apiVersion: apps/v1
kind: Deployment
metadata:
  name: design-workshop-queue
  labels:
    app.kubernetes.io/name: design-workshop
    app.kubernetes.io/component: queue
  annotations:
    # Load-bearing, not decoration. See the replicas/strategy comments below before changing either.
    design-workshop.io/singleton: "This workload must never run more than one pod."
spec:
  # EXACTLY ONE. Not a starting point, not an HPA target, not something to raise under load.
  #
  # THE CLAIM IS ALREADY ATOMIC; IT IS THE RECOVERY THAT IS NOT. An earlier version of this comment
  # asserted that nothing in the queue claims a job atomically across processes, and sent the next
  # reader off to build something that already exists: `_lock_job` in app/services/media_queue.py
  # does a compare-and-set — update_many(where={"id": ..., "status": QUEUED}) — so of two workers
  # racing for the same row exactly one sees a count of 1 and the loser returns None instead of
  # double-processing. Two pods cannot claim the same job, and raising replicas to fix that would be
  # fixing a bug that is not here. The reasons to stay at one are the two below.
  #
  # WHAT ACTUALLY BREAKS WITH A SECOND POD is `recover_stale_processing_jobs`, which every worker runs
  # at the top of every pass. It decides a job is dead purely from the age of `lockedAt` against
  # STALE_PROCESSING_AFTER (30 minutes): there is no liveness check on `lockedBy`, and across two
  # hosts there cannot be a cheap one. So pod B flips a job pod A is still working on back to QUEUED,
  # and from there the compare-and-set defends nothing — the row honestly IS queued again, so the
  # re-lock succeeds legitimately. The same recording goes to the STT provider twice, is billed twice,
  # and the two results race to write MediaFile.transcriptText. `process_next_media_jobs` documents
  # that exact sequence as the reason every caller outside the queue process must pass recover=False;
  # its safety argument is that the queue process is SERIAL, so a job it holds cannot also be a job it
  # is between batches on. A second pod is precisely what takes that argument away.
  #
  # SECOND, SMALLER: the rate-limit backoff is only half shared. The pause itself does cross processes
  # — `_park_transcription_jobs_until` pushes every queued transcription job's `runAfter` out to the
  # deadline, and every worker's selection query already filters on `runAfter <= now`. The LADDER does
  # not: `_consecutive_rate_limits` is a module global, so N pods climb N independent ladders and each
  # backs off as though it were the only one talking to a provider that is counting all of them.
  #
  # AND DO NOT EXPECT THE FILE LOCK TO SAVE YOU. `_acquire_queue_worker_lock` (app/main.py) takes an
  # fcntl lock on a file in the host temp directory and elects one worker among processes SHARING A
  # FILESYSTEM — but it is the uvicorn lifespan's guard, and this pod runs `python -m app.worker`,
  # which never calls it. Even in a pod that did, /tmp is per-pod (see the emptyDir below), so the
  # lock would be granted in every pod and elect nobody.
  #
  # The safe way to raise throughput is to make recovery PROVE the holder is dead instead of inferring
  # it from a clock — a heartbeat the holder refreshes while it works, and a recovery query that
  # matches a stale heartbeat rather than `lockedAt` alone — plus somewhere shared for the ladder to
  # live. Until that exists, this stays at 1.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # Recreate, NOT RollingUpdate. A rolling update deliberately overlaps old and new pods, which is
    # precisely the two-workers state above — just briefly, and briefly is enough to double-process a
    # job. Recreate accepts a gap in queue processing instead, which is harmless: work waits in the
    # database and is picked up on the next poll.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: design-workshop
      app.kubernetes.io/component: queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: design-workshop
        app.kubernetes.io/component: queue
    spec:
      automountServiceAccountToken: false
      # Longer than the API's: this process can be mid-transcription when the node drains, and the
      # loop only checks for shutdown between jobs. Cutting it short means a half-processed item and
      # a wasted provider call.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: queue
          image: design-workshop-api
          imagePullPolicy: IfNotPresent
          # The dedicated worker entrypoint (backend/app/worker.py), the same one the design-workshop-queue
          # systemd unit runs. Its whole reason for existing is that heavy AI/ffmpeg work must not
          # share a process with request serving.
          #
          # `args`, not `command`, for the reason spelled out in deployment-api.yaml: `command` would
          # replace the image's ENTRYPOINT and with it the wrong-database guard.
          args: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: design-workshop-config
            - secretRef:
                name: design-workshop-secrets
          env:
            # This is the ONE place it is true. The ConfigMap sets it false for the api pods; here the
            # container-level value overrides that back on, so the flag's meaning stays "this process
            # runs the queue" rather than becoming environment trivia.
            - name: MEDIA_QUEUE_WORKER_ENABLED
              value: "true"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          # No HTTP probes: this process serves no HTTP, so there is nothing to GET. A liveness probe
          # would need a heartbeat the worker does not currently write, and inventing an exec probe
          # that always succeeds is worse than none — it reports health it has not checked. The queue
          # loop already swallows per-iteration errors and keeps running (app/worker.py), so the
          # failure mode to watch is "queue depth rising", which belongs in alerting, not a probe.
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1500m"
              # Higher than the API's because this is where the memory actually goes: the pipeline
              # reads whole media files into memory before chunking. 925 media objects exist today
              # and individual clips are the largest single allocation in the system.
              memory: 1536Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            # Far larger than the API's: ffmpeg writes audio chunks here, and the ingress already
            # allows 200 MiB bodies. Still bounded, so a stuck job cannot fill the node.
            sizeLimit: 4Gi
