apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: design-workshop-api
  labels:
    app.kubernetes.io/name: design-workshop
    app.kubernetes.io/component: api
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: design-workshop
      app.kubernetes.io/component: api
---
