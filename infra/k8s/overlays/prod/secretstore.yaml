apiVersion: v1
kind: ServiceAccount
metadata:
  name: design-workshop-eso
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/design-workshop-prod-external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: design-workshop-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: design-workshop-eso
