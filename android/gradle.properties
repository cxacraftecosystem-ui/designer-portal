org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a SEPARATE JVM from the Gradle daemon, and it does not inherit
# org.gradle.jvmargs. Without this line it starts on its own default heap, and on 2026-08-13 that
# default was too small for this module: the build died with "Not enough memory to run compilation.
# Try to increase it via 'gradle.properties': kotlin.daemon.jvmargs=-Xmx<size>" and left a ZERO-BYTE
# app-debug.apk behind — an output file that exists, so a script checking for the file's presence
# reports success while nothing was built. Set it explicitly rather than relying on a default that
# varies with the Kotlin plugin version and the host's physical memory.
kotlin.daemon.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true
