<text x="432.7" y="116" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Gemini 3.8 Flash</text>
<text x="432.7" y="146" class="s" fill="#615D7A" font-size="15">One structured pass per transcript:</text><text x="432.7" y="169" class="s" fill="#615D7A" font-size="15">English for every turn, a summary,</text><text x="432.7" y="192" class="s" fill="#615D7A" font-size="15">quotes and craft terms.</text>
