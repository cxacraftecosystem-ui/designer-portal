<text x="30" y="146" class="s" fill="#615D7A" font-size="15">ElevenLabs speech-to-text with speaker</text><text x="30" y="169" class="s" fill="#615D7A" font-size="15">turns, word timings and key terms from</text><text x="30" y="192" class="s" fill="#615D7A" font-size="15">the craft. USD 0.22 an hour.</text>
