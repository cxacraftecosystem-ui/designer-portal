<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="262" viewBox="0 0 1200 262" role="img" aria-label="How a workshop flows: capture, sync, review, report, archive">
<title>How a workshop flows: capture, sync, review, report, archive</title>
<defs>
<style>.d{font-family:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.s{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.flow{stroke-dasharray:3 13;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-32}}.prog{stroke-dasharray:980;stroke-dashoffset:0;animation:prog 8s linear infinite}@keyframes prog{0%{stroke-dashoffset:980}70%{stroke-dashoffset:0}95%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.ring{opacity:0;animation:ring 8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.85;transform:scale(1)}15%{opacity:0;transform:scale(1.55)}100%{opacity:0}}.r0{animation-delay:0.1s}.r1{animation-delay:0.2s}.r2{animation-delay:0.3s}.r3{animation-delay:0.5s}.r4{animation-delay:0.6s}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.sweep{fill:url(#still)}}</style>
<linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="1090" y2="0"><stop offset="0" stop-color="#762CB1"/><stop offset="1" stop-color="#CD9200"/></linearGradient>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
