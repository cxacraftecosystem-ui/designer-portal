<text x="364.7" y="520" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">DATA</text>
<text x="30" y="584" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Browse and export</text>
<text x="30" y="614" class="s" fill="#615D7A" font-size="15">A data browser, Excel and CSV reports,</text><text x="30" y="637" class="s" fill="#615D7A" font-size="15">streamed datasets and transcripts in</text><text x="30" y="660" class="s" fill="#615D7A" font-size="15">every export.</text>
</g>
