<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="694" viewBox="0 0 1200 694" role="img" aria-label="What the portal does: capture, offline, reports, interviews, questionnaires, AI help, data, the Ministry and security">
<title>What the portal does: capture, offline, reports, interviews, questionnaires, AI help, data, the Ministry and security</title>
<defs>
