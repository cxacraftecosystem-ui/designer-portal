<rect x="432.7" y="498" width="48" height="48" rx="14" fill="#F9F5FF" stroke="#E7D5FE"/>
<g transform="translate(444.7 510) scale(1)" fill="none" stroke="#762CB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></g>
<text x="767.3" y="520" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">MINISTRY</text>
<text x="432.7" y="584" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Plans, orders, inspections</text>
<text x="432.7" y="614" class="s" fill="#615D7A" font-size="15">Sanction orders, the annual plan,</text><text x="432.7" y="637" class="s" fill="#615D7A" font-size="15">inspections, ratings and the dashboard,</text><text x="432.7" y="660" class="s" fill="#615D7A" font-size="15">on the web.</text>
</g>
<g class="rise r8">
<rect x="811.3" y="474" width="382.7" height="214" rx="18" fill="#FFFFFF" stroke="#E4E2EF"/>
<g clip-path="url(#k8)"><circle cx="1164" cy="494" r="120" fill="url(#halo)"/><rect x="811.3" y="474" width="382.7" height="3" fill="#E7D5FE"/><rect class="shine" style="animation-delay:5.6s" x="631.3" y="474" width="180" height="3" fill="url(#glint)"/></g>
<rect x="835.3" y="498" width="48" height="48" rx="14" fill="#F9F5FF" stroke="#E7D5FE"/>
<g transform="translate(847.3 510) scale(1)" fill="none" stroke="#762CB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="1170" y="520" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">SECURITY</text>
<text x="835.3" y="584" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Who may do what</text>
<text x="835.3" y="614" class="s" fill="#615D7A" font-size="15">Eleven roles, two-factor sign-in,</text><text x="835.3" y="637" class="s" fill="#615D7A" font-size="15">consent before any send and scoped</text><text x="835.3" y="660" class="s" fill="#615D7A" font-size="15">grants on every route.</text>
</g>
