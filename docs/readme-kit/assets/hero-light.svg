<g class="rise r1"><text x="64" y="172" class="d sweep" fill="url(#sweep)" font-size="56" font-weight="800" letter-spacing="-1.5">Design Prototype</text><text x="64" y="232.5" class="d sweep" fill="url(#sweep)" font-size="56" font-weight="800" letter-spacing="-1.5">Workshop</text></g>
<g class="rise r2"><text x="64" y="278.5" class="s" fill="#3A3651" font-size="19">Capture every stage of a craft design workshop on a phone or</text><text x="64" y="307.5" class="s" fill="#3A3651" font-size="19">in the browser, and leave with the finished report, even</text><text x="64" y="336.5" class="s" fill="#3A3651" font-size="19">where there is no signal.</text></g>
