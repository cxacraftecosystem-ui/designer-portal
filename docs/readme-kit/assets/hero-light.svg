<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Design Prototype Workshop: capture every stage of a craft design workshop and leave with the finished report">
<title>Design Prototype Workshop: capture every stage of a craft design workshop and leave with the finished report</title>
<defs>
<style>.d{font-family:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.s{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.blob{animation:drift 18s ease-in-out infinite alternate}.b2{animation-duration:24s;animation-delay:-7s}.b3{animation-duration:30s;animation-delay:-13s}@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(50px,-30px)}100%{transform:translate(-40px,24px)}}.warp{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}.wb{animation-delay:-2.5s}@keyframes sway{from{transform:translateX(-1px)}to{transform:translateX(1px)}}.weft{stroke-dasharray:320;stroke-dashoffset:0;animation:weave 10s linear infinite}.w0{animation-delay:0s}.w1{animation-delay:1s}.w2{animation-delay:2s}.w3{animation-delay:3s}.w4{animation-delay:4s}.w5{animation-delay:5s}.w6{animation-delay:6s}@keyframes weave{0%{stroke-dashoffset:320}10%{stroke-dashoffset:0}90%{stroke-dashoffset:0}100%{stroke-dashoffset:-320}}.wa{animation:wave 11s ease-in-out infinite alternate}.wv{animation:wave 15s ease-in-out infinite alternate-reverse}@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-150px)}}.live{animation:live 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes live{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}.r0{animation-delay:0.1s}.r1{animation-delay:0.3s}.r2{animation-delay:0.5s}.r3{animation-delay:0.6s}.r4{animation-delay:0.8s}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.sweep{fill:url(#still)}}</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F7F6FB"/><stop offset="1" stop-color="#F2E9FE"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B1674"/><stop offset="0.25" stop-color="#762CB1"/><stop offset="0.5" stop-color="#9148D2"/><stop offset="0.75" stop-color="#AD7300"/><stop offset="1" stop-color="#4B1674"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="8s" repeatCount="indefinite"/></linearGradient><linearGradient id="still" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B1674"/><stop offset="1" stop-color="#762CB1"/></linearGradient>
<linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#762CB1"/><stop offset=".5" stop-color="#CD9200"/><stop offset="1" stop-color="#762CB1"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="64"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3A3651" stroke-opacity="0.05"/></pattern>
<clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
</defs>
