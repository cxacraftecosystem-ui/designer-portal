[project]
name = "design-workshop-backend"
version = "0.0.4"
description = "API-first FastAPI backend for Design Prototype Workshop capture, review and report generation."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "PyJWT>=2.15.1",
    "bcrypt>=5.0.0",
    "prisma==0.15.0",
    "boto3>=1.43.123",
    "python-multipart>=0.0.33",
    "email-validator>=2.3.0",
    "google-auth>=2.62.0",
    "requests>=2.34.2",
    "lxml>=6.1.3",
    "httpx>=0.28.1",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.2",
    "openpyxl>=3.1.5",
    "XlsxWriter>=3.3.1",
    "reportlab>=5.1.0",
    "uharfbuzz>=0.57.0",
    "anthropic>=2.3.0",
    "cryptography>=50.0.2",
    "segno>=1.6.6",
    "anyascii>=0.3.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3,<0.18",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.28.1",
    "pypdf>=6.21.4",
]
ai = [
    "pillow>=13.0.0",
    "vtracer>=0.6.15",
]
ai-local = [
    "pillow>=13.0.0",
    "rembg>=2.0.86",
    "onnxruntime>=1.31.1",
]
cache = [
    "redis>=8.1.0",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["prisma*"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "DTZ",
    "ISC",
    "BLE",
    "PIE",
    "FURB",
    "PYI",
    "RUF",
    "PLC",
    "PLE",
    "PLW",
]

ignore = [
    "B008",

    "PLC0415",

    "PLW0603",

    "RUF001",
    "RUF002",
    "RUF003",

    "ISC002",
    "ISC004",

    "SIM105",

    "UP042",

    "B905",

    "E501",
]

external = ["SLF001", "ANN001"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]

"app/api/routes/design_workshops.py" = ["I001", "RUF100"]

"app/services/design_workshops.py" = ["I001"]

"app/services/cross_portal.py" = ["SIM103"]
"app/services/questionnaire_forms.py" = ["I001"]

"app/services/records.py" = ["FURB162"]

"app/services/report_questionnaires.py" = ["SIM113"]

"tests/test_naming.py" = ["PLE2502"]

"tests/test_entry_provenance.py" = ["C408", "DTZ001"]

"tests/test_reference_carry.py" = ["I001", "C408", "DTZ001", "PLW2901"]

"tests/test_entry_provenance_readers.py" = ["RUF005"]
"tests/test_process_step_authorization.py" = ["RUF005"]

"tests/test_record_media_urls.py" = ["RUF015"]

"tests/test_report_carry_forward.py" = ["PLW0108", "PLW2901"]

"tests/test_report_questionnaire_annexure.py" = ["RUF007"]

"tests/test_workshop_access_rerequest.py" = ["FURB162"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-p", "anyio"]
