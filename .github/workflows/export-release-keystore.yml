# ==========================================================================================
# ONE-OFF RECOVERY: get a copy of the release signing key back out of CI.
#
# A GitHub secret is write-only — there is no API that reads ANDROID_RELEASE_KEYSTORE_BASE64
# back. The only way out is a job that already has the secret in scope. This is that job.
#
# WHY THE ARTIFACT IS ENCRYPTED, AND NOT JUST UPLOADED
# ----------------------------------------------------
# GitHub masks secrets in LOGS. It does not mask ARTIFACT CONTENTS. An artifact holding a raw
# .jks is downloadable by every account with read access to this repository, and it sits in
# storage until its retention expires. So the keystore is symmetrically encrypted before it
# ever becomes a file anyone can fetch, with a passphrase supplied as a SEPARATE secret. The
# artifact on its own is useless.
#
# RUN IT LIKE THIS
# ----------------
#   1. Generate a strong passphrase locally and keep it somewhere you trust:
#        python -c "import secrets; print(secrets.token_urlsafe(32))"
#   2. Add it as a repository secret named KEYSTORE_EXPORT_PASSPHRASE.
#   3. Actions -> "Export release keystore (one-off recovery)" -> Run workflow.
#   4. Download the `release-keystore-encrypted` artifact, then locally:
#        gpg --batch --passphrase '<passphrase>' \
#            --output designrepo-release.jks --decrypt release-signing-key.jks.gpg
#   5. Verify it is the real key — the fingerprint must match ANDROID_RELEASE_CERT_SHA256:
#        keytool -list -v -keystore designrepo-release.jks
#   6. DELETE the artifact and DELETE the KEYSTORE_EXPORT_PASSPHRASE secret:
#        gh run download --help   # find the run id, then:
#        gh api -X DELETE repos/{owner}/{repo}/actions/artifacts/{artifact_id}
#        gh secret delete KEYSTORE_EXPORT_PASSPHRASE
#   7. Store the recovered .jks OFFLINE. It is the only thing that can update the published app.
#
# Then delete this workflow file. It exists to be run once.
# ==========================================================================================

name: Export release keystore (one-off recovery)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type EXPORT to confirm you intend to extract the signing key'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless the run was confirmed deliberately
        # A signing key should not leave CI because someone clicked the wrong green button.
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "EXPORT" ]; then
            echo "::error::Type EXPORT in the confirm input to run this. Nothing was exported."
            exit 1
          fi

      - name: Check both secrets are present before touching anything
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 is empty or unset."; exit 1; }
          [ -n "$PASSPHRASE" ]      || { echo "::error::Set a KEYSTORE_EXPORT_PASSPHRASE secret first — see the header of this file."; exit 1; }
          if [ "${#PASSPHRASE}" -lt 16 ]; then
            echo "::error::KEYSTORE_EXPORT_PASSPHRASE is shorter than 16 characters. Use a real random passphrase."
            exit 1
          fi

      - name: Decode, verify and encrypt the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          work="${RUNNER_TEMP}/ks"
          mkdir -p "$work"
          out="${GITHUB_WORKSPACE}/release-signing-key.jks.gpg"

          # printf is a bash builtin, so the secret never appears in `ps`.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$work/key.jks"

          # Same guard publish-android.yml uses: a truncated or double-encoded secret decodes to
          # something that is not a keystore, and saying so here beats a confusing failure later.
          bytes="$(stat -c%s "$work/key.jks")"
          if [ "$bytes" -lt 512 ]; then
            echo "::error::Decoded keystore is only ${bytes} bytes — the secret is truncated or is not base64 of the .jks."
            exit 1
          fi
          magic="$(head -c 4 "$work/key.jks" | xxd -p)"
          case "$magic" in
            feedfeed) echo "JKS keystore, ${bytes} bytes — magic OK." ;;
            30*)      echo "PKCS#12 keystore, ${bytes} bytes — DER header OK." ;;
            *)        echo "::error::Decoded bytes start with 0x${magic}, which is neither JKS nor PKCS#12."; exit 1 ;;
          esac

          # Symmetric AES-256. --passphrase-fd 0 keeps it off the command line.
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --quiet \
            --passphrase-fd 0 --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 \
            --output "$out" "$work/key.jks"

          echo "encrypted artifact: $(stat -c%s "$out") bytes"
          echo "sha256 of the ENCRYPTED file: $(sha256sum "$out" | cut -d' ' -f1)"
          shred -u "$work/key.jks" 2>/dev/null || rm -f "$work/key.jks"

      - name: Upload the encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-encrypted
          path: release-signing-key.jks.gpg
          # Short on purpose: download it, decrypt it, then delete the artifact.
          retention-days: 1
          if-no-files-found: error

      - name: Scrub the workspace
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/release-signing-key.jks.gpg"
