name: Live end-to-end suite

on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Specs to run (empty: the whole suite)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-live
  cancel-in-progress: false

jobs:
  e2e:
    name: Browser suite against a live stack
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    env:
      POSTGRES_HOST_PORT: "55432"
      MINIO_HOST_PORT: "9010"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:55432/design_workshop"
      JWT_SECRET: "e2e-live-not-a-secret-0123456789abcdefgh"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_REGION: "us-east-1"
      AWS_S3_BUCKET: "design-workshop"
      AWS_S3_ENDPOINT: "http://127.0.0.1:9010"
      AWS_S3_PUBLIC_BASE_URL: "http://127.0.0.1:9010/design-workshop"
      BACKEND_CORS_ORIGINS: "http://localhost:3000"
      MEDIA_QUEUE_WORKER_ENABLED: "false"
      E2E_EMAIL: "admin2@example.org"
      E2E_PASSWORD: "LocalDev123!"
      E2E_BASE_URL: "http://localhost:3000"
      E2E_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bring up the compose stack
        run: |
          set -euo pipefail
          docker compose up -d
          docker compose ps

      - name: Wait for Postgres and MinIO
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker compose ps --format json | grep -q '"Health":"starting"'; then
              echo "attempt ${i}: still starting"; sleep 5; continue
            fi
            if docker compose ps --format json | grep -q '"Health":"unhealthy"'; then
              echo "::error::a compose service reported unhealthy"; docker compose ps; docker compose logs --tail 50; exit 1
            fi
            echo "stack is up"; docker compose ps; exit 0
          done
          echo "::error::the compose stack did not become healthy in five minutes"
          docker compose ps; docker compose logs --tail 80
          exit 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          python -m prisma py fetch
          python scripts/generate_prisma_client.py --schema prisma/schema.prisma

      - name: Apply the migrations
        working-directory: backend
        run: python -m prisma migrate deploy

      - name: Seed the test accounts
        working-directory: backend
        run: python -u scripts/seed_test_accounts.py

      - name: Start the API
        working-directory: backend
        run: |
          set -euo pipefail
          nohup python -u -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then echo "API up after ${i} polls"; break; fi
            if [ "$i" = "90" ]; then echo "::error::the API never answered /health"; tail -100 "$RUNNER_TEMP/api.log"; exit 1; fi
            sleep 4
          done
          curl -fsS http://127.0.0.1:8000/health/ready

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Build and start the web app
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npx next build
          nohup npx next start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then echo "web up after ${i} polls"; break; fi
            if [ "$i" = "60" ]; then echo "::error::the web app never served /login"; tail -100 "$RUNNER_TEMP/web.log"; exit 1; fi
            sleep 3
          done

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the live specs
        working-directory: frontend
        env:
          SPECS: ${{ inputs.specs }}
        run: npm run test:e2e -- $SPECS --reporter=list,html

      - name: Upload the Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnostics
        if: ${{ failure() }}
        run: |
          echo "=== compose ==="; docker compose ps || true
          echo "=== postgres/minio logs (tail) ==="; docker compose logs --tail 60 || true
          echo "=== api log (tail) ==="; tail -120 "$RUNNER_TEMP/api.log" || true
          echo "=== web log (tail) ==="; tail -60 "$RUNNER_TEMP/web.log" || true

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down -v || true
