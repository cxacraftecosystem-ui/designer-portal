name: Publish Android release

# THE ONE WAY A BUILD REACHES A HANDSET. Everything below exists so that "cut a release" is a
# tag push and not a person on a laptop, because a person on a laptop is how every failure this
# file guards against actually happened.
#
# ─── WHY THIS IS A STANDALONE WORKFLOW AND NOT A FOURTH STAGE ─────────────────────────────────
# The existing chain is deploy-backend.yml (`push: branches: [main]`) → deploy-frontend.yml →
# android-build.yml, each hop a `workflow_run`. This workflow cannot join it and nothing may
# chain off it, for reasons that are properties of GitHub rather than preferences:
#   • A TAG PUSH STARTS NOTHING IN THAT CHAIN. A tag push is a `push` event with
#     `ref: refs/tags/<tag>`, and a `branches:` filter matches only `refs/heads/*`, so
#     deploy-backend.yml never starts — silence, not a red X. Both `workflow_run` hops also carry
#     `branches: [main]`, which filters on the UPSTREAM run's head branch, and a run whose head is
#     a tag has no branch to match. So a release could not be reached from that chain even by
#     accident.
#   • Publishing must not be a side effect of merging to main. android-build.yml says it out loud
#     ("Nothing here can reach a phone"), and that stays true: it builds DEBUG variants only.
#     This file is the deliberate act, and it is the only one that holds the signing key.
#   • `push: tags:` runs the workflow file AS OF THE TAGGED COMMIT — unlike `workflow_run`
#     workflows, which are read from the default branch. MERGE THIS FILE TO MAIN BEFORE CUTTING
#     THE TAG, or the tag will not contain it and the release will simply not happen.
#
# ─── WHAT IT DOES, IN ORDER ───────────────────────────────────────────────────────────────────
#   read the version out of the tree → build and sign the release APK on the runner → prove the
#   signer → prove the artefact is this product's → upload the bytes to object storage →
#   POST /api/app/release → prove the world can see it.
#
# THE APK IS BUILT HERE, NOT UPLOADED FROM A DESK, and that is the single most important line in
# this file. `android/local.properties` is gitignored and absent on a runner, so the release build
# gets the production API base hard-coded in build.gradle.kts. On the machine that cut the first
# release it is present, and it says `apiBaseUrl=http://localhost:8000/api/` — the generated
# release BuildConfig on that tree carries `DEFAULT_API_BASE_URL = "http://localhost:8000/api/"`.
# That APK installs, opens, and reaches nothing at all. The same file also carries
# `debugSignRelease=true` and can carry `releaseAllAbis=true` (a ~49 MB four-ABI build the build
# file explicitly says not to publish). None of those states can exist here, and the assertions
# below check for them anyway, because "cannot happen" is what every one of them looked like.
#
# ─── SECRETS THIS WORKFLOW NEEDS (set outside it, in repository settings) ──────────────────────
#   ANDROID_RELEASE_KEYSTORE_BASE64    base64 of the release .jks
#   ANDROID_RELEASE_KEYSTORE_PASSWORD  store password
#   ANDROID_RELEASE_KEY_ALIAS          key alias inside the store
#   ANDROID_RELEASE_KEY_PASSWORD       OPTIONAL — absent means "same as the store password", which
#                                      is what this project's key actually uses. An absent secret
#                                      renders as an empty env var, and build.gradle.kts treats
#                                      empty as unset (`takeIf { it.isNotEmpty() }`) and falls back
#                                      to the store password, so absence is safe by construction.
#   ANDROID_RELEASE_CERT_SHA256        expected signer fingerprint, lower-case hex, no colons
#   APP_PUBLISH_EMAIL / APP_PUBLISH_PASSWORD   a MASTER_ADMIN account; POST /api/app/release is
#                                      `Depends(require_master_admin)` and refuses anything less
#
# NOT CONFIGURED IS A FAILURE, never a skip. On 2026-08-23 a silent skip in deploy-frontend.yml
# published nothing and reported `success`, and it cost a day; the comment block at
# deploy-frontend.yml:132-153 is the register. Every secret above is checked for PRESENCE (a
# boolean, never a value) in the gate step, which fails the run.
#
# ─── THE SIX GUARDS, AND THE FAILURE EACH ONE CLOSES ──────────────────────────────────────────
#   1. The tag must match the version the tree builds         (step: "GUARD 1 …")
#   2. The signer must be the expected key, and signed at all (step: "GUARD 2 …")
#   3. The API must be THIS product's                         (step: "GUARD 3 …")
#   4. The new versionCode must be ABOVE the published one    (step: "GUARD 4 …")
#   5. The upload must not silently exceed the single-PUT path (step: "GUARD 5 …")
#   6. It must PROVE it published                             (step: "GUARD 6 …")
# Each carries its reason at the step. Do not delete one without reading it: none of them is
# hypothetical, and four of them describe something that has already gone out of this repository.
#
# ─── WHAT THIS WORKFLOW STILL CANNOT TELL YOU ─────────────────────────────────────────────────
# R8 and resource shrinking exist only on the release variant (`isMinifyEnabled = true`,
# `isShrinkResources = true`), and R8's failure mode is not a compile error — it is a
# SerializationException or a NoSuchMethodError at the first sync, on a build that installed and
# ran fine on a desk. A GitHub runner has no device and no emulator, and no instrumented test runs
# here (android-build.yml:165-171 declines them for the same reason). So a green run here means
# "correctly built, correctly signed, correctly published" and NOT "verified on hardware". The
# build file's own standard is that a release must be run through the offline loop on a real
# handset before it ships. That is a human step and this file cannot do it for you; the step
# summary says so on every run.

on:
  push:
    tags:
      # The tag IS the release request. `v*` and not `v*.*.*` on purpose: a malformed tag should
      # reach GUARD 1 and be told exactly what is wrong with it, rather than matching nothing and
      # leaving somebody wondering why their push did nothing at all. Silence is the worst answer.
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything EXCEPT POST /api/app/release. Leave ticked to exercise the pipeline."
        type: boolean
        # DEFAULTS TO TRUE, deliberately asymmetric with the tag trigger. A hand-started run is
        # somebody testing the pipeline nine times out of ten, and the tenth is a re-run of a
        # publish that failed. Getting the default the wrong way round means an experiment
        # publishes a release; getting it this way round means a real publish needs one extra
        # click. A dry run still builds, signs, verifies, logs in, checks the version ceiling and
        # UPLOADS THE BYTES — the only thing it omits is the release record.
        default: true

permissions:
  # `contents: write`, and ONLY because this workflow now cuts a GitHub Release. It read
  # `contents: read` with a comment saying "it creates no release, no comment, no deployment, so it
  # asks for nothing that could do any of those" — that was correct and is the standard to come back
  # to. Publishing a Release is the single reason it went up, and the write is used in exactly one
  # step; nothing else here touches GitHub. If the Release step is ever removed, put this back.
  contents: write

concurrency:
  group: publish-android
  # FALSE, and this is the same rule deploy-backend.yml:38-45 states. Two runs of this workflow
  # mutate something that outlives the runner: an object in storage and a row in the AppRelease
  # table. Cancelling one mid-flight can leave an uploaded APK with no release row (harmless) or,
  # worse, cancel the proof step after the row was written — a publish nobody verified. Queue them.
  cancel-in-progress: false

env:
  # ─── THE API BASE, AND WHY IT IS WRITTEN HERE ONCE ──────────────────────────────────────────
  # There are TWO CloudFront distributions in this account and they are one glance apart.
  # `d3ekigkotd1xa2` is this product; `d2b34i3e92al6i` is the sibling product's API. Publishing
  # against the sibling SUCCEEDS — it has the same routes and its own master admins — and it would
  # push this app over another product's app. docs/CI.md section 0 is the register, and GUARD 3
  # below is the one-command test that tells them apart. Three literals of another product's
  # hostname is exactly how deploy-frontend.yml:258-311 ended up grading somebody else's healthy
  # site, so this value appears in this file precisely once.
  API_BASE: https://d3ekigkotd1xa2.cloudfront.net
  # Named only so the built artefact can be grepped for its ABSENCE (the mirror check further
  # down). Never fetched from here: an APK carrying this hostname would install and then talk to
  # somebody else's data, which is the whole failure the grep is looking for.
  #
  # AND THE LAST COMMENT LINE OF THIS BLOCK IS LOAD-BEARING, not commentary. `docs/tools/check-docs.mjs`
  # sweeps every TRACKED file for this literal and FAILS the Docs check unless one of its
  # `SIBLING_LABEL` phrases appears within FOUR LINES of it — measured while landing this file, which
  # went red the moment it was staged. The long paragraph above `API_BASE` explains the pair at
  # length and is far too far away to count, and that is the point of the rule: the way this
  # repository has twice pointed a pipeline at the wrong distribution was an unlabelled literal that
  # read, at the line where somebody was actually looking, as ours. Keep the naming ON the value.
  #
  # THE FIELD REPOSITORY'S CloudFront distribution — ANOTHER PRODUCT'S API. Not ours. Not fetched.
  SIBLING_API_HOST: d2b34i3e92al6i.cloudfront.net
  # The production API base the release APK must have compiled in. This is the fallback in
  # android/app/build.gradle.kts that applies when there is no local.properties — i.e. exactly
  # what a runner gets, and what the artefact is grepped for below. Keep the trailing `/api/`:
  # that is the literal in the BuildConfig field, and a prefix match would pass on a truncated one.
  EXPECTED_APK_API_BASE: https://d3ekigkotd1xa2.cloudfront.net/api/
  # AGP's default output for the release build type. THE FILENAME IS ITSELF THE SIGNED/UNSIGNED
  # SIGNAL: build.gradle.kts creates the signing config only when a real key resolved, and with no
  # signing config AGP writes `app-release-unsigned.apk` in this same directory instead. Both
  # names are pinned so the absence of the second is an assertion and not an assumption.
  APK: app/build/outputs/apk/release/app-release.apk
  UNSIGNED_APK: app/build/outputs/apk/release/app-release-unsigned.apk
  # Must track android/app/build.gradle.kts (compileSdk/targetSdk 35, AGP 8.7.x). This is also
  # where `apksigner` and `aapt2` live on the runner, which GUARD 2 and the version check need.
  BUILD_TOOLS_VERSION: "35.0.0"
  # 64 MiB. The presign → single PUT path is only valid below this: frontend/lib/media.ts:341
  # (`MULTIPART_THRESHOLD = 64 * 1024 * 1024`) switches to an S3 multipart upload above it, and
  # Android's own MULTIPART_THRESHOLD matches. GUARD 5 refuses at or above rather than attempting
  # a PUT and hoping. (media.ts branches on `size > threshold`, so a file of exactly 64 MiB still
  # goes as one PUT there; this workflow is one byte more conservative, which is the safe
  # direction — the boundary case has never been measured against S3 from here.)
  SINGLE_PUT_LIMIT_BYTES: "67108864"
  # A FLOOR AS WELL AS A CEILING, and the floor is the one with a story. android/gradle.properties
  # records a Kotlin-daemon OOM that "left a ZERO-BYTE app-debug.apk behind — an output file that
  # exists, so a script checking for the file's presence reports success while nothing was built."
  # A two-ABI release APK measured 66,704,870 bytes on 2026-08-23. 40 MiB is far below that and
  # far above anything a truncated or partial build produces, so it catches the zero-byte and the
  # half-written cases without failing on ordinary growth.
  MIN_APK_BYTES: "41943040"
  # The application id. A wrong one is not a bad release, it is a DIFFERENT APP: Android keys
  # installs and signatures by package name, so it would install alongside the real app rather
  # than updating it, and the OTA updater would never offer it.
  EXPECTED_APPLICATION_ID: com.designprototype.workshop

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Everything Gradle-shaped is relative to `android/`, exactly as in android-build.yml.
        # NOTE for the upload steps below: actions/upload-artifact does NOT honour this, so its
        # `path:` values are repo-root relative.
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No `ref:` override here, unlike android-build.yml. That file builds a `workflow_run`
          # commit, where the default ref (tip of main) may have moved past what was deployed.
          # This workflow's default ref IS the thing being released — the tagged commit on a tag
          # push, the dispatched ref on a manual run — so overriding it could only make it wrong.
          fetch-depth: 1
          # NO `fetch-tags: true` HERE, AND IT MUST STAY THAT WAY. GUARD 4 needs the annotated tag's
          # message, and asking checkout for tags looked like the obvious way to get it. On a TAG PUSH
          # it makes checkout construct two refspecs that collide:
          #
          #   fatal: Cannot fetch both <sha> and refs/tags/v0.0.1 to refs/tags/v0.0.1
          #
          # which failed the very first step and skipped the entire publish. The tag object is fetched
          # inside GUARD 4 instead, where a failure to get it is survivable.

      - name: Resolve the run mode, and refuse to publish something no tag names
        id: mode
        # THIS STEP DECIDES WHETHER ANYTHING GETS PUBLISHED, so it is the second thing that runs.
        #
        # GITHUB_REF_NAME is the tag on a tag push and the BRANCH on a workflow_dispatch started
        # from a branch. `github.ref_type` is what tells them apart. A dispatch started from a tag
        # ref (which GitHub allows) is a first-class case and gets the full GUARD 1 comparison.
        #
        # A dispatch from a BRANCH has no tag, so GUARD 1 has nothing to compare against — and a
        # guard that cannot run must never be a guard that silently passes. Such a run is allowed
        # as a dry run (it exercises everything up to the release call, which is the point of
        # having a dry run at all) and REFUSED outright as a publish. The version in that case
        # could only come from the tree, which is exactly the ambiguity GUARD 1 exists to remove.
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          ref_type="${{ github.ref_type }}"
          ref_name="${GITHUB_REF_NAME}"
          # `inputs.dry_run` renders empty on a tag push and true/false on a dispatch. A tag push
          # is never a dry run: pushing a release tag is the request to publish.
          requested_dry="${{ inputs.dry_run }}"

          if [ "$event" = "workflow_dispatch" ]; then
            dry_run="${requested_dry:-true}"
          else
            dry_run="false"
          fi

          # ─── DRY_RUN IS A TWO-VALUE ENUM, AND A THIRD VALUE MUST DIE HERE ───────────────
          # Everything downstream branches on `env.DRY_RUN == 'false'` (the publish, GUARD 6, the
          # did-it-actually-publish trap) or on `== 'true'` (the dry-run notice). Those are mutually
          # exclusive conditions with NO THIRD BRANCH, so a DRY_RUN that is neither literal skips
          # all of them, the job concludes `success`, and the step summary announces
          # "**PUBLISH** — tag vX.Y.Z" over a run that published nothing. That is structurally run
          # 32632590460 — the failure this entire file exists to prevent — arrived at by falling
          # OPEN to a green tick.
          #
          # Today nothing can put a third value in here: the branch above writes only the literal
          # `false`, GitHub validates a `type: boolean` input, and `${requested_dry:-true}` covers
          # the empty render. So this is defence in depth and not a live bug. It is here anyway
          # because this file's stated rule is "NOT CONFIGURED IS A FAILURE, never a skip", and a
          # mode nobody can read is exactly that; and because asserting the enum ONCE where it is
          # decided is cheaper than trusting eleven separate `if:` expressions to keep agreeing
          # about it for ever.
          case "$dry_run" in
            true|false) ;;
            *)
              echo "::error title=Android publish refused: unreadable mode::dry_run resolved to '${dry_run}', which is neither 'true' nor 'false'. Every step below compares against one of those two literals, so a third value would SKIP the publish, SKIP the proof, SKIP the dry-run notice, and still report success."
              exit 1
              ;;
          esac

          tag=""
          if [ "$ref_type" = "tag" ]; then
            tag="$ref_name"
          fi

          if [ -z "$tag" ] && [ "$dry_run" = "false" ]; then
            echo "::error title=Android publish refused: no tag::This run was started from ${ref_type} '${ref_name}', so there is no tag to check the built version against and GUARD 1 cannot run."
            echo "::error::Publishing is refused rather than trusting android/app/build.gradle.kts on its own — a version nobody named in a tag is a version nobody can look up afterwards."
            echo "::error::Either push the release tag (git tag vX.Y.Z && git push origin vX.Y.Z), or re-run this workflow from the tag ref, or leave dry_run ticked."
            exit 1
          fi

          {
            echo "DRY_RUN=${dry_run}"
            echo "RELEASE_TAG=${tag}"
          } >> "$GITHUB_ENV"

          if [ "$dry_run" = "true" ]; then
            echo "MODE: DRY RUN — everything except POST /api/app/release. Nothing will be published."
          else
            echo "MODE: PUBLISH — tag '${tag}'."
          fi

      - name: Gate — every secret this run needs is present
        # PRESENCE ONLY. Not one of these values enters the log, here or anywhere below: the
        # booleans are computed in the `env:` block, where `secrets` is readable, and the shell
        # only ever sees "true" or "false". This mirrors deploy-frontend.yml:107-109, which
        # explains why the check has to happen in a step rather than in an `if:`.
        #
        # AND IT FAILS, it does not skip. A workflow that decides at 03:00 that it is not
        # configured, skips its own publish and reports `success` is the single most expensive
        # failure this repository has met (deploy-frontend.yml:132-153). The conclusion of a run
        # is the only part of it anyone reads at a glance, so the conclusion has to be honest.
        #
        # ANDROID_RELEASE_KEY_PASSWORD is deliberately NOT required — see the header. Absent means
        # "same as the store password", which is how `keytool` is almost always driven and what
        # this project's key uses.
        env:
          HAVE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
          HAVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD != '' }}
          HAVE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS != '' }}
          HAVE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
          HAVE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 != '' }}
          HAVE_PUBLISH_EMAIL: ${{ secrets.APP_PUBLISH_EMAIL != '' }}
          HAVE_PUBLISH_PASSWORD: ${{ secrets.APP_PUBLISH_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=""
          for pair in \
            "ANDROID_RELEASE_KEYSTORE_BASE64:${HAVE_KEYSTORE}" \
            "ANDROID_RELEASE_KEYSTORE_PASSWORD:${HAVE_KEYSTORE_PASSWORD}" \
            "ANDROID_RELEASE_KEY_ALIAS:${HAVE_KEY_ALIAS}" \
            "ANDROID_RELEASE_CERT_SHA256:${HAVE_CERT_SHA256}" \
            "APP_PUBLISH_EMAIL:${HAVE_PUBLISH_EMAIL}" \
            "APP_PUBLISH_PASSWORD:${HAVE_PUBLISH_PASSWORD}"; do
            name="${pair%%:*}"
            present="${pair##*:}"
            echo "${name}: ${present}"
            if [ "$present" != "true" ]; then
              missing="${missing} ${name}"
            fi
          done
          echo "ANDROID_RELEASE_KEY_PASSWORD: ${HAVE_KEY_PASSWORD} (optional — absent means 'same as the store password')"

          if [ -n "$missing" ]; then
            echo "::error title=Android publish is not configured::Missing repository secrets:${missing}. This run FAILS rather than reporting success over a release nobody made."
            echo "::error::Set them in Settings → Secrets and variables → Actions. The signing key is required even for a dry run: an unsigned APK proves nothing about the pipeline."
            exit 1
          fi

      - name: GUARD 1 — the tag must name the version this tree builds
        id: version
        # ─── THE FAILURE THIS CLOSES ───────────────────────────────────────────────────────────
        # Tagging v0.0.2 over a tree whose `appVersionName` is still "0.0.1" builds 0.0.1 and
        # publishes it under the name 0.0.2. The website then offers "0.0.2", the release row says
        # 0.0.2, and every handset that installs it reports 0.0.1 — because the version is
        # compiled in, and NOTHING downstream can correct it. Worse, the derived versionCode is
        # then 1 and not 2, and per this project's measured behaviour a release at or below the
        # published versionCode is ACCEPTED by the API, looks successful, and reaches nobody.
        # So the comparison happens BEFORE the 15-minute build, not after it.
        #
        # ─── WHY THE VERSION IS READ, NOT PASSED IN ────────────────────────────────────────────
        # android/app/build.gradle.kts holds the single source of truth:
        #     val appVersionName = "0.0.1"
        # and DERIVES versionCode as major*1_000_000 + minor*1_000 + patch. There is no way to
        # override either from outside — no Gradle property, no env var — so the tag cannot change
        # what is built. It can only agree or disagree with it, and disagreement has to be fatal.
        #
        # ─── THE versionCode ARITHMETIC IS REPRODUCED IN THREE PLACES, ON PURPOSE ──────────────
        # Here, in build.gradle.kts, and server-side in backend/app/api/routes/app_release.py
        # (`_derive_version_code`), which RE-DERIVES it from the version name and overrides
        # whatever the client sent. This step therefore validates the name against the SERVER's
        # rules (three parts, digits only, each ≤ 999) rather than against the looser thing bash
        # would accept: if the name falls outside them the server keeps the client's number
        # instead, and the two definitions of the number every device compares diverge silently.
        # `10#` forces base 10 — without it bash reads a zero-padded part like `010` as octal and
        # quietly means eight.
        run: |
          set -euo pipefail
          gradle_file="app/build.gradle.kts"

          # Exactly one declaration, or the parse itself is the bug. A file with two (or none,
          # after a refactor moves the constant) must not be read by taking the first match — that
          # is how a check keeps passing while measuring the wrong line.
          declarations="$(grep -c '^val appVersionName = "' "$gradle_file" || true)"
          if [ "$declarations" != "1" ]; then
            echo "::error::Expected exactly one 'val appVersionName = \"…\"' line in android/${gradle_file}; found ${declarations}."
            echo "::error::That line is the only source of both the version name and the derived versionCode. Fix this parse to match the file — do not guess the version."
            exit 1
          fi
          tree_version="$(sed -n 's/^val appVersionName = "\([^"]*\)".*/\1/p' "$gradle_file")"
          if [ -z "$tree_version" ]; then
            echo "::error::Parsed an EMPTY version out of android/${gradle_file}. An empty version would compare equal to an empty tag and publish nothing recognisable, so it is a failure of its own."
            exit 1
          fi
          echo "android/${gradle_file} builds version: ${tree_version}"

          if [ -n "${RELEASE_TAG}" ]; then
            case "${RELEASE_TAG}" in
              v*) tag_version="${RELEASE_TAG#v}" ;;
              *)
                echo "::error::Tag '${RELEASE_TAG}' does not start with 'v'. The trigger is 'v*' and the convention is v<MAJOR>.<MINOR>.<PATCH>, e.g. v0.0.2."
                exit 1
                ;;
            esac
            if [ "$tag_version" != "$tree_version" ]; then
              echo "::error::Tag ${RELEASE_TAG} means version ${tag_version}, but android/${gradle_file} builds ${tree_version}. Refusing to build."
              echo "::error::The version is COMPILED IN and cannot be corrected downstream: publishing this would put '${tag_version}' on the website over an APK that reports '${tree_version}', with a versionCode derived from ${tree_version} — which is the number devices compare, and which may already be published."
              echo "::error::Fix by bumping 'val appVersionName' to ${tag_version} and re-tagging that commit (the tag must point at the bump, not at its parent)."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} agrees with the tree."
          else
            echo "::notice::No tag on this run (dry run from ${{ github.ref_type }} '${GITHUB_REF_NAME}'), so GUARD 1's comparison did not run. Version taken from the tree: ${tree_version}."
          fi

          # Validate against the SERVER's rules, then derive.
          IFS='.' read -r major minor patch extra <<< "$tree_version"
          if [ -n "${extra:-}" ] || [ -z "${major:-}" ] || [ -z "${minor:-}" ] || [ -z "${patch:-}" ]; then
            echo "::error::Version '${tree_version}' is not three dot-separated parts. backend/app/api/routes/app_release.py:_derive_version_code returns None for anything else, and the server then TRUSTS the client's version code instead of deriving it — two definitions of the number every device compares."
            exit 1
          fi
          for part in "$major" "$minor" "$patch"; do
            case "$part" in
              ''|*[!0-9]*)
                echo "::error::Version part '${part}' in '${tree_version}' is not a plain number. The server requires str.isdigit() on all three parts."
                exit 1
                ;;
            esac
            if [ "$((10#$part))" -gt 999 ]; then
              echo "::error::Version part '${part}' exceeds 999, which the server rejects outright (the 1,000-wide buckets in the versionCode formula would collide). The documented scheme runs each part 0→100 before rolling the next one forward."
              exit 1
            fi
          done
          version_code=$(( (10#$major) * 1000000 + (10#$minor) * 1000 + (10#$patch) ))

          echo "Derived versionCode: ${version_code} (major*1000000 + minor*1000 + patch)"
          {
            echo "VERSION_NAME=${tree_version}"
            echo "VERSION_CODE=${version_code}"
          } >> "$GITHUB_ENV"

      - name: GUARD 3 — the API must be THIS product's
        id: api_identity
        # ─── THE FAILURE THIS CLOSES ───────────────────────────────────────────────────────────
        # There are two CloudFront distributions in this account whose ids differ by a glance:
        # ours (`d3ekigkotd1xa2`) and the sibling product's (`d2b34i3e92al6i`). The sibling API has
        # the same shape, the same auth, and its own master admins. Publishing this app's APK
        # against it would SUCCEED and would push this app to another product's users, with no
        # error anywhere to notice — hard-coded literals of the wrong hostname are exactly how
        # deploy-frontend.yml ended up asserting the health of somebody else's site.
        #
        # ─── THE TEST, AND WHY IT IS THIS ROUTE ────────────────────────────────────────────────
        # GET /api/design-workshops is 401 on ours (the route exists and demands a bearer token)
        # and 404 on theirs (no such route). It needs no credentials, so it can run first, before
        # anything is built and before anything logs in — an unauthenticated request that
        # distinguishes the two distributions is worth more than an authenticated one that does
        # not. A 200 would be just as wrong as a 404: it would mean the route stopped requiring
        # authentication, which is a security finding and not a green light to publish.
        #
        # Placed before the build so a misconfigured base fails in seconds rather than after 15
        # minutes of Gradle. API_BASE is a literal in this file and nothing between here and the
        # publish can change it, so checking it early loses nothing.
        run: |
          set -euo pipefail
          # `|| true` for the same reason as the GUARD 6 poll further down: under `set -e` a
          # transport failure aborted this step before the `000)` arm could ever run, which left
          # that arm as dead code and replaced its specific message ("DNS, TLS or timeout") with a
          # bare non-zero exit. The OUTCOME was already correct here — the step fails either way,
          # and failing is right — but a guard whose most explanatory branch is unreachable teaches
          # the next reader that the branch is decoration.
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${API_BASE}/api/design-workshops" || true)"
          code="${code:-000}"
          echo "GET ${API_BASE}/api/design-workshops -> ${code}"
          case "$code" in
            401)
              echo "401 as expected: the route exists and requires a bearer token, which is this product's API."
              ;;
            404)
              echo "::error::${API_BASE} answered 404 for /api/design-workshops. THAT ROUTE DOES NOT EXIST ON THE SIBLING PRODUCT'S DISTRIBUTION (${SIBLING_API_HOST}) — this is almost certainly the wrong CloudFront distribution."
              echo "::error::Publishing there would succeed and would push this app over ANOTHER PRODUCT'S app. Refusing. docs/CI.md section 0 is the register of which distribution is which."
              exit 1
              ;;
            200)
              echo "::error::${API_BASE} answered 200 for /api/design-workshops with no Authorization header. On this product that route is authenticated, so either this is not our API or the route has lost its guard."
              echo "::error::Do not publish until that is understood: an unauthenticated design-workshops list is a data-exposure finding, not a CI nuisance."
              exit 1
              ;;
            000)
              echo "::error::No HTTP response at all from ${API_BASE} (curl reported 000 — DNS, TLS or timeout). Nothing has been built or published."
              exit 1
              ;;
            *)
              echo "::error::${API_BASE} answered ${code} for /api/design-workshops, which is neither the expected 401 nor the sibling's 404. Do not guess: find out what is in front of this hostname before publishing."
              exit 1
              ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # 17 is not a free choice: android/app/build.gradle.kts pins
          # sourceCompatibility/targetCompatibility to VERSION_17 and kotlinOptions.jvmTarget to
          # "17". AGP 8.7 rejects a lower JDK, and a higher one changes the default bytecode
          # target, so this must track that file. Same value as android-build.yml, for the same
          # reason: a release built on a different JDK than the one the debug pipeline tests is a
          # variable nobody wants on the publish path.
          java-version: "17"
          # Caches ~/.gradle/caches and the wrapper distribution (Gradle 8.9, ~130 MB), keyed on
          # the gradle files. Without it every run re-downloads the whole AndroidX/Compose graph.
          cache: gradle

      - name: Make the Gradle wrapper executable
        # The wrapper is committed with mode 100644 (it was added from Windows), so the runner
        # cannot exec it as-is. Cheaper than rewriting the file mode in git.
        run: chmod +x gradlew

      - name: Ensure the required Android SDK packages are installed
        # ubuntu-latest ships an Android SDK, but which platform/build-tools versions are
        # preinstalled drifts with the runner image. compileSdk/targetSdk are 35 and AGP 8.7.3
        # wants build-tools 35.x, so install them explicitly rather than betting on the image.
        # Both are no-ops when already present.
        #
        # RELEASE-SPECIFIC REASON THIS STEP MATTERS MORE HERE: build-tools is also what puts
        # `apksigner` and `aapt2` on the box, at $ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/.
        # GUARD 2 cannot prove the signer without the first, and the version assertion reads the
        # packaged manifest with the second. So their presence is asserted rather than assumed:
        # a missing tool must not turn into a skipped check on the one path that ships bytes.
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-35" "build-tools;${BUILD_TOOLS_VERSION}" > /dev/null
          tools="${sdk_root}/build-tools/${BUILD_TOOLS_VERSION}"
          for tool in apksigner aapt2; do
            if [ ! -x "${tools}/${tool}" ]; then
              echo "::error::${tools}/${tool} is missing after installing build-tools;${BUILD_TOOLS_VERSION}."
              echo "::error::Without apksigner the signer cannot be proved, and this workflow must not publish an APK whose signature it has not read. Fix the SDK install rather than skipping the check."
              exit 1
            fi
          done
          echo "ANDROID_BUILD_TOOLS=${tools}" >> "$GITHUB_ENV"

      # ─── DO NOT WRITE android/local.properties HERE. EVER. ─────────────────────────────────────
      # It is gitignored, so it does not exist on a runner, and its absence is what makes this a
      # publishable build. Two consequences, both intended:
      #   • sdk.dir falls back to $ANDROID_HOME, which the runner sets.
      #   • buildConfigField DEFAULT_API_BASE_URL falls back to the production CloudFront URL
      #     hard-coded in build.gradle.kts — i.e. the CI APK points at PRODUCTION.
      # The machine that cut the first release has `apiBaseUrl=http://localhost:8000/api/` in that
      # file, and its release BuildConfig says so; that APK reaches nothing on a handset. The same
      # file is also where `debugSignRelease=true` and `releaseAllAbis=true` live. The signing key
      # therefore arrives through the four ANDROID_RELEASE_* ENVIRONMENT VARIABLES below, which
      # build.gradle.kts reads as an alternative to the properties file — writing the key into a
      # local.properties would reintroduce every hazard above to save nothing.

      - name: Fetch the vendored sherpa-onnx AAR
        # WITHOUT THIS STEP NOTHING COMPILES — debug or release. The offline speech engine is on no
        # Maven repository (docs/ASR-RUNTIME-MEASUREMENT.md §1 proved that through the Gradle
        # resolver: six coordinate spellings, six live 404s), so app/build.gradle.kts binds it as a
        # bare file through the `flatDir` in settings.gradle.kts, and android/app/libs/ is
        # gitignored because the file is 36 MB. It exists on a developer's machine and has never
        # existed on a runner.
        #
        # `flatDir` resolves BY FILE NAME, relative to the settings dir, so the path and the name
        # below are both load-bearing: get either wrong and Gradle says
        #   Could not find :sherpa-onnx-static-link-onnxruntime-1.13.5:
        #
        # The digest and size are the ones recorded beside the `implementation` line in
        # build.gradle.kts and are identical to android-build.yml's. Verified rather than trusted
        # because this pulls 36 MB of native code that ships INSIDE the APK we are about to sign
        # with a key that can never be rotated: "downloaded successfully" is not the question.
        run: |
          set -euo pipefail
          aar="app/libs/sherpa-onnx-static-link-onnxruntime-1.13.5.aar"
          sha="508b79be1aeef3cbb92b8d4325b9b1dad0fa9a4eb1991de0d3d1826b8a09c358"
          mkdir -p app/libs
          curl -fsSL --retry 3 --retry-delay 5 -o "$aar" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-static-link-onnxruntime-1.13.5.aar"
          echo "$sha  $aar" | sha256sum -c -
          test "$(stat -c%s "$aar")" = "37749854"

      - name: Materialise the release keystore outside the workspace
        # ─── WHY OUTSIDE THE WORKSPACE ─────────────────────────────────────────────────────────
        # $RUNNER_TEMP is not under $GITHUB_WORKSPACE, so the key cannot be picked up by a build
        # that globs the tree, cannot be swept into an uploaded artifact by a careless `path:`, and
        # cannot end up in a `git status` or a diff. It is also deleted by the always()-conditioned
        # cleanup step at the end of this job, and again by the runner when the job ends.
        #
        # THE PASSWORD NEVER TOUCHES A COMMAND LINE. `printf` is a bash BUILTIN, so no separate
        # process is spawned and nothing appears in `ps`; the base64 goes into `base64 -d` through
        # a pipe. Whitespace is stripped first because a secret pasted from a terminal usually
        # arrives wrapped at 76 columns, and stripping is cheaper than diagnosing.
        #
        # ─── AND WHY THE MAGIC BYTES ARE CHECKED ───────────────────────────────────────────────
        # A truncated, double-encoded or BOM-prefixed secret decodes to something that is not a
        # keystore. build.gradle.kts would then see the FILE PRESENT and the password set, decide
        # the key is usable... and the failure would surface as a Gradle signing error deep in a
        # 15-minute build, or — in the half-configured cases — as a build that SUCCEEDS and
        # produces an unsigned APK. JKS starts with the magic 0xFEEDFEED; a PKCS#12 store is
        # DER-encoded and starts with 0x30. Anything else is a bad secret, and saying so here
        # costs one line and names the actual problem.
        #
        # The alias is NOT passed to keytool for a pre-flight listing, deliberately: keytool has
        # `-storepass:env` but no `-alias:env`, so it would put a secret on a visible command line
        # to check something GUARD 2 proves properly from the finished artefact anyway.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/release-signing-key.jks"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          chmod 600 "$keystore"

          bytes="$(stat -c%s "$keystore")"
          if [ "$bytes" -lt 512 ]; then
            echo "::error::The decoded keystore is only ${bytes} bytes, which is too small to be a keystore. ANDROID_RELEASE_KEYSTORE_BASE64 is truncated, or is not base64 of the .jks."
            exit 1
          fi
          magic="$(head -c 4 "$keystore" | od -An -tx1 | tr -d ' \n')"
          case "$magic" in
            feedfeed*) kind="JKS" ;;
            30*)       kind="PKCS#12 (DER)" ;;
            *)
              echo "::error::The decoded keystore does not start with a keystore magic number (JKS 0xFEEDFEED or PKCS#12 0x30). The secret is probably double-encoded, wrapped in quotes, or carries a BOM."
              echo "::error::Left unchecked this produces a signing failure deep in the Gradle build, or — if the file merely looks present — a release APK that is UNSIGNED and installs nowhere."
              exit 1
              ;;
          esac
          echo "Keystore decoded: ${bytes} bytes, format ${kind}. Its contents are never printed."
          echo "RELEASE_KEYSTORE_PATH=${keystore}" >> "$GITHUB_ENV"

      - name: Assemble the signed release APK
        id: assemble
        # ─── WHAT IS DIFFERENT ABOUT THIS TASK ─────────────────────────────────────────────────
        # android-build.yml only ever runs debug tasks, so a green run there asserts NOTHING about
        # this variant: R8 (`isMinifyEnabled = true`) and resource shrinking are release-only, and
        # debug sets both to false. This is the first and only place the shipped bytes are built.
        #
        # ─── THE FOUR ENV VARS, AND THE ABSOLUTE PATH ──────────────────────────────────────────
        # build.gradle.kts reads each of these from local.properties OR from the environment
        # (`signingProperty`), trims them, and treats empty as unset. So:
        #   • ANDROID_RELEASE_KEY_PASSWORD may legitimately be empty — it then falls back to the
        #     store password, which is what this project's key uses.
        #   • The keystore path must be ABSOLUTE. A relative path is resolved with
        #     rootProject.file(), i.e. against `android/` — not the repo root, not the CWD — which
        #     is a confusing way to arrive at "the key is not usable".
        #
        # A CONFIGURED REAL KEY WINS OVER `debugSignRelease`, by design and in that order: that
        # flag is something a developer sets once in a gitignored file and forgets for months (it
        # was already set on the machine that cut the first release), and if it were checked first
        # the presence of a real key would be silently ignored and the build that went to every
        # handset would be the undistributable one. CI sets neither the flag nor a local.properties,
        # so only the real key is in play here.
        #
        # The output is teed to a log because two of the assertions below read it: the UNSIGNED
        # lifecycle line and the half-configured warning are the ONLY trace those states leave, and
        # both leave the build SUCCEEDING. `pipefail` is what keeps `tee` from swallowing a Gradle
        # failure. The log is not uploaded as an artifact — nobody reads a build log on a green
        # run, which is exactly why the grep has to happen here, in the job, every time.
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ env.RELEASE_KEYSTORE_PATH }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --console=plain --stacktrace 2>&1 \
            | tee "${RUNNER_TEMP}/assemble-release.log"

      - name: Assert the build produced a SIGNED artefact and said nothing to the contrary
        # ─── UNSIGNED IS A VALID, NEAR-SILENT OUTCOME. THAT IS THE POINT OF THIS STEP. ─────────
        # `hasReleaseSigningKey` in build.gradle.kts needs four things to line up: the keystore
        # path resolved, the file present, the password set, the alias set. Miss any ONE and the
        # build still SUCCEEDS; the only trace is a lifecycle line among hundreds —
        #     release: UNSIGNED — no release key configured and debugSignRelease is off.
        #     The APK will build and will not install.
        # — and the half-configured case is only a `logger.warn`. Green Gradle, publishable-looking
        # file, an APK that installs nowhere. So four signals are checked:
        #   (1) the expected filename EXISTS,
        #   (2) the unsigned filename DOES NOT — AGP's default output with no signing config is
        #       `app-release-unsigned.apk` in the same directory, so its absence is a real check,
        #   (3) the build log carries neither the UNSIGNED line nor the signing warning,
        #   (4) the build log does NOT say the release variant was signed with the DEBUG keystore.
        #       That is the third outcome of build.gradle.kts's release block and nothing in this
        #       step looked at it until 2026-08-23. It produces a signed, entirely plausible
        #       `app-release.apk`, so checks (1) to (3) all pass over it. See the grep below.
        # GUARD 2 then proves the signature cryptographically. This step exists because it names
        # WHICH of the four inputs went missing, which a fingerprint mismatch cannot tell you.
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/assemble-release.log"

          if [ -f "$UNSIGNED_APK" ]; then
            echo "::error::${UNSIGNED_APK} exists. AGP writes that name when there is NO signing config, which means build.gradle.kts did not consider the release key usable."
            echo "::error::An unsigned APK installs on nothing and must never be published. Check that ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD and ANDROID_RELEASE_KEY_ALIAS are all set, and that the alias exists in that store."
            exit 1
          fi
          if [ ! -f "$APK" ]; then
            echo "::error::${APK} was not produced by :app:assembleRelease, and neither was the unsigned name. The build reported success, so something changed about the output path or the variant — read the assemble step's log above."
            exit 1
          fi

          if grep -q "release: UNSIGNED" "$log"; then
            echo "::error::The Gradle log says 'release: UNSIGNED — no release key configured'. The build SUCCEEDED and the APK cannot be installed by anyone."
            echo "::error::This is the failure mode this workflow exists to make loud: it is one lifecycle line among hundreds and it never fails a build."
            exit 1
          fi
          if grep -q "release signing: .*is not usable" "$log"; then
            echo "::error::The Gradle log carries the half-configured signing warning: a keystore path was set but the key was not usable (the log line itself says which of file-present / password-set / alias-set failed)."
            exit 1
          fi
          # ─── THE DEBUG-KEYSTORE BRANCH: THE ONLY OUTCOME HERE THAT LOOKS ENTIRELY FINE ───────
          # build.gradle.kts's release block has THREE outcomes, not two, and until 2026-08-23 this
          # step looked at only two of them. The middle one is `debugSignRelease=true` in somebody's
          # gitignored local.properties with no release key resolved (build.gradle.kts:302-315): the
          # release variant is then signed with the DEBUG keystore that ships inside every Android
          # SDK on earth. That is a SIGNED `app-release.apk`, so every other signal in this step
          # reads green over it — the expected filename exists, `app-release-unsigned.apk` does
          # not, there is no "release: UNSIGNED" line and no half-configured warning. An APK that
          # anybody on the internet can publish an update for, reported as a clean pass.
          #
          # FATAL, unlike the advisory below it, because the two answer different questions. A
          # missing positive line can be a reworded string. This line is emitted ONLY when the
          # release key did not resolve, which is a fact about the build and not about anybody's
          # wording. GUARD 2's fingerprint would also catch it one step later; that is a backstop,
          # and this step's entire reason to exist is naming WHICH input went wrong, which a
          # fingerprint mismatch cannot do for you.
          if grep -q "release: signing with the DEBUG keystore" "$log"; then
            echo "::error::The Gradle log says the release variant was signed with the DEBUG KEYSTORE (debugSignRelease=true, and no release key resolved). That APK is signed and it installs, and it must never be published: the debug keystore ships with every Android SDK, so anybody can sign an update for it."
            echo "::error::On a runner this can only mean the release key did not resolve — check ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD and ANDROID_RELEASE_KEY_ALIAS. A real key always wins over the flag (build.gradle.kts:302-311 states that ordering and why), so a key that resolved cannot reach this branch."
            exit 1
          fi

          # ─── THE POSITIVE ASSERTION, AND THE STRING IT HAS TO MATCH ───────────────────────
          # Taken verbatim from android/app/build.gradle.kts:299-301, which logs:
          #     release: signing with the RELEASE key (<store>.jks, alias <alias>). This APK is distributable.
          # This grep used to read "signing with the configured release key" — a string that
          # appears NOWHERE in this repository. So the notice below fired on every correct run,
          # including what would have been the first real publish. Permanent noise on a publish path
          # is how a pipeline stops being read at all; deploy-frontend.yml:132-153 is this
          # repository's own register of that, and it is quoted at the top of this file.
          # Matched only as far as "the RELEASE key": the store filename and the alias follow it on
          # that same line, and neither of those belongs in an assertion.
          if ! grep -q "release: signing with the RELEASE key" "$log"; then
            # Advisory, and deliberately NOT fatal on its own: the positive lifecycle line is a
            # string in build.gradle.kts that a refactor may reword, and GUARD 2 proves the same
            # thing from the artefact itself with a cryptographic check that cannot be reworded.
            # Failing here would be failing on the wording of a log message. The three FATAL greps
            # around it carry the load. If this notice appears on a run GUARD 2 passes, the string
            # was reworded and THIS grep is what needs updating — which is the only correct
            # reading of this line, and getting it wrong once already made it fire on every run.
            echo "::notice::The expected 'release: signing with the RELEASE key' lifecycle line was not found in the build log. GUARD 2 is the authority on whether this APK is signed correctly; if that passes, this line has probably just been reworded in build.gradle.kts — update the grep."
          fi
          echo "Artefact present under the signed name: ${APK} ($(stat -c%s "$APK") bytes)."

      - name: GUARD 2 — the signer must be the expected key, and there must BE one
        id: signer
        # ─── THE FAILURE THIS CLOSES, AND WHY IT IS THE WORST ONE HERE ─────────────────────────
        # THIS KEY CAN NEVER BE ROTATED. Android identifies an app by (package name, signing
        # certificate): an APK signed with any other key is refused as an update by every device
        # that already has the app, for ever, with no way back except uninstalling — which takes
        # the user's local data with it. docs/ENVIRONMENT.md:425-432 records this as "the one
        # secret in this project that cannot be rotated". So a wrong key must not merely warn: it
        # must be impossible to publish.
        #
        # AND "SIGNED AT ALL" IS THE OTHER HALF. With no key the release build is silently
        # unsigned (see the step above); apksigner exits non-zero on such a file, which is the
        # cryptographic version of the same check and the one that cannot be fooled by a filename.
        #
        # ─── WHAT IS PRINTED, AND WHAT IS NOT ──────────────────────────────────────────────────
        # The expected fingerprint arrives as a secret and is NEVER printed — not even on a
        # mismatch. The fingerprint READ FROM THE ARTEFACT is printed only when it disagrees,
        # because that value is a public certificate digest (safe by the same reasoning
        # docs/ENVIRONMENT.md uses when it records the expected one) and because "which key did I
        # actually sign with" is the only question worth answering at that moment. On the happy
        # path neither is shown: the answer is a boolean, and a boolean is what gets logged.
        #
        # Comparison is done on a lower-cased, colon-stripped, whitespace-stripped form of both
        # sides. apksigner prints lower-case hex with no separators today, but a secret is typed by
        # a human, and refusing a correct key because somebody pasted the colons would be a false
        # refusal on the publish path — which is how checks get deleted.
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/apksigner.txt"

          if ! "${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$APK" > "$out" 2>&1; then
            echo "::error::apksigner refused ${APK}. Either it is UNSIGNED (the silent outcome of a missing release key) or its signature does not verify."
            echo "::error::apksigner said:"
            sed 's/^/    /' "$out"
            exit 1
          fi

          # Exactly one signer. Two would mean a second certificate got into the signing config,
          # and "one of the signers is right" is not the property devices check.
          digest_lines="$(grep -c 'certificate SHA-256 digest:' "$out" || true)"
          if [ "$digest_lines" != "1" ]; then
            echo "::error::apksigner reported ${digest_lines} certificate SHA-256 digests for this APK; expected exactly 1."
            echo "::error::Do not loosen this to 'at least one'. An APK carrying an extra signer is a different identity to Android and cannot be reasoned about from a fingerprint match on one of them."
            sed 's/^/    /' "$out"
            exit 1
          fi

          actual="$(sed -n 's/.*certificate SHA-256 digest: *//p' "$out" | tr -d ' :\r\n' | tr 'A-F' 'a-f')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ' :\r\n' | tr 'A-F' 'a-f')"
          if [ -z "$actual" ]; then
            echo "::error::Could not parse a certificate SHA-256 out of apksigner's output. Read it below and fix the parse — an unparsed fingerprint must never be treated as a match."
            sed 's/^/    /' "$out"
            exit 1
          fi
          if [ ${#expected} -ne 64 ]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 is ${#expected} characters after stripping colons and spaces; a SHA-256 is 64 hex characters. The value itself is not printed."
            echo "::error::An unusable expected value must fail here rather than compare unequal further down, where it would look exactly like a wrong signing key."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::THE RELEASE APK IS SIGNED WITH THE WRONG KEY. Refusing to publish."
            echo "::error::Signer read from the artefact: ${actual}"
            echo "::error::(The expected value is a repository secret and is not printed.) This key cannot be rotated: an APK signed with anything else is refused as an update by every device that already has the app, for ever."
            echo "::error::Check ANDROID_RELEASE_KEYSTORE_BASE64 and ANDROID_RELEASE_KEY_ALIAS — a store holding more than one key will happily sign with the wrong alias."
            exit 1
          fi
          echo "Signer fingerprint matches ANDROID_RELEASE_CERT_SHA256 (neither value printed)."

          # v2/v3 are enabled in build.gradle.kts alongside v1. A v1-only APK still verifies, so
          # apksigner's exit code does not cover this — and v2/v3 are what modern Android actually
          # validates on install.
          if ! grep -qE 'Verified using v[23] scheme[^:]*: true' "$out"; then
            echo "::error::apksigner did not report a v2 or v3 signature scheme as verified, though build.gradle.kts enables both."
            echo "::error::If the tooling has merely reworded this line, update the grep — do not delete the check: a v1-only APK is what an old signing path produces, and modern Android validates v2/v3."
            sed 's/^/    /' "$out"
            exit 1
          fi
          grep -E '^(Verifies|Verified using|Number of signers)' "$out" | sed 's/^/    /'

      - name: Assert the APK carries the tagged version and this app's identity
        # THE VERSION IS READ OUT OF THE PACKAGED MANIFEST, not out of the build file it came from
        # and not out of the sidecar. `aapt2 dump badging` reads the binary manifest inside the APK
        # that is about to be uploaded, which is the only copy any device will ever see. GUARD 1
        # compared the tag with the SOURCE; this compares the tag with the ARTEFACT, and they are
        # different assertions: a stale incremental build, a cached variant, or a property arriving
        # from somewhere unexpected all live in the gap between them.
        #
        # output-metadata.json is cross-checked as well, because it is what a human reads when they
        # go looking, and a sidecar that disagrees with its own APK is worth knowing about.
        #
        # THE PACKAGE NAME MATTERS AS MUCH AS THE VERSION. Android keys installs and update
        # eligibility by (package, signature). A wrong applicationId is not a bad release, it is a
        # second app that installs alongside the real one and that the OTA updater never offers.
        run: |
          set -euo pipefail
          # THE OUTPUT GOES TO A FILE FIRST, AND `head` IS NOT IN A PIPELINE, for a reason that has
          # nothing to do with tidiness. Under `set -o pipefail`, `aapt2 dump badging … | head -n 1`
          # fails the whole step on a PERFECTLY GOOD APK: `head` exits after one line, `aapt2` is
          # killed by SIGPIPE, and pipefail reports 141 for the pipeline even though `head`
          # succeeded. A guard that goes red on correct input is a guard somebody deletes.
          badging_all="${RUNNER_TEMP}/badging.txt"
          "${ANDROID_BUILD_TOOLS}/aapt2" dump badging "$APK" > "$badging_all"
          badging="$(sed -n '1p' "$badging_all")"
          apk_package="$(printf '%s' "$badging" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          apk_version_code="$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          apk_version_name="$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          echo "APK manifest: package=${apk_package} versionCode=${apk_version_code} versionName=${apk_version_name}"

          if [ -z "$apk_package" ] || [ -z "$apk_version_code" ] || [ -z "$apk_version_name" ]; then
            echo "::error::Could not parse package/versionCode/versionName out of 'aapt2 dump badging'. An unparsed value must not be treated as a match — fix the parse."
            echo "    ${badging}"
            exit 1
          fi
          if [ "$apk_package" != "$EXPECTED_APPLICATION_ID" ]; then
            echo "::error::The APK's package is '${apk_package}', expected '${EXPECTED_APPLICATION_ID}'. That is a DIFFERENT APP to Android: it would install beside the real one instead of updating it, and the in-app updater would never offer it."
            exit 1
          fi
          if [ "$apk_version_name" != "$VERSION_NAME" ] || [ "$apk_version_code" != "$VERSION_CODE" ]; then
            echo "::error::The built APK says ${apk_version_name} (code ${apk_version_code}) but this run is publishing ${VERSION_NAME} (code ${VERSION_CODE})."
            echo "::error::GUARD 1 checked the tag against the SOURCE; this checks it against the ARTEFACT. A mismatch here means the bytes are not the version this run believes it built — a stale incremental output is the usual cause. Re-run with a clean build; do not publish."
            exit 1
          fi

          metadata="app/build/outputs/apk/release/output-metadata.json"
          if [ -f "$metadata" ]; then
            meta_code="$(jq -r '.elements[0].versionCode // empty' "$metadata")"
            meta_name="$(jq -r '.elements[0].versionName // empty' "$metadata")"
            if [ "$meta_code" != "$VERSION_CODE" ] || [ "$meta_name" != "$VERSION_NAME" ]; then
              echo "::error::output-metadata.json says ${meta_name}/${meta_code} while the APK manifest says ${apk_version_name}/${apk_version_code}. These are written by the same build, so a disagreement means one of them is left over from an earlier one."
              exit 1
            fi
            echo "output-metadata.json agrees with the manifest."
          else
            echo "::notice::No output-metadata.json beside the APK. Not fatal — the manifest read above is the authority — but AGP normally writes it, so the output layout may have changed."
          fi

      - name: Assert the APK points at THIS product's API and packages only field ABIs
        # ─── THE FAILURE THIS CLOSES: THE LOCALHOST RELEASE ────────────────────────────────────
        # DEFAULT_API_BASE_URL is a compiled-in build constant taken from `apiBaseUrl` in
        # local.properties, falling back to the production CloudFront URL. On the machine that cut
        # the first release that property says `http://localhost:8000/api/`, and the generated
        # release BuildConfig on that tree carries it. Such an APK installs, opens, and reaches
        # nothing — every request fails and the user sees a broken app, with no server-side symptom
        # for anyone to notice. A runner has no local.properties so it cannot happen here; this
        # asserts it anyway, because that is precisely the kind of "cannot happen" this repository
        # keeps meeting. It is the same idiom as deploy-frontend.yml:406-413, which greps the built
        # bundle for the API host rather than trusting the input that produced it: grepping the
        # artefact for the host IS the literal user-visible symptom.
        #
        # ─── WHY THE NEEDLES ARE THESE AND NOT "localhost" ─────────────────────────────────────
        # `res/xml/network_security_config.xml` legitimately lists `localhost` (and 10.0.2.2, and
        # 127.0.0.1) as cleartext-permitted domains, and that resource SHIPS INSIDE THE APK. A
        # grep for the bare word would therefore fail on every correct release — a false red on the
        # publish path, which is how a check gets deleted. `://localhost` only appears in a URL
        # literal, which is what a compiled-in base URL is.
        # The sibling distribution's hostname is searched for the same way, as its own needle: an
        # APK pointing at another product's API is the mirror image of GUARD 3.
        #
        # ─── AND THE ABI SET ───────────────────────────────────────────────────────────────────
        # `releaseAllAbis=true` in a developer's local.properties packages all four ABIs — about
        # 22 MB of x86/x86_64 native libraries no field handset can load — and build.gradle.kts
        # says in as many words: "For emulator testing only; do not publish this APK." The filters
        # are applied at PACKAGING time, so the intermediate merge directories contain all four
        # regardless; the packaged APK's own entry list is the only place this can honestly be
        # read. Nor may this be an ABI split: one universal APK is required, because the download
        # URL serves exactly one file and a handset of the other architecture answers
        # INSTALL_FAILED_NO_MATCHING_ABIS to a dialog it cannot dismiss.
        run: |
          set -euo pipefail

          # THE ARCHIVE IS UNPACKED TO ONE FILE AND GREPPED THREE TIMES, RATHER THAN PIPED THREE
          # TIMES, and that is a correctness fix and not an optimisation. Under `set -o pipefail`,
          # `unzip -p "$APK" | grep -aqF needle` fails the step WHEN THE NEEDLE IS FOUND: `grep -q`
          # exits at the first match, `unzip` is killed by SIGPIPE, and pipefail reports 141 for a
          # pipeline whose last command succeeded. That turns the happy path red, which is how a
          # check ends up deleted rather than fixed.
          bytes_file="${RUNNER_TEMP}/apk-bytes"
          unzip -p "$APK" > "$bytes_file"

          # `-a` because the archive mixes dex and native binaries with text; `-F` because a host
          # is a literal and not a pattern. The needle is searched for, never printed as a match.
          if ! grep -aqF "$EXPECTED_APK_API_BASE" "$bytes_file"; then
            echo "::error::The release APK does not contain the production API base '${EXPECTED_APK_API_BASE}'."
            echo "::error::That string is the compiled-in DEFAULT_API_BASE_URL. Its absence means the build took an apiBaseUrl from somewhere else — a local.properties on the runner (there must not be one), or a changed fallback in build.gradle.kts."
            echo "::error::An APK that points anywhere else reaches nothing on a handset, and it cannot be corrected after publishing."
            exit 1
          fi
          if grep -aqF "://localhost" "$bytes_file"; then
            echo "::error::The release APK contains a 'localhost' URL literal. This is the localhost release: it installs, opens and reaches nothing."
            echo "::error::Cause: an 'apiBaseUrl' pointing at a laptop reached the build. There must be no android/local.properties on a runner. (The bare word 'localhost' in res/xml/network_security_config.xml is expected and is NOT what this matched — the needle is '://localhost'.)"
            exit 1
          fi
          if grep -aqF "$SIBLING_API_HOST" "$bytes_file"; then
            echo "::error::The release APK references ${SIBLING_API_HOST}, which is the SIBLING PRODUCT's API. Publishing this would point this product's users at another product's backend."
            exit 1
          fi
          rm -f "$bytes_file"
          echo "APK carries the production API base; no localhost literal; no sibling host."

          # `|| true` on the listing only: `unzip -Z1` exits 11 when a pattern matches nothing, and
          # "no lib/ entries at all" deserves the sentence below rather than exit 11 from a step
          # whose name is about API hosts.
          abis="$(unzip -Z1 "$APK" 'lib/*' 2>/dev/null | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)"
          echo "Packaged ABIs: ${abis:-<none>}"
          if [ -z "$abis" ]; then
            echo "::error::The APK contains no lib/ entries at all, so it carries no native libraries. This app links a native speech engine (sherpa-onnx); an APK without it is not the app."
            exit 1
          fi
          expected_abis="arm64-v8a armeabi-v7a "
          if [ "$abis" != "$expected_abis" ]; then
            echo "::error::Packaged ABIs are '${abis}', expected '${expected_abis}'."
            echo "::error::Four ABIs means releaseAllAbis=true reached this build — about 22 MB of x86 libraries no field handset can load, and build.gradle.kts says explicitly not to publish it. Fewer than two means an ABI split, which breaks every handset of the missing architecture with INSTALL_FAILED_NO_MATCHING_ABIS."
            exit 1
          fi

      - name: GUARD 5 — the APK must fit the single-PUT upload path
        id: size
        # ─── THE FAILURE THIS CLOSES ───────────────────────────────────────────────────────────
        # This workflow uploads the APK as ONE presigned PUT. That path is only valid below 64 MiB:
        # above it the browser client switches to an S3 multipart upload (create → presign parts →
        # PUT each part → complete), and Android's MULTIPART_THRESHOLD matches. The multipart flow
        # is NOT implemented here, and it must not be improvised at 03:00 on a release night: a
        # partially uploaded object with a completed release row pointing at it is a broken
        # download for every user, published and irreversible.
        #
        # The APK measured 66,704,870 bytes on 2026-08-23 — under the limit by less than half a
        # megabyte. It WILL cross it. When it does, this step is the thing that says so in one
        # sentence instead of leaving a truncated object in a bucket.
        #
        # THE FLOOR IS THE OTHER HALF, and it has a story of its own: android/gradle.properties
        # records a Kotlin-daemon OOM that "left a ZERO-BYTE app-debug.apk behind — an output file
        # that exists, so a script checking for the file's presence reports success while nothing
        # was built". Presence is not a measurement. Size is.
        run: |
          set -euo pipefail
          bytes="$(stat -c%s "$APK")"
          headroom=$(( SINGLE_PUT_LIMIT_BYTES - bytes ))
          echo "${APK}: ${bytes} bytes (single-PUT limit ${SINGLE_PUT_LIMIT_BYTES}, headroom ${headroom})"

          if [ "$bytes" -lt "$MIN_APK_BYTES" ]; then
            echo "::error::The release APK is ${bytes} bytes, below the ${MIN_APK_BYTES}-byte floor. A real two-ABI release measured 66,704,870 bytes."
            echo "::error::A file this small is a truncated or empty output, not a release — a Kotlin-daemon OOM has produced a zero-byte APK in this project before, on a build that reported success. Do not publish it."
            exit 1
          fi
          # ── WHICH UPLOAD PATH, and this used to be a hard refusal ────────────────────────────
          #
          # It read: at or above 64 MiB, "THE MULTIPART UPLOAD FLOW IS REQUIRED AND IS NOT
          # IMPLEMENTED IN THIS WORKFLOW", and stopped. That was the right refusal to ship with —
          # attempting a single PUT of an over-size object and hoping produces a truncated file with a
          # published release row pointing at it, which is a broken download for every user and cannot
          # be taken back.
          #
          # It then fired for real: adding CameraX took the APK to 67,222,842 bytes, **113,978 bytes**
          # over the line. So the flow is implemented now and this step CHOOSES a path instead of
          # refusing. The floor check above is untouched and still refuses, because a too-SMALL APK is
          # a truncated build and there is no path that makes it publishable.
          if [ "$bytes" -ge "$SINGLE_PUT_LIMIT_BYTES" ]; then
            echo "UPLOAD_MODE=multipart" >> "$GITHUB_ENV"
            echo "::notice title=Multipart upload::${bytes} bytes is at or above the ${SINGLE_PUT_LIMIT_BYTES}-byte single-PUT limit, so the APK goes up in parts."
          else
            echo "UPLOAD_MODE=single" >> "$GITHUB_ENV"
            echo "${bytes} bytes fits the single-PUT path (limit ${SINGLE_PUT_LIMIT_BYTES})."
          fi
          if [ "$headroom" -lt 2097152 ]; then
            echo "::notice::Only ${headroom} bytes of headroom under the 64 MiB single-PUT limit. The next release may well cross it; the multipart flow named above is what will be needed."
          fi
          echo "APK_BYTES=${bytes}" >> "$GITHUB_ENV"

      - name: Sign in to the API as the publishing master admin
        id: login
        # ─── SECRET HYGIENE, WHICH IS THE WHOLE REASON THIS STEP LOOKS LIKE THIS ───────────────
        # 1. THE PASSWORD IS NEVER ON A COMMAND LINE. `jq -n` builds the body from `env.*`, so the
        #    value is not in jq's argv (`--arg password "$PASSWORD"` would put it there, visible to
        #    anything that can read /proc on the runner), and the JSON goes to curl through a pipe
        #    with `--data-binary @-`. jq also does the quoting, so a password containing a quote or
        #    a backslash cannot corrupt the request.
        # 2. THE BEARER TOKEN IS NEVER ON A COMMAND LINE EITHER. It goes into a curl CONFIG FILE
        #    (`header = "Authorization: Bearer …"`, mode 600, under $RUNNER_TEMP) which every later
        #    call reads with `--config`. `-H "Authorization: Bearer $token"` would put a live
        #    master-admin credential in argv, and one `set -x` or one error message that echoes the
        #    command would put it in the log for ever. GitHub masks registered secrets; it does not
        #    mask a token this workflow minted itself.
        # 3. WHAT GETS PRINTED IS A LENGTH. Following deploy-frontend.yml:351-396: "present, N
        #    characters" is enough to tell "the login worked" from "the login returned a body with
        #    no token in it", and no more than that.
        # The config file is deleted by the always()-conditioned cleanup step at the end of the job.
        #
        # THE ROLE IS CHECKED HERE, BEFORE ANYTHING IS UPLOADED. POST /api/app/release is
        # `require_master_admin`; discovering that after a 66 MB upload wastes the upload and
        # leaves an orphaned object, and the 403 arrives at the one step where an error is easiest
        # to misread as "the release call is broken".
        env:
          APP_PUBLISH_EMAIL: ${{ secrets.APP_PUBLISH_EMAIL }}
          APP_PUBLISH_PASSWORD: ${{ secrets.APP_PUBLISH_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          body="${RUNNER_TEMP}/login.json"
          auth="${RUNNER_TEMP}/curl-auth.cfg"

          code="$(jq -nc '{email: env.APP_PUBLISH_EMAIL, password: env.APP_PUBLISH_PASSWORD}' \
            | curl -sS --max-time 60 -o "$body" -w '%{http_code}' \
                -X POST "${API_BASE}/api/auth/login" \
                -H 'content-type: application/json' \
                --data-binary @-)"

          if [ "$code" != "200" ]; then
            echo "::error::POST /api/auth/login answered ${code}. Nothing has been published."
            case "$code" in
              401) echo "::error::401 is 'Invalid email or password' — the API deliberately gives one answer for an unknown address and a wrong password. Check APP_PUBLISH_EMAIL and APP_PUBLISH_PASSWORD." ;;
              403) echo "::error::403 means the credential is right but the account is not admitted (pending approval, or off the platform allow-list). Publishing needs a MASTER_ADMIN." ;;
              422) echo "::error::422 is a schema rejection: the login body must be {email, password} and the password has a minimum length. Neither value is printed." ;;
            esac
            # The refusal text is what is wanted here, and it carries no credential.
            jq -r '.detail // empty' "$body" 2>/dev/null | sed 's/^/    detail: /' || true
            exit 1
          fi

          # `.accessToken`, camelCase, AND `.access_token` as a fallback. The field is camelCase —
          # `backend/app/api/routes/auth.py:450` returns {"accessToken", "tokenType", "user"} — and
          # this read `.access_token` only, so the first real run of this workflow authenticated
          # successfully, found nothing where it looked, and failed AFTER a 7-minute signed build with
          # a message blaming the API for returning an empty token. The API was correct; the reader
          # was not. Both spellings are accepted so that this cannot break again in either direction
          # if the response is ever normalised.
          token="$(jq -r '.accessToken // .access_token // empty' "$body")"
          if [ -z "$token" ]; then
            echo "::error::The login returned 200 but no token under .accessToken or .access_token. A 200 with an empty token is exactly the 'cheerful false pass' that would make every later call anonymous and every guard below meaningless."
            exit 1
          fi
          role="$(jq -r '.user.role // "unknown"' "$body")"
          echo "Signed in: token present, ${#token} characters. Account role: ${role}."
          if [ "$role" != "MASTER_ADMIN" ]; then
            echo "::error::This account's role is '${role}'. POST /api/app/release is master-admin only (require_master_admin), so publishing would fail with a 403 after the APK had already been uploaded."
            echo "::error::Failing now, while nothing has been changed. Point APP_PUBLISH_EMAIL at a MASTER_ADMIN account."
            exit 1
          fi

          printf 'header = "Authorization: Bearer %s"\n' "$token" > "$auth"
          chmod 600 "$auth"
          rm -f "$body"
          echo "CURL_AUTH=${auth}" >> "$GITHUB_ENV"

      - name: GUARD 4 — the new versionCode must be ABOVE the published one
        id: ceiling
        # ─── THE FAILURE THIS CLOSES, AND IT IS THE QUIETEST ONE IN THIS FILE ─────────────────
        # A release at or below the published versionCode is ACCEPTED by the API. It returns 201,
        # the row is written, the workflow goes green — and it reaches nobody: `_latest_release()`
        # orders by versionCode descending, so the older row is simply never "latest", and every
        # device's update check goes on comparing against the higher number. A perfect green run
        # over a release no human will ever be offered.
        #
        # The devices compare the CODE, not the name, which is why this compares codes: 0.1.0
        # (1,000) beats 0.0.99 (99) but 0.0.9 (9) does not, and no amount of reading the version
        # names tells you that.
        #
        # ─── WHY 404 AND AN EMPTY BODY ARE BOTH FINE ───────────────────────────────────────────
        # GET /api/app/release/latest returns `{}` — a 200 with an empty object — when nothing has
        # been published, and that was the measured state of this API: GET /api/app/download
        # answered 404, "No Android build has been published yet, so there is nothing to
        # download." So there is no floor to beat on a first release, and treating "nothing
        # published" as an error would block the one release that certainly cannot be too low.
        #
        # ─── WHAT MUST NOT BE TREATED AS "NOTHING PUBLISHED" ──────────────────────────────────
        # A 401 or 403 here. This route requires a bearer token, so an auth failure produces a body
        # with no versionCode in it — indistinguishable from "nothing published" to a naive parse,
        # and it would wave through a release that is too low. It is called out as its own failure.
        run: |
          set -euo pipefail
          latest="${RUNNER_TEMP}/latest-before.json"
          code="$(curl -sS --max-time 30 --config "$CURL_AUTH" -o "$latest" -w '%{http_code}' \
            "${API_BASE}/api/app/release/latest")"
          echo "GET /api/app/release/latest -> ${code}"

          published=""
          case "$code" in
            200)
              published="$(jq -r '.versionCode // empty' "$latest")"
              ;;
            404)
              echo "404 — no release row at all. Nothing is published yet."
              ;;
            401|403)
              echo "::error::/api/app/release/latest answered ${code}: the bearer token was refused. This is NOT 'nothing is published yet'."
              echo "::error::Treating an auth failure as an empty release list would wave through a release at or below the published version — which is accepted, looks successful and reaches nobody. Refusing."
              exit 1
              ;;
            *)
              echo "::error::/api/app/release/latest answered ${code}, which this workflow cannot interpret. The version ceiling is unknown, so publishing is refused."
              exit 1
              ;;
          esac

          if [ -z "$published" ]; then
            echo "Nothing is published yet, so there is no versionCode to beat. Publishing ${VERSION_NAME} (code ${VERSION_CODE}) as the first release."
            echo "PUBLISHED_BEFORE=none" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$published" in
            ''|*[!0-9]*)
              echo "::error::The published versionCode read back as '${published}', which is not a number. Refusing to compare against a value this workflow does not understand."
              exit 1
              ;;
          esac

          published_name="$(jq -r '.versionName // "?"' "$latest")"
          echo "Currently published: ${published_name} (code ${published})."
          # ── REPUBLISHING THE SAME VERSION, DELIBERATELY AND ONLY WHEN THE TAG SAYS SO ──────────
          #
          # The first published release (0.0.1) could not sign anybody in, and the fix was a build
          # change with no user-visible version to bump — the owner's instruction was to reissue it as
          # 0.0.1. So an EQUAL code can be republished, and only when the tag's own annotation carries
          # the marker [republish]. Not a repository variable and not a workflow input: a variable
          # would silently weaken every later run, an input cannot reach a tag push, and the tag
          # message is the one place where the reason travels WITH the artefact and expires with it.
          #
          # EQUAL ONLY, NEVER LOWER. A lower code is never defensible: it cannot win 'latest' and
          # cannot install over what is out there. An equal one is defensible for exactly one reason —
          # `_latest_release` orders by versionCode DESC then publishedAt DESC, so a newer row with the
          # same code DOES win the tie and /api/app/download serves the new bytes.
          #
          # WHAT IT STILL CANNOT DO, said out loud because it is the thing that will surprise someone:
          # the in-app updater compares CODES, so any handset already on code ${published} will never
          # be offered this. It is a fix for everyone who downloads from now on, not an update push.
          # If devices are already carrying the broken build, bump the version instead.
          # The tag-push checkout writes a LIGHTWEIGHT ref (`+<sha>:refs/tags/<name>`), so the local
          # tag points straight at the commit and the annotation is not present to read. Fetch the real
          # tag object now. Failure is tolerated on purpose: no message means no marker, which means
          # the guard refuses an equal-code publish — the safe direction.
          git fetch --force --no-recurse-submodules origin             "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
          tag_message="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" 2>/dev/null || true)"
          republish=false
          case "$tag_message" in *"[republish]"*) republish=true ;; esac

          if [ "$VERSION_CODE" -eq "$published" ] && [ "$republish" = "true" ]; then
            echo "::warning title=Republishing the same version::Tag ${GITHUB_REF_NAME} carries [republish], so version ${VERSION_NAME} (code ${VERSION_CODE}) is being published again over the identical code already live."
            echo "A newer row with the same code wins the publishedAt tie, so /api/app/download will serve these bytes."
            echo "Handsets ALREADY on code ${published} will NOT be offered this — the updater compares codes. This reissue reaches new downloads only."
            echo "REPUBLISHED_SAME_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
            echo "PUBLISHED_BEFORE=${published}" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$VERSION_CODE" -le "$published" ]; then
            if [ "$VERSION_CODE" -eq "$published" ]; then
              echo "::error::Version ${VERSION_NAME} is ALREADY published at this exact code (${published}). If you mean to reissue the same version over it — a build fix with nothing user-visible to bump — put the literal marker [republish] in the ANNOTATED tag's message and push that tag."
              echo "::error::Be sure that is what you want: a handset already on code ${published} will never be offered it, because the updater compares codes."
            fi
            echo "::error::Version ${VERSION_NAME} derives versionCode ${VERSION_CODE}, which is NOT ABOVE the published ${published} (${published_name}). Refusing to publish."
            echo "::error::This is the quiet failure: the API would ACCEPT this release and return 201, this run would go green, and not one device would ever be offered it — 'latest' is the highest versionCode, and that would still be ${published}."
            echo "::error::Bump 'val appVersionName' in android/app/build.gradle.kts above ${published_name} and tag that commit. Remember devices compare the CODE: major*1000000 + minor*1000 + patch."
            exit 1
          fi
          echo "${VERSION_CODE} > ${published}: this release will be the latest."
          echo "PUBLISHED_BEFORE=${published}" >> "$GITHUB_ENV"

      - name: Upload the APK to object storage (presign, then one PUT)
        id: upload
        # Only for an APK that fits one PUT. GUARD 5 decides and sets UPLOAD_MODE; the step
        # below takes the over-size case. Exactly one of the two runs, and both set OBJECT_KEY.
        if: ${{ env.UPLOAD_MODE == 'single' }}
        # ─── THE SAME TWO CALLS THE WEB PUBLISHER MAKES ────────────────────────────────────────
        # POST /api/media/presign returns {uploadUrl, objectKey, bucket, headers, publicUrl} and
        # then the bytes go to `uploadUrl` with exactly the headers it returned. The request body
        # is {filename, mimeType, mediaType, sizeBytes}: an .apk is
        # `application/vnd.android.package-archive` with mediaType "DOCUMENT". The schema is
        # `extra="forbid"`, so an extra field is a 422 rather than something politely ignored —
        # send these four and no more.
        #
        # NO /media/complete CALL, and that is deliberate rather than an omission: an APK is the
        # one thing in this system that is legitimately just an object. `/media/complete` would
        # create a MediaFile row, i.e. put a 66 MB binary into the researchers' media lists. The
        # release is recorded against /app/release BY OBJECT KEY. frontend/lib/media.ts's
        # `uploadStorageObject` exists for exactly this reason and says so.
        #
        # ─── THE PRESIGNED URL IS A CREDENTIAL, SO IT GOES IN A CONFIG FILE TOO ────────────────
        # It carries X-Amz-Signature and is a time-limited write grant to the bucket. Putting it in
        # argv (`curl "$uploadUrl"`) exposes it to anything that can read /proc, and one accidental
        # `set -x` puts it in the log. So the URL and the headers are written into a mode-600 curl
        # config under $RUNNER_TEMP and passed with `--config`; nothing is printed but the object
        # key, which is not a credential.
        #
        # NO RETRY. The presigned signature window is short, and the web client's own answer to a
        # failed PUT is a FRESH presign, not a repeat of a stale one. If this step fails, re-run
        # the workflow: a re-run does the whole thing again from a clean state, which is the
        # behaviour you want on a publish path.
        run: |
          set -euo pipefail
          umask 077
          presign="${RUNNER_TEMP}/presign.json"
          put_cfg="${RUNNER_TEMP}/curl-put.cfg"
          put_out="${RUNNER_TEMP}/put-response.txt"

          code="$(jq -nc --argjson size "$APK_BYTES" \
                '{filename: "app-release.apk",
                  mimeType: "application/vnd.android.package-archive",
                  mediaType: "DOCUMENT",
                  sizeBytes: $size}' \
            | curl -sS --max-time 60 --config "$CURL_AUTH" -o "$presign" -w '%{http_code}' \
                -X POST "${API_BASE}/api/media/presign" \
                -H 'content-type: application/json' \
                --data-binary @-)"
          if [ "$code" != "200" ]; then
            echo "::error::POST /api/media/presign answered ${code}. Nothing has been uploaded and nothing published."
            jq -r '.detail // empty' "$presign" 2>/dev/null | sed 's/^/    detail: /' || true
            exit 1
          fi

          object_key="$(jq -r '.objectKey // empty' "$presign")"
          bucket="$(jq -r '.bucket // empty' "$presign")"
          public_url="$(jq -r '.publicUrl // empty' "$presign")"
          upload_url="$(jq -r '.uploadUrl // empty' "$presign")"
          if [ -z "$object_key" ] || [ -z "$upload_url" ]; then
            echo "::error::The presign response is missing objectKey or uploadUrl. A 200 without them is not a usable upload target."
            exit 1
          fi
          # ─── THE OBJECT KEY IS NOT PRINTED WHOLE, AND THAT IS THIS REPOSITORY'S OWN RULE ───
          # `make_object_key` (backend/app/services/s3.py:143, called from
          # backend/app/api/routes/media.py:190) builds
          #     media/<uploader user id>/<uuid4 hex>/<safe filename>
          # and backend/app/api/routes/design_workshops.py:210-224 records the standing rule as a
          # comment on its own logger: object keys are never logged, "because the key embeds the
          # uploader's user id and the original filename". That rule does not stop applying because
          # the uploader on this path happens to be a CI service account, and the key is the string
          # that addresses the object directly.
          #
          # So the SECOND SEGMENT — the user id, and only that — is masked. The uuid segment is
          # kept deliberately: it is unguessable, it identifies nobody, and it is the part an
          # operator needs in order to find an orphaned upload in the bucket after a failed run.
          # The rewrite is a whitelist: a key whose shape is not the one above prints as a
          # character count and nothing else, rather than falling through to the raw value the
          # moment somebody changes the format.
          case "$object_key" in
            media/*/*/*)
              object_key_safe="media/<uploader-id-redacted>/${object_key#media/*/}"
              ;;
            *)
              object_key_safe="<an object key of ${#object_key} characters, in an unrecognised shape, so no part of it is printed>"
              ;;
          esac
          echo "Presigned an upload target: objectKey=${object_key_safe} bucket=${bucket} (the signed URL is a write credential and is not printed; the uploader id is redacted out of the key)."

          # `url =` and `header =` in a config file, so neither the signed URL nor the content type
          # ever reaches argv. The headers come FROM the response because the signature covers
          # them: sending a different Content-Type than the one presigned is refused by S3.
          {
            printf 'url = "%s"\n' "$upload_url"
            jq -r '.headers | to_entries[] | "header = \"\(.key): \(.value)\""' "$presign"
          } > "$put_cfg"
          chmod 600 "$put_cfg"

          # 15 minutes: 66 MB from a runner is seconds, but a slow link must fail with a timeout
          # rather than hang a publish job until the 6-hour job limit.
          code="$(curl -sS --max-time 900 --config "$put_cfg" --request PUT \
            --upload-file "$APK" -o "$put_out" -w '%{http_code}')"
          echo "PUT (presigned) -> ${code}"
          case "$code" in
            200|201|204) ;;
            *)
              echo "::error::The APK upload answered ${code}; the bytes are not in object storage. Nothing has been published."
              # ─── ONLY <Code> AND <Message>. NEVER THE RAW BODY. ──────────────────────
              # This used to be `head -c 800 "$put_out"`, and that is a credential leak on the one
              # refusal S3 is most likely to hand back here. A `SignatureDoesNotMatch` body echoes
              # the request straight back at you: <AWSAccessKeyId> holds the real access key id,
              # and <StringToSign>, <SignatureProvidedByS3> and a <CanonicalRequest> carrying the
              # whole X-Amz-Credential all sit well inside the first 800 bytes. NONE of those is a
              # registered repository secret, so GitHub's log masking does not touch them, and an
              # Actions log is readable by everyone with repo read access. The comment block above
              # this step spends eight lines keeping the presigned URL out of argv and out of the
              # log; printing S3's echo of it undid every one of them in a single line.
              #
              # <Code> and <Message> are the entire diagnostic value of that body, and neither ever
              # carries a key, a signature or a string-to-sign. The extraction is a WHITELIST and
              # not a redaction: a body that does not have the expected shape prints nothing at all,
              # rather than "print it and hope there was nothing sensitive in it".
              #
              # Written to a file and read back with the `read` builtin rather than piped into
              # `head`: a pipe whose reader exits first hands the writer SIGPIPE, which under
              # `pipefail` is exit 141 — a false failure, on the error path, which is the worst
              # place in this workflow to have one. Two other places in this file (`aapt2 dump
              # badging` and the `unzip -p` mirror check) are written to files for the same reason.
              # TWO SEPARATE PASSES, and this is not a style choice: sed applies every `-e` to
              # the SAME pattern space in order, so a single invocation with both substitutions
              # rewrites the line to `code=...` on the first expression and the second then finds no
              # <Message> to match. S3 puts both elements on one line, so one-invocation form
              # silently dropped the message — the half of the pair that says what to do about it.
              s3_bits="${RUNNER_TEMP}/s3-error-fields.txt"
              sed -n 's:.*<Code>\([^<]*\)</Code>.*:code=\1:p' "$put_out" > "$s3_bits" || true
              sed -n 's:.*<Message>\([^<]*\)</Message>.*:message=\1:p' "$put_out" >> "$s3_bits" || true
              s3_code=""
              s3_message=""
              while IFS= read -r line; do
                case "$line" in
                  code=*)
                    if [ -z "$s3_code" ]; then s3_code="${line#code=}"; fi
                    ;;
                  message=*)
                    if [ -z "$s3_message" ]; then s3_message="${line#message=}"; fi
                    ;;
                esac
              done < "$s3_bits"
              rm -f "$s3_bits"
              if [ -n "$s3_code" ] || [ -n "$s3_message" ]; then
                echo "::error::S3 said: ${s3_code:-<no Code element>} — ${s3_message:-<no Message element>}"
              else
                echo "::error::S3's refusal carried no <Code>/<Message> pair, and the raw body is deliberately NOT printed: the body of a signature error echoes the access key id and the string-to-sign, and neither of those is masked in this log. Reproduce the presign locally to read it."
              fi
              echo "::error::A 403 here is usually an expired signature (re-run: a re-run presigns afresh) or a Content-Type that differs from the one presigned."
              exit 1
              ;;
          esac
          echo "Uploaded ${APK_BYTES} bytes."
          # OBJECT_KEY itself is still exported — the POST body needs the real value, and writing
          # to $GITHUB_ENV does not echo it into the log. OBJECT_KEY_SAFE travels beside it so that
          # every LATER step wanting to name the key in a log line or in the step summary has a
          # printable form to hand, and nobody has to re-derive the redaction in three places.
          {
            echo "OBJECT_KEY=${object_key}"
            echo "OBJECT_KEY_SAFE=${object_key_safe}"
            echo "PUBLIC_URL=${public_url}"
          } >> "$GITHUB_ENV"
          rm -f "$put_cfg"

      # ─── THE OVER-SIZE PATH, AND WHY IT EXISTS NOW ───────────────────────────────────────────
      #
      # GUARD 5 used to refuse at 64 MiB with "the multipart flow is required and is not implemented
      # in this workflow" — honest, and correct to ship with, until CameraX took the APK to
      # 67,222,842 bytes: 113,978 over the line. This is that flow, and it is the same four calls
      # `frontend/lib/media.ts`'s `uploadInParts` makes.
      #
      # NO CORS PROBLEM HERE, which is the one way this is easier than the browser's version. A page
      # needs `ExposeHeaders: ["ETag"]` on the bucket or no part response can be read and a multipart
      # upload is impossible from a browser at all — `lib/media.ts` carries a whole runtime flag for
      # detecting that. curl reads response headers unconditionally.
      #
      # IT ABORTS ON FAILURE. An abandoned multipart upload is invisible storage that is billed and
      # never collected, so the abort runs on any error and reports its own outcome without masking
      # the failure that triggered it.
      - name: Upload the APK to object storage in parts
        id: upload_multipart
        if: ${{ env.UPLOAD_MODE == 'multipart' }}
        env:
          APK: app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail

          # $1 path, $2 JSON body. The bearer comes from the mode-600 curl config written earlier, so
          # the token never reaches a command line, a process list or the log.
          api() {
            curl -sS --config "$CURL_AUTH" -H 'Content-Type: application/json' \
                 -o /tmp/mp.json -w '%{http_code}' --max-time 120 \
                 -X POST "${API_BASE}$1" --data-binary "$2"
          }

          create_body="$(jq -n \
            --arg n "design-prototype-workshop-${VERSION_NAME}.apk" \
            --argjson b "${APK_BYTES}" \
            '{filename:$n, mimeType:"application/vnd.android.package-archive", mediaType:"DOCUMENT", sizeBytes:$b}')"
          code="$(api /api/media/multipart/create "$create_body")" || code=000
          case "$code" in
            200|201) ;;
            *) echo "::error::multipart/create answered ${code}. Nothing was uploaded."; exit 1 ;;
          esac
          object_key="$(jq -r '.objectKey // empty' /tmp/mp.json)"
          upload_id="$(jq -r '.uploadId // empty' /tmp/mp.json)"
          part_size="$(jq -r '.partSize // empty' /tmp/mp.json)"
          part_count="$(jq -r '.partCount // empty' /tmp/mp.json)"
          if [ -z "$object_key" ] || [ -z "$upload_id" ] || [ -z "$part_size" ] || [ -z "$part_count" ]; then
            echo "::error::multipart/create returned ${code} without the four fields the rest of this depends on."
            exit 1
          fi
          echo "created: ${part_count} part(s) of ${part_size} bytes"

          abort_upload() {
            echo "::warning title=Aborting the multipart upload::Parts already sent would otherwise sit billed and uncollected."
            body="$(jq -n --arg k "$object_key" --arg u "$upload_id" '{objectKey:$k, uploadId:$u}')"
            rc="$(api /api/media/multipart/abort "$body")" || rc=000
            echo "abort answered ${rc}"
          }
          trap abort_upload ERR

          numbers="$(seq 1 "$part_count" | jq -s -R 'split("\n") | map(select(length>0) | tonumber)' | jq -c '.')"
          presign_body="$(jq -n --arg k "$object_key" --arg u "$upload_id" --argjson p "$numbers" \
            '{objectKey:$k, uploadId:$u, partNumbers:$p}')"
          code="$(api /api/media/multipart/presign-parts "$presign_body")" || code=000
          if [ "$code" != "200" ]; then
            echo "::error::multipart/presign-parts answered ${code}."
            exit 1
          fi
          cp /tmp/mp.json /tmp/mp-urls.json

          # One pass with `split` rather than a `dd` per part: five 16 MiB reads through dd on a runner
          # disk is slower than one sequential pass, and a short final part is exactly what split
          # produces without any arithmetic of mine.
          rm -rf /tmp/apkparts
          mkdir -p /tmp/apkparts
          split -b "$part_size" -d -a 3 "$APK" /tmp/apkparts/part
          made="$(find /tmp/apkparts -type f | wc -l | tr -d ' ')"
          if [ "$made" != "$part_count" ]; then
            echo "::error::split produced ${made} parts and the server planned ${part_count}. Refusing to guess which is right."
            exit 1
          fi

          parts_json='[]'
          n=0
          for f in $(find /tmp/apkparts -type f | sort); do
            n=$((n + 1))
            url="$(jq -r --arg k "$n" '.urls[$k] // empty' /tmp/mp-urls.json)"
            if [ -z "$url" ]; then
              echo "::error::no presigned URL for part ${n} of ${part_count}."
              exit 1
            fi
            # A presigned URL is a write credential with a deadline. Into a mode-600 config file, the
            # same way the bearer token is handled, and never onto a command line.
            cfg="$(mktemp)"
            chmod 600 "$cfg"
            printf 'url = "%s"\n' "$url" > "$cfg"
            hdr="$(mktemp)"
            pcode="$(curl -sS --config "$cfg" -X PUT --upload-file "$f" \
                     -D "$hdr" -o /dev/null -w '%{http_code}' --max-time 900)" || pcode=000
            shred -u "$cfg" 2>/dev/null || rm -f "$cfg"
            if [ "$pcode" != "200" ]; then
              echo "::error::part ${n} of ${part_count} answered ${pcode}."
              rm -f "$hdr"
              exit 1
            fi
            etag="$(tr -d '\r' < "$hdr" | grep -i '^etag:' | tail -1 | sed -e 's/^[Ee][Tt][Aa][Gg]:[[:space:]]*//' -e 's/"//g')"
            rm -f "$hdr"
            if [ -z "$etag" ]; then
              echo "::error::part ${n} uploaded but answered no ETag, and multipart/complete cannot be called without one."
              exit 1
            fi
            parts_json="$(printf '%s' "$parts_json" | jq -c --argjson pn "$n" --arg e "$etag" '. + [{partNumber:$pn, etag:$e}]')"
            echo "part ${n}/${part_count} ok"
          done

          complete_body="$(jq -n --arg k "$object_key" --arg u "$upload_id" --argjson p "$parts_json" \
            '{objectKey:$k, uploadId:$u, parts:$p}')"
          code="$(api /api/media/multipart/complete "$complete_body")" || code=000
          case "$code" in
            200|201) ;;
            *) echo "::error::multipart/complete answered ${code}. The object is NOT assembled."; exit 1 ;;
          esac
          trap - ERR
          rm -rf /tmp/apkparts

          assembled="$(jq -r '.objectKey // empty' /tmp/mp.json)"
          if [ -n "$assembled" ]; then object_key="$assembled"; fi

          # Masked the way the single-PUT step masks it: the second path segment is the uploader's
          # user id, and this repository's rule is that object keys are not logged.
          safe="$(printf '%s' "$object_key" | awk -F/ 'NF>2{ $2="<uploader-id-redacted>" }1' OFS=/)"
          # PUBLIC_URL TOO, and forgetting it is what broke the first multipart run: the publish step
          # reads it under `set -u`, so an unset variable is "PUBLIC_URL: unbound variable" AFTER a
          # successful 67 MB upload — the object sitting in storage with no release row pointing at it.
          # Harmless (the next run re-uploads) and a waste of six minutes.
          #
          # `complete` answers publicUrl, and `create` answered one too; prefer complete's and fall
          # back, because the assembled object is the thing being named. Empty is legitimate: the
          # backend derives a URL from the object key when no public base is configured, which is
          # exactly what `_durable_url` exists for, and `publish_release` does
          # `payload.url or public_url_for_key(...)`.
          public_url="$(jq -r '.publicUrl // empty' /tmp/mp.json)"
          if [ -z "$public_url" ]; then
            public_url="$(jq -r '.publicUrl // empty' /tmp/mp-urls.json)"
          fi
          echo "assembled ${part_count} parts into ${safe}"
          {
            echo "OBJECT_KEY=${object_key}"
            echo "OBJECT_KEY_SAFE=${safe}"
            echo "PUBLIC_URL=${public_url}"
          } >> "$GITHUB_ENV"

      - name: Publish the release
        id: publish
        if: ${{ env.DRY_RUN == 'false' }}
        # THE ONE IRREVERSIBLE CALL IN THIS WORKFLOW, and the only step a dry run skips.
        #
        # Body: {versionCode, versionName, objectKey, url, notes, sizeBytes}. versionCode is REQUIRED
        # by the schema (`ge=1`) even though the server RE-DERIVES it from the version name and
        # overrides what was sent — and that derivation returns None for a name that is not three
        # plain numbers, in which case the server falls back to the client's number. So the value sent
        # here is not decoration: it is the fallback, and GUARD 1 is what makes it the same number
        # the APK carries.
        #
        # `url` is sent because a release with no downloadable URL is a push that silently does
        # nothing — other devices only show the update prompt when the release carries a non-blank
        # URL. The server derives it from the object key when it is absent, so this is belt and
        # braces, and it is what the browser publisher sends too.
        #
        # ─── `sizeBytes`: WHAT MAKES A PHONE ABLE TO TELL "FINISHED" FROM "STOPPED" ────────────
        # `WorkshopRepository.downloadApk` used to accept any 2xx and hand the bytes to Android's
        # package installer. A response is successful the moment its HEADERS are; the body streams
        # afterwards, so a link that dies part-way through 66 MB leaves a truncated file that the OS
        # then refuses in a system dialog, stacked over a FORCED update prompt with no "Later" in it.
        # The declared length is what lets the app say "that download did not finish" and offer the
        # button again. See android/app/src/main/java/com/designprototype/workshop/data/
        # AppUpdateIntegrity.kt for why a length rather than a hash.
        #
        # IT IS `$APK_BYTES` AND NOT A SECOND MEASUREMENT. GUARD 5 already stats the file
        # (`bytes="$(stat -c%s "$APK")"`), refuses it below MIN_APK_BYTES, chooses the upload path
        # from it and exports it; the single-PUT presign declares the same number, and the multipart
        # step splits into parts by it. A second `stat` here could disagree with all three — which,
        # on the one number a phone will compare a downloaded file against, is worse than not sending
        # it. Both upload paths run before this step and neither rewrites APK_BYTES, so one variable
        # covers both.
        #
        # OPTIONAL ON THE SCHEMA, so a workflow run against an API that predates the field is a 422
        # rather than a silent no-op — see the error arm below, which now names it.
        #
        # The notes carry the tag, the commit and the run id, so that six months later "where did
        # this build come from" has an answer that does not depend on anybody remembering.
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/publish.json"
          notes="Published by ${{ github.workflow }} from tag ${RELEASE_TAG} (commit ${{ github.sha }}, run ${{ github.run_id }})."

          # Refused rather than sent as null: an empty APK_BYTES here means the measuring step did not
          # run or did not export, and publishing a release with no size claim over a pipeline that is
          # supposed to make one is the quiet failure this workflow's whole guard set exists against.
          # A release row is irreversible, so this is checked BEFORE the POST.
          if [ -z "${APK_BYTES:-}" ]; then
            echo "::error::APK_BYTES is empty, so the APK was never measured. GUARD 5 sets it; nothing has been published."
            exit 1
          fi

          code="$(jq -nc \
                --arg versionName "$VERSION_NAME" \
                --argjson versionCode "$VERSION_CODE" \
                --arg objectKey "$OBJECT_KEY" \
                --arg url "$PUBLIC_URL" \
                --arg notes "$notes" \
                --argjson sizeBytes "$APK_BYTES" \
                '{versionCode: $versionCode,
                  versionName: $versionName,
                  objectKey: $objectKey,
                  url: (if $url == "" then null else $url end),
                  notes: $notes,
                  sizeBytes: $sizeBytes}' \
            | curl -sS --max-time 60 --config "$CURL_AUTH" -o "$out" -w '%{http_code}' \
                -X POST "${API_BASE}/api/app/release" \
                -H 'content-type: application/json' \
                --data-binary @-)"
          echo "POST /api/app/release -> ${code}"
          if [ "$code" != "201" ]; then
            echo "::error::POST /api/app/release answered ${code} instead of 201. NOTHING IS PUBLISHED — the APK is sitting in object storage under ${OBJECT_KEY_SAFE} with no release row pointing at it (harmless, and a re-run uploads it again)."
            case "$code" in
              403) echo "::error::403 means the account is not a MASTER_ADMIN. That is checked at login, so this would mean the role changed mid-run." ;;
              422) echo "::error::422 is a schema rejection. The body is exactly {versionCode, versionName, objectKey, url, notes, sizeBytes} and the schema forbids extra fields — check whether it has gained or lost one. If the detail names 'sizeBytes' as an extra input, this workflow is newer than the deployed API: deploy the backend carrying AppReleasePublishRequest.sizeBytes, then re-run." ;;
            esac
            jq -r '.detail // empty' "$out" 2>/dev/null | sed 's/^/    detail: /' || true
            exit 1
          fi

          server_code="$(jq -r '.versionCode // empty' "$out")"
          server_name="$(jq -r '.versionName // empty' "$out")"
          echo "Server recorded: ${server_name} (code ${server_code})."

          # ─── THE SIZE CLAIM, GRADED OFF THE STORED ROW AND NOT OFF THE REQUEST ────────────────
          # A WARNING AND NOT A FAILURE, deliberately. A release row carrying no size is a perfectly
          # good release — an absent size means "download and trust the transfer", which is exactly
          # what every fielded 0.0.7 APK already does — so failing the run here would destroy a
          # correct publish over a check that is an improvement rather than a requirement. What it
          # buys is that the day the column stops round-tripping (a schema drift, a client
          # regenerated without it) somebody sees it on the run that caused it, instead of nobody
          # noticing that no phone has verified a download for six months.
          server_size="$(jq -r '.sizeBytes // empty' "$out")"
          if [ -z "$server_size" ]; then
            echo "::warning title=No size recorded::The release row came back with no sizeBytes, so phones will download this build without checking the transfer completed. The publish itself is fine. Check that the deployed API carries AppRelease.sizeBytes."
          elif [ "$server_size" != "$APK_BYTES" ]; then
            echo "::warning title=Size mismatch::This run built ${APK_BYTES} bytes but the release row records ${server_size}. A phone comparing a good download against that number will refuse it and offer a retry that cannot succeed."
          else
            echo "Size recorded: ${server_size} bytes, matching what was uploaded."
          fi
          if [ "$server_code" != "$VERSION_CODE" ] || [ "$server_name" != "$VERSION_NAME" ]; then
            echo "::error::The server stored ${server_name}/${server_code} but this run built ${VERSION_NAME}/${VERSION_CODE}. The server re-derives the version code from the name, so a disagreement means the two derivations have drifted apart."
            echo "::error::A release row is now live carrying a version this run did not build. Read it at GET /api/app/release/latest and decide deliberately; do not just re-run."
            exit 1
          fi

      - name: Dry run — say plainly that nothing was published
        if: ${{ env.DRY_RUN == 'true' }}
        # A dry run that ends with a green tick and no explanation is how somebody concludes a
        # release went out. This step is the whole reason the dry-run mode is safe to offer: it
        # names, in the log and in the summary, exactly what did NOT happen.
        run: |
          set -euo pipefail
          echo "::notice title=DRY RUN — nothing was published::Built, signed, verified and uploaded ${VERSION_NAME} (code ${VERSION_CODE}) as ${OBJECT_KEY_SAFE}, then STOPPED. POST /api/app/release was not called, GET /api/app/download still answers whatever it answered before, and no device will be offered anything."
          echo "The uploaded object is orphaned by design: no release row and no MediaFile row points at it, so it is invisible to the product and costs only storage."
          echo "To publish for real: push the tag v${VERSION_NAME}, or re-run this workflow from that tag with dry_run unticked."

      - name: GUARD 6 — prove the release is actually published
        id: proof
        if: ${{ env.DRY_RUN == 'false' }}
        # ─── THE MOST-REPEATED FAILURE IN THIS REPOSITORY IS A GREEN RUN THAT PUBLISHED NOTHING ─
        # deploy-frontend.yml carries the register of it (run 32632590460: published nothing,
        # concluded `success`), and its answer is the pattern followed here — grade the artefact
        # the WORLD receives, not the call you just made. A 201 from /app/release proves a row was
        # written. It does not prove that the download resolves, that the object key in that row
        # points at real bytes, or that "latest" is now this build.
        #
        # TWO INDEPENDENT CHECKS, because they fail differently:
        #   • GET /api/app/download is the address the website's button and every phone use. Before
        #     this release it answered 404 ("No Android build has been published yet, so there is
        #     nothing to download") — the measured state of this API. It must now answer a
        #     REDIRECT: the route returns a 307 today (RedirectResponse with
        #     HTTP_307_TEMPORARY_REDIRECT in backend/app/api/routes/app_release.py), so any of the
        #     redirect codes is accepted rather than pinning 302 and failing on a correct API.
        #     It must also not answer 503, which is what the route returns when it HAS a release
        #     row but cannot locate the object — a published release with no bytes behind it.
        #     UNAUTHENTICATED on purpose (a browser cannot attach a bearer token to a plain link),
        #     which is exactly what makes this a check on what a visitor gets rather than on what
        #     this workflow can see.
        #   • GET /api/app/release/latest must report THIS version. "Latest" is the highest
        #     versionCode, so this is the assertion that the row is the one devices will actually
        #     compare against, and it is the direct counterpart to GUARD 4.
        #
        # POLLED, NOT SLEPT (deploy-backend.yml:307-311). The row is written synchronously, but
        # there is a CDN in front of the API and object storage has its own consistency behaviour;
        # a fixed sleep is either too short and flaky or too long and slow.
        #
        # AND THE 404 THIS POLLS AGAINST IS NOW EXPLICITLY UNCACHEABLE, which this step depends on
        # and could not previously assume. A 404 here is the pre-release state of the endpoint, so
        # it is the response the CloudFront distribution in front of the API has the longest
        # opportunity to pick up — and a cached one would make this loop poll 404 for two minutes
        # after a perfectly good publish and then declare the live download button broken. On
        # 2026-08-23 `backend/app/api/routes/app_release.py` was changed to send
        # `Cache-Control: no-store, max-age=0` on the 404 and the 503 as well as on the redirect
        # (only the redirect carried it before). If that header is ever removed, THIS STEP starts
        # producing false "production is broken" failures on correct releases, which is the profile
        # of a guard that gets deleted rather than fixed.
        #
        # THE REDIRECT TARGET IS NEVER PRINTED. It is a presigned GET URL — a credential, however
        # short-lived — so `-o /dev/null` and `%{http_code}` are all this step takes, and `-L` is
        # deliberately absent: following it would fetch 66 MB to learn nothing.
        run: |
          set -euo pipefail
          download_ok=""
          for attempt in $(seq 1 20); do
            # `|| true`, and it is the difference between a retry loop and one attempt with
            # extra steps. This step runs under `set -euo pipefail`, so ONE transient DNS failure,
            # TLS reset or 30-second timeout anywhere in these twenty attempts aborted the step
            # instead of counting as an attempt — and the whole premise of polling is that the
            # early attempts are expected not to succeed. The single case a retry loop exists to
            # survive was therefore the one case it could not, on the far side of the irreversible
            # POST, and the `*)` arm below could never report it.
            # `|| true` and NOT `|| echo 000`: curl writes its `-w` output even when the transfer
            # fails, so 000 has already been printed by then and a second one would concatenate
            # into "000000" and fall through as an unrecognised code. The `:-000` below covers the
            # only remaining case, curl dying before it wrote anything at all.
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${API_BASE}/api/app/download" || true)"
            code="${code:-000}"
            case "$code" in
              301|302|303|307|308)
                echo "GET /api/app/download -> ${code} (redirect) on attempt ${attempt}."
                download_ok="yes"
                break
                ;;
              404)
                echo "attempt ${attempt}: /api/app/download still 404 (no published build visible to the resolver yet)."
                ;;
              503)
                echo "attempt ${attempt}: /api/app/download answered 503 — a release row exists but the object cannot be located in storage."
                ;;
              *)
                echo "attempt ${attempt}: /api/app/download answered ${code}."
                ;;
            esac
            sleep 6
          done
          if [ -z "$download_ok" ]; then
            echo "::error::A release row was created, but GET /api/app/download never answered a redirect. THE DOWNLOAD BUTTON ON THE WEBSITE IS BROKEN RIGHT NOW — fix the live site first, then find out why."
            echo "::error::404 means no release row is visible to the resolver at all. 503 means the row exists but its objectKey does not resolve in object storage, i.e. the release points at nothing: the upload and the release row disagree."
            echo "::error::The published row is at GET /api/app/release/latest. Publishing a corrected release with a HIGHER version is the way forward — a row cannot be un-published, and re-publishing the same version code reaches nobody."
            exit 1
          fi

          latest="${RUNNER_TEMP}/latest-after.json"
          code="$(curl -sS --max-time 30 --config "$CURL_AUTH" -o "$latest" -w '%{http_code}' \
            "${API_BASE}/api/app/release/latest")"
          if [ "$code" != "200" ]; then
            echo "::error::GET /api/app/release/latest answered ${code} after publishing, so the release cannot be confirmed."
            exit 1
          fi
          now_code="$(jq -r '.versionCode // empty' "$latest")"
          now_name="$(jq -r '.versionName // empty' "$latest")"
          url_length="$(jq -r '(.url // "") | length' "$latest")"
          echo "Latest is now: ${now_name} (code ${now_code}); its url field is ${url_length} characters long (the value is not printed — it addresses the object)."
          if [ "$now_code" != "$VERSION_CODE" ] || [ "$now_name" != "$VERSION_NAME" ]; then
            echo "::error::'Latest' is ${now_name} (code ${now_code}), not the ${VERSION_NAME} (code ${VERSION_CODE}) this run published."
            echo "::error::Latest is the HIGHEST versionCode, so something above this release is already published and this build will reach nobody — exactly the outcome GUARD 4 exists to prevent, arrived at from the other direction (a concurrent publish, or a row created outside this workflow)."
            exit 1
          fi
          if [ "$url_length" = "0" ]; then
            echo "::error::The published release carries an EMPTY url. Devices only show the update prompt when the release has a non-blank URL, so this release would sit there and reach nobody."
            exit 1
          fi
          echo "Published and verified: ${VERSION_NAME} (code ${VERSION_CODE}) is latest, and /api/app/download resolves."

      - name: A publish run must have actually published
        id: publish_trap
        # ─── THE THIRD BRANCH THAT DOES NOT EXIST, CAUGHT FROM THE OUTSIDE ────────────
        # The mode step at the top of this job now refuses a DRY_RUN that is neither 'true' nor
        # 'false', so on today's tree this step cannot fire. It exists anyway, because the two
        # defences fail differently and only one of them is inside the file being edited: the mode
        # step asserts the VALUE it computed, and this asserts the OUTCOME of the steps that
        # consumed it. Somebody adding a second condition to the publish step's `if:`, or an
        # expression evaluating false for a reason nobody predicted, produces a SKIPPED publish on a
        # non-dry run — and a skipped step is a green step. The only part of a run anybody reads
        # at a glance is its conclusion, so a run that did not publish must not be able to end green
        # while the summary calls it a publish.
        #
        # NO `always()`, and that is the whole reason this step is not noise. A bare `if:` carries
        # an implicit `success()`, so this is skipped the moment anything above it failed: a real
        # failure in GUARD 2 or GUARD 4 has already failed the job and printed why, and a second
        # red step restating it would bury the actual error. This only ever speaks when every step
        # above it passed AND the publish still did not happen — which is precisely the state that
        # would otherwise be indistinguishable from a successful release.
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail
          publish="${{ steps.publish.outcome }}"
          proof="${{ steps.proof.outcome }}"
          if [ "$publish" = "success" ] && [ "$proof" = "success" ]; then
            echo "POST /api/app/release and GUARD 6 both ran and both passed: this run really did publish ${VERSION_NAME:-?} (code ${VERSION_CODE:-?})."
            exit 0
          fi
          echo "::error title=This run did not publish, and it is not a dry run::DRY_RUN='${DRY_RUN:-unset}', yet POST /api/app/release was '${publish}' and GUARD 6 was '${proof}'. Nothing above this step failed, so without this check the run would have concluded success and the summary would have called it a PUBLISH."
          echo "::error::NOTHING REACHED A HANDSET. Start at the mode step at the top of this job: DRY_RUN must be exactly 'true' or 'false', and every downstream 'if:' compares against those two literals. A skipped step is a green step, which is why the conclusion cannot be trusted to notice this on its own."
          exit 1

      # ─── THE GITHUB RELEASE, AND WHY IT COMES LAST ───────────────────────────────────────────
      #
      # After GUARD 6, deliberately. A Release is the human-facing announcement, and announcing a
      # release that did not reach the API would be worse than not announcing one: somebody would
      # download the attached APK, install it by hand, and be on a build the fleet does not know
      # about. So this runs only once the publish has been PROVEN — `/api/app/download` redirecting
      # and `release/latest` naming this version — and never on a dry run.
      #
      # `if: env.DRY_RUN == 'false'` and a tag: a dispatch has no tag to hang a Release on, and
      # `softprops` / `gh release create` would either fail or invent one.
      #
      # The body is the ANNOTATED TAG'S OWN MESSAGE plus the three facts a reader needs to identify
      # the artefact: the version pair, the signing certificate, and the commit. The tag message is
      # where the reason for a release is already written — GUARD 4 reads it for the [republish]
      # marker — so restating it by hand would be a second copy free to disagree with the first.
      #
      # The APK is attached because the owner asked for it. Worth naming the consequence: this is now
      # a SECOND distribution channel beside `/api/app/download`, and the two cannot drift for this
      # tag (identical bytes, uploaded from the same file in the same job) but a Release is forever
      # while `latest` moves. Anyone installing from an old Release gets an old build, by definition.
      - name: Cut the GitHub Release for this tag
        id: release
        if: ${{ env.DRY_RUN == 'false' && startsWith(github.ref, 'refs/tags/') }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: android/app/build/outputs/apk/release/app-release.apk
          CERT_FINGERPRINT: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          if [ ! -f "$APK" ]; then
            echo "::error::The APK is not where this step expects it (${APK}), so there is nothing to attach. The release was already published to the API; only the GitHub Release is missing."
            exit 1
          fi

          # The tag object is already local — GUARD 4 fetched it. Empty is survivable: the body just
          # loses the annotation, and the three facts below are the part that identifies the build.
          annotation="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"

          # PLAIN `echo` LINES, and two things about them are deliberate.
          #
          # No `printf` with newline escapes: the first version used those and the escapes were
          # consumed before they reached the file, leaving a literal newline inside a
          # single-quoted YAML string and a workflow that would not parse. No heredoc either: its
          # body has to sit at column 0 to avoid being indented into a markdown code block, and
          # column 0 ENDS the YAML block scalar this whole step lives in.
          #
          # And no backticks anywhere in the body. Inside double quotes a backtick is command
          # substitution, so markdown code ticks around a version number would try to RUN it.
          # The table reads perfectly well without them.
          notes="$(mktemp)"
          {
            echo "Published to the fleet and the website by ${GITHUB_WORKFLOW} (run ${GITHUB_RUN_ID})."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | ${VERSION_NAME} |"
            echo "| versionCode | ${VERSION_CODE} |"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| signing certificate SHA-256 | ${CERT_FINGERPRINT} |"
            echo
            echo "Every device offers this build on its next launch or resume - the in-app updater"
            echo "compares versionCode. The attached APK is the same bytes /api/app/download serves"
            echo "for this version."
          } > "$notes"

          # Appended rather than interpolated above, so a tag message containing a backtick or a
          # dollar sign cannot be re-expanded. `--` is not needed; `echo "$var"` is literal.
          if [ -n "$annotation" ]; then
            {
              echo
              echo "---"
              echo
              echo "$annotation"
            } >> "$notes"
          fi

          # The certificate FINGERPRINT is not a secret — it is in every copy of the APK, and a
          # reader needs it to confirm which key signed what they are installing. It is masked in
          # logs by virtue of being a secret value, which is why it is written to the notes file
          # rather than echoed.
          named="design-prototype-workshop-${VERSION_NAME}.apk"
          cp "$APK" "${RUNNER_TEMP}/${named}"

          # `--clobber` so a re-cut tag (see GUARD 4's [republish] path) replaces the asset instead
          # of failing on a name that already exists. `edit` when the Release exists for the same
          # reason: a republished tag must update its Release, not refuse.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A Release already exists for ${TAG} — updating it in place (this is the republish path)."
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
            gh release upload "$TAG" "${RUNNER_TEMP}/${named}" --clobber
          else
            gh release create "$TAG" "${RUNNER_TEMP}/${named}"               --title "$TAG" --notes-file "$notes" --verify-tag
          fi

          url="$(gh release view "$TAG" --json url --jq .url)"
          echo "Release: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "- GitHub Release: ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the published APK as a run artifact
        if: ${{ always() && steps.size.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # THE EXACT BYTES THAT WENT OUT, kept for as long as artifacts are kept. Not a
          # convenience: the release-signed APK is what a support question ("which build is this
          # user on, and what is in it?") has to be answered against, and object storage holds it
          # under a machine-generated key while this holds it under the version.
          #
          # `path:` is repo-root relative — actions/upload-artifact does not honour
          # `defaults.run.working-directory`.
          name: app-release-${{ env.VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload the R8 mapping
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # WITHOUT THIS, THE CRASHES FROM THIS BUILD CANNOT BE READ. Release is the only variant
          # with R8 enabled, so every stack trace from a field handset arrives obfuscated, and
          # `mapping.txt` is the only thing that turns it back into names. It is generated inside
          # the build directory and thrown away with the runner. The rest of the directory
          # (r8-removed.txt, seeds.txt, usage.txt, configuration.txt, resources.txt) is how this
          # project checks what R8 stripped, which is the other question a release raises.
          name: android-release-mapping-${{ env.VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/mapping/release/
          # `warn`, not `error`: this step runs under always(), including on a run that failed
          # before Gradle produced anything. A missing-artifact error there would replace the real
          # failure on the run with a bookkeeping one.
          if-no-files-found: warn
          retention-days: 90

      - name: Shred the credentials this job wrote to disk
        if: ${{ always() }}
        # RUN FROM RUNNER_TEMP, NOT FROM `android/`. The job's default working directory is
        # `android`, which does not exist when checkout itself failed — and on 2026-08-23 that turned
        # this cleanup into "An error occurred trying to start process '/usr/bin/bash' … No such file
        # or directory". A shred step that cannot start is a shred step that did not happen. The paths
        # below are all absolute under RUNNER_TEMP, so it never needed the repository anyway.
        working-directory: ${{ runner.temp }}
        # ALWAYS, INCLUDING ON FAILURE, which is the only version of this step worth having: a job
        # that dies between decoding the keystore and finishing is exactly when files get left
        # behind. The runner is ephemeral and $RUNNER_TEMP goes with it, so this is belt and
        # braces — but the keystore is the one secret in this project that CANNOT BE ROTATED, and
        # a self-hosted runner, or a future change of runner, is not the moment to discover that
        # this file outlived its job. `shred` overwrites before unlinking; the `|| rm -f` fallback
        # keeps a missing `shred` from turning cleanup into a failure that masks the real one.
        #
        # The curl config files hold a live master-admin bearer token and a presigned write URL,
        # which is why they are in this list and not only the keystore.
        run: |
          set -euo pipefail
          for f in \
            "${RUNNER_TEMP}/release-signing-key.jks" \
            "${RUNNER_TEMP}/curl-auth.cfg" \
            "${RUNNER_TEMP}/curl-put.cfg" \
            "${RUNNER_TEMP}/login.json" \
            "${RUNNER_TEMP}/presign.json"; do
            if [ -e "$f" ]; then
              shred -u "$f" 2>/dev/null || rm -f "$f"
              echo "removed $(basename "$f")"
            fi
          done
          echo "No credential file remains in RUNNER_TEMP, which is the intended end state."

      - name: Summarise
        if: ${{ always() }}
        # Same reason as the shred step above: the default `android` working directory does not
        # exist if checkout failed, and a summary that cannot start is the one a reader most needs.
        working-directory: ${{ runner.temp }}
        # The step summary is not the guard — nobody reads a summary on a green run, which is why
        # every check above fails the job instead of writing a note. It is here for the person who
        # opens this run six months later and needs to know what it did.
        run: |
          set -euo pipefail
          {
            echo "### Publish Android release"
            echo ""
            # THREE-WAY, not `if true / else PUBLISH`. This step is `always()`, so it also runs on
            # a job that died before the mode step wrote DRY_RUN at all — and the two-way form read
            # an unset variable as "not a dry run" and headed the summary **PUBLISH**, which is the
            # one word a reader takes at face value. An unknown mode has to say so.
            case "${DRY_RUN:-unset}" in
              true)
                echo "**DRY RUN — nothing was published.** The release record was not created."
                ;;
              false)
                echo "**PUBLISH** — tag \`${RELEASE_TAG:-none}\`"
                ;;
              *)
                echo "**MODE UNKNOWN (\`DRY_RUN=${DRY_RUN:-unset}\`).** This run did not get as far as"
                echo "deciding what it was, or the mode step refused it. Nothing below may be read as a"
                echo "publish."
                ;;
            esac
            echo ""
            echo "| what | value |"
            echo "|---|---|"
            echo "| version | \`${VERSION_NAME:-?}\` (code \`${VERSION_CODE:-?}\`) |"
            echo "| previously published | \`${PUBLISHED_BEFORE:-not reached}\` |"
            echo "| APK size | \`${APK_BYTES:-?}\` bytes |"
            echo "| object key | \`${OBJECT_KEY_SAFE:-not uploaded}\` |"
            echo ""
            echo "| step | result |"
            echo "|---|---|"
            echo "| GUARD 1 tag == built version | ${{ steps.version.outcome }} |"
            echo "| GUARD 3 API is this product's | ${{ steps.api_identity.outcome }} |"
            echo "| assembleRelease | ${{ steps.assemble.outcome }} |"
            echo "| GUARD 2 signer fingerprint | ${{ steps.signer.outcome }} |"
            echo "| GUARD 5 upload path chosen | ${{ steps.size.outcome }} (${{ env.UPLOAD_MODE }}) |"
            echo "| login (MASTER_ADMIN) | ${{ steps.login.outcome }} |"
            echo "| GUARD 4 versionCode above published | ${{ steps.ceiling.outcome }} |"
            echo "| upload (presign + PUT) | ${{ steps.upload.outcome }} |"
            echo "| POST /api/app/release | ${{ steps.publish.outcome }} |"
            echo "| GUARD 6 published and resolvable | ${{ steps.proof.outcome }} |"
            echo "| the publish actually happened | ${{ steps.publish_trap.outcome }} |"
            echo ""
            echo "**Still not verified by this run:** R8 and resource shrinking are release-only, and"
            echo "their failure mode is a \`SerializationException\` or a \`NoSuchMethodError\` at the first"
            echo "sync, on a build that installs and runs fine. No device or emulator exists on a GitHub"
            echo "runner and no instrumented test ran here. A release must still be taken through the"
            echo "offline loop on real hardware — a green run above does not do that for you."
          } >> "$GITHUB_STEP_SUMMARY"
