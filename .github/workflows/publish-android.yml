name: Publish Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything EXCEPT POST /api/app/release. Leave ticked to exercise the pipeline."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-android
  cancel-in-progress: false

env:
  API_BASE: https://d3ekigkotd1xa2.cloudfront.net
  FIELDREPO_API_HOST: d2b34i3e92al6i.cloudfront.net
  EXPECTED_APK_API_BASE: https://d3ekigkotd1xa2.cloudfront.net/api/
  APK: app/build/outputs/apk/release/app-release.apk
  UNSIGNED_APK: app/build/outputs/apk/release/app-release-unsigned.apk
  BUILD_TOOLS_VERSION: "37.0.0"
  SINGLE_PUT_LIMIT_BYTES: "67108864"
  MIN_APK_BYTES: "41943040"
  EXPECTED_APPLICATION_ID: com.designprototype.workshop

jobs:
  backend-live:
    name: Backend for this commit is live
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Wait for deploy-backend on this commit, then for /health to report its backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ENFORCE: ${{ (github.event_name == 'push' || inputs.dry_run == false) && 'true' || 'false' }}
        run: bash scripts/ci/await_backend_release.sh

  provenance:
    name: The commit is on main
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse a ref or commit that main does not contain
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "::error title=Android publish refused: not main::Dispatch this workflow from main or from a release tag, not from '${REF}'. The signing key and the publish account only reach commits on main."
            exit 1
          fi
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error title=Android publish refused: commit not on main::${GITHUB_SHA} is not reachable from main. Tag a commit that has been merged to main."
            exit 1
          fi
          echo "${GITHUB_SHA} is on main"

  publish:
    needs: [backend-live, provenance]
    runs-on: ubuntu-26.04
    environment: android-release
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Resolve the run mode, and refuse to publish something no tag names
        id: mode
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          ref_type="${{ github.ref_type }}"
          ref_name="${GITHUB_REF_NAME}"
          requested_dry="${{ inputs.dry_run }}"

          if [ "$event" = "workflow_dispatch" ]; then
            dry_run="${requested_dry:-true}"
          else
            dry_run="false"
          fi

          case "$dry_run" in
            true|false) ;;
            *)
              echo "::error title=Android publish refused: unreadable mode::dry_run resolved to '${dry_run}', which is neither 'true' nor 'false'. Every step below compares against one of those two literals, so a third value would SKIP the publish, SKIP the proof, SKIP the dry-run notice, and still report success."
              exit 1
              ;;
          esac

          tag=""
          if [ "$ref_type" = "tag" ]; then
            tag="$ref_name"
          fi

          if [ -z "$tag" ] && [ "$dry_run" = "false" ]; then
            echo "::error title=Android publish refused: no tag::This run was started from ${ref_type} '${ref_name}', so there is no tag to check the built version against and GUARD 1 cannot run."
            echo "::error::Publishing is refused rather than trusting android/app/build.gradle.kts on its own — a version nobody named in a tag is a version nobody can look up afterwards."
            echo "::error::Either push the release tag (git tag vX.Y.Z && git push origin vX.Y.Z), or re-run this workflow from the tag ref, or leave dry_run ticked."
            exit 1
          fi

          {
            echo "DRY_RUN=${dry_run}"
            echo "RELEASE_TAG=${tag}"
          } >> "$GITHUB_ENV"

          if [ "$dry_run" = "true" ]; then
            echo "MODE: DRY RUN — everything except POST /api/app/release. Nothing will be published."
          else
            echo "MODE: PUBLISH — tag '${tag}'."
          fi

      - name: Gate — every secret this run needs is present
        env:
          HAVE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
          HAVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD != '' }}
          HAVE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS != '' }}
          HAVE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
          HAVE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 != '' }}
          HAVE_PUBLISH_EMAIL: ${{ secrets.APP_PUBLISH_EMAIL != '' }}
          HAVE_PUBLISH_PASSWORD: ${{ secrets.APP_PUBLISH_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=""
          for pair in \
            "ANDROID_RELEASE_KEYSTORE_BASE64:${HAVE_KEYSTORE}" \
            "ANDROID_RELEASE_KEYSTORE_PASSWORD:${HAVE_KEYSTORE_PASSWORD}" \
            "ANDROID_RELEASE_KEY_ALIAS:${HAVE_KEY_ALIAS}" \
            "ANDROID_RELEASE_CERT_SHA256:${HAVE_CERT_SHA256}" \
            "APP_PUBLISH_EMAIL:${HAVE_PUBLISH_EMAIL}" \
            "APP_PUBLISH_PASSWORD:${HAVE_PUBLISH_PASSWORD}"; do
            name="${pair%%:*}"
            present="${pair##*:}"
            echo "${name}: ${present}"
            if [ "$present" != "true" ]; then
              missing="${missing} ${name}"
            fi
          done
          echo "ANDROID_RELEASE_KEY_PASSWORD: ${HAVE_KEY_PASSWORD} (optional — absent means 'same as the store password')"

          if [ -n "$missing" ]; then
            echo "::error title=Android publish is not configured::Missing repository secrets:${missing}. This run FAILS rather than reporting success over a release nobody made."
            echo "::error::Set them in Settings → Secrets and variables → Actions. The signing key is required even for a dry run: an unsigned APK proves nothing about the pipeline."
            exit 1
          fi

      - name: GUARD 1 — the tag must name the version this tree builds
        id: version
        run: |
          set -euo pipefail
          gradle_file="app/build.gradle.kts"

          declarations="$(grep -c '^val appVersionName = "' "$gradle_file" || true)"
          if [ "$declarations" != "1" ]; then
            echo "::error::Expected exactly one 'val appVersionName = \"…\"' line in android/${gradle_file}; found ${declarations}."
            echo "::error::That line is the only source of the version name. Fix this parse to match the file — do not guess the version."
            exit 1
          fi
          tree_version="$(sed -n 's/^val appVersionName = "\([^"]*\)".*/\1/p' "$gradle_file")"
          if [ -z "$tree_version" ]; then
            echo "::error::Parsed an EMPTY version out of android/${gradle_file}. An empty version would compare equal to an empty tag and publish nothing recognisable, so it is a failure of its own."
            exit 1
          fi
          echo "android/${gradle_file} builds version: ${tree_version}"

          if [ -n "${RELEASE_TAG}" ]; then
            case "${RELEASE_TAG}" in
              v*) tag_version="${RELEASE_TAG#v}" ;;
              *)
                echo "::error::Tag '${RELEASE_TAG}' does not start with 'v'. The trigger is 'v*' and the convention is v<MAJOR>.<MINOR>.<PATCH>, e.g. v0.0.2."
                exit 1
                ;;
            esac
            if [ "$tag_version" != "$tree_version" ]; then
              echo "::error::Tag ${RELEASE_TAG} means version ${tag_version}, but android/${gradle_file} builds ${tree_version}. Refusing to build."
              echo "::error::The version is COMPILED IN and cannot be corrected downstream: publishing this would put '${tag_version}' on the website over an APK that reports '${tree_version}'."
              echo "::error::Fix by bumping 'val appVersionName' to ${tag_version} and re-tagging that commit (the tag must point at the bump, not at its parent)."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} agrees with the tree."
          else
            echo "::notice::No tag on this run (dry run from ${{ github.ref_type }} '${GITHUB_REF_NAME}'), so GUARD 1's comparison did not run. Version taken from the tree: ${tree_version}."
          fi

          code_lines="$(grep -c '^val appVersionCode = ' "$gradle_file" || true)"
          if [ "$code_lines" != "1" ]; then
            echo "::error::Expected exactly one 'val appVersionCode = N' line in android/${gradle_file}; found ${code_lines}."
            exit 1
          fi
          version_code="$(sed -n 's/^val appVersionCode = \([0-9][0-9]*\)[[:space:]]*$/\1/p' "$gradle_file")"
          if [ -z "$version_code" ] || [ "$((10#$version_code))" -lt 1 ]; then
            echo "::error::'val appVersionCode' in android/${gradle_file} is not a positive whole number."
            exit 1
          fi
          version_code=$((10#$version_code))

          echo "versionCode from android/${gradle_file}: ${version_code}"
          {
            echo "VERSION_NAME=${tree_version}"
            echo "VERSION_CODE=${version_code}"
          } >> "$GITHUB_ENV"

      - name: GUARD 3 — the API must be THIS product's
        id: api_identity
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${API_BASE}/api/design-workshops" || true)"
          code="${code:-000}"
          echo "GET ${API_BASE}/api/design-workshops -> ${code}"
          case "$code" in
            401)
              echo "401 as expected: the route exists and requires a bearer token, which is this product's API."
              ;;
            404)
              echo "::error::${API_BASE} answered 404 for /api/design-workshops. THAT ROUTE DOES NOT EXIST ON THE SIBLING PRODUCT'S DISTRIBUTION (${FIELDREPO_API_HOST}) — this is almost certainly the wrong CloudFront distribution."
              echo "::error::Publishing there would succeed and would push this app over ANOTHER PRODUCT'S app. Refusing. docs/CI.md section 0 is the register of which distribution is which."
              exit 1
              ;;
            200)
              echo "::error::${API_BASE} answered 200 for /api/design-workshops with no Authorization header. On this product that route is authenticated, so either this is not our API or the route has lost its guard."
              echo "::error::Do not publish until that is understood: an unauthenticated design-workshops list is a data-exposure finding, not a CI nuisance."
              exit 1
              ;;
            000)
              echo "::error::No HTTP response at all from ${API_BASE} (curl reported 000 — DNS, TLS or timeout). Nothing has been built or published."
              exit 1
              ;;
            *)
              echo "::error::${API_BASE} answered ${code} for /api/design-workshops, which is neither the expected 401 nor the sibling's 404. Do not guess: find out what is in front of this hostname before publishing."
              exit 1
              ;;
          esac

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Ensure the required Android SDK packages are installed
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.2" "build-tools;${BUILD_TOOLS_VERSION}" > /dev/null
          tools="${sdk_root}/build-tools/${BUILD_TOOLS_VERSION}"
          for tool in apksigner aapt2; do
            if [ ! -x "${tools}/${tool}" ]; then
              echo "::error::${tools}/${tool} is missing after installing build-tools;${BUILD_TOOLS_VERSION}."
              echo "::error::Without apksigner the signer cannot be proved, and this workflow must not publish an APK whose signature it has not read. Fix the SDK install rather than skipping the check."
              exit 1
            fi
          done
          echo "ANDROID_BUILD_TOOLS=${tools}" >> "$GITHUB_ENV"

      - name: Fetch the vendored sherpa-onnx AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aar="app/libs/sherpa-onnx-static-link-onnxruntime-1.13.8.aar"
          sha="b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471"
          mkdir -p app/libs
          "$GITHUB_WORKSPACE/scripts/ci/fetch_release_asset.sh" k2-fsa/sherpa-onnx v1.13.8 sherpa-onnx-static-link-onnxruntime-1.13.8.aar "$aar" "$sha" 38691998 555212241
          echo "$sha  $aar" | sha256sum -c -
          test "$(stat -c%s "$aar")" = "38691998"

      - name: Materialise the release keystore outside the workspace
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/release-signing-key.jks"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          chmod 600 "$keystore"

          bytes="$(stat -c%s "$keystore")"
          if [ "$bytes" -lt 512 ]; then
            echo "::error::The decoded keystore is only ${bytes} bytes, which is too small to be a keystore. ANDROID_RELEASE_KEYSTORE_BASE64 is truncated, or is not base64 of the .jks."
            exit 1
          fi
          magic="$(head -c 4 "$keystore" | od -An -tx1 | tr -d ' \n')"
          case "$magic" in
            feedfeed*) kind="JKS" ;;
            30*)       kind="PKCS#12 (DER)" ;;
            *)
              echo "::error::The decoded keystore does not start with a keystore magic number (JKS 0xFEEDFEED or PKCS#12 0x30). The secret is probably double-encoded, wrapped in quotes, or carries a BOM."
              echo "::error::Left unchecked this produces a signing failure deep in the Gradle build, or — if the file merely looks present — a release APK that is UNSIGNED and installs nowhere."
              exit 1
              ;;
          esac
          echo "Keystore decoded: ${bytes} bytes, format ${kind}. Its contents are never printed."
          echo "RELEASE_KEYSTORE_PATH=${keystore}" >> "$GITHUB_ENV"

      - name: Assemble the signed release APK
        id: assemble
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ env.RELEASE_KEYSTORE_PATH }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_TENANT: ${{ vars.MICROSOFT_TENANT }}
          YAHOO_CLIENT_ID: ${{ vars.YAHOO_CLIENT_ID }}
          OIDC_REDIRECT_URI: ${{ vars.OIDC_REDIRECT_URI }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --console=plain --stacktrace 2>&1 \
            | tee "${RUNNER_TEMP}/assemble-release.log"

      - name: Assert the build produced a SIGNED artefact and said nothing to the contrary
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/assemble-release.log"

          if [ -f "$UNSIGNED_APK" ]; then
            echo "::error::${UNSIGNED_APK} exists. AGP writes that name when there is NO signing config, which means build.gradle.kts did not consider the release key usable."
            echo "::error::An unsigned APK installs on nothing and must never be published. Check that ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD and ANDROID_RELEASE_KEY_ALIAS are all set, and that the alias exists in that store."
            exit 1
          fi
          if [ ! -f "$APK" ]; then
            echo "::error::${APK} was not produced by :app:assembleRelease, and neither was the unsigned name. The build reported success, so something changed about the output path or the variant — read the assemble step's log above."
            exit 1
          fi

          if grep -q "release: UNSIGNED" "$log"; then
            echo "::error::The Gradle log says 'release: UNSIGNED — no release key configured'. The build SUCCEEDED and the APK cannot be installed by anyone."
            echo "::error::This is the failure mode this workflow exists to make loud: it is one lifecycle line among hundreds and it never fails a build."
            exit 1
          fi
          if grep -q "release signing: .*is not usable" "$log"; then
            echo "::error::The Gradle log carries the half-configured signing warning: a keystore path was set but the key was not usable (the log line itself says which of file-present / password-set / alias-set failed)."
            exit 1
          fi
          if grep -q "release: signing with the DEBUG keystore" "$log"; then
            echo "::error::The Gradle log says the release variant was signed with the DEBUG KEYSTORE (debugSignRelease=true, and no release key resolved). That APK is signed and it installs, and it must never be published: the debug keystore ships with every Android SDK, so anybody can sign an update for it."
            echo "::error::On a runner this can only mean the release key did not resolve — check ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD and ANDROID_RELEASE_KEY_ALIAS. A real key always wins over the flag (build.gradle.kts:348-357 states that ordering and why), so a key that resolved cannot reach this branch."
            exit 1
          fi

          if ! grep -q "release: signing with the RELEASE key" "$log"; then
            echo "::notice::The expected 'release: signing with the RELEASE key' lifecycle line was not found in the build log. GUARD 2 is the authority on whether this APK is signed correctly; if that passes, this line has probably just been reworded in build.gradle.kts — update the grep."
          fi
          echo "Artefact present under the signed name: ${APK} ($(stat -c%s "$APK") bytes)."

      - name: GUARD 2 — the signer must be the expected key, and there must BE one
        id: signer
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/apksigner.txt"

          if ! "${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$APK" > "$out" 2>&1; then
            echo "::error::apksigner refused ${APK}. Either it is UNSIGNED (the silent outcome of a missing release key) or its signature does not verify."
            echo "::error::apksigner said:"
            sed 's/^/    /' "$out"
            exit 1
          fi

          digest_lines="$(grep -c 'certificate SHA-256 digest:' "$out" || true)"
          if [ "$digest_lines" != "1" ]; then
            echo "::error::apksigner reported ${digest_lines} certificate SHA-256 digests for this APK; expected exactly 1."
            echo "::error::Do not loosen this to 'at least one'. An APK carrying an extra signer is a different identity to Android and cannot be reasoned about from a fingerprint match on one of them."
            sed 's/^/    /' "$out"
            exit 1
          fi

          actual="$(sed -n 's/.*certificate SHA-256 digest: *//p' "$out" | tr -d ' :\r\n' | tr 'A-F' 'a-f')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ' :\r\n' | tr 'A-F' 'a-f')"
          if [ -z "$actual" ]; then
            echo "::error::Could not parse a certificate SHA-256 out of apksigner's output. Read it below and fix the parse — an unparsed fingerprint must never be treated as a match."
            sed 's/^/    /' "$out"
            exit 1
          fi
          if [ ${#expected} -ne 64 ]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 is ${#expected} characters after stripping colons and spaces; a SHA-256 is 64 hex characters. The value itself is not printed."
            echo "::error::An unusable expected value must fail here rather than compare unequal further down, where it would look exactly like a wrong signing key."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::THE RELEASE APK IS SIGNED WITH THE WRONG KEY. Refusing to publish."
            echo "::error::Signer read from the artefact: ${actual}"
            echo "::error::(The expected value is a repository secret and is not printed.) This key cannot be rotated: an APK signed with anything else is refused as an update by every device that already has the app, for ever."
            echo "::error::Check ANDROID_RELEASE_KEYSTORE_BASE64 and ANDROID_RELEASE_KEY_ALIAS — a store holding more than one key will happily sign with the wrong alias."
            exit 1
          fi
          echo "Signer fingerprint matches ANDROID_RELEASE_CERT_SHA256 (neither value printed)."

          if ! grep -qE 'Verified using v[23] scheme[^:]*: true' "$out"; then
            echo "::error::apksigner did not report a v2 or v3 signature scheme as verified, though build.gradle.kts enables both."
            echo "::error::If the tooling has merely reworded this line, update the grep — do not delete the check: a v1-only APK is what an old signing path produces, and modern Android validates v2/v3."
            sed 's/^/    /' "$out"
            exit 1
          fi
          grep -E '^(Verifies|Verified using|Number of signers)' "$out" | sed 's/^/    /'

      - name: Assert the APK carries the tagged version and this app's identity
        run: |
          set -euo pipefail
          badging_all="${RUNNER_TEMP}/badging.txt"
          "${ANDROID_BUILD_TOOLS}/aapt2" dump badging "$APK" > "$badging_all"
          badging="$(sed -n '1p' "$badging_all")"
          apk_package="$(printf '%s' "$badging" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          apk_version_code="$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          apk_version_name="$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          echo "APK manifest: package=${apk_package} versionCode=${apk_version_code} versionName=${apk_version_name}"

          if [ -z "$apk_package" ] || [ -z "$apk_version_code" ] || [ -z "$apk_version_name" ]; then
            echo "::error::Could not parse package/versionCode/versionName out of 'aapt2 dump badging'. An unparsed value must not be treated as a match — fix the parse."
            echo "    ${badging}"
            exit 1
          fi
          if [ "$apk_package" != "$EXPECTED_APPLICATION_ID" ]; then
            echo "::error::The APK's package is '${apk_package}', expected '${EXPECTED_APPLICATION_ID}'. That is a DIFFERENT APP to Android: it would install beside the real one instead of updating it, and the in-app updater would never offer it."
            exit 1
          fi
          if [ "$apk_version_name" != "$VERSION_NAME" ] || [ "$apk_version_code" != "$VERSION_CODE" ]; then
            echo "::error::The built APK says ${apk_version_name} (code ${apk_version_code}) but this run is publishing ${VERSION_NAME} (code ${VERSION_CODE})."
            echo "::error::GUARD 1 checked the tag against the SOURCE; this checks it against the ARTEFACT. A mismatch here means the bytes are not the version this run believes it built — a stale incremental output is the usual cause. Re-run with a clean build; do not publish."
            exit 1
          fi

          metadata="app/build/outputs/apk/release/output-metadata.json"
          if [ -f "$metadata" ]; then
            meta_code="$(jq -r '.elements[0].versionCode // empty' "$metadata")"
            meta_name="$(jq -r '.elements[0].versionName // empty' "$metadata")"
            if [ "$meta_code" != "$VERSION_CODE" ] || [ "$meta_name" != "$VERSION_NAME" ]; then
              echo "::error::output-metadata.json says ${meta_name}/${meta_code} while the APK manifest says ${apk_version_name}/${apk_version_code}. These are written by the same build, so a disagreement means one of them is left over from an earlier one."
              exit 1
            fi
            echo "output-metadata.json agrees with the manifest."
          else
            echo "::notice::No output-metadata.json beside the APK. Not fatal — the manifest read above is the authority — but AGP normally writes it, so the output layout may have changed."
          fi

      - name: Assert the APK points at THIS product's API and packages only field ABIs
        run: |
          set -euo pipefail

          bytes_file="${RUNNER_TEMP}/apk-bytes"
          unzip -p "$APK" > "$bytes_file"

          if ! grep -aqF "$EXPECTED_APK_API_BASE" "$bytes_file"; then
            echo "::error::The release APK does not contain the production API base '${EXPECTED_APK_API_BASE}'."
            echo "::error::That string is the compiled-in DEFAULT_API_BASE_URL. Its absence means the build took an apiBaseUrl from somewhere else — a local.properties on the runner (there must not be one), or a changed fallback in build.gradle.kts."
            echo "::error::An APK that points anywhere else reaches nothing on a handset, and it cannot be corrected after publishing."
            exit 1
          fi
          if grep -aqF "://localhost" "$bytes_file"; then
            echo "::error::The release APK contains a 'localhost' URL literal. This is the localhost release: it installs, opens and reaches nothing."
            echo "::error::Cause: an 'apiBaseUrl' pointing at a laptop reached the build. There must be no android/local.properties on a runner. (The bare word 'localhost' in res/xml/network_security_config.xml is expected and is NOT what this matched — the needle is '://localhost'.)"
            exit 1
          fi
          if grep -aqF "$FIELDREPO_API_HOST" "$bytes_file"; then
            echo "::error::The release APK references ${FIELDREPO_API_HOST}, which is the SIBLING PRODUCT's API. Publishing this would point this product's users at another product's backend."
            exit 1
          fi
          rm -f "$bytes_file"
          echo "APK carries the production API base; no localhost literal; no sibling host."

          abis="$(unzip -Z1 "$APK" 'lib/*' 2>/dev/null | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)"
          echo "Packaged ABIs: ${abis:-<none>}"
          if [ -z "$abis" ]; then
            echo "::error::The APK contains no lib/ entries at all, so it carries no native libraries. This app links a native speech engine (sherpa-onnx); an APK without it is not the app."
            exit 1
          fi
          expected_abis="arm64-v8a armeabi-v7a "
          if [ "$abis" != "$expected_abis" ]; then
            echo "::error::Packaged ABIs are '${abis}', expected '${expected_abis}'."
            echo "::error::Four ABIs means releaseAllAbis=true reached this build — about 22 MB of x86 libraries no field handset can load, and build.gradle.kts says explicitly not to publish it. Fewer than two means an ABI split, which breaks every handset of the missing architecture with INSTALL_FAILED_NO_MATCHING_ABIS."
            exit 1
          fi

      - name: GUARD 5 — the APK must fit the single-PUT upload path
        id: size
        run: |
          set -euo pipefail
          bytes="$(stat -c%s "$APK")"
          headroom=$(( SINGLE_PUT_LIMIT_BYTES - bytes ))
          echo "${APK}: ${bytes} bytes (single-PUT limit ${SINGLE_PUT_LIMIT_BYTES}, headroom ${headroom})"

          if [ "$bytes" -lt "$MIN_APK_BYTES" ]; then
            echo "::error::The release APK is ${bytes} bytes, below the ${MIN_APK_BYTES}-byte floor. A real two-ABI release measured 66,704,870 bytes."
            echo "::error::A file this small is a truncated or empty output, not a release — a Kotlin-daemon OOM has produced a zero-byte APK in this project before, on a build that reported success. Do not publish it."
            exit 1
          fi
          if [ "$bytes" -ge "$SINGLE_PUT_LIMIT_BYTES" ]; then
            echo "UPLOAD_MODE=multipart" >> "$GITHUB_ENV"
            echo "::notice title=Multipart upload::${bytes} bytes is at or above the ${SINGLE_PUT_LIMIT_BYTES}-byte single-PUT limit, so the APK goes up in parts."
          else
            echo "UPLOAD_MODE=single" >> "$GITHUB_ENV"
            echo "${bytes} bytes fits the single-PUT path (limit ${SINGLE_PUT_LIMIT_BYTES})."
          fi
          if [ "$headroom" -lt 2097152 ]; then
            echo "::notice::Only ${headroom} bytes of headroom under the 64 MiB single-PUT limit. The next release may well cross it; the multipart flow named above is what will be needed."
          fi
          echo "APK_BYTES=${bytes}" >> "$GITHUB_ENV"

      - name: Sign in to the API as the publishing master admin
        id: login
        env:
          APP_PUBLISH_EMAIL: ${{ secrets.APP_PUBLISH_EMAIL }}
          APP_PUBLISH_PASSWORD: ${{ secrets.APP_PUBLISH_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          body="${RUNNER_TEMP}/login.json"
          auth="${RUNNER_TEMP}/curl-auth.cfg"

          code="$(jq -nc '{email: env.APP_PUBLISH_EMAIL, password: env.APP_PUBLISH_PASSWORD}' \
            | curl -sS --max-time 60 -o "$body" -w '%{http_code}' \
                -X POST "${API_BASE}/api/auth/login" \
                -H 'content-type: application/json' \
                --data-binary @-)"

          if [ "$code" != "200" ]; then
            echo "::error::POST /api/auth/login answered ${code}. Nothing has been published."
            case "$code" in
              401) echo "::error::401 is 'Invalid email or password' — the API deliberately gives one answer for an unknown address and a wrong password. Check APP_PUBLISH_EMAIL and APP_PUBLISH_PASSWORD." ;;
              403) echo "::error::403 means the credential is right but the account is not admitted (pending approval, or off the platform allow-list). Publishing needs a MASTER_ADMIN." ;;
              422) echo "::error::422 is a schema rejection: the login body must be {email, password} and the password has a minimum length. Neither value is printed." ;;
            esac
            jq -r '.detail // empty' "$body" 2>/dev/null | sed 's/^/    detail: /' || true
            exit 1
          fi

          token="$(jq -r '.accessToken // .access_token // empty' "$body")"
          if [ -z "$token" ]; then
            echo "::error::The login returned 200 but no token under .accessToken or .access_token. A 200 with an empty token is exactly the 'cheerful false pass' that would make every later call anonymous and every guard below meaningless."
            exit 1
          fi
          role="$(jq -r '.user.role // "unknown"' "$body")"
          echo "Signed in: token present, ${#token} characters. Account role: ${role}."
          if [ "$role" != "MASTER_ADMIN" ]; then
            echo "::error::This account's role is '${role}'. POST /api/app/release is master-admin only (require_master_admin), so publishing would fail with a 403 after the APK had already been uploaded."
            echo "::error::Failing now, while nothing has been changed. Point APP_PUBLISH_EMAIL at a MASTER_ADMIN account."
            exit 1
          fi

          printf 'header = "Authorization: Bearer %s"\n' "$token" > "$auth"
          chmod 600 "$auth"
          rm -f "$body"
          echo "CURL_AUTH=${auth}" >> "$GITHUB_ENV"

      - name: GUARD 4 — the new versionCode must be ABOVE the published one
        id: ceiling
        run: |
          set -euo pipefail
          latest="${RUNNER_TEMP}/latest-before.json"
          code="$(curl -sS --max-time 30 --config "$CURL_AUTH" -o "$latest" -w '%{http_code}' \
            "${API_BASE}/api/app/release/latest")"
          echo "GET /api/app/release/latest -> ${code}"

          published=""
          case "$code" in
            200)
              published="$(jq -r '.versionCode // empty' "$latest")"
              ;;
            404)
              echo "404 — no release row at all. Nothing is published yet."
              ;;
            401|403)
              echo "::error::/api/app/release/latest answered ${code}: the bearer token was refused. This is NOT 'nothing is published yet'."
              echo "::error::Treating an auth failure as an empty release list would wave through a release at or below the published version — which is accepted, looks successful and reaches nobody. Refusing."
              exit 1
              ;;
            *)
              echo "::error::/api/app/release/latest answered ${code}, which this workflow cannot interpret. The version ceiling is unknown, so publishing is refused."
              exit 1
              ;;
          esac

          if [ -z "$published" ]; then
            echo "Nothing is published yet, so there is no versionCode to beat. Publishing ${VERSION_NAME} (code ${VERSION_CODE}) as the first release."
            echo "PUBLISHED_BEFORE=none" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$published" in
            ''|*[!0-9]*)
              echo "::error::The published versionCode read back as '${published}', which is not a number. Refusing to compare against a value this workflow does not understand."
              exit 1
              ;;
          esac

          published_name="$(jq -r '.versionName // "?"' "$latest")"
          echo "Currently published: ${published_name} (code ${published})."
          git fetch --force --no-recurse-submodules origin             "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
          tag_message="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" 2>/dev/null || true)"
          republish=false
          case "$tag_message" in *"[republish]"*) republish=true ;; esac

          if [ "$VERSION_CODE" -eq "$published" ] && [ "$republish" = "true" ]; then
            echo "::warning title=Republishing the same version::Tag ${GITHUB_REF_NAME} carries [republish], so version ${VERSION_NAME} (code ${VERSION_CODE}) is being published again over the identical code already live."
            echo "A newer row with the same code wins the publishedAt tie, so /api/app/download will serve these bytes."
            echo "Handsets ALREADY on code ${published} will NOT be offered this — the updater compares codes. This reissue reaches new downloads only."
            echo "REPUBLISHED_SAME_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
            echo "PUBLISHED_BEFORE=${published}" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$VERSION_CODE" -le "$published" ]; then
            if [ "$VERSION_CODE" -eq "$published" ]; then
              echo "::error::Version ${VERSION_NAME} is ALREADY published at this exact code (${published}). If you mean to reissue the same version over it — a build fix with nothing user-visible to bump — put the literal marker [republish] in the ANNOTATED tag's message and push that tag."
              echo "::error::Be sure that is what you want: a handset already on code ${published} will never be offered it, because the updater compares codes."
            fi
            echo "::error::Version ${VERSION_NAME} has versionCode ${VERSION_CODE}, which is NOT ABOVE the published ${published} (${published_name}). Refusing to publish."
            echo "::error::This is the quiet failure: the API would ACCEPT this release and return 201, this run would go green, and not one device would ever be offered it — 'latest' is the highest versionCode, and that would still be ${published}."
            echo "::error::Raise 'val appVersionCode' in android/app/build.gradle.kts above ${published} (and bump 'val appVersionName'), then tag that commit. Devices compare the CODE."
            exit 1
          fi
          echo "${VERSION_CODE} > ${published}: this release will be the latest."
          echo "PUBLISHED_BEFORE=${published}" >> "$GITHUB_ENV"

      - name: Upload the APK to object storage (presign, then one PUT)
        id: upload
        if: ${{ env.UPLOAD_MODE == 'single' }}
        run: |
          set -euo pipefail
          umask 077
          presign="${RUNNER_TEMP}/presign.json"
          put_cfg="${RUNNER_TEMP}/curl-put.cfg"
          put_out="${RUNNER_TEMP}/put-response.txt"

          code="$(jq -nc --arg name "DesignWorkshop_Android-App_Release-Build_v${VERSION_NAME}.apk" --argjson size "$APK_BYTES" \
                '{filename: $name,
                  mimeType: "application/vnd.android.package-archive",
                  mediaType: "DOCUMENT",
                  sizeBytes: $size}' \
            | curl -sS --max-time 60 --config "$CURL_AUTH" -o "$presign" -w '%{http_code}' \
                -X POST "${API_BASE}/api/media/presign" \
                -H 'content-type: application/json' \
                --data-binary @-)"
          if [ "$code" != "200" ]; then
            echo "::error::POST /api/media/presign answered ${code}. Nothing has been uploaded and nothing published."
            jq -r '.detail // empty' "$presign" 2>/dev/null | sed 's/^/    detail: /' || true
            exit 1
          fi

          object_key="$(jq -r '.objectKey // empty' "$presign")"
          bucket="$(jq -r '.bucket // empty' "$presign")"
          public_url="$(jq -r '.publicUrl // empty' "$presign")"
          upload_url="$(jq -r '.uploadUrl // empty' "$presign")"
          if [ -z "$object_key" ] || [ -z "$upload_url" ]; then
            echo "::error::The presign response is missing objectKey or uploadUrl. A 200 without them is not a usable upload target."
            exit 1
          fi
          case "$object_key" in
            media/*/*/*)
              object_key_safe="media/<uploader-id-redacted>/${object_key#media/*/}"
              ;;
            *)
              object_key_safe="<an object key of ${#object_key} characters, in an unrecognised shape, so no part of it is printed>"
              ;;
          esac
          echo "Presigned an upload target: objectKey=${object_key_safe} bucket=${bucket} (the signed URL is a write credential and is not printed; the uploader id is redacted out of the key)."

          {
            printf 'url = "%s"\n' "$upload_url"
            jq -r '.headers | to_entries[] | "header = \"\(.key): \(.value)\""' "$presign"
          } > "$put_cfg"
          chmod 600 "$put_cfg"

          code="$(curl -sS --max-time 900 --config "$put_cfg" --request PUT \
            --upload-file "$APK" -o "$put_out" -w '%{http_code}')"
          echo "PUT (presigned) -> ${code}"
          case "$code" in
            200|201|204) ;;
            *)
              echo "::error::The APK upload answered ${code}; the bytes are not in object storage. Nothing has been published."
              s3_bits="${RUNNER_TEMP}/s3-error-fields.txt"
              sed -n 's:.*<Code>\([^<]*\)</Code>.*:code=\1:p' "$put_out" > "$s3_bits" || true
              sed -n 's:.*<Message>\([^<]*\)</Message>.*:message=\1:p' "$put_out" >> "$s3_bits" || true
              s3_code=""
              s3_message=""
              while IFS= read -r line; do
                case "$line" in
                  code=*)
                    if [ -z "$s3_code" ]; then s3_code="${line#code=}"; fi
                    ;;
                  message=*)
                    if [ -z "$s3_message" ]; then s3_message="${line#message=}"; fi
                    ;;
                esac
              done < "$s3_bits"
              rm -f "$s3_bits"
              if [ -n "$s3_code" ] || [ -n "$s3_message" ]; then
                echo "::error::S3 said: ${s3_code:-<no Code element>} — ${s3_message:-<no Message element>}"
              else
                echo "::error::S3's refusal carried no <Code>/<Message> pair, and the raw body is deliberately NOT printed: the body of a signature error echoes the access key id and the string-to-sign, and neither of those is masked in this log. Reproduce the presign locally to read it."
              fi
              echo "::error::A 403 here is usually an expired signature (re-run: a re-run presigns afresh) or a Content-Type that differs from the one presigned."
              exit 1
              ;;
          esac
          echo "Uploaded ${APK_BYTES} bytes."
          {
            echo "OBJECT_KEY=${object_key}"
            echo "OBJECT_KEY_SAFE=${object_key_safe}"
            echo "PUBLIC_URL=${public_url}"
          } >> "$GITHUB_ENV"
          rm -f "$put_cfg"

      - name: Upload the APK to object storage in parts
        id: upload_multipart
        if: ${{ env.UPLOAD_MODE == 'multipart' }}
        env:
          APK: app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail

          api() {
            curl -sS --config "$CURL_AUTH" -H 'Content-Type: application/json' \
                 -o /tmp/mp.json -w '%{http_code}' --max-time 120 \
                 -X POST "${API_BASE}$1" --data-binary "$2"
          }

          create_body="$(jq -n \
            --arg n "DesignWorkshop_Android-App_Release-Build_v${VERSION_NAME}.apk" \
            --argjson b "${APK_BYTES}" \
            '{filename:$n, mimeType:"application/vnd.android.package-archive", mediaType:"DOCUMENT", sizeBytes:$b}')"
          code="$(api /api/media/multipart/create "$create_body")" || code=000
          case "$code" in
            200|201) ;;
            *) echo "::error::multipart/create answered ${code}. Nothing was uploaded."; exit 1 ;;
          esac
          object_key="$(jq -r '.objectKey // empty' /tmp/mp.json)"
          upload_id="$(jq -r '.uploadId // empty' /tmp/mp.json)"
          part_size="$(jq -r '.partSize // empty' /tmp/mp.json)"
          part_count="$(jq -r '.partCount // empty' /tmp/mp.json)"
          if [ -z "$object_key" ] || [ -z "$upload_id" ] || [ -z "$part_size" ] || [ -z "$part_count" ]; then
            echo "::error::multipart/create returned ${code} without the four fields the rest of this depends on."
            exit 1
          fi
          echo "created: ${part_count} part(s) of ${part_size} bytes"

          abort_upload() {
            echo "::warning title=Aborting the multipart upload::Parts already sent would otherwise sit billed and uncollected."
            body="$(jq -n --arg k "$object_key" --arg u "$upload_id" '{objectKey:$k, uploadId:$u}')"
            rc="$(api /api/media/multipart/abort "$body")" || rc=000
            echo "abort answered ${rc}"
          }
          trap abort_upload ERR

          numbers="$(seq 1 "$part_count" | jq -s -R 'split("\n") | map(select(length>0) | tonumber)' | jq -c '.')"
          presign_body="$(jq -n --arg k "$object_key" --arg u "$upload_id" --argjson p "$numbers" \
            '{objectKey:$k, uploadId:$u, partNumbers:$p}')"
          code="$(api /api/media/multipart/presign-parts "$presign_body")" || code=000
          if [ "$code" != "200" ]; then
            echo "::error::multipart/presign-parts answered ${code}."
            exit 1
          fi
          cp /tmp/mp.json /tmp/mp-urls.json

          rm -rf /tmp/apkparts
          mkdir -p /tmp/apkparts
          split -b "$part_size" -d -a 3 "$APK" /tmp/apkparts/part
          made="$(find /tmp/apkparts -type f | wc -l | tr -d ' ')"
          if [ "$made" != "$part_count" ]; then
            echo "::error::split produced ${made} parts and the server planned ${part_count}. Refusing to guess which is right."
            exit 1
          fi

          parts_json='[]'
          n=0
          for f in $(find /tmp/apkparts -type f | sort); do
            n=$((n + 1))
            url="$(jq -r --arg k "$n" '.urls[$k] // empty' /tmp/mp-urls.json)"
            if [ -z "$url" ]; then
              echo "::error::no presigned URL for part ${n} of ${part_count}."
              exit 1
            fi
            cfg="$(mktemp)"
            chmod 600 "$cfg"
            printf 'url = "%s"\n' "$url" > "$cfg"
            hdr="$(mktemp)"
            pcode="$(curl -sS --config "$cfg" -X PUT --upload-file "$f" \
                     -D "$hdr" -o /dev/null -w '%{http_code}' --max-time 900)" || pcode=000
            shred -u "$cfg" 2>/dev/null || rm -f "$cfg"
            if [ "$pcode" != "200" ]; then
              echo "::error::part ${n} of ${part_count} answered ${pcode}."
              rm -f "$hdr"
              exit 1
            fi
            etag="$(tr -d '\r' < "$hdr" | grep -i '^etag:' | tail -1 | sed -e 's/^[Ee][Tt][Aa][Gg]:[[:space:]]*//' -e 's/"//g')"
            rm -f "$hdr"
            if [ -z "$etag" ]; then
              echo "::error::part ${n} uploaded but answered no ETag, and multipart/complete cannot be called without one."
              exit 1
            fi
            parts_json="$(printf '%s' "$parts_json" | jq -c --argjson pn "$n" --arg e "$etag" '. + [{partNumber:$pn, etag:$e}]')"
            echo "part ${n}/${part_count} ok"
          done

          complete_body="$(jq -n --arg k "$object_key" --arg u "$upload_id" --argjson p "$parts_json" \
            '{objectKey:$k, uploadId:$u, parts:$p}')"
          code="$(api /api/media/multipart/complete "$complete_body")" || code=000
          case "$code" in
            200|201) ;;
            *) echo "::error::multipart/complete answered ${code}. The object is NOT assembled."; exit 1 ;;
          esac
          trap - ERR
          rm -rf /tmp/apkparts

          assembled="$(jq -r '.objectKey // empty' /tmp/mp.json)"
          if [ -n "$assembled" ]; then object_key="$assembled"; fi

          safe="$(printf '%s' "$object_key" | awk -F/ 'NF>2{ $2="<uploader-id-redacted>" }1' OFS=/)"
          public_url="$(jq -r '.publicUrl // empty' /tmp/mp.json)"
          if [ -z "$public_url" ]; then
            public_url="$(jq -r '.publicUrl // empty' /tmp/mp-urls.json)"
          fi
          echo "assembled ${part_count} parts into ${safe}"
          {
            echo "OBJECT_KEY=${object_key}"
            echo "OBJECT_KEY_SAFE=${safe}"
            echo "PUBLIC_URL=${public_url}"
          } >> "$GITHUB_ENV"

      - name: Publish the release
        id: publish
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/publish.json"
          notes="Published by ${{ github.workflow }} from tag ${RELEASE_TAG} (commit ${{ github.sha }}, run ${{ github.run_id }})."

          if [ -z "${APK_BYTES:-}" ]; then
            echo "::error::APK_BYTES is empty, so the APK was never measured. GUARD 5 sets it; nothing has been published."
            exit 1
          fi

          code="$(jq -nc \
                --arg versionName "$VERSION_NAME" \
                --argjson versionCode "$VERSION_CODE" \
                --arg objectKey "$OBJECT_KEY" \
                --arg url "$PUBLIC_URL" \
                --arg notes "$notes" \
                --argjson sizeBytes "$APK_BYTES" \
                '{versionCode: $versionCode,
                  versionName: $versionName,
                  objectKey: $objectKey,
                  url: (if $url == "" then null else $url end),
                  notes: $notes,
                  sizeBytes: $sizeBytes}' \
            | curl -sS --max-time 60 --config "$CURL_AUTH" -o "$out" -w '%{http_code}' \
                -X POST "${API_BASE}/api/app/release" \
                -H 'content-type: application/json' \
                --data-binary @-)"
          echo "POST /api/app/release -> ${code}"
          if [ "$code" != "201" ]; then
            echo "::error::POST /api/app/release answered ${code} instead of 201. NOTHING IS PUBLISHED — the APK is sitting in object storage under ${OBJECT_KEY_SAFE} with no release row pointing at it (harmless, and a re-run uploads it again)."
            case "$code" in
              403) echo "::error::403 means the account is not a MASTER_ADMIN. That is checked at login, so this would mean the role changed mid-run." ;;
              422) echo "::error::422 is a schema rejection. The body is exactly {versionCode, versionName, objectKey, url, notes, sizeBytes} and the schema forbids extra fields — check whether it has gained or lost one. If the detail names 'sizeBytes' as an extra input, this workflow is newer than the deployed API: deploy the backend carrying AppReleasePublishRequest.sizeBytes, then re-run." ;;
            esac
            jq -r '.detail // empty' "$out" 2>/dev/null | sed 's/^/    detail: /' || true
            exit 1
          fi

          server_code="$(jq -r '.versionCode // empty' "$out")"
          server_name="$(jq -r '.versionName // empty' "$out")"
          echo "Server recorded: ${server_name} (code ${server_code})."

          server_size="$(jq -r '.sizeBytes // empty' "$out")"
          if [ -z "$server_size" ]; then
            echo "::warning title=No size recorded::The release row came back with no sizeBytes, so phones will download this build without checking the transfer completed. The publish itself is fine. Check that the deployed API carries AppRelease.sizeBytes."
          elif [ "$server_size" != "$APK_BYTES" ]; then
            echo "::warning title=Size mismatch::This run built ${APK_BYTES} bytes but the release row records ${server_size}. A phone comparing a good download against that number will refuse it and offer a retry that cannot succeed."
          else
            echo "Size recorded: ${server_size} bytes, matching what was uploaded."
          fi
          if [ "$server_code" != "$VERSION_CODE" ] || [ "$server_name" != "$VERSION_NAME" ]; then
            echo "::error::The server stored ${server_name}/${server_code} but this run built ${VERSION_NAME}/${VERSION_CODE}. The server stores the version code as sent, so a disagreement means the publish body and the build drifted apart."
            echo "::error::A release row is now live carrying a version this run did not build. Read it at GET /api/app/release/latest and decide deliberately; do not just re-run."
            exit 1
          fi

      - name: Dry run — say plainly that nothing was published
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          set -euo pipefail
          echo "::notice title=DRY RUN — nothing was published::Built, signed, verified and uploaded ${VERSION_NAME} (code ${VERSION_CODE}) as ${OBJECT_KEY_SAFE}, then STOPPED. POST /api/app/release was not called, GET /api/app/download still answers whatever it answered before, and no device will be offered anything."
          echo "The uploaded object is orphaned by design: no release row and no MediaFile row points at it, so it is invisible to the product and costs only storage."
          echo "To publish for real: push the tag v${VERSION_NAME}, or re-run this workflow from that tag with dry_run unticked."

      - name: GUARD 6 — prove the release is actually published
        id: proof
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          set -euo pipefail
          download_ok=""
          for attempt in $(seq 1 20); do
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${API_BASE}/api/app/download" || true)"
            code="${code:-000}"
            case "$code" in
              301|302|303|307|308)
                echo "GET /api/app/download -> ${code} (redirect) on attempt ${attempt}."
                download_ok="yes"
                break
                ;;
              404)
                echo "attempt ${attempt}: /api/app/download still 404 (no published build visible to the resolver yet)."
                ;;
              503)
                echo "attempt ${attempt}: /api/app/download answered 503 — a release row exists but the object cannot be located in storage."
                ;;
              *)
                echo "attempt ${attempt}: /api/app/download answered ${code}."
                ;;
            esac
            sleep 6
          done
          if [ -z "$download_ok" ]; then
            echo "::error::A release row was created, but GET /api/app/download never answered a redirect. THE DOWNLOAD BUTTON ON THE WEBSITE IS BROKEN RIGHT NOW — fix the live site first, then find out why."
            echo "::error::404 means no release row is visible to the resolver at all. 503 means the row exists but its objectKey does not resolve in object storage, i.e. the release points at nothing: the upload and the release row disagree."
            echo "::error::The published row is at GET /api/app/release/latest. Publishing a corrected release with a HIGHER version is the way forward — a row cannot be un-published, and re-publishing the same version code reaches nobody."
            exit 1
          fi

          latest="${RUNNER_TEMP}/latest-after.json"
          code="$(curl -sS --max-time 30 --config "$CURL_AUTH" -o "$latest" -w '%{http_code}' \
            "${API_BASE}/api/app/release/latest")"
          if [ "$code" != "200" ]; then
            echo "::error::GET /api/app/release/latest answered ${code} after publishing, so the release cannot be confirmed."
            exit 1
          fi
          now_code="$(jq -r '.versionCode // empty' "$latest")"
          now_name="$(jq -r '.versionName // empty' "$latest")"
          url_length="$(jq -r '(.url // "") | length' "$latest")"
          echo "Latest is now: ${now_name} (code ${now_code}); its url field is ${url_length} characters long (the value is not printed — it addresses the object)."
          if [ "$now_code" != "$VERSION_CODE" ] || [ "$now_name" != "$VERSION_NAME" ]; then
            echo "::error::'Latest' is ${now_name} (code ${now_code}), not the ${VERSION_NAME} (code ${VERSION_CODE}) this run published."
            echo "::error::Latest is the HIGHEST versionCode, so something above this release is already published and this build will reach nobody — exactly the outcome GUARD 4 exists to prevent, arrived at from the other direction (a concurrent publish, or a row created outside this workflow)."
            exit 1
          fi
          if [ "$url_length" = "0" ]; then
            echo "::error::The published release carries an EMPTY url. Devices only show the update prompt when the release has a non-blank URL, so this release would sit there and reach nobody."
            exit 1
          fi
          echo "Published and verified: ${VERSION_NAME} (code ${VERSION_CODE}) is latest, and /api/app/download resolves."

      - name: A publish run must have actually published
        id: publish_trap
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail
          publish="${{ steps.publish.outcome }}"
          proof="${{ steps.proof.outcome }}"
          if [ "$publish" = "success" ] && [ "$proof" = "success" ]; then
            echo "POST /api/app/release and GUARD 6 both ran and both passed: this run really did publish ${VERSION_NAME:-?} (code ${VERSION_CODE:-?})."
            exit 0
          fi
          echo "::error title=This run did not publish, and it is not a dry run::DRY_RUN='${DRY_RUN:-unset}', yet POST /api/app/release was '${publish}' and GUARD 6 was '${proof}'. Nothing above this step failed, so without this check the run would have concluded success and the summary would have called it a PUBLISH."
          echo "::error::NOTHING REACHED A HANDSET. Start at the mode step at the top of this job: DRY_RUN must be exactly 'true' or 'false', and every downstream 'if:' compares against those two literals. A skipped step is a green step, which is why the conclusion cannot be trusted to notice this on its own."
          exit 1

      - name: Cut the GitHub Release for this tag
        id: release
        if: ${{ env.DRY_RUN == 'false' && startsWith(github.ref, 'refs/tags/') }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: android/app/build/outputs/apk/release/app-release.apk
          CERT_FINGERPRINT: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          if [ ! -f "$APK" ]; then
            echo "::error::The APK is not where this step expects it (${APK}), so there is nothing to attach. The release was already published to the API; only the GitHub Release is missing."
            exit 1
          fi

          annotation="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"

          notes="$(mktemp)"
          {
            echo "Published to the fleet and the website by ${GITHUB_WORKFLOW} (run ${GITHUB_RUN_ID})."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | ${VERSION_NAME} |"
            echo "| versionCode | ${VERSION_CODE} |"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| signing certificate SHA-256 | ${CERT_FINGERPRINT} |"
            echo
            echo "Every device offers this build on its next launch or resume - the in-app updater"
            echo "compares versionCode. The attached APK is the same bytes /api/app/download serves"
            echo "for this version."
          } > "$notes"

          if [ -n "$annotation" ]; then
            {
              echo
              echo "---"
              echo
              echo "$annotation"
            } >> "$notes"
          fi

          named="DesignWorkshop_Android-App_Release-Build_v${VERSION_NAME}.apk"
          cp "$APK" "${RUNNER_TEMP}/${named}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A Release already exists for ${TAG} — updating it in place (this is the republish path)."
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
            gh release upload "$TAG" "${RUNNER_TEMP}/${named}" --clobber
          else
            gh release create "$TAG" "${RUNNER_TEMP}/${named}"               --title "$TAG" --notes-file "$notes" --verify-tag
          fi

          url="$(gh release view "$TAG" --json url --jq .url)"
          echo "Release: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "- GitHub Release: ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Name the published APK by the convention (NAMING 2.1)
        if: ${{ always() && steps.size.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/DesignWorkshop_Android-App_Release-Build_v${{ env.VERSION_NAME }}.apk"

      - name: Upload the published APK as a run artifact
        if: ${{ always() && steps.size.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-${{ env.VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/DesignWorkshop_Android-App_Release-Build_v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload the R8 mapping
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-mapping-${{ env.VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 90

      - name: Shred the credentials this job wrote to disk
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for f in \
            "${RUNNER_TEMP}/release-signing-key.jks" \
            "${RUNNER_TEMP}/curl-auth.cfg" \
            "${RUNNER_TEMP}/curl-put.cfg" \
            "${RUNNER_TEMP}/login.json" \
            "${RUNNER_TEMP}/presign.json"; do
            if [ -e "$f" ]; then
              shred -u "$f" 2>/dev/null || rm -f "$f"
              echo "removed $(basename "$f")"
            fi
          done
          echo "No credential file remains in RUNNER_TEMP, which is the intended end state."

      - name: Summarise
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          {
            echo "### Publish Android release"
            echo ""
            case "${DRY_RUN:-unset}" in
              true)
                echo "**DRY RUN — nothing was published.** The release record was not created."
                ;;
              false)
                echo "**PUBLISH** — tag \`${RELEASE_TAG:-none}\`"
                ;;
              *)
                echo "**MODE UNKNOWN (\`DRY_RUN=${DRY_RUN:-unset}\`).** This run did not get as far as"
                echo "deciding what it was, or the mode step refused it. Nothing below may be read as a"
                echo "publish."
                ;;
            esac
            echo ""
            echo "| what | value |"
            echo "|---|---|"
            echo "| version | \`${VERSION_NAME:-?}\` (code \`${VERSION_CODE:-?}\`) |"
            echo "| previously published | \`${PUBLISHED_BEFORE:-not reached}\` |"
            echo "| APK size | \`${APK_BYTES:-?}\` bytes |"
            echo "| object key | \`${OBJECT_KEY_SAFE:-not uploaded}\` |"
            echo ""
            echo "| step | result |"
            echo "|---|---|"
            echo "| GUARD 1 tag == built version | ${{ steps.version.outcome }} |"
            echo "| GUARD 3 API is this product's | ${{ steps.api_identity.outcome }} |"
            echo "| assembleRelease | ${{ steps.assemble.outcome }} |"
            echo "| GUARD 2 signer fingerprint | ${{ steps.signer.outcome }} |"
            echo "| GUARD 5 upload path chosen | ${{ steps.size.outcome }} (${{ env.UPLOAD_MODE }}) |"
            echo "| login (MASTER_ADMIN) | ${{ steps.login.outcome }} |"
            echo "| GUARD 4 versionCode above published | ${{ steps.ceiling.outcome }} |"
            echo "| upload (presign + PUT) | ${{ steps.upload.outcome }} |"
            echo "| POST /api/app/release | ${{ steps.publish.outcome }} |"
            echo "| GUARD 6 published and resolvable | ${{ steps.proof.outcome }} |"
            echo "| the publish actually happened | ${{ steps.publish_trap.outcome }} |"
            echo ""
            echo "**Still not verified by this run:** R8 and resource shrinking are release-only, and"
            echo "their failure mode is a \`SerializationException\` or a \`NoSuchMethodError\` at the first"
            echo "sync, on a build that installs and runs fine. This job has no device or emulator and"
            echo "no instrumented test ran here. A release must still be taken through the"
            echo "offline loop on real hardware — a green run above does not do that for you."
          } >> "$GITHUB_STEP_SUMMARY"
