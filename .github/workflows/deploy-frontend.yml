name: Deploy frontend to Vercel

on:
  workflow_run:
    workflows: ["Deploy backend to EC2"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if no frontend/ files changed, and skip the wait for Checks"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      sha: ${{ steps.decide.outputs.sha }}
      wait_for_checks: ${{ steps.decide.outputs.wait_for_checks }}
    steps:
      - name: Check out the tree this run would publish, and the history to compare it against
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.force }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Compare this commit with the one production is actually serving
        id: scope
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.force }}
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          live=""

          out() {
            {
              echo "pending=$1"
              echo "live_sha=${live}"
              echo "reason=$2"
            } >> "$GITHUB_OUTPUT"
            echo "$2"
          }

          api() {
            curl -sS --max-time 20 --retry 2 --retry-delay 3 --retry-connrefused \
                 -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                 -H "Accept: application/json" \
                 "$1" || true
          }

          project="$(api "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          name="$(printf '%s' "$project" | jq -r '.name // empty' 2>/dev/null || true)"
          if [ -z "$name" ]; then
            out unknown "Vercel did not say what project '${VERCEL_PROJECT_ID:-<unset>}' is, so the commit production is serving could not be read. Check VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID."
            exit 0
          fi
          echo "Vercel project '${name}' — production alias ${name}.vercel.app"

          dep="$(api "https://api.vercel.com/v13/deployments/${name}.vercel.app?teamId=${VERCEL_ORG_ID}")"
          live="$(printf '%s' "$dep" | jq -r '(.meta.deployedCommitSha // .meta.githubCommitSha) // empty' 2>/dev/null | tr 'A-Z' 'a-z' || true)"

          if ! printf '%s' "$live" | grep -Eq '^[0-9a-f]{40}$'; then
            live=""
            out unknown "${name}.vercel.app names no commit this gate can read (first deploy, or the API did not answer). Publishing rather than guessing."
            exit 0
          fi
          echo "production is serving ${live}; this run would publish ${TARGET_SHA}"

          run_id="$(printf '%s' "$dep" | jq -r '.meta.deployedRunId // empty' 2>/dev/null || true)"
          verdict=""
          if printf '%s' "$run_id" | grep -Eq '^[0-9]+$'; then
            verdict="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // empty' 2>/dev/null || true)"
          fi
          if [ -n "$verdict" ] && [ "$verdict" != "success" ]; then
            out true "The run that published ${live} concluded '${verdict}', so what production is serving is not known good. Republishing rather than trusting it."
            exit 0
          fi

          if [ ! -d .git ]; then
            out unknown "No checkout to diff in — the checkout step did not complete."
            exit 0
          fi
          for want in "$live" "$TARGET_SHA"; do
            if ! git cat-file -e "${want}^{commit}" 2>/dev/null; then
              out unknown "Commit ${want} is not in this repository (force-push, rebase, or a deployment from another tree), so there is nothing to diff."
              exit 0
            fi
          done

          if [ "$live" = "$TARGET_SHA" ]; then
            out false "Production is already serving ${TARGET_SHA}. Nothing to publish; run this workflow with force=true to republish it."
            exit 0
          fi

          if git merge-base --is-ancestor "$TARGET_SHA" "$live" 2>/dev/null; then
            echo "::warning title=This publish moves production backwards::${live} is live and ${TARGET_SHA} is an ancestor of it. Publishing will roll the site back to the older tree. If that is not what you meant, cancel this run."
          fi

          if ! files="$(git diff --name-only "$live" "$TARGET_SHA")"; then
            out unknown "git diff between ${live} and ${TARGET_SHA} failed, so no comparison could be made. Publishing rather than guessing."
            exit 0
          fi
          echo "files differing between live and target:"
          printf '%s\n' "$files"

          if grep -Eq '^(frontend/|\.github/workflows/deploy-frontend\.yml$)' <<< "$files"; then
            out true "frontend/ differs between ${live} (live) and ${TARGET_SHA} — there is work production is not serving."
          else
            out false "Nothing under frontend/ differs between ${live} (live) and ${TARGET_SHA} — the site is already serving this frontend."
          fi

      - name: Decide whether to deploy
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HAVE_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          PENDING: ${{ steps.scope.outputs.pending }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
          LIVE_SHA: ${{ steps.scope.outputs.live_sha }}
        run: |
          set -euo pipefail
          sha="${HEAD_SHA:-$GITHUB_SHA}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            wait_for_checks=false
            echo "Manual dispatch with force=true — not waiting for the Checks run on $sha."
          else
            wait_for_checks=true
          fi
          echo "wait_for_checks=$wait_for_checks" >> "$GITHUB_OUTPUT"

          pending="${PENDING:-}"
          case "$pending" in
            true|false) ;;
            *) pending=unknown ;;
          esac
          echo "Unpublished frontend work on ${sha}: pending=${pending} (production is serving ${LIVE_SHA:-unknown})"

          if [ "$EVENT" != "workflow_dispatch" ] && [ "${BACKEND_CONCLUSION}" != "success" ]; then
            echo "Backend deploy concluded '${BACKEND_CONCLUSION}' — refusing to publish the frontend."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"

            if [ "$pending" = "false" ]; then
              {
                echo "### Frontend deploy skipped — nothing was stranded"
                echo ""
                echo "The backend workflow concluded \`${BACKEND_CONCLUSION}\`. The web app calls"
                echo "endpoints that may not exist (or may be down mid-migration) until that deploy"
                echo "is green, so this run refused to publish. Fix the backend deploy and re-run"
                echo "it; this workflow will follow."
                echo ""
                echo "**Nothing is waiting behind this refusal.** Production is serving"
                echo "\`${LIVE_SHA:-unknown}\`, and \`${sha}\` carries no frontend work that is not"
                echo "already live — so this run is green on purpose. A red X here would be a"
                echo "second mark for a failure the backend run has already reported, and a gate"
                echo "that fires on every backend-only push is one nobody reads by Friday."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$pending" = "true" ]; then
              echo "::error title=Frontend work is merged and not published::The backend deploy concluded '${BACKEND_CONCLUSION}' so this run refused to publish, and ${sha} carries frontend work production is not serving. This job FAILS rather than reporting success over a skipped deploy."
              {
                echo "### Frontend deploy REFUSED — and there was something to publish"
                echo ""
                echo "The backend workflow concluded \`${BACKEND_CONCLUSION}\`. The web app calls"
                echo "endpoints that may not exist (or may be down mid-migration) until that deploy"
                echo "is green, so refusing to publish \`${sha}\` was correct."
                echo ""
                echo "| | commit |"
                echo "| --- | --- |"
                echo "| production is serving | \`${LIVE_SHA:-unknown}\` |"
                echo "| this run would have published | \`${sha}\` |"
                echo ""
                echo "**What to do, in this order:**"
                echo ""
                echo "1. Fix the backend deploy and re-run it. The gate below now measures against"
                echo "   the live site rather than against one push, so the first green backend run"
                echo "   after this WILL publish the backlog on its own — which is new as of"
                echo "   2026-09-17 and is the repair, not a promise to be taken on trust."
                echo "2. If the API is already healthy and you do not want to wait, publish it:"
                echo ""
                echo "   \`\`\`"
                echo "   gh workflow run \"Deploy frontend to Vercel\" --ref main -f force=true"
                echo "   \`\`\`"
                echo ""
                echo "   \`force=true\` publishes regardless of what changed **and** skips the wait"
                echo "   for Checks on that commit. It bypasses the rule this run just enforced, so"
                echo "   only take it when the backend is actually up."
                echo ""
                echo "**This job fails on purpose**, and it is the second branch in this file to"
                echo "learn it — the \`VERCEL_TOKEN\` branch below went red for the same reason on"
                echo "2026-08-23. A run that published nothing must not report \`success\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "::error title=Refused to publish, and could not tell what that stranded::The backend deploy concluded '${BACKEND_CONCLUSION}' and the comparison against the live site produced no answer, so this run cannot say whether ${sha} carries unpublished frontend work. Failing rather than concluding success over a skipped deploy."
            {
              echo "### Frontend deploy refused — and the gate could not say what that cost"
              echo ""
              echo "The backend workflow concluded \`${BACKEND_CONCLUSION}\`, so this run refused to"
              echo "publish \`${sha}\` — correctly. What it could **not** work out is whether that"
              echo "refusal stranded anything:"
              echo ""
              echo "> ${SCOPE_REASON:-the comparison step did not run, or died before it answered.}"
              echo ""
              echo "**Why this is red rather than green.** A green run here reads as \"published\","
              echo "and that reading is what cost two days on 2026-09-17."
              echo ""
              echo "**What to check:** the *Compare this commit with the one production is actually"
              echo "serving* step above — whether \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\` and"
              echo "\`VERCEL_PROJECT_ID\` are still readable from this job, and whether the checkout"
              echo "completed. Then compare \`main\` against what production is actually serving."
              echo ""
              echo "If frontend work is waiting and the API is healthy, publish it:"
              echo ""
              echo "\`\`\`"
              echo "gh workflow run \"Deploy frontend to Vercel\" --ref main -f force=true"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${HAVE_VERCEL_TOKEN}" != "true" ]; then
            echo "::error title=Frontend publish is not configured::VERCEL_TOKEN is not set, so nothing was published. This job now FAILS rather than reporting success over a skipped deploy."
            {
              echo "### Frontend deploy skipped — not configured"
              echo ""
              echo "This repository has no \`VERCEL_TOKEN\` secret, so there is nothing to"
              echo "authenticate the publish with. Add these three under **Settings →"
              echo "Secrets and variables → Actions**, then re-run this workflow:"
              echo ""
              echo "| Secret | Where to get it |"
              echo "| --- | --- |"
              echo "| \`VERCEL_TOKEN\` | Vercel → Account Settings → Tokens → Create |"
              echo "| \`VERCEL_ORG_ID\` | \`.vercel/project.json\` → \`orgId\` |"
              echo "| \`VERCEL_PROJECT_ID\` | \`.vercel/project.json\` → \`projectId\` |"
              echo ""
              echo "Also turn Vercel's own Git auto-deploy for \`main\` off first, or it"
              echo "will publish ahead of the backend — see \`docs/CI.md\`."
              echo ""
              echo "**This job fails on purpose.** It used to exit 0 here, which made the"
              echo "run conclude \`success\` while publishing nothing — see the comment above"
              echo "this branch in the workflow for what that cost on 2026-08-23."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          should=true
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            reason="Manual dispatch with force=true — published without consulting the live site."
          elif [ "$pending" = "false" ]; then
            should=false
            reason="${SCOPE_REASON:-frontend/ matches what production is already serving.}"
          else
            reason="${SCOPE_REASON:-No usable comparison against the live site; deploying to be safe.}"
          fi
          echo "$reason"
          echo "should_deploy=$should" >> "$GITHUB_OUTPUT"

          {
            echo "### Frontend deploy decision"
            echo ""
            echo "| | commit |"
            echo "| --- | --- |"
            echo "| production is serving | \`${LIVE_SHA:-unknown}\` |"
            echo "| this run would publish | \`${sha}\` |"
            echo ""
            echo "should_deploy=\`${should}\` — ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

  wait-for-checks:
    name: Wait for Checks on this commit
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' && needs.gate.outputs.wait_for_checks == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      superseded: ${{ steps.poll.outputs.superseded }}
    steps:
      - name: Poll for the gating jobs
        id: poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.gate.outputs.sha }}
          GATING_JOBS: '["Backend tests","Web typecheck, lint and unit specs","Docs check"]'
        run: |
          set -euo pipefail
          if [ -z "${SHA}" ]; then
            echo "::error::the gate produced no commit SHA to check. An empty head_sha filter returns the newest Checks runs for any commit, so this gate would grade a different tree and pass. Refusing to guess; nothing has been published."
            exit 1
          fi
          api="repos/${GITHUB_REPOSITORY}/actions"
          last=""
          for attempt in $(seq 1 60); do
            runs="$(gh api "${api}/workflows/checks.yml/runs?head_sha=${SHA}&per_page=30" 2>/dev/null || echo '{"workflow_runs":[]}')"
            run_id="$(printf '%s' "$runs" | jq -r '([.workflow_runs[] | select(.conclusion != "cancelled")] | ([.[] | select(.event == "push")][0] // .[0])) // .workflow_runs[0] | .id // ""')"
            if [ -z "$run_id" ]; then
              echo "attempt ${attempt}/60: no Checks run for ${SHA} yet"
              last=""
              sleep 20
              continue
            fi
            jobs="$(gh api "${api}/runs/${run_id}/jobs?per_page=100" 2>/dev/null || echo '{"jobs":[]}')"
            verdict="$(printf '%s' "$jobs" | jq -r --argjson want "$GATING_JOBS" '
              [ .jobs[] | select(.name | IN($want[])) ]                       as $g
              | ($want - [ $g[].name ])                                        as $missing
              | ([ $g[] | select(.status != "completed") | .name ])            as $running
              | ([ $g[] | select(.status == "completed" and .conclusion == "cancelled") | .name ]) as $cancelled
              | ([ $g[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "cancelled") | .name ]) as $bad
              | if   ($bad | length) > 0     then "fail " + ($bad | join(", "))
                elif (($missing + $running) | length) > 0 then "wait " + (($missing + $running) | join(", "))
                elif ($cancelled | length) > 0 then "cancelled " + ($cancelled | join(", "))
                else "pass" end')"
            state="${verdict%% *}"
            detail="${verdict#* }"
            last="$state"
            case "$state" in
              pass)
                echo "Checks passed for ${SHA} — run ${run_id}"
                echo "Checks green for \`${SHA}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              fail)
                echo "::error::Checks failed for ${SHA} (${detail}). Not publishing. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                {
                  echo "### Frontend deploy stopped — Checks are red"
                  echo ""
                  echo "\`${detail}\` failed on \`${SHA}\`, so this commit was not published."
                  echo "The live site is still serving the previous build."
                  echo ""
                  echo "[Checks run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id})"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              cancelled)
                tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha 2>/dev/null || true)"
                if ! grep -Eq '^[0-9a-f]{40}$' <<< "$tip"; then tip=""; fi
                if [ -n "$tip" ] && [ "$tip" != "$SHA" ]; then
                  echo "::notice title=Superseded by a newer commit on main::Checks on ${SHA} was cancelled (${detail}), and main has moved on to ${tip}. That commit's own run of this pipeline ships these changes with its own, so this run ships nothing."
                  echo "superseded=true" >> "$GITHUB_OUTPUT"
                  {
                    echo "### Superseded by a newer commit — nothing shipped from this run"
                    echo ""
                    echo "Checks on \`${SHA}\` was cancelled (\`${detail}\`), and \`main\` has moved on to"
                    echo "\`${tip}\`. That commit's own run of this pipeline ships these changes with its own."
                    echo ""
                    echo "[Cancelled Checks run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id})"
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                echo "attempt ${attempt}/60: Checks on ${SHA} was cancelled (${detail}) and main's tip reads '${tip:-unreadable}', so nothing newer will ship it; waiting for a re-run or a dispatch of Checks"
                ;;
              *)
                echo "attempt ${attempt}/60: still waiting on ${detail}"
                ;;
            esac
            sleep 20
          done
          if [ "$last" = "cancelled" ]; then
            echo "::error::Checks on ${SHA} was CANCELLED, not failed (${detail}), and nothing re-ran it within 20 minutes. Main's tip read '${tip:-unreadable}' at the last look, so no newer run will ship this commit, and nothing has been shipped from this one. Re-run that Checks run (or dispatch Checks on main), then re-run this workflow. A gating job that hits its own timeout-minutes also ends as cancelled: if one did, the suite is the problem."
            {
              echo "### Stopped — Checks on this commit was cancelled, not failed"
              echo ""
              echo "\`${detail}\` was cancelled on \`${SHA}\` and nothing re-ran it within twenty minutes, so"
              echo "nothing was shipped. Re-run the Checks run, then re-run this workflow."
              echo ""
              echo "[Checks run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id})"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::error::timed out after 20 minutes waiting for the Checks jobs on ${SHA}. Nothing was published and the live site is still serving the previous build, which is the safe end of this failure. If the suite is genuinely this slow now, raise the loop bound here rather than deleting the gate; to publish past it in an emergency, run this workflow from the Actions tab with force=true — that skips the wait by design."
          exit 1

  deploy:
    needs: [gate, wait-for-checks]
    timeout-minutes: 25
    if: >-
      ${{ !cancelled()
          && github.ref == 'refs/heads/main'
          && needs.gate.result == 'success'
          && needs.gate.outputs.should_deploy == 'true'
          && (needs.wait-for-checks.result == 'success' || needs.wait-for-checks.result == 'skipped')
          && needs.wait-for-checks.outputs.superseded != 'true' }}
    runs-on: ubuntu-26.04
    environment:
      name: production-web
      url: ${{ steps.alias.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout the commit the backend deployed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull the production project settings and environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Assert the project is still rooted at frontend/
        run: |
          set -euo pipefail
          root="$(node -p "require('./.vercel/project.json').settings?.rootDirectory ?? ''")"
          echo "Vercel Root Directory = '${root}'"
          if [ "$root" != "frontend" ]; then
            echo "::error::Vercel project Root Directory is '${root}', expected 'frontend'."
            echo "::error::Fix it in Vercel → Project → Settings → General → Root Directory."
            exit 1
          fi

      - name: Say so when the project's Node.js Version disagrees with this build
        run: |
          set -euo pipefail
          build="$(node -p 'process.versions.node.split(".")[0]')"
          engines="$(node -p "require('./frontend/package.json').engines?.node ?? ''")"
          project="$(node -p "require('./.vercel/project.json').settings?.nodeVersion ?? ''")"
          echo "build Node ${build}; frontend/package.json engines.node '${engines:-<unset>}'; project Node.js Version '${project:-<unset>}'"
          if [ -z "$engines" ]; then
            echo "::warning title=frontend/package.json names no Node major::Without engines.node, setup-node had no version to read (this build ran on Node ${build}) and production runs on the project's Node.js Version ('${project:-<unset>}'). Put engines.node back at the newest major Vercel offers, never below ${build}.x."
            exit 0
          fi
          major="${project%%.*}"
          case "$major" in
            ''|*[!0-9]*) ;;
            *)
              if [ "$major" -gt "$build" ]; then
                echo "::warning title=Vercel offers a newer Node major than this build::The project's Node.js Version is '${project}', but engines.node in frontend/package.json is '${engines}', so production and this build run on Node ${build}. Raise engines.node to ${major}.x (with @types/node and frontend/Dockerfile's NODE_VERSION). Do not lower the project setting."
              elif [ "$major" -lt "$build" ]; then
                echo "::warning title=The project's Node.js Version is behind this build::The project's Node.js Version reads '${project}', but engines.node ('${engines}') overrides it, so production runs on Node ${build}, as this build does. Raise the setting to ${build}.x in Vercel -> Project -> Settings -> Build and Deployment -> Node.js Version so it stops misleading readers. Do not lower engines.node."
              fi
              ;;
          esac

      - name: Resolve the production alias of the project we are publishing to
        id: alias
        run: |
          set -euo pipefail
          name="$(node -p "require('./.vercel/project.json').projectName ?? ''")"
          if [ -z "$name" ]; then
            echo "::error::.vercel/project.json carries no projectName, so the production alias cannot be resolved."
            echo "::error::Without it there is nothing to smoke-check but the deployment URL, which always serves the new build and therefore proves nothing. Re-run 'vercel pull' or re-link the project."
            exit 1
          fi
          if [ "$name" = "field-repository" ]; then
            echo "::error::vercel pull resolved the project 'field-repository', which is a DIFFERENT product in the same Vercel team. This repository publishes to 'designer-repository'."
            echo "::error::VERCEL_PROJECT_ID must be prj_uRYcc64FRwcrkvMDZg9Gp7ZEtCoc (designer-repository) under VERCEL_ORG_ID team_pcTf4Alb2DCIwq2IZcdu00dS; it is almost certainly prj_EzXN8hhGKpMciFBrZRdxpcgUUzN0, the field-repository project. Nothing has been deployed. See docs/CI.md section 2."
            exit 1
          fi
          echo "url=https://${name}.vercel.app" >> "$GITHUB_OUTPUT"
          echo "Vercel project '${name}' — production alias https://${name}.vercel.app"

      - name: Assert the pulled environment carries the values the app cannot run without
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          if [ ! -f "$env_file" ]; then
            echo "::error::vercel pull wrote no ${env_file}, so the build has no NEXT_PUBLIC_* values at all."
            exit 1
          fi

          fail=0
          discovered="$(grep -oE '^NEXT_PUBLIC_[A-Z0-9_]+' "$env_file" | sort -u | grep -v '^NEXT_PUBLIC_APP_URL$' || true)"
          if [ -z "$discovered" ]; then
            echo "::error::the pulled production environment contains no NEXT_PUBLIC_* variables at all, so the build would inline undefined for every one of them."
            exit 1
          fi
          echo "checking: ${discovered}"
          for var in $discovered; do
            value="$(sed -n "s/^${var}=//p" "$env_file" | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"

            if [ -z "$value" ] || [ "$value" = "undefined" ] || [ "$value" = "[SENSITIVE]" ]; then
              echo "::error::${var} is missing, empty, or withheld as Sensitive in the pulled production environment (value read: '${value:-<empty>}')."
              echo "::error::Almost always this means it is stored as Sensitive in Vercel. A Sensitive variable is withheld from 'vercel pull' by design, this pipeline builds on the GitHub runner, and Next.js therefore inlines undefined - the build and the deploy both still succeed and the live site is broken."
              echo "::error::Fix: Vercel -> Project -> Settings -> Environment Variables, delete ${var} and re-add it as Encrypted (not Sensitive) for Production, Preview and Development, then re-run this workflow."
              echo "::error::Marking these two Sensitive protects nothing, which is why this is safe to do: NEXT_PUBLIC_* values are compiled into the JavaScript every visitor downloads, so both are already public in the bundle. What Sensitive does buy is that nothing can read them back - including this build."
              echo "::error::A deploy launched with 'vercel deploy' (no --prebuilt) builds ON Vercel, where the real values are available, which is why the live site works while this pipeline cannot reproduce it."
              fail=1
              continue
            fi

            case "$var" in
              NEXT_PUBLIC_API_URL)
                case "$value" in
                  http://*|https://*) ;;
                  *)
                    echo "::error::${var} is set but is not an absolute http(s) origin. lib/api.ts appends /api to it verbatim, so a bare host or a stray quote breaks every request the browser makes."
                    fail=1
                    continue ;;
                esac ;;
              NEXT_PUBLIC_GOOGLE_CLIENT_ID)
                case "$value" in
                  *.apps.googleusercontent.com) ;;
                  *)
                    echo "::error::${var} is set but does not end in .apps.googleusercontent.com. Google answers anything else with 'Error 401: invalid_client - The OAuth client was not found', which looks like an outage rather than a typo."
                    fail=1
                    continue ;;
                esac ;;
            esac

            echo "${var}: present, ${#value} characters, shape OK"
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Name any database credential the frontend project still carries
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          names="$(grep -oE '^(DATABASE_URL[A-Z_]*|POSTGRES_[A-Z_]+|PG[A-Z_]+|NEON_[A-Z_]+|VITE_NEON_[A-Z_]+)=' "$env_file" | tr -d '=' | sort -u | tr '\n' ' ' || true)"
          if [ -n "$names" ]; then
            echo "::warning title=The frontend project holds database credentials::vercel pull returned ${names}for the production environment. Nothing in frontend/ reads them. Disconnect the store connection that injects them (Vercel -> Storage -> the store -> Projects -> Disconnect) rather than deleting the variables one by one, and do not delete the store or the integration itself without its owner. See docs/DEPLOYMENT_VERCEL.md section 2.3."
          else
            echo "no database credentials in the pulled production environment"
          fi

      - name: Build (uses the project's own install/build commands from frontend/vercel.json)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Assert the values actually reached the bundle we are about to publish
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          out=".vercel/output"
          if [ ! -d "$out" ]; then
            echo "::error::vercel build produced no ${out} to inspect."
            exit 1
          fi

          fail=0
          for var in NEXT_PUBLIC_API_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID; do
            value="$(sed -n "s/^${var}=//p" "$env_file" | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"
            needle="$value"
            if [ "$var" = "NEXT_PUBLIC_API_URL" ]; then
              needle="$(printf '%s' "$value" | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#[/?].*$##')"
            fi

            if [ -z "$needle" ]; then
              echo "::error::${var} has no value to search for here, so nothing could have been inlined from it."
              fail=1
              continue
            fi

            if grep -raqF -- "$needle" "$out"; then
              echo "${var}: found inlined in ${out}"
            else
              echo "::error::${var} was present in the pulled environment but its value appears nowhere in ${out}."
              echo "::error::The bundle cannot use a value it does not contain, so this build would deploy green and fail at runtime. Do not publish it - check that the build resolved Root Directory 'frontend' and that the app reads process.env.${var} as a literal, which is the only form Next.js inlines."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy the prebuilt output to production
        id: deploy
        env:
          DEPLOYED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes \
                   --meta "deployedCommitSha=${DEPLOYED_SHA}" \
                   --meta "deployedRunId=${GITHUB_RUN_ID}" \
                   --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Move the production alias onto this deployment
        env:
          SITE: ${{ steps.alias.outputs.url }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          host="${SITE#https://}"
          vercel alias set "${URL#https://}" "$host" --token="$VERCEL_TOKEN"
          echo "Aliased $host -> $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-check the production alias
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SITE: ${{ steps.alias.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${SITE}/" || true)"
            if [ "$code" = "200" ]; then
              echo "production alias healthy after ${i} tries (HTTP $code)"
              exit 0
            fi
            sleep 4
          done
          echo "::error::${SITE} did not return 200 (last: ${code:-none}). Deployment: ${DEPLOY_URL}"
          exit 1

      - name: Assert the bundle the CDN is serving is the one that was verified
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SITE: ${{ steps.alias.outputs.url }}
        run: |
          set -euo pipefail
          site="$SITE"
          env_file=".vercel/.env.production.local"

          value="$(sed -n "s/^NEXT_PUBLIC_API_URL=//p" "$env_file" | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"
          host="$(printf '%s' "$value" | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#[/?].*$##')"
          if [ -z "$host" ]; then
            echo "::error::There is no API host to look for in the live bundle, so this check cannot say anything about it. The pulled production environment should have failed the earlier assertion - do not treat this deployment as verified."
            exit 1
          fi

          work="$(mktemp -d)"
          paths=()
          total=0
          searched=0

          for attempt in $(seq 1 6); do
            searched=0
            paths=()
            rm -rf "${work:?}/"* 2>/dev/null || true

            if ! curl -fsS --max-time 30 -o "$work/login.html" "${site}/login?ci-smoke=${GITHUB_RUN_ID}-${attempt}"; then
              echo "attempt ${attempt}: /login did not answer yet"
              sleep 10
              continue
            fi

            while IFS= read -r path; do
              paths+=("$path")
            done < <(grep -oE '/_next/static/chunks/[A-Za-z0-9._@/-]+\.js' "$work/login.html" | sort -u)
            total="${#paths[@]}"

            if [ "$total" -eq 0 ]; then
              echo "attempt ${attempt}: /login answered but loaded no JavaScript, which is not a page anyone can sign in on"
              sleep 10
              continue
            fi

            found=0
            for path in "${paths[@]}"; do
              if ! curl -fsS --max-time 30 -o "$work/chunk.js" "${site}${path}"; then
                continue
              fi
              searched=$((searched + 1))
              if grep -aqF -- "$host" "$work/chunk.js"; then
                found=1
                break
              fi
            done

            if [ "$found" -eq 1 ]; then
              echo "live bundle calls the expected API host (attempt ${attempt}, found in chunk ${searched} of ${total})"
              exit 0
            fi

            echo "attempt ${attempt}: read ${searched} of ${total} chunks, none mentions the API host"
            sleep 10
          done

          if [ "$searched" -eq 0 ]; then
            echo "::error::Nothing readable came back from ${site}/login on any of 6 attempts - either the page never answered or it loaded no JavaScript at all - so there is no evidence this deployment works."
          else
            echo "::error::The live site is serving a login page whose JavaScript never mentions the API host from NEXT_PUBLIC_API_URL (${#host} characters, taken from the environment this build was pulled with). Searched ${searched} of the ${total} chunks that ${site}/login loads, on each of 6 attempts."
            echo "::error::The upload was checked and did contain that host, so the bytes on the alias are not the bytes that were built - either the production alias is still pointing at an older deployment, or --prod aliased a different one. Whichever it is, the site is in the state it was in on 2026-07-26: every page loads, and nobody can sign in."
          fi
          echo "::error::This deployment is ALREADY live, so fix the site before fixing the cause. Roll back first, by pointing the alias at the last deployment known to work: 'vercel alias set <last-good-deployment-url> ${site#https://}' (the URL is in Vercel -> Project -> Deployments, or 'vercel ls'). Instant Rollback and 'vercel rollback' move only the project's own domains, which this alias may not be one of. Make the next push to main the fix or a revert: every run compares main with what the alias serves, so any other push would publish this same frontend again."
          exit 1
