name: Deploy frontend to Vercel

# Stage 2 of 3:  deploy-backend.yml → [ THIS ] → android-build.yml
#
# ─── WHY THIS RUNS AFTER THE BACKEND, AND NEVER BEFORE ────────────────────────────────
# The web app is a pure client: the browser talks straight to the FastAPI box (there is no
# Next.js proxy — see docs/DEPLOYMENT_VERCEL.md §0), so the bundle we publish here assumes
# every endpoint it calls already exists. A commit that adds a page and the API route it
# reads is a single push; if the Vercel deploy wins the race, the live site spends the next
# few minutes calling routes that answer 404 — users see empty lists, failed saves, and
# "Failed to fetch" toasts, and it self-heals only when the EC2 deploy catches up. Worse,
# the backend deploy stops the service to run `prisma migrate deploy`, so the gap is not
# theoretical: there is a real window where the API is down. Backend first, always.
#
# The gate is `workflow_run` on the backend workflow *completing successfully*. Note that
# the backend workflow deliberately has no `paths:` filter (see its header): it starts on
# every push to main and skips its own deploy job when backend/ is untouched. That is what
# stops a frontend-only change from dead-locking here waiting for a run that never starts.
#
# ─── THE CHECKS GATE, AND WHY THE BACKEND'S COPY CANNOT COVER THIS STAGE — 2026-09-03 ──
# deploy-backend.yml gained a `wait-for-checks` job that refuses to hand over to its deploy until
# the Checks run for the same commit is green. That protects the EC2 box and it does NOT protect
# this stage, for the reason stated in the paragraph immediately above: the backend workflow runs
# on every push and skips its own deploy — and therefore its own wait — when nothing under
# backend/ changed. A FRONTEND-ONLY PUSH WITH A RED CHECKS RUN IS EXACTLY THAT CASE. The backend
# run concludes `success` because it correctly did nothing, this workflow starts on that success,
# and the site is published over a commit the suite has already failed. Nothing, anywhere, waited.
#
# It is also the push where the red tick is most likely to be a FRONTEND one — a type error, an
# eslint finding, a failing unit spec — so the case the backend's gate could not see was the case
# that mattered most. The `wait-for-checks` job below closes it by polling the Checks run for
# `github.event.workflow_run.head_sha`, which is the same commit the deploy job checks out.
#
# ─── ONE-TIME SETUP THIS WORKFLOW ASSUMES ─────────────────────────────────────────────
# Vercel's own Git integration must NOT also be auto-deploying `main`, or it will race
# ahead of the backend and re-create exactly the bug this ordering exists to prevent.
# Turn it off once, in Vercel → Project → Settings → Git → "Ignored Build Step"
# (`exit 0`) or by disabling production deployments for `main`. docs/CI.md has the exact
# steps. Preview deployments for pull requests can stay on — they are not the live site.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       Vercel → Account Settings → Tokens → Create (scope: the team)
#   VERCEL_ORG_ID      team_pcTf4Alb2DCIwq2IZcdu00dS
#   VERCEL_PROJECT_ID  prj_uRYcc64FRwcrkvMDZg9Gp7ZEtCoc   ← THIS portal's project, `designer-repository`
#
# 2026-08-22: the line above used to read `prj_EzXN8hhGKpMciFBrZRdxpcgUUzN0`, which docs/CI.md §2
# pairs with the Vercel project `field-repository` — a DIFFERENT product in the same Vercel team.
# `frontend/.vercel/project.json`, written by `vercel link` in this checkout, says this repository's
# project is `designer-repository` / `prj_uRYcc64FRwcrkvMDZg9Gp7ZEtCoc`, and deploy-backend.yml pins
# `BACKEND_CORS_ORIGINS` to `designer-repository.vercel.app` (never `field-repository`), so the API
# would reject the browser origin the old id publishes to. A project id is a deploy TARGET: the
# wrong one does not fail, it publishes this portal's build over somebody else's live site. What
# the repository's secret actually holds cannot be read from a checkout — see docs/CI.md §2.
# The NEXT_PUBLIC_* build-time variables are NOT GitHub secrets: `vercel pull` fetches them
# from the Vercel project, so the Environment Variables screen stays the single source of
# truth for them (docs/DEPLOYMENT_VERCEL.md §2). They must be stored there as **Encrypted**,
# never **Sensitive** — Vercel deliberately never hands a sensitive value back to `vercel
# pull`, and since this pipeline builds on the runner rather than on Vercel, a sensitive
# NEXT_PUBLIC_* is an empty one. The two steps that enforce that carry the full story.

on:
  workflow_run:
    workflows: ["Deploy backend to EC2"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        # 2026-09-03: this input gained a SECOND meaning and the description says both, because a
        # dispatch box that under-states what it does is how an override gets used by accident. It
        # still means "ignore the change summary", and it now also means "do not wait for Checks" —
        # the emergency path, spelled out on the `wait-for-checks` job below. The default is TRUE,
        # so the ordinary manual run is already the override; untick it to get the gate.
        description: "Deploy even if no frontend/ files changed, and skip the wait for Checks"
        type: boolean
        default: true

permissions:
  contents: read
  # actions: read is what lets this run download the change-detection artifact that the
  # backend run produced. Artifacts are the only channel across a workflow_run boundary —
  # job outputs do not cross it.
  #
  # 2026-09-03: re-derived from what this workflow actually calls rather than left as
  # inherited. `actions/download-artifact` with `run-id:` reads ANOTHER run's artifacts and
  # needs `actions: read`; the checkout needs `contents: read`; the Vercel CLI authenticates
  # with its own token and needs no GITHUB_TOKEN scope at all. Nothing here writes to the
  # repository, so there is deliberately no `contents: write`, no `deployments: write` and no
  # `pull-requests: write` — a token that cannot push cannot be made to push.
  #
  # 2026-09-03, later the same day: `wait-for-checks` is now a SECOND caller of that same
  # scope — it reads the Checks workflow's runs and their jobs through the REST API. Worth
  # naming here because of how it fails without it: `gh api` answers 404, which this poll
  # cannot tell apart from "Checks has not started yet", so a narrowed token would wait out
  # the full twenty minutes and then fail for the wrong stated reason.
  actions: read

# ─── EVERY `uses:` IS A COMMIT SHA, SINCE 2026-09-03 ─────────────────────────────────────
# A version tag is mutable and the action's owner can repoint it, so `@v4` is a promise from a
# third party rather than a fact about what runs. The SHA is the fact; the tag rides along in a
# trailing comment for readability. `.github/dependabot.yml` is what keeps them from rotting.
# (The Vercel CLI a step below installs is deliberately NOT pinned — its own comment says why.)

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  # This job always runs — the ordering rule is enforced by the `should_deploy` output it
  # produces, not by an `if:` on the job itself. Two reasons for that shape:
  #   1. A run whose only job was skipped is a confusing "grey tick" with no explanation of
  #      why the site did not update; here the reason is printed in the job summary.
  #   2. android-build.yml is chained off THIS workflow completing. A workflow run in which
  #      every job was skipped is a weaker signal to chain from than one that really ran,
  #      so keeping a job alive keeps stage 3 reliably reachable even on a failed backend
  #      deploy — which is exactly when you still want to know the APK compiles.
  # It does NOT fail when the backend deploy failed: the backend workflow is already red,
  # and a second red X for the same root cause is noise, not information.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      sha: ${{ steps.decide.outputs.sha }}
      # 2026-09-03: whether this run has to wait for Checks. Decided in the shell below rather
      # than in the `if:` of `wait-for-checks`, so that `force` is read in exactly ONE place,
      # as a string, with the same comparison the change-detection branch already uses. A
      # boolean dispatch input is a string here and a real boolean in an `if:` expression, and
      # a gate that hinges on which of those two a reader assumed is not a gate.
      wait_for_checks: ${{ steps.decide.outputs.wait_for_checks }}
    steps:
      - name: Fetch the change summary from the backend run
        id: fetch
        # Skipped when the backend deploy did not succeed — there is nothing to deploy in
        # that case, and the artifact may not even have been uploaded.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        continue-on-error: true # absent on manual dispatch, and on any older backend run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pipeline-changes
          path: pipeline-changes
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to deploy
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # Presence only — the value never enters the log. `secrets` is not readable from
          # an `if:` on a step in a reusable position, so the check happens here in the gate.
          HAVE_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          set -euo pipefail
          sha="${HEAD_SHA:-$GITHUB_SHA}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # ── THE CHECKS OVERRIDE, DECIDED BEFORE ANY BRANCH BELOW CAN EXIT ────────────
          # 2026-09-03. `wait-for-checks` reads this output, so it has to be written on EVERY
          # path out of this step — including the two that exit early — or an unset output
          # would read as `!= 'true'`, i.e. "do not wait", which is the failure this whole
          # gate exists to prevent arrived at by omission.
          #
          # `force` defaults to TRUE, so the ordinary manual dispatch skips the wait, and that
          # is the documented emergency override rather than an oversight: when the site is
          # broken and the fix is known, waiting twenty minutes for a docs check is not a
          # safety property, it is an outage extended by process, and the person typing `gh
          # workflow run` has already decided. Untick `force` to publish through the gate. The
          # skip is a visibly skipped job in the run graph, so the override leaves a trace.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            wait_for_checks=false
            echo "Manual dispatch with force=true — not waiting for the Checks run on $sha."
          else
            wait_for_checks=true
          fi
          echo "wait_for_checks=$wait_for_checks" >> "$GITHUB_OUTPUT"

          # ── The ordering rule, enforced ──────────────────────────────────────────────
          # Anything other than a green backend run stops the deploy dead. A cancelled or
          # failed backend deploy can leave the API stopped mid-migration, so publishing a
          # frontend that depends on it would be strictly worse than publishing nothing.
          if [ "$EVENT" != "workflow_dispatch" ] && [ "${BACKEND_CONCLUSION}" != "success" ]; then
            echo "Backend deploy concluded '${BACKEND_CONCLUSION}' — refusing to publish the frontend."
            {
              echo "### Frontend deploy skipped"
              echo ""
              echo "The backend workflow concluded \`${BACKEND_CONCLUSION}\`. The web app calls"
              echo "endpoints that may not exist (or may be down mid-migration) until that deploy"
              echo "is green. Fix the backend deploy and re-run it; this workflow will follow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── NOT CONFIGURED IS A FAILURE. IT USED TO BE A SILENT SKIP. ────────────────
          # The reasoning it replaces was sound when it was written: a red X for a setup
          # step nobody had done yet is permanent noise, and permanent noise trains people
          # to ignore a release pipeline. What changed is the cost on the other side.
          #
          # ON 2026-08-23 THIS SKIP TOLD A LIE THAT COST A DAY. Run 32632590460 published
          # NOTHING and the workflow concluded `success`, because the gate exited 0 and the
          # deploy job was skipped. Read from the runs list — "Deploy frontend to Vercel:
          # success" — that is indistinguishable from a real deploy. The owner went looking
          # for their UI changes on the live site and found the old build; nobody had
          # noticed that CI has never once published this frontend.
          #
          # A step summary cannot fix that, and this one was already there and already
          # correct: nobody reads a summary on a green run. The conclusion is the only part
          # of a run that gets read at a glance, so the conclusion has to be honest.
          #
          # This path is not reachable from a fork or a PR — the triggers are
          # `workflow_run` on the backend deploy (main only) and `workflow_dispatch` — so a
          # missing token here is never an outside contributor, it is always this
          # repository being misconfigured on its own release path.
          if [ "${HAVE_VERCEL_TOKEN}" != "true" ]; then
            echo "::error title=Frontend publish is not configured::VERCEL_TOKEN is not set, so nothing was published. This job now FAILS rather than reporting success over a skipped deploy."
            {
              echo "### Frontend deploy skipped — not configured"
              echo ""
              echo "This repository has no \`VERCEL_TOKEN\` secret, so there is nothing to"
              echo "authenticate the publish with. Add these three under **Settings →"
              echo "Secrets and variables → Actions**, then re-run this workflow:"
              echo ""
              echo "| Secret | Where to get it |"
              echo "| --- | --- |"
              echo "| \`VERCEL_TOKEN\` | Vercel → Account Settings → Tokens → Create |"
              echo "| \`VERCEL_ORG_ID\` | \`.vercel/project.json\` → \`orgId\` |"
              echo "| \`VERCEL_PROJECT_ID\` | \`.vercel/project.json\` → \`projectId\` |"
              echo ""
              echo "Also turn Vercel's own Git auto-deploy for \`main\` off first, or it"
              echo "will publish ahead of the backend — see \`docs/CI.md\`."
              echo ""
              echo "**This job fails on purpose.** It used to exit 0 here, which made the"
              echo "run conclude \`success\` while publishing nothing — see the comment above"
              echo "this branch in the workflow for what that cost on 2026-08-23."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Default to deploying. A missing or unreadable summary must never silently skip
          # a real change — over-deploying costs a build minute, under-deploying ships a
          # stale site that nobody notices until a user reports it.
          should=true
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "Manual dispatch with force=true."
          elif [ -f pipeline-changes/changes.env ]; then
            cat pipeline-changes/changes.env
            # Grepped, not sourced: only an exact `frontend=false` line can turn a deploy
            # off, so a malformed or truncated artifact falls through to "deploy".
            if grep -qx 'frontend=false' pipeline-changes/changes.env; then
              should=false
              echo "No frontend/ files changed in this push — nothing to publish."
            fi
          else
            echo "No change summary available; deploying to be safe."
          fi
          echo "should_deploy=$should" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $sha: should_deploy=$should" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # THE HALF OF THE CHECKS GATE THE BACKEND'S COPY CANNOT SEE — ADDED 2026-09-03
  # ═══════════════════════════════════════════════════════════════════════════════════════
  #
  # WHAT IT DOES. Polls the REST API for the Checks run whose head SHA is exactly the commit this
  # run is about to publish, and waits for the three jobs branch protection names. Success hands
  # over to `deploy`; a failure or a timeout fails the run before anything reaches Vercel. The
  # header of this file says at length why deploy-backend.yml's identical gate does not already
  # cover this: it skips itself on a frontend-only push, which is the push this one is for.
  #
  # IT IS USUALLY ONE API CALL. The backend's copy starts racing Checks from the same push; this
  # one starts only after a whole backend deploy has run — minutes of rsync, venv and migrate — so
  # the Checks run for this commit has almost always concluded before the first poll. The
  # twenty-minute budget is for the case where it has not: a queued runner, or a re-run of an
  # older backend deploy against a commit whose Checks run is being re-run beside it.
  #
  # WHY ALL THREE JOBS AND NOT JUST THE WEB ONE, which is the decision most worth reading here.
  # "Publishing the frontend can only depend on the frontend's checks" is FALSE in this repository,
  # and checks.yml's own header is where it is written down: `test_the_web_carries_the_same_
  # hydration_table` lives in the BACKEND suite (`backend/tests/test_reference_registry.py`), and it
  # is what catches a wrong entry in `frontend/lib/designWorkshops.ts` — a frontend-only edit whose
  # only red tick is `Backend tests`, gating the deploy of the very surface that carries the defect.
  # `Docs check` is the same shape: `docs/REPO_FACTS.md` carries per-directory file and line counts
  # for `frontend/app`, `frontend/components` and `frontend/lib`, so adding or deleting a component
  # goes red there and nowhere else until somebody regenerates it. Keeping this
  # gate exactly as wide as branch protection also keeps ONE definition of "fit to ship" in one
  # place; narrowing it here would be a second, quieter one that nobody would think to re-read.
  #
  # WHY THE NAMED JOBS AND NOT THE WHOLE RUN. checks.yml's `Backend integration tests` stands up a
  # Postgres service and runs the ~375 database-backed tests. It is deliberately NOT a required
  # check (that file's section 5 says so, and says why) and it can take longer than this entire
  # budget, so waiting on the RUN would make an advisory job into the thing that decides whether
  # the live site can be updated — by accident, through a timeout, with no decision recorded
  # anywhere. IF THE THREE NAMES BELOW ARE RENAMED IN checks.yml THIS GOES RED WITH A MESSAGE
  # SAYING SO, rather than silently passing over a list that matches nothing. That is on purpose.
  #
  # THIS LOOP IS A COPY OF deploy-backend.yml'S, and the duplication is deliberate: the alternative
  # is a composite action, i.e. a fourth thing to pin, audit and keep in dependabot, to hold twenty
  # lines of `gh` and `jq`. The two are not allowed to drift — fix a defect in one, fix it in both.
  #
  # A RED RUN HERE DOES NOT SEVER STAGE 3. android-build.yml chains off this workflow COMPLETING
  # and deliberately carries no `conclusion == 'success'` gate (its header argues the case), so the
  # APK is still built and still answers "does it compile" for a commit this stage refused to
  # publish. The gate job above stays a job that always runs, for the same reason it always did.
  wait-for-checks:
    name: Wait for Checks on this commit
    needs: gate
    # Only when something is actually going to be published, and only when the gate did not record
    # the override. A run that has already decided not to deploy has nothing to gate, and hanging a
    # twenty-minute poll off it would buy nothing.
    #
    # THAT IS ALSO WHY THIS CANNOT DOUBLE-RED A FAILURE THE BACKEND ALREADY CAUGHT, which is the
    # first objection to raise against adding a second copy of the same gate. On a push that touches
    # backend/, a red Checks fails deploy-backend.yml's `wait-for-checks`, so the backend run
    # concludes `failure`, so the ordering rule in the gate above sets `should_deploy=false` and
    # this job never starts. It runs exactly where the backend's copy could not: a push whose
    # backend deploy correctly did nothing and therefore correctly waited for nothing.
    if: ${{ needs.gate.outputs.should_deploy == 'true' && needs.gate.outputs.wait_for_checks == 'true' }}
    runs-on: ubuntu-latest
    # A hair over the poll's own 20-minute budget, so the loop's error message — which names what it
    # was still waiting for — is what a reader sees rather than a bare job cancellation. It is also
    # the bound on how long this run holds the `deploy-frontend` concurrency group, which does not
    # cancel in progress: a stuck Checks run delays the next publish, it cannot queue for ever.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Poll for the gating jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The commit the deploy job checks out, resolved once by the gate — the backend run's
          # `head_sha` on the chained trigger, `github.sha` on a dispatch. Reading it from the gate
          # rather than re-deriving it here is what guarantees the commit that is GRADED is the
          # commit that is PUBLISHED; a `workflow_run` job otherwise defaults to the tip of main,
          # which may already have moved on.
          SHA: ${{ needs.gate.outputs.sha }}
          # The three checks.yml jobs branch protection names (see that file's header, and the note
          # above for why all three). JSON because jq consumes it as a list; a shell string of names
          # with spaces in them is how this kind of loop quietly starts matching nothing.
          GATING_JOBS: '["Backend tests","Web typecheck, lint and unit specs","Docs check"]'
        run: |
          set -euo pipefail
          # AN EMPTY SHA WOULD PASS THIS GATE OVER SOMEBODY ELSE'S COMMIT. `?head_sha=` with no
          # value is not a filter that matches nothing, it is an absent filter: the API answers with
          # the most recent Checks runs for ANY commit, and a green one from an hour ago would let
          # this publish an untested tree. Unreachable today — the gate always writes a SHA — which
          # is exactly why it is asserted rather than assumed.
          if [ -z "${SHA}" ]; then
            echo "::error::the gate produced no commit SHA to check. An empty head_sha filter returns the newest Checks runs for any commit, so this gate would grade a different tree and pass. Refusing to guess; nothing has been published."
            exit 1
          fi
          api="repos/${GITHUB_REPOSITORY}/actions"
          # 60 × 20 s. Twenty minutes is generous rather than tight here (see the note above): by
          # the time this job starts the answer usually already exists, and the budget is headroom
          # for a queued runner, not a measurement of the suite.
          for attempt in $(seq 1 60); do
            # `checks.yml` BY FILENAME. Looking the workflow up by its display name would break the
            # day somebody edits `name:` at the top of that file, and would break SILENTLY — an
            # empty result is indistinguishable from "not started yet", so the gate would time out
            # blaming the suite for a rename.
            runs="$(gh api "${api}/workflows/checks.yml/runs?head_sha=${SHA}&per_page=30" 2>/dev/null || echo '{"workflow_runs":[]}')"
            # Prefer the `push` run for this SHA; fall back to whatever run exists for it. On main
            # the push run is the one that matters, but a re-run or a dispatch of Checks against the
            # same commit is just as good an answer and there is no reason to ignore it.
            run_id="$(printf '%s' "$runs" | jq -r '([.workflow_runs[] | select(.event=="push")][0] // .workflow_runs[0]) | .id // ""')"
            if [ -z "$run_id" ]; then
              echo "attempt ${attempt}/60: no Checks run for ${SHA} yet"
              sleep 20
              continue
            fi
            jobs="$(gh api "${api}/runs/${run_id}/jobs?per_page=100" 2>/dev/null || echo '{"jobs":[]}')"
            verdict="$(printf '%s' "$jobs" | jq -r --argjson want "$GATING_JOBS" '
              [ .jobs[] | select(.name | IN($want[])) ]                       as $g
              | ($want - [ $g[].name ])                                        as $missing
              | ([ $g[] | select(.status != "completed") | .name ])            as $running
              | ([ $g[] | select(.status == "completed" and .conclusion != "success") | .name ]) as $bad
              | if   ($bad | length) > 0     then "fail " + ($bad | join(", "))
                elif (($missing + $running) | length) > 0 then "wait " + (($missing + $running) | join(", "))
                else "pass" end')"
            state="${verdict%% *}"
            detail="${verdict#* }"
            case "$state" in
              pass)
                echo "Checks passed for ${SHA} — run ${run_id}"
                echo "Checks green for \`${SHA}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              fail)
                echo "::error::Checks failed for ${SHA} (${detail}). Not publishing. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                {
                  echo "### Frontend deploy stopped — Checks are red"
                  echo ""
                  echo "\`${detail}\` failed on \`${SHA}\`, so this commit was not published."
                  echo "The live site is still serving the previous build."
                  echo ""
                  echo "[Checks run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id})"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              *)
                echo "attempt ${attempt}/60: still waiting on ${detail}"
                ;;
            esac
            sleep 20
          done
          echo "::error::timed out after 20 minutes waiting for the Checks jobs on ${SHA}. Nothing was published and the live site is still serving the previous build, which is the safe end of this failure. If the suite is genuinely this slow now, raise the loop bound here rather than deleting the gate; to publish past it in an emergency, run this workflow from the Actions tab with force=true — that skips the wait by design."
          exit 1

  deploy:
    needs: [gate, wait-for-checks]
    # ─── WHY THIS CONDITION GREW A STATUS FUNCTION — 2026-09-03 ──────────────────────────
    # `wait-for-checks` SKIPS ITSELF on the emergency override, and on any run that was never
    # going to publish. GitHub's default is that a job whose dependency was skipped is skipped
    # too — so leaving this as the plain `should_deploy` test would have silently turned the
    # documented override into "a forced dispatch never deploys", which is the same class of
    # quiet lie as the skip that cost a day on 2026-08-23 (see the gate step above). Writing a
    # status function into the `if` is what removes the implicit `success()` and lets this job
    # judge the results itself:
    #   • wait-for-checks succeeded            → deploy (the normal, gated path)
    #   • wait-for-checks was skipped          → deploy IF the gate still said so (force=true
    #                                            dispatch; a gate that said no is caught by the
    #                                            `should_deploy` test on the line below anyway)
    #   • wait-for-checks failed or cancelled  → DO NOT deploy
    # `needs.gate.result == 'success'` is restated because that same implicit `success()` used to
    # carry it. It changes no outcome today — the gate writes `should_deploy=false` before every
    # exit it fails on — and it is here so that an edit which ever fails the gate AFTER writing
    # `true` cannot publish through the hole.
    if: >-
      ${{ !cancelled()
          && needs.gate.result == 'success'
          && needs.gate.outputs.should_deploy == 'true'
          && (needs.wait-for-checks.result == 'success' || needs.wait-for-checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      # Resolved from the project this run actually deployed, not written down here. A literal was
      # what made this link point at `field-repository.vercel.app` — a site this workflow has never
      # published — so the run summary handed every reader a link to another product's page and
      # called it "production-web".
      name: production-web
      url: ${{ steps.alias.outputs.url }}
    env:
      # The CLI reads these two to resolve the project without a committed .vercel/ link
      # (frontend/.vercel is gitignored, so CI has no link to inherit).
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout the commit the backend deployed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A workflow_run run defaults to the tip of the default branch, which may already
          # have moved on. Pin to the exact commit whose backend deploy just went green so
          # the API and the site that calls it come from the same tree.
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22" # Next 16 needs ≥ 20.9; 22 matches Vercel's current build image
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Vercel CLI
        # Unpinned on purpose so token/API changes never strand the pipeline. If a CLI
        # release ever breaks the build, pin the version here — see docs/CI.md.
        run: npm install --global vercel@latest

      # Every CLI command below runs from the REPOSITORY ROOT, not from frontend/. The
      # Vercel project stores Root Directory = frontend (docs/DEPLOYMENT_VERCEL.md §1) and
      # `vercel build` applies that setting itself; running from inside frontend/ would
      # make it look for frontend/frontend and fail with "No Next.js version detected".
      - name: Pull the production project settings and environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Assert the project is still rooted at frontend/
        # Cheap guard against the single most common way this workflow can break: someone
        # clears Root Directory in the dashboard and the build starts looking at the repo
        # root, where there is no package.json. Fail here with a readable message instead
        # of 60 lines into a Next.js build.
        run: |
          set -euo pipefail
          root="$(node -p "require('./.vercel/project.json').settings?.rootDirectory ?? ''")"
          echo "Vercel Root Directory = '${root}'"
          if [ "$root" != "frontend" ]; then
            echo "::error::Vercel project Root Directory is '${root}', expected 'frontend'."
            echo "::error::Fix it in Vercel → Project → Settings → General → Root Directory."
            exit 1
          fi

      - name: Resolve the production alias of the project we are publishing to
        id: alias
        # WHY THIS IS RESOLVED AND NOT WRITTEN DOWN. Three places in this file used to name
        # `field-repository.vercel.app` as the site to check: the environment link above, the
        # smoke check, and the live-bundle assertion. This pipeline has never deployed that
        # hostname — it belongs to a different product in the same Vercel team — so both checks
        # were grading a site somebody else publishes. That is worse than having no check: a
        # `--prod` that failed to move OUR alias left the other product's healthy page answering
        # 200 with the expected API host in its chunks, and the run went green over the exact
        # failure the last step of this job exists to catch.
        #
        # `vercel pull` has just written `.vercel/project.json` for whatever project the token and
        # VERCEL_PROJECT_ID resolve to, and `<projectName>.vercel.app` is the domain Vercel
        # CONVENTIONALLY gives a project of that name. So the check follows the deploy target
        # automatically: point this workflow at a different project and the assertions move with
        # it, which is precisely what a literal could not do.
        #
        # BE CLEAR ABOUT WHAT THIS DOES NOT PROVE. It follows the project's NAME, which is not the
        # same thing as the alias the platform has actually assigned. `.vercel.app` subdomains are
        # globally unique across all of Vercel, so where a project's conventional domain was
        # already taken the project gets a suffixed one and the plain `<name>.vercel.app` belongs
        # to somebody else's account — and then the two checks below would poll a stranger's
        # healthy page, exactly the false green this step was added to remove, arrived at by
        # derivation instead of by a literal. It is right for `designer-repository` today, which
        # `deploy-backend.yml`'s CORS pin corroborates independently, and the guard below refuses
        # the one wrong name we know by name. The assertion that would need no such argument is
        # `vercel inspect "$url" --token=… | grep` for the alias in the deployment's own Aliases
        # list, after the deploy — that measures the thing rather than assuming it. It is NOT done
        # here because it cannot be exercised from a checkout with no Vercel credentials, and an
        # untested hard gate on the production deploy path is a worse failure than the one it
        # closes. Whoever next has the token in hand should promote it.
        #
        # IT MUST BE THE ALIAS, NEVER `vercel deploy`'s output URL. That URL addresses the
        # deployment we just uploaded, so it serves the new build whether or not production was
        # ever moved onto it — checking it would confirm the upload and assert nothing at all
        # about what a visitor receives.
        run: |
          set -euo pipefail
          name="$(node -p "require('./.vercel/project.json').projectName ?? ''")"
          if [ -z "$name" ]; then
            echo "::error::.vercel/project.json carries no projectName, so the production alias cannot be resolved."
            echo "::error::Without it there is nothing to smoke-check but the deployment URL, which always serves the new build and therefore proves nothing. Re-run 'vercel pull' or re-link the project."
            exit 1
          fi
          # The one name we know is wrong. If `vercel pull` resolved the field repository's
          # project, every check below would grade that product's live site AND this job would be
          # about to publish over it — so stop before the build, not after the upload.
          if [ "$name" = "field-repository" ]; then
            echo "::error::vercel pull resolved the project 'field-repository', which is a DIFFERENT product in the same Vercel team. This repository publishes to 'designer-repository'."
            echo "::error::VERCEL_PROJECT_ID is almost certainly prj_EzXN8hhGKpMciFBrZRdxpcgUUzN0; it must be prj_uRYcc64FRwcrkvMDZg9Gp7ZEtCoc. Nothing has been deployed. See docs/CI.md section 2."
            exit 1
          fi
          echo "url=https://${name}.vercel.app" >> "$GITHUB_OUTPUT"
          echo "Vercel project '${name}' — production alias https://${name}.vercel.app"

      - name: Assert the pulled environment carries the values the app cannot run without
        # 2026-07-26: these variables were marked Sensitive in the dashboard. Vercel never
        # returns a sensitive value to `vercel pull`, and this pipeline builds on the runner
        # (`vercel build` below, then `deploy --prebuilt`) rather than on Vercel — so the
        # build had nothing to inline, Next.js compiled in `undefined`, and every stage of
        # the pipeline went green over a site that could not log a single person in. Failing
        # here is the only place that costs nothing; the alternative is finding out from a
        # user. Presence and shape only — see the note about values in the loop.
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          if [ ! -f "$env_file" ]; then
            echo "::error::vercel pull wrote no ${env_file}, so the build has no NEXT_PUBLIC_* values at all."
            exit 1
          fi

          # EVERY `NEXT_PUBLIC_*` THE PULL RETURNS, not a hand-written pair. The list used to be
          # exactly those two, and on 2026-08-23 all FOUR of this project's public variables were
          # stored Sensitive — so a gate that named two would have gone green the moment those two
          # were fixed and published a bundle with `undefined` inlined for the MapTiler key, i.e. a
          # site that logs in fine and shows no map. Discovering the keys from the pulled file means
          # a variable added in the dashboard next month is covered without anyone remembering to
          # come back here.
          #
          # NEXT_PUBLIC_APP_URL is exempt, and only because it is genuinely inert: nothing under
          # `frontend/` reads it (backend/DEPLOY_AWS.md and .env.example both say so), so its value
          # cannot reach a bundle and being withheld cannot break one. If anything ever starts
          # reading it, delete it from this list in the same change.
          fail=0
          # No `tr` and no quoting below: `for var in $discovered` word-splits on IFS, which
          # includes newline, so the pulled keys need no flattening.
          discovered="$(grep -oE '^NEXT_PUBLIC_[A-Z0-9_]+' "$env_file" | sort -u | grep -v '^NEXT_PUBLIC_APP_URL$')"
          if [ -z "$discovered" ]; then
            echo "::error::the pulled production environment contains no NEXT_PUBLIC_* variables at all, so the build would inline undefined for every one of them."
            exit 1
          fi
          echo "checking: ${discovered}"
          for var in $discovered; do
            # Never echoed. Every `NEXT_PUBLIC_*` is public by definition — they are compiled into
            # the JavaScript every visitor downloads — but a workflow that prints env values is the
            # template someone copies the day the variable is not public. Only the two whose shape
            # is knowable get a format check below; the rest are presence-only, which is the part
            # that actually fails.
            value="$(sed -n "s/^${var}=//p" "$env_file" | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"

            # `[SENSITIVE]` IS THE SENTINEL THE CLI ACTUALLY WRITES, and not testing for it made
            # this step lie. The comment above predicted a Sensitive variable would arrive empty;
            # CLI 57 instead writes the literal placeholder `"[SENSITIVE]"`, which is neither empty
            # nor `undefined`, so on 2026-08-23 the first run that ever had a token fell straight
            # through to the shape checks and reported "NEXT_PUBLIC_API_URL is set but is not an
            # absolute http(s) origin" — sending the reader after a malformed URL that does not
            # exist. Both variables failing shape at once was the only clue that the values were
            # never really read. A guard whose diagnosis is wrong is worse than no guard: it spends
            # someone's afternoon in the wrong file.
            if [ -z "$value" ] || [ "$value" = "undefined" ] || [ "$value" = "[SENSITIVE]" ]; then
              echo "::error::${var} is missing, empty, or withheld as Sensitive in the pulled production environment (value read: '${value:-<empty>}')."
              echo "::error::Almost always this means it is stored as Sensitive in Vercel. A Sensitive variable is withheld from 'vercel pull' by design, this pipeline builds on the GitHub runner, and Next.js therefore inlines undefined - the build and the deploy both still succeed and the live site is broken."
              echo "::error::Fix: Vercel -> Project -> Settings -> Environment Variables, delete ${var} and re-add it as Encrypted (not Sensitive) for Production, Preview and Development, then re-run this workflow."
              echo "::error::Marking these two Sensitive protects nothing, which is why this is safe to do: NEXT_PUBLIC_* values are compiled into the JavaScript every visitor downloads, so both are already public in the bundle. What Sensitive does buy is that nothing can read them back - including this build."
              echo "::error::A deploy launched with 'vercel deploy' (no --prebuilt) builds ON Vercel, where the real values are available, which is why the live site works while this pipeline cannot reproduce it."
              fail=1
              continue
            fi

            case "$var" in
              NEXT_PUBLIC_API_URL)
                case "$value" in
                  http://*|https://*) ;;
                  *)
                    echo "::error::${var} is set but is not an absolute http(s) origin. lib/api.ts appends /api to it verbatim, so a bare host or a stray quote breaks every request the browser makes."
                    fail=1
                    continue ;;
                esac ;;
              NEXT_PUBLIC_GOOGLE_CLIENT_ID)
                case "$value" in
                  *.apps.googleusercontent.com) ;;
                  *)
                    echo "::error::${var} is set but does not end in .apps.googleusercontent.com. Google answers anything else with 'Error 401: invalid_client - The OAuth client was not found', which looks like an outage rather than a typo."
                    fail=1
                    continue ;;
                esac ;;
            esac

            echo "${var}: present, ${#value} characters, shape OK"
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Build (uses the project's own install/build commands from frontend/vercel.json)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Assert the values actually reached the bundle we are about to publish
        # The step above checks an *input* to the build; this one checks the artifact. A
        # variable that was pulled fine and still did not get inlined is a different bug
        # with the same symptom — a stale cache, a build that resolved the wrong Root
        # Directory, a `process.env[name]` lookup Next cannot statically replace — and it
        # would sail past every check upstream of here. Grepping .vercel/output for the
        # host is the literal user-visible symptom: when this broke, searching the live
        # chunks for the API origin and the client id returned nothing at all.
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          out=".vercel/output"
          if [ ! -d "$out" ]; then
            echo "::error::vercel build produced no ${out} to inspect."
            exit 1
          fi

          fail=0
          for var in NEXT_PUBLIC_API_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID; do
            value="$(sed -n "s/^${var}=//p" "$env_file" | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"
            needle="$value"
            if [ "$var" = "NEXT_PUBLIC_API_URL" ]; then
              # Host[:port] only. The bundle may hold the origin split from its scheme or
              # joined to a path, but the host is the part whose absence is fatal.
              needle="$(printf '%s' "$value" | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#[/?].*$##')"
            fi

            # An empty needle would match every file and report a cheerful false pass, so
            # it has to be its own failure. Reachable via a scheme with no host behind it,
            # which satisfies the shape check before the build.
            if [ -z "$needle" ]; then
              echo "::error::${var} has no value to search for here, so nothing could have been inlined from it."
              fail=1
              continue
            fi

            # -a because the output tree mixes minified JS with binaries; -F because a
            # host is a literal, not a pattern. The needle is searched for, never printed.
            if grep -raqF -- "$needle" "$out"; then
              echo "${var}: found inlined in ${out}"
            else
              echo "::error::${var} was present in the pulled environment but its value appears nowhere in ${out}."
              echo "::error::The bundle cannot use a value it does not contain, so this build would deploy green and fail at runtime. Do not publish it - check that the build resolved Root Directory 'frontend' and that the app reads process.env.${var} as a literal, which is the only form Next.js inlines."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy the prebuilt output to production
        id: deploy
        run: |
          set -euo pipefail
          # --prebuilt uploads .vercel/output instead of rebuilding on Vercel, so what was
          # verified in the step above is byte-for-byte what goes live. --prod moves the
          # production alias resolved above onto this deployment — and whether it actually did
          # is exactly what the two steps after this one are for.
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"

      # ─── `--prod` IS NOT ENOUGH, AND THIS IS WHY THE SITE WENT STALE FOR A WEEK ──────────────
      #
      # A production alias that was ever assigned by hand — `vercel alias set`, or a click in the
      # dashboard — stops tracking the newest production deployment. `vercel deploy --prod` and
      # `vercel promote` both create one and neither moves it. That is what
      # designer-repository.vercel.app was doing on 2026-08-23: bound to a deployment seven days old
      # while every deploy "succeeded". The step below would not have caught it either, because the
      # alias serves 200 whichever deployment it points at.
      #
      # So the alias is moved EXPLICITLY, at the artifact just uploaded. Idempotent: if `--prod`
      # already landed it there this is a no-op, and if the alias was pinned this is the only thing
      # that unpins it. `|| exit 1` rather than a warning — an alias that did not move means nothing
      # was published, and that must not read as a green deploy.
      - name: Move the production alias onto this deployment
        env:
          SITE: ${{ steps.alias.outputs.url }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          host="${SITE#https://}"
          vercel alias set "${URL#https://}" "$host" --token="$VERCEL_TOKEN"
          echo "Aliased $host -> $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-check the production alias
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SITE: ${{ steps.alias.outputs.url }}
        run: |
          set -euo pipefail
          # This proves the alias moved and the site is being served. It proves nothing
          # about whether the site works: the build that shipped `undefined` for all three
          # NEXT_PUBLIC_* values returned 200 on every page it had, and simply could not
          # log anyone in. A 200 only ever rules out "no deployment" — the step after this
          # one is what rules out "a deployment nobody can use", by reading the bytes the
          # CDN is handing out rather than trusting that it has any.
          # Alias propagation is not instant; poll rather than sleep-and-hope.
          for i in $(seq 1 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${SITE}/" || true)"
            if [ "$code" = "200" ]; then
              echo "production alias healthy after ${i} tries (HTTP $code)"
              exit 0
            fi
            sleep 4
          done
          echo "::error::${SITE} did not return 200 (last: ${code:-none}). Deployment: ${DEPLOY_URL}"
          exit 1

      - name: Assert the bundle the CDN is serving is the one that was verified
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SITE: ${{ steps.alias.outputs.url }}
        # The two assertions before the deploy grade an artifact on the runner; this one
        # grades the artifact a visitor receives, which is the only one that has ever been
        # broken. Everything between the two — the upload, `--prod` picking which deployment
        # the alias lands on, the edge cache — is unverified by anything upstream, so a stale
        # alias or a `--prod` that aliased a different deployment reads as a clean green run.
        # Fetching /login and grepping its own chunks for the API host is exactly the check
        # that was run by hand to diagnose 2026-07-26, promoted out of the incident channel.
        run: |
          set -euo pipefail
          site="$SITE"
          env_file=".vercel/.env.production.local"

          # Read, never echoed — same rule and same extraction as the pre-build assertions.
          value="$(sed -n "s/^NEXT_PUBLIC_API_URL=//p" "$env_file" | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"
          host="$(printf '%s' "$value" | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#[/?].*$##')"
          if [ -z "$host" ]; then
            echo "::error::There is no API host to look for in the live bundle, so this check cannot say anything about it. The pulled production environment should have failed the earlier assertion - do not treat this deployment as verified."
            exit 1
          fi

          work="$(mktemp -d)"
          paths=()
          total=0
          searched=0

          # Six attempts, because a fresh alias takes a few seconds to reach every edge and
          # the first request after a deploy can still be answered by the deployment it just
          # replaced. Failing on the first miss would page someone for CDN propagation.
          for attempt in $(seq 1 6); do
            searched=0
            paths=()
            rm -rf "${work:?}/"* 2>/dev/null || true

            # The query string is a cache-buster: without it the edge is free to hand back
            # the previous deployment's HTML, and this would grade the build just replaced.
            if ! curl -fsS --max-time 30 -o "$work/login.html" "${site}/login?ci-smoke=${GITHUB_RUN_ID}-${attempt}"; then
              echo "attempt ${attempt}: /login did not answer yet"
              sleep 10
              continue
            fi

            # The script tags on the page, resolved against the alias, so what gets read is
            # what a browser would download rather than what the runner still has lying in
            # .vercel/output. Chunk filenames are content-hashed, hence no cache-buster.
            while IFS= read -r path; do
              paths+=("$path")
            done < <(grep -oE '/_next/static/chunks/[A-Za-z0-9._@/-]+\.js' "$work/login.html" | sort -u)
            total="${#paths[@]}"

            if [ "$total" -eq 0 ]; then
              echo "attempt ${attempt}: /login answered but loaded no JavaScript, which is not a page anyone can sign in on"
              sleep 10
              continue
            fi

            found=0
            for path in "${paths[@]}"; do
              # A 404 here means the alias moved between the page and its scripts; the retry
              # picks up a consistent pair instead of counting the miss against the build.
              if ! curl -fsS --max-time 30 -o "$work/chunk.js" "${site}${path}"; then
                continue
              fi
              searched=$((searched + 1))
              if grep -aqF -- "$host" "$work/chunk.js"; then
                found=1
                break
              fi
            done

            if [ "$found" -eq 1 ]; then
              echo "live bundle calls the expected API host (attempt ${attempt}, found in chunk ${searched} of ${total})"
              exit 0
            fi

            echo "attempt ${attempt}: read ${searched} of ${total} chunks, none mentions the API host"
            sleep 10
          done

          # Two unrelated failures end up here, and saying which one it was matters: nothing
          # to read means the site is down, which anyone can see; chunks without the host is
          # the one that looks perfectly healthy and cannot sign a single person in.
          if [ "$searched" -eq 0 ]; then
            echo "::error::Nothing readable came back from ${site}/login on any of 6 attempts - either the page never answered or it loaded no JavaScript at all - so there is no evidence this deployment works."
          else
            echo "::error::The live site is serving a login page whose JavaScript never mentions the API host from NEXT_PUBLIC_API_URL (${#host} characters, taken from the environment this build was pulled with). Searched ${searched} of the ${total} chunks that ${site}/login loads, on each of 6 attempts."
            echo "::error::The upload was checked and did contain that host, so the bytes on the alias are not the bytes that were built - either the production alias is still pointing at an older deployment, or --prod aliased a different one. Whichever it is, the site is in the state it was in on 2026-07-26: every page loads, and nobody can sign in."
          fi
          echo "::error::This deployment is ALREADY live, so fix the site before fixing the cause. Roll back first: Vercel -> Project -> Deployments -> the last deployment known to work -> Instant Rollback (or 'vercel rollback <that deployment url>'). Then re-run this workflow to publish ${DEPLOY_URL} again and watch this step."
          exit 1
