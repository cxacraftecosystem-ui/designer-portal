# ─── LIVE AGAIN AS OF 2026-09-02 ────────────────────────────────────────────────────────────
#
# This workflow was dormant from 2026-08-22 (schedule commented out, no database secret) while the
# provider of that era suspended idle compute on its own. On 2026-09-02 production moved back onto a
# Supabase project, whose free tier PAUSES after a stretch of inactivity and needs a human to
# restore it — the exact case this ping was built for — so the dormancy header's own condition 2
# was executed as written: the two `schedule:` lines below were restored, the
# `SUPABASE_DATABASE_URL` repository secret was set (the session-pooler DSN; the script rewrites the
# port to the transaction pooler itself, so the nightly ping never occupies a session slot), and the
# dormancy block was replaced by this one. (WHICH provider hosts production is still stated in
# exactly one place, docs/ENVIRONMENT.md's "The database" section; this file is the workaround that
# exists because of that provider's pause behaviour, which is why it may name it.)
#
# `workflow_dispatch` is KEPT so the ping can also be fired by hand against whichever URL the
# secrets name — useful for confirming the database is reachable from a runner without deploying.
#
# A run that fails here is a real signal now, not noise: it means the runner could not reach the
# production database. Check the secret first, then the provider's status page.
#
# ONE THING TO KNOW BEFORE DELETING THIS FILE: `npm ci` here is the reason the root `package.json`
# name cannot be renamed in a single commit — docs/CI.md §7 records that constraint. Removing this
# file removes that constraint too, so say so in the commit message.

name: Keep Supabase Active

on:
  # Every day at 8:00 PM UTC (1:30 AM IST).
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install keep-alive dependencies
        run: npm ci

      - name: Ping Supabase Postgres
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run keep-alive

      - name: Notify on failure
        if: failure()
        run: |
          echo "Supabase keep-alive failed - the runner could not reach the production database."
          echo "SUPABASE_DATABASE_URL is expected to exist in repository secrets (set 2026-09-02)."
          echo "Check that secret first, then the provider's status page. A red run here is a real"
          echo "signal, not noise - the header of this file explains why it is live."
