name: Android instrumented tests

# ─── EIGHT TEST CLASSES, FIRST EXECUTED ON 2026-10-09 (RUN 37937482647) ─────────────────
#
# `android/app/src/androidTest/` holds eight instrumented test classes — 24 `@Test` methods,
# counted 2026-09-03 — and android-build.yml runs none of them. It cannot: `connectedAndroidTest`
# needs a device or an emulator, and that workflow compiles, lints and assembles on a bare runner.
# So the ASR engine probes, the device-tier probe, the language-pack probe, the custom-section
# store and the stage-authority device tests are code that only this workflow compiles and runs
# (android-build.yml compiles the unit tests, not these). `DwCustomSectionStoreDeviceTest` and
# `DwStageAuthorityDeviceTest` carry eight assertions each about behaviour that only exists on a
# real Android runtime; they are the two worth caring about most, and they are exactly the two
# that a JVM unit test cannot replace.
#
# A GREEN RUN USED TO PROVE NOTHING, AND THE FIRST ONE DID EXACTLY THAT. This workflow's first run
# (37930568222, 2026-10-09) compiled, then its install failed — "Requested internal only, but not
# enough space" — and the Gradle task logged "AndroidTestRunner failed on emulator-5554", ended
# BUILD SUCCESSFUL and wrote a report counting 0 tests. `disk-size` below answers the install; the
# step after the emulator answers the green, by reading that report: a run in which no test
# executed, or in which one failed, is red.
#
# The second run (37935344589) was red for the right reason and showed the next fault: SurfaceFlinger
# aborting in a loop ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma", in
# GoldfishMapper::readFromHost), taking the framework down with it, so the install found no
# package service ("cmd: Can't find service: package"). That is the runner image's Command-line
# Tools 12.0: its avdmanager writes `target=android-0` for a minor-versioned image such as
# android-37.0, and the emulator then boots the image as API 3 and leaves off the graphics features
# Android 17 needs (ReactiveCircus/android-emulator-runner#482). The command-line-tools step below
# answers it, and the script's first line refuses an AVD with any other target than the one asked for.
#
# The third run (37937482647) executed the tests for the first time: 22 of 24 passed, and the two
# failures were real — a paused speech-model download that kept running (fixed in 25ec2cd) and a
# download readout that counted the wait for the first byte as transfer time (fixed in c9d4a34).
# Run 37944158602 passed all 24. docs/CI.md §1.5 keeps the account.
#
# ─── WHY THIS IS `workflow_dispatch` ONLY, WHICH IS A COST DECISION AND NOT A TASTE ──────
# An emulator job is the most expensive thing this repository could run. It needs KVM, boots a
# system image, and takes somewhere between fifteen and thirty minutes end to end — an order of
# magnitude more runner time than every other workflow here put together, on a fleet whose entire
# infrastructure is one t3.micro. Running it per push, or even nightly, would dominate the
# account's usage to re-prove eight probes that change a few times a year.
#
# So it is a tool, not a gate: run it when you touch anything under `android/app/src/main/java/**`
# that these probes cover, before cutting a release, or when a handset in the field does something
# the JVM tests say is impossible.
#
#     gh workflow run "Android instrumented tests" --ref <branch>
#
# IT IS NOT WIRED INTO BRANCH PROTECTION AND MUST NOT BE. A required check that a human has to
# remember to trigger is a required check that blocks every pull request forever.
#
# ─── IF THIS IS EVER PROMOTED TO A SCHEDULE ─────────────────────────────────────────────
# Weekly is the shape that would make sense — same argument, same non-blocking status. What would
# NOT make sense is per-push: see the cost paragraph. Whoever makes that change should measure one
# run first and write the number into this comment.
#
# THIS USED TO CITE e2e-live.yml AS THE PRECEDENT TO SIT ALONGSIDE. It is no longer one: that
# workflow was weekly from 2026-09-03 and had its `schedule:` REMOVED on 2026-09-21, because all
# three of its scheduled runs went red and none was read — two of them on a Docker Hub image that
# had been withdrawn, unrelated to anything in the repository. The precedent it now sets is the
# cautionary one: a scheduled run that nobody has agreed to read is not a signal, it is a red badge
# people learn to scroll past. Before scheduling THIS one, say who reads the result and what they
# do about it.

on:
  workflow_dispatch:
    inputs:
      api-level:
        # A STRING, and "37.0" rather than 37: since Android 16 the SDK publishes platforms and
        # system images under a minor level (`platforms;android-37.0`,
        # `system-images;android-37.0;google_apis;x86_64`), and the runner builds both package
        # names from this value verbatim — there is no `android-37` package for it to find.
        # 37.0 is the targetSdk (Android 17); 37.2, the newest platform, is published only as the
        # 16 KB-page `google_apis_ps16k` image, which this job's fixed `target` does not name.
        description: "Android API level to run the emulator at (e.g. 37.0)"
        type: string
        default: "37.0"

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: connectedDebugAndroidTest on an emulator
    # ubuntu-latest and NOT macos: the macOS runners are the ones with a hardware-accelerated
    # emulator on Apple silicon, and they are also ten times the per-minute cost. Linux runners
    # expose KVM (see the step below), which is fast enough for probes that are not driving a UI.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # 25 for the same reason android-build.yml runs it, and it is the JDK that RUNS Gradle,
          # not the bytecode level: android/app/build.gradle.kts and the core-* modules pin Java 17
          # (Android's documented ceiling) explicitly, so the class files are the same 61 either
          # way. Keep the three Android workflows on one value.
          java-version: "25"
          cache: gradle

      - name: Make the Gradle wrapper executable
        # The wrapper is committed with mode 100644 (it was added from Windows), so the runner
        # cannot exec it as-is. Same line, same reason, as android-build.yml.
        run: chmod +x gradlew

      - name: Replace the runner's SDK command-line tools with the newest release
        # 23.0, the newest stable `cmdline-tools` in Google's SDK repository on 2026-10-09; the
        # runner image ships 12.0, whose avdmanager writes `target=android-0` for android-37.0 and
        # leaves SurfaceFlinger crashing in a loop (see the top of this file). The emulator action
        # runs avdmanager from cmdline-tools/latest and installs a copy of its own only when that
        # directory is missing, so the newer release has to BE cmdline-tools/latest. sdkmanager
        # checks the download against the repository's checksum. Bump the version with the SDK.
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;23.0" > /dev/null
          rm -rf "$sdk/cmdline-tools/latest"
          mv "$sdk/cmdline-tools/23.0" "$sdk/cmdline-tools/latest"
          # Not `sdkmanager --version`: since 23.0 that prints the Android CLI's own version
          # (1.0.16500706), which does not show that 23.0 is the one in place.
          grep '^Pkg.Revision=' "$sdk/cmdline-tools/latest/source.properties"

      - name: Ensure the required Android SDK packages are installed
        # Mirrors android-build.yml deliberately: which platform and build-tools versions are
        # preinstalled drifts with the runner image, the app compiles against the 37.2 platform,
        # and it pins build-tools 37.0.0. Both installs are no-ops when already present. (The
        # emulator action installs the platform for `api-level` itself; this is the one the
        # build compiles against.)
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Fetch the vendored sherpa-onnx AAR
        # WITHOUT THIS STEP NOTHING IN THIS JOB COMPILES, and until 2026-10-09 it was missing: the
        # offline speech engine is a bare file in the gitignored `android/app/libs/`, bound
        # through the `flatDir` in settings.gradle.kts, so `connectedDebugAndroidTest` stopped at
        #   Could not find :sherpa-onnx-static-link-onnxruntime-<version>:
        # before a single probe ran. android-build.yml carries the full argument; this is the
        # same fetch, with the same name, digest and size, verified the same way — and
        # DwAsrEngineProbeTest, which this job exists to run, is the probe of exactly this file.
        run: |
          set -euo pipefail
          aar="app/libs/sherpa-onnx-static-link-onnxruntime-1.13.8.aar"
          sha="b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471"
          mkdir -p app/libs
          curl -fsSL --retry 3 --retry-delay 5 -o "$aar" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar"
          echo "$sha  $aar" | sha256sum -c -
          test "$(stat -c%s "$aar")" = "38691998"

      - name: Stage the pinned speech model for the engine probe
        # DwAsrEngineProbeTest FAILS WHEN THE MODEL IS NOT STAGED, on purpose — a probe that quietly
        # measured nothing is the failure it exists to catch. The files are the row `DW_ASR_MODELS`
        # pins in android/app/src/main/java/com/designprototype/workshop/data/DwAsrModel.kt, unpacked
        # from the release tarball that file's KDoc names, with the digest and size it records. The
        # emulator step pushes them to /data/local/tmp/dwasr, where the probe's KDoc stages them (and
        # one of the two places the app itself looks), and the probe hashes both files ON THE DEVICE
        # against digests compiled into the APK before it loads anything: this digest guards the
        # download, the probe's guards the load. Upstream's sample clips go too, so the probe decodes
        # rather than only loads. When DW_ASR_MODELS pins another row, change name, digest and size.
        run: |
          set -euo pipefail
          name="sherpa-onnx-omnilingual-asr-1600-languages-300M-ctc-int8-2025-11-12"
          tarball="$RUNNER_TEMP/$name.tar.bz2"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$name.tar.bz2"
          echo "cdcd0559c7c73efed54209a926e321afc914d046c5fdbf3665f00dc78180e5ed  $tarball" | sha256sum -c -
          test "$(stat -c%s "$tarball")" = "292571207"
          tar -xjf "$tarball" -C "$RUNNER_TEMP"
          rm "$tarball"
          stage="$RUNNER_TEMP/dwasr"
          mkdir -p "$stage/wav"
          mv "$RUNNER_TEMP/$name/model.int8.onnx" "$RUNNER_TEMP/$name/tokens.txt" "$stage/"
          find "$RUNNER_TEMP/$name" -name '*.wav' -exec mv -t "$stage/wav/" {} +
          ls -lR "$stage"

      - name: Build the app and test APKs before the emulator boots
        # The emulator step only installs and runs them: `connectedDebugAndroidTest` finds both
        # APKs up to date. Building first keeps an eight-minute compile from competing with a
        # booting emulator for the runner's four cores, and puts a compile error in a step of its
        # own instead of in the middle of the emulator's log.
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --stacktrace

      - name: Enable KVM for the emulator
        # WITHOUT THIS THE EMULATOR FALLS BACK TO SOFTWARE RENDERING AND THE JOB TIMES OUT. The
        # ubuntu-latest image has /dev/kvm but does not grant the runner user access to it; the udev
        # rule below is the documented fix from the action's own README. It is a one-line step whose
        # absence looks like "the emulator is just slow", which is why it gets a comment.
        #
        # `working-directory: android` is overridden to the workspace root — nothing here touches
        # the project and udev is a system concern.
        working-directory: .
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the instrumented tests
        # SHA-pinned like every other action in this repository — see .github/dependabot.yml for
        # why, and for what keeps the pin from rotting. This one is a third-party action rather than
        # a first-party `actions/*` one, which makes the pin matter more rather than less.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        # The dispatch input reaches the script as data, through the environment, and is compared as
        # a fixed string — not pasted into the shell line, where `.` is a regex wildcard and the text
        # is whatever the person dispatching typed.
        env:
          API_LEVEL: ${{ inputs.api-level || '37.0' }}
        with:
          api-level: ${{ inputs.api-level || '37.0' }}
          # `google_apis` rather than the bare `default` image: the probes touch Play-services-shaped
          # APIs on some paths, and google_apis is the image that has them without pulling in the
          # Play Store (which needs a different, slower image and a signed-in account).
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          # No window, no audio, no boot animation, no camera, and NO SNAPSHOT EITHER WAY. The two
          # snapshot flags are the ones that matter for a job that runs once on a fresh runner:
          # writing a snapshot at the end costs minutes and nothing will ever read it, and loading
          # one that does not exist is a boot path with its own failure modes.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -no-snapshot-load -camera-back none -camera-front none
          disable-animations: true
          # 8 GB of userdata, sparse on the runner. The default partition could not take the debug
          # APK (run 37930568222, above), and the staged model needs room twice: 365 MB in
          # /data/local/tmp, and as much again once a probe copies it into the app's own storage.
          # 4 GB of RAM because the engine probe holds that model in one process, and what the
          # Nexus 6 profile would give is not something this file controls.
          disk-size: 8G
          ram-size: 4096M
          working-directory: android
          # The action runs each line on its own (`sh -c`) and stops at the first that fails:
          #  1.   The AVD must be the API level asked for — `target=android-0` is the
          #       command-line-tools fault at the top of this file, and boots a broken device.
          #  2-3. The staged model onto the device, where DwAsrEngineProbeTest's KDoc puts it.
          #  4.   A bigger log buffer, so the probes' lines survive to the end of the run.
          #  5.   `:app:connectedDebugAndroidTest` and not `connectedAndroidTest`: the latter runs
          #       every variant, and this project only ever needs the debug one — release is signed
          #       with a key CI does not hold. Its exit status is parked rather than acted on, so
          #  6.   the probes' log is saved from a failed run too — what they print is the evidence
          #       they exist for, and the emulator is gone once this script ends — and then
          #  7.   the parked status fails the step.
          script: |
            grep -Fx "target=android-$API_LEVEL" "$ANDROID_AVD_HOME/test.ini" || { echo "::error::The AVD was not created for API $API_LEVEL: $(grep '^target=' "$ANDROID_AVD_HOME/test.ini")"; exit 1; }
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" push "$RUNNER_TEMP/dwasr" /data/local/tmp/
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" shell chmod -R 755 /data/local/tmp/dwasr
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" logcat -G 16M || true
            ./gradlew :app:connectedDebugAndroidTest --console=plain --stacktrace || echo "$?" > "$RUNNER_TEMP/connected-exit"
            mkdir -p app/build/outputs/androidTest-results && "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" logcat -d -v time -s DWASRPROBE DWICPROBE DWXFERPROBE DWTIERPROBE DWPACKPROBE DWTIER2PROBE TestRunner AndroidRuntime DEBUG libc > app/build/outputs/androidTest-results/probes-logcat.txt || true
            test ! -e "$RUNNER_TEMP/connected-exit"

      - name: Fail unless instrumented tests ran, and none failed
        # The other half of the first run's lesson (top of this file): the Gradle task's exit status
        # does not mean "the tests ran", so this reads the report the task wrote. No test executed,
        # whether none was found or every one was skipped, is a failure, and so is any failed test.
        # The counts go to the job summary; `!cancelled()` so they are there after a red run as well.
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          report = pathlib.Path("app/build/reports/androidTests/connected/debug/index.html")
          if not report.is_file():
              print(f"::error::{report} was not written, so this run says nothing about the tests.")
              sys.exit(1)
          html = report.read_text(encoding="utf-8", errors="replace")

          def count(label):
              m = re.search(r'<div class="counter">([0-9,]+)</div>\s*<p>%s</p>' % label, html)
              return int(m.group(1).replace(",", "")) if m else None

          tests, failures, skipped = count("tests"), count("failures"), count("skipped")
          line = f"Instrumented tests: {tests} in the report, {failures} failed, {skipped} skipped."
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
          if None in (tests, failures, skipped):
              print(f"::error::The counters in {report} could not be read; its layout has changed.")
              sys.exit(1)
          if tests - skipped <= 0:
              print("::error::No instrumented test executed. The emulator step's log names the device "
                    "error (an install that failed, a device that went away); the task does not fail on it.")
              sys.exit(1)
          # A PASS THAT MEASURED NOTHING IS SAID OUT LOUD. A probe whose artifact is not staged here
          # (DwAsrIndicProbeTest: this job stages no IndicConformer model) logs "NOT STAGED" and
          # returns, which the report counts as a pass — and an Assume would not help, because AGP
          # 9.4's report files an AssumptionViolatedException under failures (run 37951774101).
          probes = pathlib.Path("app/build/outputs/androidTest-results/probes-logcat.txt")
          unmeasured = [line.split("): ", 1)[-1][:160] for line in
                        (probes.read_text(encoding="utf-8", errors="replace").splitlines() if probes.is_file() else [])
                        if "NOT STAGED" in line]
          if unmeasured:
              note = f"{len(unmeasured)} probe(s) passed without measuring anything: " + " | ".join(unmeasured)
              print(f"::warning::{note}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(note + "\n")
          if failures:
              print(f"::error::{failures} instrumented test(s) failed; see the android-instrumented-results artifact.")
              sys.exit(1)
          PY

      - name: Upload the instrumented-test results
        # `always()`: a red run is precisely when the HTML report and the per-test XML are worth
        # reading, and a run that fails during the emulator boot still produces the directory (empty
        # or partial), which `if-no-files-found: warn` lets through rather than replacing the real
        # error with a missing-artifact one. Same reasoning as android-build.yml's unit-test upload.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumented-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
