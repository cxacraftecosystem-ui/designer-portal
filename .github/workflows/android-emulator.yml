name: Android instrumented tests

# ─── EIGHT TEST CLASSES THAT NOTHING HAS EVER RUN ────────────────────────────────────────
#
# `android/app/src/androidTest/` holds eight instrumented test classes — 24 `@Test` methods,
# counted 2026-09-03 — and android-build.yml runs none of them. It cannot: `connectedAndroidTest`
# needs a device or an emulator, and that workflow compiles, lints and assembles on a bare runner.
# So the ASR engine probes, the device-tier probe, the language-pack probe, the custom-section
# store and the stage-authority device tests are all code that is compiled by CI and executed by
# nobody. `DwCustomSectionStoreDeviceTest` and `DwStageAuthorityDeviceTest` carry eight assertions
# each about behaviour that only exists on a real Android runtime; they are the two worth caring
# about most, and they are exactly the two that a JVM unit test cannot replace.
#
# ─── WHY THIS IS `workflow_dispatch` ONLY, WHICH IS A COST DECISION AND NOT A TASTE ──────
# An emulator job is the most expensive thing this repository could run. It needs KVM, boots a
# system image, and takes somewhere between fifteen and thirty minutes end to end — an order of
# magnitude more runner time than every other workflow here put together, on a fleet whose entire
# infrastructure is one t3.micro. Running it per push, or even nightly, would dominate the
# account's usage to re-prove eight probes that change a few times a year.
#
# So it is a tool, not a gate: run it when you touch anything under `android/app/src/main/java/**`
# that these probes cover, before cutting a release, or when a handset in the field does something
# the JVM tests say is impossible.
#
#     gh workflow run "Android instrumented tests" --ref <branch>
#
# IT IS NOT WIRED INTO BRANCH PROTECTION AND MUST NOT BE. A required check that a human has to
# remember to trigger is a required check that blocks every pull request forever.
#
# ─── IF THIS IS EVER PROMOTED TO A SCHEDULE ─────────────────────────────────────────────
# Weekly is the shape that would make sense, alongside e2e-live.yml — same argument, same
# non-blocking status. What would NOT make sense is per-push: see the cost paragraph. Whoever makes
# that change should measure one run first and write the number into this comment.

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: "Android API level to run the emulator at"
        type: string
        default: "34"

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: connectedDebugAndroidTest on an emulator
    # ubuntu-latest and NOT macos: the macOS runners are the ones with a hardware-accelerated
    # emulator on Apple silicon, and they are also ten times the per-minute cost. Linux runners
    # expose KVM (see the step below), which is fast enough for probes that are not driving a UI.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # 17 for the same reason android-build.yml pins it, and that reason is not a preference:
          # android/app/build.gradle.kts pins sourceCompatibility/targetCompatibility to VERSION_17
          # and kotlinOptions.jvmTarget to "17". AGP 8.7 rejects a lower JDK and a higher one moves
          # the default bytecode target. This must track that file.
          java-version: "17"
          cache: gradle

      - name: Make the Gradle wrapper executable
        # The wrapper is committed with mode 100644 (it was added from Windows), so the runner
        # cannot exec it as-is. Same line, same reason, as android-build.yml.
        run: chmod +x gradlew

      - name: Ensure the required Android SDK packages are installed
        # Mirrors android-build.yml deliberately: which platform and build-tools versions are
        # preinstalled drifts with the runner image, compileSdk/targetSdk are 35, and AGP 8.7.3
        # wants build-tools 35.x. Both installs are no-ops when already present.
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Enable KVM for the emulator
        # WITHOUT THIS THE EMULATOR FALLS BACK TO SOFTWARE RENDERING AND THE JOB TIMES OUT. The
        # ubuntu-latest image has /dev/kvm but does not grant the runner user access to it; the udev
        # rule below is the documented fix from the action's own README. It is a one-line step whose
        # absence looks like "the emulator is just slow", which is why it gets a comment.
        #
        # `working-directory: android` is overridden to the workspace root — nothing here touches
        # the project and udev is a system concern.
        working-directory: .
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the instrumented tests
        # SHA-pinned like every other action in this repository — see .github/dependabot.yml for
        # why, and for what keeps the pin from rotting. This one is a third-party action rather than
        # a first-party `actions/*` one, which makes the pin matter more rather than less.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api-level || '34' }}
          # `google_apis` rather than the bare `default` image: the probes touch Play-services-shaped
          # APIs on some paths, and google_apis is the image that has them without pulling in the
          # Play Store (which needs a different, slower image and a signed-in account).
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          # No window, no audio, no boot animation, no camera, and NO SNAPSHOT EITHER WAY. The two
          # snapshot flags are the ones that matter for a job that runs once on a fresh runner:
          # writing a snapshot at the end costs minutes and nothing will ever read it, and loading
          # one that does not exist is a boot path with its own failure modes.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -no-snapshot-load -camera-back none -camera-front none
          disable-animations: true
          working-directory: android
          # `:app:connectedDebugAndroidTest` and not `connectedAndroidTest`: the latter runs every
          # variant, and this project only ever needs the debug one — release is signed with a key
          # CI does not hold.
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain --stacktrace

      - name: Upload the instrumented-test results
        # `always()`: a red run is precisely when the HTML report and the per-test XML are worth
        # reading, and a run that fails during the emulator boot still produces the directory (empty
        # or partial), which `if-no-files-found: warn` lets through rather than replacing the real
        # error with a missing-artifact one. Same reasoning as android-build.yml's unit-test upload.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumented-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
