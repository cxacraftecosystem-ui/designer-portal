name: Android instrumented tests

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: "Android API level to run the emulator at (e.g. 37.0)"
        type: string
        default: "37.0"

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: connectedDebugAndroidTest on an emulator (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Replace the runner's SDK command-line tools with the newest release
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;23.0" > /dev/null
          rm -rf "$sdk/cmdline-tools/latest"
          mv "$sdk/cmdline-tools/23.0" "$sdk/cmdline-tools/latest"
          grep '^Pkg.Revision=' "$sdk/cmdline-tools/latest/source.properties"

      - name: Ensure the required Android SDK packages are installed
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Fetch the vendored sherpa-onnx AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aar="app/libs/sherpa-onnx-static-link-onnxruntime-1.13.8.aar"
          sha="b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471"
          mkdir -p app/libs
          "$GITHUB_WORKSPACE/scripts/ci/fetch_release_asset.sh" k2-fsa/sherpa-onnx v1.13.8 sherpa-onnx-static-link-onnxruntime-1.13.8.aar "$aar" "$sha" 38691998 555212241
          echo "$sha  $aar" | sha256sum -c -
          test "$(stat -c%s "$aar")" = "38691998"

      - name: Stage the pinned speech model for the engine probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="sherpa-onnx-omnilingual-asr-1600-languages-300M-ctc-int8-2025-11-12"
          tarball="$RUNNER_TEMP/$name.tar.bz2"
          "$GITHUB_WORKSPACE/scripts/ci/fetch_release_asset.sh" k2-fsa/sherpa-onnx asr-models "$name.tar.bz2" "$tarball" cdcd0559c7c73efed54209a926e321afc914d046c5fdbf3665f00dc78180e5ed 292571207
          echo "cdcd0559c7c73efed54209a926e321afc914d046c5fdbf3665f00dc78180e5ed  $tarball" | sha256sum -c -
          test "$(stat -c%s "$tarball")" = "292571207"
          tar -xjf "$tarball" -C "$RUNNER_TEMP"
          rm "$tarball"
          stage="$RUNNER_TEMP/dwasr"
          mkdir -p "$stage/wav"
          mv "$RUNNER_TEMP/$name/model.int8.onnx" "$RUNNER_TEMP/$name/tokens.txt" "$stage/"
          find "$RUNNER_TEMP/$name" -name '*.wav' -exec mv -t "$stage/wav/" {} +
          ls -lR "$stage"

      - name: Build the app and test APKs before the emulator boots
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --stacktrace

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          API_LEVEL: ${{ inputs.api-level || '37.0' }}
          SHARD: ${{ matrix.shard }}
        with:
          api-level: ${{ inputs.api-level || '37.0' }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -no-snapshot-load -camera-back none -camera-front none
          disable-animations: true
          disk-size: 8G
          ram-size: 4096M
          working-directory: android
          script: |
            grep -Fx "target=android-$API_LEVEL" "$ANDROID_AVD_HOME/test.ini" || { echo "::error::The AVD was not created for API $API_LEVEL: $(grep '^target=' "$ANDROID_AVD_HOME/test.ini")"; exit 1; }
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" push "$RUNNER_TEMP/dwasr" /data/local/tmp/
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" shell chmod -R 755 /data/local/tmp/dwasr
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" logcat -G 16M || true
            ./gradlew :app:connectedDebugAndroidTest --console=plain --stacktrace -Pandroid.testInstrumentationRunnerArguments.numShards=2 -Pandroid.testInstrumentationRunnerArguments.shardIndex="$((SHARD - 1))" || echo "$?" > "$RUNNER_TEMP/connected-exit"
            mkdir -p app/build/outputs/androidTest-results && "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" logcat -d -v time -s DWASRPROBE DWICPROBE DWXFERPROBE DWTIERPROBE DWPACKPROBE DWTIER2PROBE TestRunner AndroidRuntime DEBUG libc > app/build/outputs/androidTest-results/probes-logcat.txt || true
            test ! -e "$RUNNER_TEMP/connected-exit"

      - name: Fail unless instrumented tests ran, and none failed
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          report = pathlib.Path("app/build/reports/androidTests/connected/debug/index.html")
          if not report.is_file():
              print(f"::error::{report} was not written, so this run says nothing about the tests.")
              sys.exit(1)
          html = report.read_text(encoding="utf-8", errors="replace")

          def count(label):
              m = re.search(r'<div class="counter">([0-9,]+)</div>\s*<p>%s</p>' % label, html)
              return int(m.group(1).replace(",", "")) if m else None

          tests, failures, skipped = count("tests"), count("failures"), count("skipped")
          line = f"Instrumented tests: {tests} in the report, {failures} failed, {skipped} skipped."
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
          if None in (tests, failures, skipped):
              print(f"::error::The counters in {report} could not be read; its layout has changed.")
              sys.exit(1)
          if tests - skipped <= 0:
              print("::error::No instrumented test executed. The emulator step's log names the device "
                    "error (an install that failed, a device that went away); the task does not fail on it.")
              sys.exit(1)
          probes = pathlib.Path("app/build/outputs/androidTest-results/probes-logcat.txt")
          unmeasured = [line.split("): ", 1)[-1][:160] for line in
                        (probes.read_text(encoding="utf-8", errors="replace").splitlines() if probes.is_file() else [])
                        if "NOT STAGED" in line]
          if unmeasured:
              note = f"{len(unmeasured)} probe(s) passed without measuring anything: " + " | ".join(unmeasured)
              print(f"::warning::{note}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(note + "\n")
          if failures:
              print(f"::error::{failures} instrumented test(s) failed; see the android-instrumented-results artifact.")
              sys.exit(1)
          PY

      - name: Upload the instrumented-test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-results-shard-${{ matrix.shard }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
