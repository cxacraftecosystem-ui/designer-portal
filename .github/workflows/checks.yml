name: Checks

# ─── WHAT THIS EXISTS TO STOP ────────────────────────────────────────────────────────────
# Until this file landed, a pull request that touched only `backend/` and `frontend/` started
# NO WORKFLOW AT ALL. The workflows beside this one are NAMED here rather than counted, because a
# count is the one fact in this header that a new file falsifies silently and nobody re-reads:
# deploy-backend.yml fires on `push: main` and deploy-frontend.yml on `workflow_run` after it, so
# neither can run on a pull request at all; android-build.yml does carry a `pull_request` trigger,
# but path-filtered to `android/**` and its own workflow file; and keep-supabase-active.yml is a
# nightly cron that pings Postgres so the free tier does not idle out, asserting nothing about the
# code. So every guard this repository has written for the server and the web ran only when a
# human remembered to type the command.
#
# That is not an abstract gap. The carry rules exist because a stage row that points at an
# artisan has to copy that artisan's values at SAVE time, and the table saying WHICH values move
# is written out three times: `REFERENCE_HYDRATION` in the backend, `DW_REFERENCE_HYDRATION`
# hand-copied into `frontend/lib/designWorkshops.ts`, and — on Android — nothing, because
# `DwReferenceField` reads the server's table off the shipped `design-workshop-schema.json`.
# Android therefore CANNOT drift, and Android was the one surface with a CI job. The two copies
# that can drift were the two with no automation. Widen the server's table, forget the web's,
# and `test_the_web_carries_the_same_hydration_table` is what catches it — a test nothing ran.
# The failure it prevents is not a blank box: for the `existingProduct` shape the web table is
# explicit about, `data.name` under `artisanRef` is the ARTISAN's name, so a wrong entry writes
# a person's name into a product column, only-fill-blanks then refuses to correct it at save,
# and the .docx handed to a ministry officer names a person in its product table.
#
# `test_controlled_vocabularies.py` is in the same unrun suite and carries the OTHER guard worth
# naming here: `test_the_bundled_android_asset_is_the_registry_it_claims_to_be` is the only thing
# anywhere that checks the shipped `android/app/src/main/assets/design-workshop-schema.json`
# still equals `registry_to_dict()`. A `stage_definitions` edit that does not regenerate the
# asset is otherwise completely invisible until a handset in a village renders the wrong form.
#
# ─── THIS WORKFLOW RUNS. IT DOES NOT, BY ITSELF, GATE ANYTHING ───────────────────────────
# Nothing in `.github/` can prove a job BLOCKS a merge or a deploy: required status checks live in
# the repository's branch-protection settings, not in a workflow file. Read a green Checks tick as
# "the guards were asked", not as "main is protected" — the header above says at length what this
# stops, and this paragraph exists because saying that without saying this misleads.
#
# Two specific things it does NOT do. It does not block a merge unless `Backend tests`, `Web
# typecheck, lint and unit specs` and `Docs check` are named as required checks on `main`. And it
# does not block a deploy FROM HERE: deploy-backend.yml fires on its own `push: main` trigger and
# one workflow cannot `needs:` a job in another. A `needs:` inside deploy-backend.yml was considered
# and rejected — that workflow never fires on a pull request, which is where the drift these jobs
# catch is introduced, so it would have gated the wrong half. See docs/CI.md §5.
#
# 2026-09-03: THE SECOND OF THOSE USED TO END "so on main the two RACE", AND IT NO LONGER DOES —
# the race is closed from the OTHER end, which is why nothing in this file changed. The deploy
# usually WON that race (an rsync starts faster than minutes of pytest), so the ordinary case was a
# breaking commit reaching production and the red tick arriving after, on a run nobody was watching.
# Both deploy stages now carry a `wait-for-checks` job that POLLS for the Checks run at the exact
# SHA being shipped and refuses to hand over until the three jobs named above are green:
# deploy-backend.yml gates a push that touches backend/, and deploy-frontend.yml gates a
# frontend-only one — the case the backend's copy structurally cannot see, because a backend run
# with nothing to deploy correctly waits for nothing. This file is still only the RUNNER of the
# guards; the gate lives in the two workflows that ship. If the three names above are renamed, both
# waits go RED with a message saying so rather than silently matching nothing.
#
# ─── WHY NO `paths:` FILTER ──────────────────────────────────────────────────────────────
# Deliberate, and it is the specific mistake this file was written to not repeat. A path filter
# is how android-build.yml ended up unreachable from a backend PR. The three jobs below are
# cheap and independent; a filter would buy a few minutes and cost the property that makes this
# workflow worth having — that EVERY pull request runs it. Do not add one.
#
# ─── EVERY `uses:` IS A COMMIT SHA, SINCE 2026-09-03 ─────────────────────────────────────
# `actions/checkout@v4` is a MUTABLE tag: whoever controls that repository can move it, and the
# next run of this workflow then executes different code with the same line in the diff. That is
# the supply-chain shape that has compromised other projects' CI, and the cost of closing it is
# unreadable `uses:` lines — so the human tag is kept in a trailing comment and the SHA is what
# runs. `.github/dependabot.yml` is what keeps them from rotting; read its header before bumping
# one by hand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Safe to cancel, unlike the deploy workflows: nothing outside the runner is mutated here, and
  # a superseded commit's result is noise. Keyed per PR (or per branch on a push) so two open PRs
  # never cancel each other.
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════
  # 1 · The backend suite
  # ═══════════════════════════════════════════════════════════════════════════════════════
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # ─── THE DATABASE, AND WHY THESE VALUES LOOK LIKE THAT ───────────────────────────────
    # THERE IS NO DATABASE IN THIS JOB AND THERE MUST NOT BE ONE. Twenty-six test modules under
    # backend/tests/ gate themselves on the DSN naming `localhost` or `127.0.0.1`, and that gate
    # is not fussiness: those tests create users, workshops and stage entries and delete them
    # again, so pointing them at any database that is not a scratch one is how field data gets
    # destroyed. The DSN below names `ci.invalid` — RFC 2606 reserves `.invalid` precisely so it
    # can never resolve — which means the gate reads "not local", every database-backed test
    # skips BY DESIGN, and nothing can accidentally connect to anything even if a gate is wrong.
    #
    # It is set at all only because `app.core.config.Settings` declares DATABASE_URL, JWT_SECRET,
    # the three AWS values and MASTER_ADMIN_EMAIL as REQUIRED fields, with `.env` (absent here —
    # it is gitignored) as their only other source. With them unset `Settings()` refuses to build,
    # and a plain `pytest` in this job dies with 70 COLLECTION ERRORS rather than skipping: among
    # them `test_reference_carry.py`, which is the entire carry-fidelity suite and the main reason
    # this workflow exists. Measured on this tree, not assumed — `pytest --collect-only` with a
    # completely empty environment collects 1244 tests and ERRORS ON 70 MODULES; with the
    # placeholders below it collects the whole suite and errors on none. "Leave DATABASE_URL unset"
    # was the first thing tried here, and that is what it does.
    #
    # So these are placeholders that let the pure-Python suite IMPORT, and every one of them is
    # chosen to be unusable: an unresolvable host, a secret that is obviously not a secret, an
    # `.invalid` address. Do not "improve" any of them into something real, and do not add a
    # Postgres service container — a database here would silently promote twenty-six modules from
    # "skipped by design" to "running against whatever CI happens to have", which is a different
    # suite with different failure modes, unreviewed.
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://ci:ci@ci.invalid:5432/no_such_database"
      JWT_SECRET: "ci-placeholder-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.12 because that is what the EC2 box runs (`python3.12 -m venv .venv` in
          # deploy-backend.yml). A test suite that passes on a version production does not have
          # is a weaker statement than it looks. pyproject allows >= 3.11.
          python-version: "3.12"
          cache: pip
          # Both files, since 2026-09-03: the lock is what decides the installed set now, and a
          # cache keyed only on pyproject would be reused across a lock refresh that changed every
          # pin. pyproject stays in the key because it is still what a refresh is compiled FROM.
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend and its test extras
        # `[dev]`, not a bare install: pytest-asyncio lives there, and `asyncio_mode = "auto"` is
        # INERT without it — pytest collects the async tests, finds no runner, warns, and reports
        # green. That has already happened once on this project (see the note beside the pin in
        # pyproject.toml), and it would happen here in the one place nobody is watching the output.
        #
        # 2026-09-03: THE INVOCATION CHANGED AND THE ARGUMENT ABOVE DID NOT. `backend/requirements.lock`
        # is compiled from this pyproject WITH the dev extra (`pip-compile --extra dev`), so
        # pytest-asyncio is still installed here and the paragraph above still describes why it must
        # be — the lock is now the thing that guarantees it rather than the `[dev]` marker on the
        # command line. What the lock buys is that CI, the EC2 box and a developer's venv resolve to
        # the SAME versions: before it, three machines each took whatever the index offered that day,
        # which is how an unpinned transitive dependency turns a green branch red overnight with no
        # commit behind it. `--no-deps` on the editable install is what keeps the lock authoritative:
        # without it pip re-resolves this project's own declared ranges and can quietly lift a pin.
        #
        # REFRESH IT DELIBERATELY, NEVER AS A SIDE EFFECT. It is compiled in a container so the
        # Python that resolves it is the Python that runs it (3.12 — the local venv on the machine
        # this was written from is 3.14, and a lock compiled there would carry that interpreter's
        # markers into production):
        #
        #   docker run --rm -v "$PWD/backend:/w" -w /w python:3.12 sh -c \
        #     "pip install -q pip-tools && pip-compile -q --strip-extras --extra dev \
        #      --output-file requirements.lock pyproject.toml"
        #
        # `--extra dev` AND NOT `--all-extras`: `ai-local` pulls rembg and onnxruntime, ~400 MB of
        # wheels that backend/pyproject.toml explicitly says must not be installed on the t3.micro.
        # Measured on the way in — `--all-extras` produced a lock with onnxruntime, rembg, numpy and
        # scipy in it, and this line is the correction.
        #
        # DO NOT PASTE THE COMMAND FROM THE LOCK'S OWN HEADER. pip-compile writes `--no-index` into
        # that header to record that no index URL was emitted into the file; passing it for real
        # tells pip to resolve against no index at all and the refresh fails.
        # docs/CI.md carries the same procedure in prose.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Generate the Prisma client
        # `from prisma import Prisma` in app/core/db.py resolves against code that `prisma
        # generate` writes into the installed package; without this step every module that
        # reaches app.core.db fails to import. It talks to the schema and to the engine download,
        # NOT to a database — no migration runs and nothing connects.
        run: python -m prisma generate --schema prisma/schema.prisma

      - name: Run the suite
        # THE WHOLE SUITE, not a hand-written selection, and that is the point: a `-k` expression
        # is a list that goes stale the day somebody adds a file, and the guards this workflow
        # exists for are exactly the kind nobody remembers to add to a list. The database-backed
        # modules take themselves out via the gate described in the `env:` block above, so "what
        # runs here" is decided by the tests themselves rather than by this file.
        #
        # NO `-q`, AND THAT IS THE POINT OF THE FLAGS RATHER THAN A TASTE IN LOG VOLUME. This step
        # ran `-q -rf` for its whole first life, and under `-q` pytest drops verbosity to -1 and
        # `TerminalReporter.pytest_sessionstart` returns before `_write_report_lines_from_hooks`, so
        # `conftest.pytest_report_header` — the one line this comment used to promise was here,
        # saying whether the database-backed tests ran or skipped — was never printed at all. Back
        # then that hook was the only one, so `-q` left the log as dots and a bare count: the reader
        # was left with exactly the skip number the sentence was written to replace, which is this
        # repository's own named failure mode — a green skip that cannot be told apart from a test
        # nobody ever wrote. Since `pytest_terminal_summary` landed there is a second copy at the
        # foot that `-q` cannot touch, so what `-q` costs TODAY is narrower and is measured below;
        # the flag is still wrong here, and the gate at the end of this step is what enforces that
        # rather than this paragraph.
        #
        # `-rf`, AND THE MISSING `s` IS THE POINT. Skips are already reported, grouped by reason, by
        # `pytest_terminal_summary` in backend/tests/conftest.py, and asking pytest for them as well
        # reproduces precisely the output that hook was written to replace: measured 2026-08-20 with
        # this env block, the run skips 381 tests and `-rfs` spends 360 SKIPPED lines restating them
        # one location at a time. It also puts them in the wrong place, which is the half that is
        # not obvious. Pluggy calls the LAST-registered `pytest_terminal_summary` first, and a
        # conftest is registered after pytest's own TerminalReporter, so anything a `-r` flag
        # summarises prints BELOW the conftest tally, not above it. In that measured log the wall of
        # SKIPPED lines starts at the summary section and runs unbroken down to the final status
        # line — over half the log — so the `database:` sentence and the breakdown sit on top of it,
        # in a log everybody opens at the bottom. NO ABSOLUTE LINE NUMBERS HERE, and there were some:
        # this paragraph gave "line 209 of 595 … from 235", and re-measuring the same command the
        # same day gave 245 of 633. Every test added and every failure traceback moves them, which is
        # exactly the rot the rest of this file argues against. Measured both ways
        # on tests/test_conftest_database_gate.py too: under `-rfs` the tally prints first and
        # pytest's own SKIPPED summary after it. `-rf` puts its FAILED lines under the tally by the
        # same ordering — measured, with a failure forced into that file — but that is one line per
        # failure, which is a list worth reading rather than a wall, and it is the one thing a
        # reader scrolling to the bottom of a red log came for.
        #
        # If `s` is ever wanted back it goes INSIDE THIS FLAG — `-rfs`, never `-rf -rs`. A second
        # `-r` REPLACES the first rather than adding to it; measured here, `pytest -rf -rs` on a run
        # with a failure and a skip prints the SKIPPED lines and silently drops the FAILED ones.
        # Spelling it as one flag is the difference between a summary that names the failures and
        # one that hides them.
        #
        # The grep below is a gate, not decoration, and it COUNTS rather than matching once. Both
        # hooks print the same sentence — `pytest_report_header` at the top, `pytest_terminal_summary`
        # at the foot, from one `_gate_sentence` so they cannot drift — and `grep -q` was satisfied
        # by either, which made this step's promise to go red on a deleted hook false: delete
        # `pytest_terminal_summary`, lose the skip tally that makes 381 readable, and the header copy
        # still matched, green. Demanding two is the only way to tell them apart.
        #
        # That also makes `-q` incompatible with this step, deliberately. Under `-q` the header hook
        # is never written at all (see the paragraph above), so the count drops to exactly one and
        # this step goes red — measured 2026-08-20, `python -m pytest
        # tests/test_conftest_database_gate.py -rf -q --durations=15` prints the `database:` sentence
        # ONCE and the identical command without `-q` prints it TWICE, which is this gate's own
        # negative control.
        #
        # WHAT `-q` COSTS IS THAT HEADER SENTENCE AND NOTHING ELSE OF THIS STEP'S OUTPUT, and an
        # earlier version of this paragraph said it cost "the tally and the durations", which is
        # false and contradicted the conftest docstring in the same change. Both survive any
        # verbosity: `terminalreporter.write_line` is unconditional, and the durations report is not
        # verbosity-gated either. Measured the same day, that `-q` run still prints `skipped 1 tests,
        # by reason:` with its breakdown and a `slowest 15 durations` section, and `python -m pytest
        # tests/test_reference_carry.py -rf --durations=5` prints five real duration rows with and
        # without `-q` alike. The tally surviving is precisely WHY the grep below has to count to
        # two: with one hook silenced the other still matches, so matching once could never notice.
        # pytest's pass/fail verdict is carried across the check in `status`, so
        # the grep can only ADD a failure, never mask one: a red suite is still what the job reports.
        #
        # MEASURED, not estimated, 2026-08-20 on this tree: this step's own invocation, `python -m
        # pytest -rf --durations=15` from backend/ with exactly the environment of the `env:` block
        # and no database anywhere — 2892 passed, 381 skipped, 2 xfailed, 0 failed, 353 s. The
        # `-rfs` re-run started the moment it finished, which is where the 360-line figure was counted,
        # gave 2890 passed, 381 skipped, 2 xfailed, 274 s and 2 FAILED in test_measurement_provenance
        # that another workstream had landed in between — see the warning at the foot of this comment
        # before you read a failure here as yours. `-r` decides what the summary section prints and
        # nothing about what runs, so the flag is not what moved the pass count; the tree moved.
        # THAT IS THE POINT OF WRITING THEM DOWN AT ALL. They are a snapshot of a healthy run, NOT a
        # target: totals move the day anybody adds a test, the wall-clock pair was taken on a
        # developer laptop with other work running on it and predicts nothing about a runner, and
        # reconciling a CI log against a number typed into a comment is how people learn to argue
        # with the log.
        #
        # THE SKIP COUNT IS THE ONE TO WATCH, and the terminal summary breaks it down by reason so
        # the watching is possible rather than a matter of trust. The two lines that carry it,
        # verbatim from the `-rf` run above and identical in the `-rfs` one:
        #         339 × needs a LOCAL database; refuses to run against a remote DATABASE_URL
        #          36 × needs a LOCAL database
        # So 375 of the 381 are the database gate. The other six each print their own line and are
        # deliberately not pasted here — one of them is a whole paragraph about st_ctime on Windows,
        # and copying it in is how this comment would start rotting again. If the 375 collapses
        # toward zero without the `database:` sentence changing, a gate has been inverted and this
        # job is quietly running far less than its green tick claims.
        #
        # ONE WARNING ABOUT A RED RUN HERE, learned the expensive way on a tree several workstreams
        # were editing at once: this job runs the WHOLE suite, so a failure it reports is not always
        # a defect in the file you touched. The same invocation once reported failures in
        # test_entry_provenance.py and test_reference_carry.py that both modules passed when run
        # alone — cross-module pollution from in-flight work, which no workflow file can fix. Run the
        # named module by itself before you believe the attribution; believe the verdict either way.
        run: |
          set -uo pipefail
          status=0
          if ! python -m pytest -rf --durations=15 | tee pytest-output.log; then
            status=1
          fi
          # Two, not one: the header hook and the terminal-summary hook each print the sentence, and
          # matching once would let either be deleted unnoticed. See the comment above. Counted into
          # a variable with a `:-0` default so a MISSING log reads as zero and goes red — `[ "" -lt
          # 2 ]` is a shell error, and a shell error inside `if` is a FALSE condition, i.e. a gate
          # that passes exactly when it has nothing to check.
          sentences=$(grep -c '^database: ' pytest-output.log || true)
          if [ "${sentences:-0}" -lt 2 ]; then
            echo "::error::conftest printed its 'database:' line fewer than twice, so one of the two hooks has been deleted, renamed, or silenced by a verbosity flag. Both must reach the log — pytest_report_header at the top, pytest_terminal_summary with the skip tally at the foot. See backend/tests/conftest.py."
            exit 1
          fi
          exit "$status"

      - name: Prove the database gate on a runner that has only a dotenv
        # THE FOUR TESTS IN test_conftest_database_gate.py HAVE NO TEETH IN THE STEP ABOVE, and this
        # step is what gives them some. The job exports a placeholder DATABASE_URL (it has to — see
        # the `env:` block), so up there a module-scope `os.environ` read finds a DSN whether or not
        # the conftest published one, and the two tests that measure the publish either pass
        # vacuously or skip themselves outright. The accident they guard — twenty-six modules whose
        # gate is correct only because an `app.…` import happens to sit above it and load `.env` as
        # a side effect — lives on a machine where the DSN exists ONLY in `backend/.env`. So this
        # step builds that machine: blank the exported DSN, write a `.env`, and run from the
        # REPOSITORY ROOT, which is also the only invocation that reaches `_dotenv_database_url` at
        # all (both real loaders are CWD-relative and find nothing from here).
        #
        # It found a live bug the first time it was run, which is the argument for keeping it: the
        # publish was `os.environ.setdefault`, and setdefault tests key PRESENCE, so a DATABASE_URL
        # exported as an empty string left the key set, the publish a no-op, and every gated module
        # reading "". See the note beside the publish in conftest.py.
        #
        # ONLY THAT ONE FILE RUNS HERE, and that is a safety property, not tidiness. The `.env`
        # written below names a loopback DSN, so `HAS_LOCAL_DATABASE` is TRUE for the duration —
        # pointing the whole suite at it would promote all twenty-six database-backed modules from
        # "skipped by design" to "connecting to whatever is on 127.0.0.1 of a CI runner". Do not
        # widen the path below. The trap removes the file even if pytest fails, so the step above
        # (which runs first, and must keep seeing no `.env`) is unaffected either way.
        #
        # THIS IS THE ONE STEP IN THIS FILE THAT MUST NOT BE PASTED INTO A DEVELOPER'S TERMINAL, and
        # the `[ -e backend/.env ]` refusal below is what enforces that rather than this sentence.
        # On a runner the file is gitignored and absent, so writing it and trapping it away costs
        # nothing. On a machine that has one it is somebody's real credentials — 17 KB of them on
        # this project's own laptop, recoverable from nowhere — and `act`, or copying the run block
        # to reproduce a failure, is all it takes to lose them. Note the order: the check happens
        # BEFORE `trap` is armed, so a refusal cannot delete the file it just refused to overwrite.
        #
        # `-rf` here for the same reason as the step above, and there is nothing for an `s` to
        # summarise anyway: with DATABASE_URL blanked, `DATABASE_URL_WAS_EXPORTED` is False, so the
        # export-detection test that skips up there runs down here. Measured against an equivalent
        # loopback `.env`: 4 passed, 0 skipped.
        working-directory: .
        env:
          # YAML cannot unset a job-level variable, and it does not need to: every read of this in
          # the resolution path is a truthiness test, so "" is indistinguishable from absent there.
          # Proving that is half the point of the step.
          DATABASE_URL: ""
        run: |
          set -euo pipefail
          if [ -e backend/.env ]; then
            echo "::error::backend/.env already exists, and this step overwrites it and then deletes it. On a runner that file is gitignored and cannot be there, so you are almost certainly running this workflow locally (act, or a copy-pasted run block) against real secrets. Refusing before touching it."
            exit 1
          fi
          trap 'rm -f backend/.env' EXIT
          echo 'DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/nothing_is_listening' > backend/.env
          python -m pytest backend/tests/test_conftest_database_gate.py -rf

      - name: Lint the backend with ruff
        # ─── WHAT WAS WRONG UNTIL THIS STEP EXISTED ──────────────────────────────────────
        # `backend/pyproject.toml` has carried a full `[tool.ruff.lint]` rule set — every family
        # selected by name, every exclusion argued out in a comment beside it — and
        # `ruff` has been in the `[dev]` extra, installed into every venv and onto this runner by
        # the step above. NOTHING HAS EVER RUN IT. The web half of this workflow gates on both a
        # typechecker and a linter; the server half gated on tests alone, so the entire lint
        # configuration was a document rather than a check.
        #
        # ─── WHY IT IS THE LAST STEP, AND WHY IT RUNS ANYWAY ─────────────────────────────
        # `!cancelled()` rather than the default, and the ordering is the reason. ruff takes about
        # a second and the suite above takes minutes, so putting the fast check first is the
        # obvious arrangement — and it is the wrong one here: a step that fails stops the job, so
        # a single unsorted import would abort before pytest ran and the pull request would learn
        # nothing about whether the tests pass. Last-plus-`!cancelled()` is the arrangement where
        # NEITHER failure can hide the other: a red suite still gets a lint verdict, a lint
        # finding still leaves the suite's own verdict in the log above it, and both are reported.
        # `!cancelled()` and not `always()` so that a cancelled run (the `concurrency` block at the
        # top of this file cancels superseded commits) does not spend a runner on it.
        #
        # ─── IT MUST BE ABLE TO FAIL, AND THAT IS NOT DECORATION ─────────────────────────
        # No `continue-on-error`, no `--exit-zero`, and the gating invocation is the one whose
        # status is carried to `exit`. There IS a `|| true` below and it is deliberately on the
        # OTHER invocation — `--statistics` is the human-readable tally printed after the verdict
        # has already been decided, and it must not be able to change it in either direction.
        #
        # The alternative was live in this repository to read: `.github/workflows/android-build.yml`
        # carries `continue-on-error: true` on its Android Lint step, for the honest reason written
        # beside it — the tree has a pre-existing manifest error, so a hard gate "would fail 100% of
        # runs from day one and train everyone to ignore red". That reasoning applied here too: this
        # tree had 51 ruff findings when this step was written (measured 2026-08-22, ruff 0.16.1).
        # The difference is what was done about it: a `continue-on-error` cannot shrink and nothing
        # tells you when it could be removed, whereas the dated per-file baseline in
        # backend/pyproject.toml names every finding that is left, one file at a time, so each is a
        # one-line deletion when it is fixed and a new one cannot slip in beside it.
        #
        # ─── THE FILE COUNT IS A GATE, NOT A LOG LINE ────────────────────────────────────
        # `ruff check .` reports success just as cheerfully over nothing as over the whole tree,
        # so an `exclude` entry, a renamed directory or a `paths` mistake could turn this step
        # permanently green while checking zero files, and nothing in a green log would say so.
        # The floor below is what stops that. It is a FLOOR, not a target, and the difference
        # matters: `ruff check . --show-files` from backend/ listed 289 paths when this step landed
        # and 290 a few hours later on the same working tree, because concurrent work keeps adding
        # files (the paths are app, tests, scripts, tools and pyproject.toml itself; `.venv` is
        # excluded by ruff's own defaults and does not exist on a runner anyway). A gate on the
        # exact count would go red every time somebody adds a module. 200 is far enough below that
        # number that ordinary growth and ordinary deletion never touch it, and far enough above
        # zero that losing a whole directory does.
        #
        # ─── WHAT THIS STEP DOES NOT LINT, SO A GREEN TICK IS NOT MISREAD ────────────────
        # backend/ and nothing else. Seven tracked Python files live outside it — four in
        # `scripts/`, two in `android/tools/`, one in `frontend/tools/` — and none of them is
        # checked here. They are not clean, which is why widening the invocation was not just a
        # longer command: MEASURED 2026-08-22 from the repository root,
        # `ruff check scripts android/tools frontend/tools --config backend/pyproject.toml` reports
        # 6 findings (1 RUF100, 3 UP020, 1 B904, 1 RUF021), so adding them would ship a gate that is
        # red on day one — the exact outcome the baseline in backend/pyproject.toml exists to avoid,
        # and those three trees are nobody's baseline to write from here. So the scope is stated
        # instead of quietly assumed: green here means backend/ is clean, NOT that the repository's
        # Python is.
        #
        # ─── IF THIS GOES RED ────────────────────────────────────────────────────────────
        # Run `ruff check .` from backend/, or read the findings this step printed in the log above.
        # Most of the rule set is safely auto-fixable — `ruff check --fix .` — but read the diff
        # before committing it: RUF100's fix deletes the ENTIRE comment it lives on, prose and
        # all, which is measured and written up beside `external` in backend/pyproject.toml.
        # DO NOT make this green by adding to `ignore` in that file. There is a dated, per-file
        # baseline in `[tool.ruff.lint.per-file-ignores]` for findings that are real and unfixed;
        # it is meant to shrink, and its header says what belongs in it.
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          files=$(ruff check . --show-files | wc -l)
          echo "$(ruff --version) over ${files} files under backend/"
          if [ "${files:-0}" -lt 200 ]; then
            echo "::error::ruff found only ${files} files to check under backend/, which is far below the 289 measured when this step landed. Something — an exclude, a rename, a bad working directory — has emptied the run, and a green tick here would be meaningless. See the comment on this step."
            exit 1
          fi
          status=0
          # `--output-format=github` so each finding is emitted as a GitHub workflow-command
          # annotation rather than a bare log line. WHETHER GITHUB THEN PINS IT TO THE DIFF IS NOT
          # CLAIMED HERE, because it was not measured on a runner: locally (ruff 0.16.1, 2026-08-22)
          # the emitter writes an ABSOLUTE path into the `file=` field (a `D:\...\backend\...` on
          # this machine), and GitHub documents that field as relative to the repository root.
          # Running the gate from the repository root as `ruff check backend` does NOT fix that:
          # measured, `file=` is absolute from there too and only the message text changes. So there
          # is no cheap rearrangement to buy the annotation with, the findings are in the log either
          # way, and the exit status below is what actually gates. It prints NOTHING on success,
          # which is why the file count above is echoed unconditionally: this step always says what
          # it did.
          if ! ruff check . --output-format=github; then
            status=1
          fi
          # Non-gating by design — see the comment above. A per-rule tally is what makes a red log
          # readable at a glance; it prints nothing when there is nothing to say.
          ruff check . --statistics || true
          exit "$status"

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # 2 · The web checks
  # ═══════════════════════════════════════════════════════════════════════════════════════
  web:
    name: Web typecheck, lint and unit specs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22 to match deploy-frontend.yml, which matches Vercel's current build image. A
          # typecheck that passes on a different major than the one that builds production is
          # not the check anybody thinks it is.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # `npm ci` only. NO `npx playwright install` — MEASURED: the selected specs run to
        # completion in 34 s with PLAYWRIGHT_BROWSERS_PATH pointed at an empty directory, because
        # not one of them asks for the `page` fixture; Playwright launches a browser lazily and
        # never gets asked to. Downloading Chromium would add about a minute to every run of this
        # job to serve nothing. If a spec ever does need one, the failure says exactly that
        # ("Executable doesn't exist… run npx playwright install"), which is a better signpost
        # than a browser sitting there letting a screen-driving spec time out against no server.
        run: npm ci

      - name: Typecheck
        # `next build` also fails on a type error, but only during the deploy — i.e. AFTER the
        # backend has already shipped. Running it here moves the answer to before the merge.
        run: npx tsc --noEmit

      - name: Lint
        # --max-warnings=0 on purpose: the config's warnings are the ones that describe real
        # accessibility and hook defects, and a warning nobody fails on is a warning nobody reads.
        # This passes on the tree it landed with; if it starts failing, something new was added.
        run: npx eslint . --max-warnings=0

      - name: Unit specs
        # ONLY the specs that need no dev server and no database. The rest of frontend/e2e/ signs in
        # against a real API and drives real records; standing the compose stack up on a runner is a
        # much larger job and a separate decision.
        #
        # `test:unit` in frontend/package.json is where the selection lives, and package.json cannot
        # hold a comment, so the reasoning is here. The rule is "every `*-unit.spec.ts`", because
        # that suffix is this repository's own convention for a spec that exercises a pure function
        # rather than a screen — `reference-hydration-unit.spec.ts` says so in its header ("PURE ON
        # PURPOSE, so this costs no dev server"). TWO FILES CARRY THE SUFFIX AND BREAK THE RULE, and
        # they are excluded by name rather than by hope:
        #   • access-refusal-unit.spec.ts        — page.route() stubs the API, but it still
        #   • login-credential-floor-unit.spec.ts  page.goto()s the real login screen.
        # MEASURED 2026-08-20 with nothing listening on :3000: the pattern WITHOUT the exclusion
        # fails exactly six tests — the four in access-refusal-unit.spec.ts and the two in
        # login-credential-floor-unit.spec.ts, every one of them inside `page.goto` with
        # `net::ERR_CONNECTION_REFUSED at http://localhost:3000/login` — and `npm run test:unit`,
        # which is that pattern minus those two files, is green. THE SIX IS THE FACT; the totals
        # either side of them are not. This paragraph carried "collects 556 … the 550 this step
        # actually runs" and the same two commands re-measured hours later collected 570 and ran 564,
        # because specs land in frontend/e2e/ continuously. The difference between the two patterns
        # is what decides whether a spec belongs in the exclusion list; neither total decides
        # anything.
        #
        # NO COUNT OR DURATION IS WRITTEN DOWN BEYOND THAT ONE MEASUREMENT OF THE EXCLUSION, on
        # purpose. Playwright prints "N passed" in this step's own log on every run, so a total kept
        # in a comment can only be wrong between edits — this paragraph has already carried "536
        # tests, 3 of them failing" past the day that stopped being true, which is worse than
        # carrying no number at all. android-build.yml's unit step takes the same line and prints its
        # file count at runtime.
        #
        # WHAT DOES BELONG HERE is the distinction that decides whether a new failure means "exclude
        # this spec". A failure inside `page.goto` — connection refused, or a navigation timeout
        # where something answers :3000 but does not serve — means the spec wants a dev server and is
        # misnamed. A failing `expect(source).toContain(…)` does NOT: those are source-inspection
        # assertions naming a symbol a component or `lib/designWorkshops.ts` is supposed to have,
        # nothing about a dev server would change the answer, and adding one to the exclusion list
        # would be silencing the check rather than scoping it.
        run: npm run test:unit

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # 3 · The documentation checks
  # ═══════════════════════════════════════════════════════════════════════════════════════
  docs:
    name: Docs check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Full history is NOT needed, but a git checkout is: check-docs shells out to
        # `git ls-files` to decide which paths a document is allowed to name.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify the documentation set
        # No `npm ci` anywhere: the script imports nothing outside node: builtins, deliberately,
        # so it can run from a bare checkout.
        #
        # WHAT FAILS HERE AND HOW TO FIX IT. The usual failure is not prose at all — it is
        # `docs/REPO_FACTS.md is out of date`, because that file is GENERATED from the repository
        # (model counts, endpoint counts, per-surface test counts) and any change to a route, a
        # Prisma model or the number of test files moves it. The fix is one command, and it is a
        # documented, reviewable diff rather than a number somebody retyped:
        #     node docs/tools/check-docs.mjs --write
        run: node docs/tools/check-docs.mjs

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # 4 · The container and Kubernetes packaging
  # ═══════════════════════════════════════════════════════════════════════════════════════
  #
  # NOTHING HERE DEPLOYS, AND NOTHING HERE IS MEANT TO. Production is one EC2 box behind nginx
  # behind CloudFront (docs/CI.md §0); the manifests under `infra/k8s/` have never been applied, and
  # the compute to run a cluster is not available. They stay unapplied on purpose.
  #
  # WHAT THIS JOB IS FOR: before it, no workflow in `.github/` mentioned docker, kubectl or
  # kustomize at all, so nineteen manifests and two Dockerfiles were carried by the repository with
  # nothing anywhere confirming they still parse. A kustomize overlay that stopped building, or a
  # `dockerfile:` path that a rename left dangling, would have been found by the first person to try
  # to use them — which, for a packaging nobody runs day to day, could be a year later and in the
  # middle of an incident. The whole job is seconds; the per-push half needs no daemon and no
  # cluster.
  #
  # It asserts SHAPE, not policy. The provider-name rule, the doc-set rules and the REPO_FACTS
  # counts all belong to `docs/tools/check-docs.mjs`, which already sweeps these files; a second,
  # stricter copy of that rule here would contradict it — `base/hpa.yaml` names the old provider
  # deliberately, dated, to say which figure the connection budget came from.
  packaging:
    name: Container and manifest packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The manifest tree must be present
        # CHECKED BEFORE THE BUILD, so a missing tree is reported as a missing tree rather than as
        # whatever kustomize says about it. Worth its own step for a reason particular to git: an
        # empty directory is not tracked, so `infra/k8s/base/` losing its contents produces four
        # deletions in a diff nobody is looking at and then nothing at all.
        run: |
          set -euo pipefail
          missing=0
          for f in infra/k8s/base/kustomization.yaml \
                   infra/k8s/overlays/dev/kustomization.yaml \
                   infra/k8s/overlays/staging/kustomization.yaml \
                   infra/k8s/overlays/prod/kustomization.yaml; do
            if [ ! -s "$f" ]; then
              echo "::error::${f} is missing or empty. docs/KUBERNETES.md documents this tree, and an empty directory is not tracked by git — it can go missing with no other symptom."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "manifest tree present: $(find infra/k8s -type f -name '*.yaml' | wc -l) files"

      - name: Every overlay must build, and must build something
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null 2>&1 || {
            echo "::error::kubectl is not on this runner image any more. Add azure/setup-kubectl before this step; do not delete the check."
            exit 1
          }
          for overlay in dev staging prod; do
            out="$(mktemp)"
            if ! kubectl kustomize "infra/k8s/overlays/${overlay}" > "$out"; then
              echo "::error::infra/k8s/overlays/${overlay} does not build."
              exit 1
            fi
            # A kustomize build over an empty resource list SUCCEEDS and emits nothing, so the
            # object count is the assertion and the exit code is not.
            objects="$(grep -c '^kind:' "$out" || true)"
            if [ "${objects:-0}" -lt 10 ]; then
              echo "::error::overlay ${overlay} built only ${objects:-0} object(s). Expected the base's ten plus the overlay's namespace and secret store."
              exit 1
            fi
            echo "${overlay}: ${objects} objects"
          done

      - name: The compose stack must still describe itself
        # `config` resolves interpolation and validates the file without building anything, so it
        # is cheap enough to run on every push — and it is what catches a `dockerfile:` pointing at
        # a path that no longer exists, or a profile typo. The service list is printed because the
        # compose file's header makes a PROMISE about it: a bare `up` starts three services and
        # everything added since sits behind a profile.
        run: |
          set -euo pipefail
          docker compose config --quiet
          echo "services a bare 'up' would start:"
          docker compose config --services | sort | sed 's/^/  /'

      - name: Build both images
        # MANUAL RUNS ONLY. Two image builds on every push is CI time nobody asked for, and nothing
        # deploys these images from here. Ask for it when you have changed a Dockerfile:
        #     gh workflow run Checks --ref <branch>
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile -t design-workshop-backend:ci .
          docker build -f frontend/Dockerfile -t design-workshop-frontend:ci \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000 .
          docker image ls --format '  {{.Repository}}:{{.Tag}}  {{.Size}}' \
            | grep -E 'design-workshop-(backend|frontend):ci'

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # 5 · The database-backed suite  (added 2026-09-03)
  # ═══════════════════════════════════════════════════════════════════════════════════════
  #
  # ─── THIS IS THE OTHER HALF OF JOB 1, NOT A REPLACEMENT FOR IT ───────────────────────────
  # Read job 1's `env:` block before touching this one. It argues, at length and correctly, that
  # THERE MUST BE NO DATABASE IN THAT JOB: twenty-six modules gate themselves on a loopback DSN
  # because they create and delete users, workshops and stage entries, and a DSN that resolves to
  # anything real is how field data gets destroyed. That argument stands and that job is unchanged.
  #
  # What it does NOT argue — and what was silently taken as read — is that those modules should
  # therefore never run ANYWHERE. Job 1's own comment records the number: 375 of its 381 skips are
  # the database gate. So on every pull request this repository has ever had, the suite that
  # exercises the actual round trips — the Craft round trip, the reference-carry hydration at SAVE
  # time, the permission refusals, the stage-entry provenance — was collected, counted as green and
  # not executed. A skip is not a pass, and 375 of them reported as a green tick is this project's
  # own named failure mode.
  #
  # This job runs them, against a Postgres that exists for ninety seconds and is thrown away. The
  # DSN is loopback, so `backend/tests/conftest.py`'s gate reads LOCAL and admits them — by design,
  # and that gate needs no change: it was always "a scratch database on this machine is fine", and
  # a service container is exactly that. `HAS_LOCAL_DATABASE` goes true, the remote-connection
  # refusal in conftest disarms itself, and the `database:` sentence at the head of the log reads
  # "local DSN resolved — database-backed tests WILL run" instead of the SKIP wording. That
  # sentence is how you tell at a glance which of the two jobs you are reading.
  #
  # ─── IT RUNS EVERYTHING, WHICH MEANS IT OVERLAPS JOB 1 AND THAT IS DELIBERATE ────────────
  # A `-k` selection of "just the database ones" is a list, and a list goes stale the day somebody
  # adds a file — the same argument job 1 makes for running the whole suite. So the ~2892 tests that
  # already pass up there pass again down here, costing runner time and buying one real thing:
  # cross-module pollution between a database-backed module and a pure one is only visible in a run
  # where both execute. Job 1 stays because it is fast, needs no service, and is the one that gates.
  #
  # ─── NOT A REQUIRED CHECK YET, ON PURPOSE ────────────────────────────────────────────────
  # Nothing in `.github/` can make a job required — that lives in branch protection — and this one
  # should NOT be added there until somebody has watched a few runs and knows what it costs and how
  # steady it is. A newly-required check that turns out to take twenty-five minutes, or to flake on
  # a service container that was slow to accept connections, trains people to merge past red. Let it
  # run advisory first; promote it when its history says it deserves it. `Backend tests`, `Web
  # typecheck, lint and unit specs` and `Docs check` remain the three named in job 1's header.
  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    # Generous, because it is the whole suite plus ~375 tests that have never run in CI and a
    # `prisma migrate deploy` of 73 migrations against a cold database. Measured on a laptop the
    # DB-less half alone is ~6 minutes; this has no measurement yet, which is the other reason it is
    # not a required check. A timeout is still set: a hung query against a service container would
    # otherwise burn the job's full six-hour default.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # 16 to match docker-compose.yml's `postgres:16-alpine`, so a test that passes here passes
        # on a developer's local stack. The managed production database is a different major, and
        # that gap is real but is not this job's to close: `prisma migrate deploy` is what says the
        # migrations apply, and it is the same migration set either way.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: design_workshop
        ports:
          # Published to the runner's loopback, which is where pytest and prisma both look. The
          # DSN below therefore says 127.0.0.1 and NOT `postgres` — a service container's DNS name
          # only resolves from inside another container, and a job whose steps run on the host would
          # fail to resolve it. It also has to say a loopback literal for conftest's gate to admit
          # anything at all.
          - 5432:5432
        # Without a health check the first step races the database's initdb and fails on "the
        # database system is starting up" — which reads as a broken migration rather than as a slow
        # container. GitHub holds the job until this passes.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUTF8: "1"
      # LOOPBACK, AND THAT IS THE ENTIRE DIFFERENCE FROM JOB 1. `ci.invalid` up there means "never
      # connect to anything"; this means "connect to the throwaway container beside this job". It is
      # created empty by the service, migrated by a step below, and destroyed with the runner.
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/design_workshop"
      # REAL-LOOKING RATHER THAN REAL, and it has to be real-LOOKING or nothing boots:
      # `app.core.security.verify_jwt_configuration` refuses to build the app for a secret under 32
      # characters or one on its placeholder list, and `create_app` calls it. So this is 43
      # characters of obviously-not-a-secret. It signs tokens for a database that will not exist in
      # half an hour. It is NOT a repository secret and must never become one: a value in a secret
      # cannot be read back to check, and this one has to be readable to be understood.
      JWT_SECRET: "ci-integration-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.12, matching production (`python3.12 -m venv` on the EC2 box) and job 1.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install from the lock
        # The same two lines as job 1 and as the EC2 deploy, so all three resolve to one set of
        # versions. See the long note on job 1's install step for why `--no-deps` is what keeps the
        # lock authoritative.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Fetch the Prisma engines and generate the client
        # TWO COMMANDS, IN THIS ORDER, AND THE ORDER IS COPIED FROM backend/Dockerfile's `prisma`
        # stage rather than invented here. `py fetch` downloads the standalone Rust query engine
        # that prisma-client-py talks to at run time; `generate` writes the models into the
        # installed `prisma` package, without which `from prisma import Prisma` raises "Client
        # hasn't been generated yet" and every module that reaches app/core/db.py fails to import.
        #
        # `py fetch` is the step that has failed silently on this project before — on Windows it has
        # exited 0 without placing the engines, which then reads as several hundred pytest defects
        # that are nothing of the kind. On Linux it is well-behaved, and the explicit fetch is here
        # so that a failure to obtain the engine is reported BY THE FETCH rather than by the first
        # test that tries to open a connection.
        #
        # PYTHONUTF8 is set at job level for parity with the rest of the repository; it is a Windows
        # concern and does nothing on a runner.
        run: |
          set -euo pipefail
          python -m prisma py fetch
          python -m prisma generate --schema prisma/schema.prisma

      - name: Apply the migrations to the service database
        # `migrate deploy`, never `migrate dev`. This repository hand-authors its migrations (see
        # backend/prisma/migrations/) and `dev` would try to author another one against a schema
        # drift it detected, interactively, on a runner with no terminal.
        #
        # This is also a real check in its own right and the reason it gets its own step: it is the
        # only place in CI where the 73-migration history is applied end to end onto an EMPTY
        # database. A migration that only works against a database that already has the previous
        # shape — a hand-written `ALTER` with no guard, a column added twice — passes on production
        # forever and fails exactly here, which is where it should fail.
        run: python -m prisma migrate deploy

      - name: Run the full suite against the database
        # THE WHOLE SUITE. Same reasoning as job 1's run step: what executes is decided by the tests
        # rather than by a selection in this file. The difference is that here the gate lets the
        # database-backed modules in, so this is the first CI job in this repository's history in
        # which they run at all.
        #
        # `-rf --durations=15` mirrors job 1 exactly, including the missing `s` — the conftest's own
        # `pytest_terminal_summary` already groups skips by reason, and `-rfs` would print a wall of
        # near-identical SKIPPED lines on top of it. There will still be skips here (the handful
        # that are not the database gate), and the tally is where to read them.
        #
        # NO `database:` SENTENCE GATE HERE, unlike job 1, and that is not an oversight: that gate
        # exists to catch a hook being deleted or `-q` being re-added, it is asserted once already
        # in a job that runs on every same event, and asserting it twice would just mean two red
        # ticks for one cause. What IS worth asserting here is the opposite property — that the gate
        # opened — because a job with a service container that silently reverted to skipping
        # everything would look identical to a green run. That is the grep below.
        run: |
          set -uo pipefail
          status=0
          if ! python -m pytest -rf --durations=15 | tee pytest-integration.log; then
            status=1
          fi
          # THE ASSERTION THAT THIS JOB DID ITS JOB. If the DSN stops resolving as local — a typo in
          # the service mapping, a conftest change, an env override — every database-backed module
          # skips again and the suite still reports green, which is precisely the "green skip that
          # cannot be told apart from a test nobody wrote" this repository refuses elsewhere.
          if ! grep -q '^database: local DSN resolved' pytest-integration.log; then
            echo "::error::conftest did not report a LOCAL database, so this job ran the same DB-less suite as 'Backend tests' and proved nothing extra. Check the postgres service, the port mapping and DATABASE_URL. See backend/tests/conftest.py::_gate_sentence."
            exit 1
          fi
          exit "$status"
