      - name: Generate the Prisma client
        run: python scripts/generate_prisma_client.py --schema prisma/schema.prisma

      - name: The other portal, for the shared-file parity tests
        working-directory: .
        env:
          PEER: cxacraftecosystem-ui/documentation-portal
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref=main
          if [ "$BRANCH" != "main" ] && git ls-remote --exit-code --heads "https://github.com/$PEER.git" "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          dest="$(dirname "$GITHUB_WORKSPACE")/${PEER#*/}"
          rm -rf "$dest"
          git clone --quiet --depth 1 --branch "$ref" "https://github.com/$PEER.git" "$dest"
          { echo "CROSS_PORTAL_PEER_REPO=$dest"; echo "SIBLING_REPO=$dest"; } >> "$GITHUB_ENV"
          echo "Shared files are compared with $PEER@$ref ($(git -C "$dest" rev-parse --short HEAD))."

      - name: The manifest, the schema fragment and the feature registry, in both portals
        run: |
          set -uo pipefail
          status=0
          python -m pytest -rs tests/test_questionnaire_parity.py tests/test_questionnaire_schema_parity.py             tests/test_questionnaire_feature_parity.py | tee parity.log || status=1
          if grep -q '^SKIPPED' parity.log; then
            echo "::error::a questionnaire parity check skipped; every one must run against the other portal here."
            exit 1
          fi
          exit "$status"

  questionnaire-unify:
    name: Questionnaire unify migration
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: design_workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/design_workshop"
      QUESTIONNAIRE_UNIFY_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/dr_unify"
      QUESTIONNAIRE_UNIFIED_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/dr_unified"
      JWT_SECRET: "ci-unify-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install from the lock
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Fetch the Prisma engines and generate the client
        run: |
          set -euo pipefail
          python -m prisma py fetch
          python scripts/generate_prisma_client.py --schema prisma/schema.prisma

      - name: Create the empty migration database
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE dr_unify'
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE dr_unified'

      - name: Dry run, apply, repeat, undo, deferred migrations
        run: |
          set -uo pipefail
          status=0
          python -m pytest -rs --durations=10 tests/test_questionnaire_unify.py tests/test_questionnaire_unified_authoring.py | tee unify.log || status=1
          if grep -q '^SKIPPED' unify.log; then
            echo "::error::the migration test skipped; QUESTIONNAIRE_UNIFY_DATABASE_URL must reach the empty database."
            exit 1
          fi
          exit "$status"

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck --version && shellcheck -x backend/deploy/blue_green.sh backend/deploy/test_blue_green.sh

      - name: Release logic against stubs
        run: bash backend/deploy/test_blue_green.sh

      - name: Backup freshness verdict against fixed clocks
        run: shellcheck -x scripts/ci/backup_freshness.sh scripts/ci/test_backup_freshness.sh && bash scripts/ci/test_backup_freshness.sh

  comment-stripper:
    name: Comment stripper
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install the frontend's TypeScript
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Self-test
        run: python scripts/tools/test_strip_comments.py -v

      - name: Stripped copies parse the same
        run: |
          python scripts/tools/strip_comments.py --out "$RUNNER_TEMP/stripped"
          node scripts/tools/verify_strip_ts.mjs "$RUNNER_TEMP/stripped"
          find "$RUNNER_TEMP/stripped" -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: No comments remain
        if: false
        run: python scripts/tools/strip_comments.py --check
