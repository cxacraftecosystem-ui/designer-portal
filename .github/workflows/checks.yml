          if-no-files-found: ignore

  web-v2-stack:
    name: Questionnaire client against a real stack
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: design_workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/design_workshop"
      JWT_SECRET: "ci-web-stack-not-a-secret-0123456789abcdef"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_S3_BUCKET: "design-workshop"
      AWS_S3_ENDPOINT: "http://127.0.0.1:9000"
      AWS_S3_PUBLIC_BASE_URL: "http://127.0.0.1:9000/design-workshop"
      AWS_REGION: "us-east-1"
      AWS_S3_SSE_ALGORITHM: ""
      QUESTIONNAIRE_V2: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend from the lock
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Prisma client and migrations
        run: |
          set -euo pipefail
          python -m prisma py fetch
          python scripts/generate_prisma_client.py --schema prisma/schema.prisma
          python -m prisma migrate deploy

      - name: Start a throwaway bucket
        run: |
          set -euo pipefail
          docker run -d --name qv2-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for i in $(seq 1 30); do
            if docker exec qv2-minio mcli alias set local http://127.0.0.1:9000 minioadmin minioadmin >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec qv2-minio mcli mb --ignore-existing local/design-workshop

      - name: Seed the database
        run: python ../scripts/ci/seed_qv2_stack.py "$RUNNER_TEMP/qv2-seed.json"

      - name: Start the API
        run: |
          set -euo pipefail
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then echo "API is up."; exit 0; fi
            sleep 2
          done
          echo "::error::the API did not answer /health within two minutes"
          tail -n 200 "$RUNNER_TEMP/api.log"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12 and the web dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --global npm@12
          npm ci

      - name: The web client against the stack
        working-directory: frontend
        env:
          QV2_STACK_API: "http://127.0.0.1:8000"
        run: |
          set -uo pipefail
          export QV2_STACK_SEED="$RUNNER_TEMP/qv2-seed.json"
          status=0
          npx playwright test e2e/questionnaire-dr-v2-stack.spec.ts || status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- API log (last 200 lines) ---"
            tail -n 200 "$RUNNER_TEMP/api.log"
          fi
          exit "$status"

  docs:
    name: Docs check
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Verify the documentation set
        run: node docs/tools/check-docs.mjs

  packaging:
    name: Container and manifest packaging
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The manifest tree must be present
        run: |
          set -euo pipefail
          missing=0
          for f in infra/k8s/base/kustomization.yaml \
                   infra/k8s/overlays/dev/kustomization.yaml \
                   infra/k8s/overlays/staging/kustomization.yaml \
                   infra/k8s/overlays/prod/kustomization.yaml; do
            if [ ! -s "$f" ]; then
              echo "::error::${f} is missing or empty. docs/KUBERNETES.md documents this tree, and an empty directory is not tracked by git — it can go missing with no other symptom."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "manifest tree present: $(find infra/k8s -type f -name '*.yaml' | wc -l) files"

      - name: Every overlay must build, and must build something
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null 2>&1 || {
            echo "::error::kubectl is not on this runner image any more. Add azure/setup-kubectl before this step; do not delete the check."
            exit 1
          }
          for overlay in dev staging prod; do
            out="$(mktemp)"
            if ! kubectl kustomize "infra/k8s/overlays/${overlay}" > "$out"; then
              echo "::error::infra/k8s/overlays/${overlay} does not build."
              exit 1
            fi
            objects="$(grep -c '^kind:' "$out" || true)"
            if [ "${objects:-0}" -lt 10 ]; then
              echo "::error::overlay ${overlay} built only ${objects:-0} object(s). Expected the base's ten plus the overlay's namespace and secret store."
              exit 1
            fi
            echo "${overlay}: ${objects} objects"
          done

      - name: The compose stack must still describe itself
        run: |
          set -euo pipefail
          docker compose config --quiet
          echo "services a bare 'up' would start:"
          docker compose config --services | sort | sed 's/^/  /'

      - name: Build both images
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile -t design-workshop-backend:ci .
          docker build -f frontend/Dockerfile -t design-workshop-frontend:ci \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000 .
          docker image ls --format '  {{.Repository}}:{{.Tag}}  {{.Size}}' \
            | grep -E 'design-workshop-(backend|frontend):ci'

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: design_workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/design_workshop"
      JWT_SECRET: "ci-integration-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install from the lock
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Fetch the Prisma engines and generate the client
        run: |
          set -euo pipefail
          python -m prisma py fetch
          python scripts/generate_prisma_client.py --schema prisma/schema.prisma

      - name: Apply the migrations to the service database
        run: python -m prisma migrate deploy

      - name: The other portal, for the shared-file parity tests
        working-directory: .
        env:
          PEER: cxacraftecosystem-ui/documentation-portal
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref=main
          if [ "$BRANCH" != "main" ] && git ls-remote --exit-code --heads "https://github.com/$PEER.git" "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          dest="$(dirname "$GITHUB_WORKSPACE")/${PEER#*/}"
          rm -rf "$dest"
          git clone --quiet --depth 1 --branch "$ref" "https://github.com/$PEER.git" "$dest"
          { echo "CROSS_PORTAL_PEER_REPO=$dest"; echo "SIBLING_REPO=$dest"; } >> "$GITHUB_ENV"
          echo "Shared files are compared with $PEER@$ref ($(git -C "$dest" rev-parse --short HEAD))."

      - name: Run the full suite against the database
        run: |
          set -uo pipefail
          status=0
          if ! python -m pytest -rf --durations=15 | tee pytest-integration.log; then
            status=1
          fi
          if ! grep -q '^database: local DSN resolved' pytest-integration.log; then
            echo "::error::conftest did not report a LOCAL database, so this job ran the same DB-less suite as 'Backend tests' and proved nothing extra. Check the postgres service, the port mapping and DATABASE_URL. See backend/tests/conftest.py::_gate_sentence."
            exit 1
          fi
          exit "$status"

  questionnaire-parity:
