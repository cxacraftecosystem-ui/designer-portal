        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Run the spec against the built site
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          E2E_SHOT_DIR: test-results/map-coverage
        run: |
          set -euo pipefail
          npx next start --port 3000 > next.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:3000/login || { cat next.log; exit 1; }
          npx playwright test e2e/map-coverage.spec.ts

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-coverage
          path: frontend/test-results
          if-no-files-found: ignore

