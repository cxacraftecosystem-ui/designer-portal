name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      beyond_android: ${{ steps.diff.outputs.beyond_android }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Does this change touch anything outside android/
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          verdict=true
          if [ "$EVENT" != "pull_request" ]; then
            echo "${EVENT} runs every job."
          elif [[ "$HEAD_REF" == release/* ]]; then
            echo "A pull request from ${HEAD_REF} runs every job."
          elif files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")" && [ -n "$files" ]; then
            echo "Changed against the pull request base:"
            printf '%s\n' "$files" | sed 's/^/  /'
            if ! printf '%s\n' "$files" | grep -qv '^android/'; then
              verdict=false
              echo "Only android/ changed: the backend database suites and the browser jobs skip."
            fi
          else
            echo "::warning::could not diff ${BASE_SHA:-<none>}...${HEAD_SHA:-<none>}, so every job runs."
          fi
          echo "beyond_android=${verdict}" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend tests
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend

    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://ci:ci@ci.invalid:5432/no_such_database"
      JWT_SECRET: "ci-placeholder-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Say whether production runs the patch this job tests
        continue-on-error: true
        run: |
          box="$(sed -nE 's/^ +BOX_PYTHON_VERSION: "([0-9.]+)"$/\1/p' "$GITHUB_WORKSPACE/.github/workflows/deploy-backend.yml" || true)"
          here="$(python -c 'import platform; print(platform.python_version())' || true)"
          newer="$(python -c 'import sys; v = lambda s: tuple(int(p) for p in s.split(".")); print("ci" if v(sys.argv[1]) > v(sys.argv[2]) else "box")' "$here" "$box" 2>/dev/null || true)"
          if [ "$here" = "$box" ]; then
            echo "this job tests CPython $here, the version the API boxes run"
          elif [ "$newer" = "ci" ]; then
            echo "::warning::this job tests CPython $here; the API boxes are pinned to $box (BOX_PYTHON_* in deploy-backend.yml and infra/terraform/user_data.sh). Raise the pin to the newest python-build-standalone release that carries $here."
          else
            echo "::warning::this job tests CPython ${here:-<unknown>}, but the API boxes are pinned to ${box:-<no pin found>} (BOX_PYTHON_* in deploy-backend.yml). CI is behind production here; check what setup-python's check-latest found."
          fi

      - name: Install the backend and its test extras
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Generate the Prisma client
        run: python scripts/generate_prisma_client.py --schema prisma/schema.prisma

      - name: The other portal, for the shared-file parity tests
        working-directory: .
        env:
          PEER: cxacraftecosystem-ui/documentation-portal
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PEER_ENV_NAMES: CROSS_PORTAL_PEER_REPO SIBLING_REPO
        run: bash scripts/ci/peer_checkout.sh

      - name: Install LibreOffice for the report round-trip test
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui
          soffice --version

      - name: Run the suite
        env:
          REQUIRE_LIBREOFFICE: "1"
        run: |
          set -uo pipefail
          status=0
          if ! python -m pytest -rf --durations=15 | tee pytest-output.log; then
            status=1
          fi
          sentences=$(grep -c '^database: ' pytest-output.log || true)
          if [ "${sentences:-0}" -lt 2 ]; then
            echo "::error::conftest printed its 'database:' line fewer than twice, so one of the two hooks has been deleted, renamed, or silenced by a verbosity flag. Both must reach the log — pytest_report_header at the top, pytest_terminal_summary with the skip tally at the foot. See backend/tests/conftest.py."
            exit 1
          fi
          exit "$status"

      - name: Prove the database gate on a runner that has only a dotenv
        working-directory: .
        env:
          DATABASE_URL: ""
        run: |
          set -euo pipefail
          if [ -e backend/.env ]; then
            echo "::error::backend/.env already exists, and this step overwrites it and then deletes it. On a runner that file is gitignored and cannot be there, so you are almost certainly running this workflow locally (act, or a copy-pasted run block) against real secrets. Refusing before touching it."
            exit 1
          fi
          trap 'rm -f backend/.env' EXIT
          echo 'DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/nothing_is_listening' > backend/.env
          python -m pytest backend/tests/test_conftest_database_gate.py -rf

      - name: Lint the backend with ruff
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          files=$(ruff check . --show-files | wc -l)
          echo "$(ruff --version) over ${files} files under backend/"
          if [ "${files:-0}" -lt 200 ]; then
            echo "::error::ruff found only ${files} files to check under backend/, which is far below the 289 measured when this step landed. Something — an exclude, a rename, a bad working directory — has emptied the run, and a green tick here would be meaningless. See the comment on this step."
            exit 1
          fi
          status=0
          if ! ruff check . --output-format=github; then
            status=1
          fi
          ruff check . --statistics || true
          exit "$status"

  web:
    name: Web typecheck, lint and unit specs
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Audit the lockfile
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: The other portal, for the shared-file parity tests
        working-directory: .
        env:
          PEER: cxacraftecosystem-ui/documentation-portal
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PEER_ENV_NAMES: CROSS_PORTAL_PEER_REPO SIBLING_REPO
        run: bash scripts/ci/peer_checkout.sh

      - name: Unit specs
        run: npm run test:unit

  map-coverage:
    name: Map coverage view in a browser
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.beyond_android != 'false' }}
