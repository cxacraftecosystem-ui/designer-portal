      - name: Install the pinned CPython on the runner, at the box's path
        run: |
          set -euo pipefail
          minor="${BOX_PYTHON_VERSION%.*}"
          home="/opt/cpython/${BOX_PYTHON_VERSION}+${BOX_PYTHON_BUILD}"
          want_url="https://github.com/astral-sh/python-build-standalone/releases/download/${BOX_PYTHON_BUILD}/cpython-${BOX_PYTHON_VERSION}%2B${BOX_PYTHON_BUILD}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          [ "$BOX_PYTHON_URL" = "$want_url" ] || { echo "::error::BOX_PYTHON_URL is not $want_url. Change the four BOX_PYTHON_* values together."; exit 1; }
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::this runner is $(uname -m); the pinned build is for x86_64."; exit 1; }
          stage="$(mktemp -d)"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 900 -o "$stage/python.tar.gz" "$BOX_PYTHON_URL"
          got="$(sha256sum "$stage/python.tar.gz" | cut -d' ' -f1)"
          [ "$got" = "$BOX_PYTHON_SHA256" ] || { echo "::error::$BOX_PYTHON_URL has SHA-256 $got, and the pin is $BOX_PYTHON_SHA256. Nothing was built."; exit 1; }
          tar -xzf "$stage/python.tar.gz" -C "$stage"
          sudo install -d -m 0755 /opt/cpython
          sudo rm -rf "$home"
          sudo mv -T "$stage/python" "$home"
          sudo "$home/bin/python${minor}" -I -m compileall -q "$home/lib/python${minor}" || true
          rm -rf "$stage"
          "$home/bin/python${minor}" -I -c 'import platform, sys; assert platform.python_version() == sys.argv[1], platform.python_version(); print("runner interpreter: CPython", platform.python_version(), "from", sys.base_prefix)' "$BOX_PYTHON_VERSION"

      - name: Build the release venv on the runner, with the Prisma client generated into it
        id: genclient
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          set -euo pipefail
          minor="${BOX_PYTHON_VERSION%.*}"
          py="/opt/cpython/${BOX_PYTHON_VERSION}+${BOX_PYTHON_BUILD}/bin/python${minor}"
          R="/home/ubuntu/app/releases/$SHA/backend"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 "$R"
          rsync -a --exclude '.venv' --exclude '__pycache__' --exclude '*.pyc' --exclude '.env' backend/ "$R/"
          cd "$R"
          "$py" -m venv .venv
          ./.venv/bin/python -m pip install --quiet --upgrade pip
          ./.venv/bin/python -m pip install --quiet -r requirements.lock
          ./.venv/bin/python -m pip install --quiet -e . --no-deps

          PATH="$R/.venv/bin:$PATH" ./.venv/bin/python scripts/generate_prisma_client.py
          ./.venv/bin/python scripts/generate_prisma_client.py --check
          sp="$(./.venv/bin/python -c 'import prisma, os; print(os.path.dirname(prisma.__file__))')"
          case "$sp" in
            "$R/.venv/"*) echo "generated into $sp" ;;
            *) echo "::error::prisma resolves to $sp, outside the release venv being built."; exit 1 ;;
          esac
          ./.venv/bin/python -m compileall -q "$sp"

          engine_src="$(find "$HOME/.cache/prisma-python/binaries" -type f -name 'query-engine-*' | head -1)"
          test -n "$engine_src" || { echo "::error::generate did not leave a query engine under the prisma-python cache"; exit 1; }
          mkdir -p /tmp/genengine
          cp "$engine_src" "/tmp/genengine/prisma-$(basename "$engine_src")"
          chmod +x /tmp/genengine/*
          ls -la /tmp/genengine

          names() { grep -oE '^(model|enum) [A-Za-z0-9_]+ *\{' "$1" | awk '{print $1, $2}' | sort; }
          if ! diff <(names "$sp/schema.prisma") <(names prisma/schema.prisma) > /tmp/schemadiff; then
            echo "::error::the generated client declares different models/enums than backend/prisma/schema.prisma"
            echo "--- < generated | > this commit ---"
            head -40 /tmp/schemadiff
            exit 1
          fi
          echo "generated client declares the same $(names prisma/schema.prisma | wc -l) models and enums as this commit"
          du -sh .venv

      - name: Ship the runner-built venv into the release directory
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          set -euo pipefail
          R="/home/ubuntu/app/releases/$SHA/backend"
          PREV="$(ssh ubuntu@${{ secrets.EC2_HOST }} 'readlink -f /home/ubuntu/app/current 2>/dev/null || true')"
          echo "previous release: ${PREV:-<none>}"
          if [ "$PREV" = "/home/ubuntu/app/releases/$SHA" ]; then
            echo "current already points at this release — keeping the venv that is in it"
            exit 0
          fi
          basis=()
          if [ -n "$PREV" ] && ssh ubuntu@${{ secrets.EC2_HOST }} "test -d '$PREV/backend/.venv' && test ! -L '$PREV/backend/.venv'"; then
            basis=(--copy-dest="$PREV/backend/.venv/")
            echo "files unchanged since $PREV are copied on the box, not sent"
          fi
          rsync -a --checksum --delete --stats "${basis[@]}" "$R/.venv/" "ubuntu@${{ secrets.EC2_HOST }}:$R/.venv/" > /tmp/venv-rsync.txt
          grep -E '^(Number of (regular )?files transferred|Total transferred file size|Total bytes sent)' /tmp/venv-rsync.txt || true
          ssh ubuntu@${{ secrets.EC2_HOST }} "SHA='$SHA' BOX_PYTHON_VERSION='$BOX_PYTHON_VERSION' BOX_PYTHON_BUILD='$BOX_PYTHON_BUILD' bash -s" <<'REMOTE'
          set -euo pipefail
          REL="/home/ubuntu/app/releases/$SHA"
          cd "$REL/backend"
          home="/opt/cpython/${BOX_PYTHON_VERSION}+${BOX_PYTHON_BUILD}"
          want="$(readlink -f "$home") $BOX_PYTHON_VERSION"
          got="$(./.venv/bin/python -I -c 'import os, sys, platform; print(os.path.realpath(sys.base_prefix), platform.python_version())' 2>/dev/null || true)"
          [ "$got" = "$want" ] || { echo "::error::this release's venv runs '${got:-nothing}', not the pinned $want. Nothing has been stopped or flipped."; exit 1; }
          where="$(./.venv/bin/python -c 'import app, os; print(os.path.dirname(os.path.realpath(app.__file__)))')"
          [ "$where" = "$(readlink -f "$REL/backend/app")" ] || { echo "::error::the shipped venv imports app from $where, not this release's $REL/backend/app."; exit 1; }
          echo "venv ready: runs $got and imports this release's app ($(du -sh .venv | cut -f1))"
          REMOTE

      - name: Pin the Node the Prisma CLI runs on
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "SHA='$SHA' NODE_PIN='$PRISMA_CLI_NODE_VERSION' bash -s" <<'REMOTE'
          set -euo pipefail
          [ -n "${NODE_PIN:-}" ] || { echo "::error::PRISMA_CLI_NODE_VERSION is empty; the job-level env block of this workflow is missing it."; exit 1; }
          dir="$HOME/.cache/prisma-python/nodeenv-${NODE_PIN}"
          want="v${NODE_PIN}"
          have="$("$dir/bin/node" --version 2>/dev/null || true)"
          if [ "$have" = "$want" ]; then
            echo "Prisma CLI Node already pinned: $want at $dir"
          else
            echo "building $dir (Node $NODE_PIN, prebuilt from nodejs.org) — found '${have:-nothing}'"
            # Rebuilt from scratch: a directory that exists but does not answer the version is a
            # half-finished build, and prisma-client-py would otherwise use it as it stands.
            rm -rf "$dir"
            mkdir -p "$(dirname "$dir")"
            "/home/ubuntu/app/releases/$SHA/backend/.venv/bin/python" -m nodeenv --prebuilt --node="$NODE_PIN" "$dir"
          fi
          got="$("$dir/bin/node" --version 2>&1)" || { echo "::error::$dir/bin/node does not start: $got"; exit 1; }
          [ "$got" = "$want" ] || { echo "::error::$dir/bin/node answers $got, not $want."; exit 1; }
          # npm's shebang is `#!/usr/bin/env node` and this box has no Node on PATH, so it is asked
          # with the env's own bin first — the PATH prisma-client-py itself gives the CLI.
          npm_version="$(PATH="$dir/bin:$PATH" "$dir/bin/npm" --version 2>&1)" || { echo "::error::npm in $dir does not start: $npm_version"; exit 1; }
          echo "Prisma CLI Node: $got, npm $npm_version ($dir)"
          REMOTE

      - name: Place the query engine beside the release, and prove the shipped client
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          set -euo pipefail
          rsync -az --chmod=F755 /tmp/genengine/             "ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/releases/$SHA/backend/"

          ssh ubuntu@${{ secrets.EC2_HOST }} "SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          APP=/home/ubuntu/app
          REL="$APP/releases/$SHA"
          cd "$REL/backend"
          # ─── A TICK ON THE WIRE WHILE A QUIET COMMAND RUNS ──────────────────────────────────
          #
          # 2026-09-17. This is the step the audit reached for first, for a reason visible in the
          # log rather than in the code: from this `cd` to the last echo it can go minutes without
          # printing a single character. Importing this client is megabytes of generated Python on a
          # t3.micro, and `connect()` starts the query-engine subprocess and then waits on a pooler
          # that may be in another region. Neither says anything while it works, so the deploy log
          # shows a step start, a long nothing, and — twice on 2026-09-17 — `client_loop: send
          # disconnect: Broken pipe` with exit 255 at 286.8 s and 281.2 s of silence.
          #
          # SILENCE IS BOTH THE SYMPTOM AND (ON THE LEADING HYPOTHESIS) THE CAUSE, which is why one
          # change addresses both. A line every 30 s puts bytes on the SSH channel, so no NAT or
          # SNAT entry in the path can age out under a command that is merely slow — and it leaves a
          # timestamped trail, so the next drop says WHICH command was running and for how long
          # instead of leaving a four-minute hole for somebody to subtract timestamps across. The
          # keepalives written into ~/.ssh/config at the top of this job are the transport half of
          # the same fix; this is the half that is also evidence. Neither alone would have told us
          # anything on 2026-09-17.
          #
          # STDERR, NOT STDOUT, AND THAT IS LOAD-BEARING. One ssh in this file — `site="$(ssh …)"`,
          # a few lines above — captures a remote command's stdout and uses it as a FILESYSTEM PATH.
          # A heartbeat on stdout would one day be appended to a path and produce an error nobody
          # could read. Actions interleaves a step's stdout and stderr in the log, so stderr costs
          # nothing in readability and removes the whole class of accident.
          #
          # IT KILLS ITSELF IF THE SHELL IT IS TICKING FOR GOES AWAY. `kill -0 "$ka_parent"` is
          # re-checked every cycle and a `trap` on EXIT stops it on every ordinary path. Without the
          # parent check, a dropped connection would leave a subshell on the box sleeping and
          # printing into a closed descriptor forever — one per failed deploy, which is exactly the
          # kind of litter a diagnostic must never become.
          #
          # 30 SECONDS. The interval has to be a small fraction of the shortest idle timeout
          # anywhere in the path; the shortest anybody has named is the four-minute Azure SNAT
          # default, so this is an eightfold margin for a handful of lines.
          ka_pid=""
          ka_start() {
            ka_label="$1"
            ka_parent=$$
            ( t=0
              while kill -0 "$ka_parent" 2>/dev/null; do
                sleep 30
                t=$((t + 30))
                printf '  … %s: still running after %ds\n' "$ka_label" "$t" >&2
              done ) &
            ka_pid=$!
          }
          # THE `sleep` IS REAPED BEFORE THE SUBSHELL, AND THAT ORDER IS THE POINT. `kill $ka_pid`
          # ends the subshell but NOT the `sleep 30` it forked and is blocked in; that orphan is
          # reparented with this session's stderr still open, and sshd does not close a channel while
          # anything still holds it. A heartbeat added to stop SSH sessions dying would otherwise
          # hold one open for up to a full interval after the work finished — and leave a stray
          # process on the box on every failure path. `pkill` is in procps and is on this image;
          # both calls are `|| true`-guarded so its absence could never fail a deploy.
          #
          # WRITTEN AS AN `if`, NOT AS `[ -n "$ka_pid" ] && kill …`. This heredoc runs under `set -e`
          # and an `&&` chain whose test is false returns 1 — as the last command of a function that
          # would end the whole step. A deploy failed by its own heartbeat being switched off is a
          # failure nobody would find quickly. The explicit `return 0` states the same rule twice.
          ka_stop() {
            if [ -n "${ka_pid:-}" ]; then
              pkill -TERM -P "$ka_pid" 2>/dev/null || true
              kill "$ka_pid" 2>/dev/null || true
              wait "$ka_pid" 2>/dev/null || true
              ka_pid=""
            fi
            return 0
          }
          trap 'ka_stop' EXIT
          # The bytecode in this venv is the runner's, written beside the sources it was compiled from
          # and shipped with them in one rsync (2026-10-19). It used to be deleted here because the
          # client was copied OVER an existing venv, so old .pyc files could outlive their sources;
          # nothing is copied over a shipped venv, and keeping it spares the box compiling the
          # generated client while the live release is still serving.
          # ─── THE CLIENT MUST BE IN *THIS* RELEASE'S VENV, AND THAT IS ASSERTED ────────────────
          #
          # WHAT HAPPENED ON 2026-09-14, WHICH IS WHY THIS BLOCK EXISTS. The deploy of 1557d93 took
          # the copied-venv path and then reported:
          #
          #   dependencies unchanged since /home/ubuntu/app/releases/b9b35bb… — copying its venv
          #   ✔ Generated Prisma Client Python to ./../../b9b35bb…/backend/.venv/…/site-packages/prisma
          #
          # READ THE SECOND LINE AGAIN: generate wrote the client into the PREVIOUS release. The
          # release being deployed kept the client that was copied into it -- generated on
          # 2026-09-03, before SanctionOrder and AnnualPlanEntry existed. Every route that touches
          # a model added since answered `AttributeError` -> a 500 reading "Something went wrong on
          # the server. The error has been logged." /api/design-workshops and /api/sanction-orders
          # were down for a day; /api/users was fine, because it predates that schema. Nothing in
          # the deploy went red: rsync, generate, migrate, the symlink flip and the readiness probe
          # all passed, because none of them ever asked WHERE the client landed.
          #
          # The check is the one question that matters and it is asked of the interpreter that will
          # actually serve traffic: import prisma, and see where it resolves. A path outside this
          # release means the app is about to run somebody else's client. Comparing the schema the
          # generator embedded beside it against this release's schema then catches the other half
          # -- a client that IS in the right place but was generated from an older tree, which is
          # the same outage with a different cause. (The engine loads THAT copy of schema.prisma,
          # not backend/prisma/schema.prisma, so it is the file that decides what the queries may
          # name.)
          #
          # THERE IS NO SELF-HEAL HERE, AND THAT IS DELIBERATE. An earlier version of this block
          # rebuilt the venv and re-ran `prisma generate` on the box when the check failed. That is
          # now the one thing this box must never be asked to do -- it is what gets OOM-killed. If
          # the client that just arrived from the runner is not the right one, the rsync or the
          # venv is wrong, and both are the runner's to fix: fail, keep the symlink where it is, and
          # let the box go on serving the last release that passed this same check.
          # ─── THE QUERY ENGINE BINARY, WHICH `generate` USED TO FETCH AS A SIDE EFFECT ────────
          #
          # MOVING GENERATION TO THE RUNNER TOOK THIS WITH IT, and the release that shipped without
          # it started, served, and failed every single request:
          #
          #   Background DB reconnect failed: Expected .../prisma-query-engine-debian-openssl-3.0.x
          #   ... to exist but none were found or could not be executed.
          #   Try running prisma py fetch
          #
          # The client is PURE PYTHON and travels; the engine is a PLATFORM BINARY and does not. The
          # paths it searched even included `/home/runner/.cache/...` -- the runner's home, carried
          # in from the machine that generated the client -- which is the clearest possible sign
          # that a binary cannot be shipped this way and has to be fetched where it will run.
          #
          # `py fetch` DOWNLOADS, it does not generate: no schema is parsed and nothing is built in
          # memory, so this is not the step that gets OOM-killed. It is a no-op once the cache holds
          # this version, which is every deploy after the first.
          # `prisma py fetch` WAS HERE AND DID NOT WORK -- see the runner step's note. The engine
          # now arrives by rsync from the runner that generated the matching client.

          # ─── THE CLIENT MUST CARRY THE PYTHON 3.14 IMPORT FIX, CHECKED BEFORE ANYTHING IMPORTS IT ──
          # 2026-10-09. The runner's generator adds `from __future__ import annotations` to types.py
          # (scripts/generate_prisma_client.py); without it every import of this client on 3.14 costs
          # minutes and more than a gigabyte, which on this box means the import checks below — and
          # every later start of both units — run into MemoryHigh and the queue's MemoryMax. `--check`
          # reads the file through find_spec and imports nothing, so a client shipped without the fix
          # fails here in a second instead of stalling the deploy for half an hour first.
          ./.venv/bin/python scripts/generate_prisma_client.py --check || { echo "::error::the Prisma client in this release is not the one scripts/generate_prisma_client.py writes (the Python 3.14 import fix and the types.py/types.pyi split); the runner's build step did not run it. Not flipping."; exit 1; }

          # ─── AN ENGINE NAME THIS BOX'S CLIENT WILL LOOK FOR, ON ANY OpenSSL 3 (2026-10-09) ─────────
          # The engine arrives named for the runner's target, `prisma-query-engine-debian-openssl-3.0.x`
          # — Prisma's own CLI files every OpenSSL 3.x host under 3.0.x, because libssl.so.3 keeps its
          # ABI across 3.x. prisma-client-py's RUNTIME does not: it names the file it looks for in the
          # working directory after `openssl version` verbatim (prisma/binaries/platform.py), so on an
          # OpenSSL 3.5 host — Ubuntu 26.04, which infra/terraform/main.tf now builds a replacement box
          # from — it would look for `…-3.5.x`, find nothing, and the connect check below would refuse
          # the flip on every deploy to that box. On today's 24.04 box (OpenSSL 3.0) the two names are
          # the same file and this does nothing. The name is computed here the way platform.py computes
          # it, so nothing has to import the client to learn it. It is the SYSTEM `openssl` binary that
          # decides, not the interpreter: the pinned CPython bundles OpenSSL 3.5.9 for its own `ssl`
          # module, and platform.py never asks it — so on 24.04 the name stays `…-3.0.x`.
          ssl_minor="$( { openssl version -v 2>/dev/null || true; } | sed -nE 's/^OpenSSL ([0-9]+\.[0-9]+)\.[0-9]+.*/\1/p')"
          box_engine="prisma-query-engine-debian-openssl-${ssl_minor:-1.1}.x"
          if [ ! -e "$box_engine" ] && [ -x prisma-query-engine-debian-openssl-3.0.x ] && [ "${ssl_minor%%.*}" = "3" ]; then
            ln -s prisma-query-engine-debian-openssl-3.0.x "$box_engine"
            echo "OpenSSL ${ssl_minor} on this box: $box_engine -> prisma-query-engine-debian-openssl-3.0.x"
          fi

          client_dir="$(./.venv/bin/python -c 'import prisma, os; print(os.path.dirname(prisma.__file__))')"

          if [ "${client_dir#$REL/}" = "$client_dir" ]; then
            echo "::error::prisma client resolved to $client_dir, which is outside $REL. Refusing to deploy a release that would import another release's client."
            exit 1
          fi
          # SAME SEMANTIC COMPARISON AS ON THE RUNNER, and for the same reason: the file the box now
          # holds is the GENERATOR'S copy of the schema, which is not promised to be byte-identical
          # to `prisma/schema.prisma` in the tree beside it. What must be true is that it declares
          # the same models and enums -- that is what the query engine reads it for, and a
          # disagreement there is the AttributeError that took /api/design-workshops down.
          # ANCHORED AT COLUMN 0 AND REQUIRING THE BRACE. `^[[:space:]]*model` also matches a FIELD named
          # `model` -- schema.prisma:2130 is `  model String?` -- which made the import check below
          # demand an accessor called `string`. A declaration in this grammar is never indented and
          # always opens a block, so both halves of that are load-bearing.
          names() { grep -oE '^(model|enum) [A-Za-z0-9_]+ *\{' "$1" | awk '{print $1, $2}' | sort; }
          if ! diff <(names "$client_dir/schema.prisma") <(names prisma/schema.prisma) > /tmp/schemadiff; then
            echo "::error::$client_dir/schema.prisma declares different models/enums than this release's prisma/schema.prisma. The query engine reads that copy, so anything it does not declare fails at runtime with AttributeError."
            echo "--- < installed | > this release ---"
            head -40 /tmp/schemadiff
            exit 1
          fi
          # AND IT MUST ACTUALLY IMPORT AND CARRY THE MODELS. Comparing schema.prisma proves what the
          # ENGINE will be told; it does not prove the generated MODULES beside it are complete. A
          # half-copied client passes the schema comparison and then fails every route at runtime,
          # which is the same outage wearing a different hat. Instantiating Prisma exercises the
          # generated `client.py`, `models.py`, `actions.py` and `types.py` in one line, and the
          # model accessors are checked by name against the schema so a missing one is named here
          # rather than discovered by a designer.
          # ONE LINE, AND BOTH REASONS ARE THE CONTAINER IT LIVES IN. A nested heredoc cannot close
          # inside this one (an indented terminator does not end an unindented `<<`), and a `-c`
          # program cannot be indented either, because Python would read the leading spaces of each
          # continuation line as an IndentationError -- while YAML's block scalar forbids putting
          # them at column 0. Semicolons are what is left.
          #
          # WHAT IT PROVES, THAT THE SCHEMA COMPARISON ABOVE DOES NOT. That check reads the file the
          # ENGINE will be handed; it says nothing about whether the generated MODULES beside it
          # arrived intact. A half-copied client passes it and then fails every route at runtime --
          # the same outage wearing a different hat. Instantiating Prisma exercises client.py,
          # models.py, actions.py and types.py together, and every model in this release's schema is
          # then checked by name, so a missing accessor is named HERE rather than found by a user.
          # THE EXIT STATUS IS CARRIED BY HAND, because the heartbeat has to be stopped BETWEEN the
          # command and the decision about it. `cmd || rc=$?` is the form that survives `set -e`
          # (the left-hand side of `||` is a tested command, so a non-zero status is not fatal
          # there), and `rc=0` is initialised first because under `set -u` an unset `rc` would abort
          # the step on the SUCCESS path — the failure mode that looks least like its own cause. The
          # one-liner below prints its own `::error::` before exiting 1, so `exit "$rc"` is the
          # whole decision.
          ka_start "prisma client import + model accessor check"
          rc=0
          ./.venv/bin/python -c 'import re,sys,pathlib;from prisma import Prisma;schema=pathlib.Path("prisma/schema.prisma").read_text(encoding="utf-8");models=sorted({m.lower() for m in re.findall(r"^model ([A-Za-z0-9_]+) *\{",schema,re.M)});missing=[m for m in models if not hasattr(Prisma(),m)];print(("::error::the installed client is missing %d model accessor(s): %s"%(len(missing),", ".join(missing[:12]))) if missing else ("client instantiates and carries all %d model accessors"%len(models)));sys.exit(1 if missing else 0)' || rc=$?
          ka_stop
          [ "$rc" -eq 0 ] || exit "$rc"

          # AND THE ENGINE IS ASSERTED, not assumed. `py fetch` exiting 0 is not the same claim as
          # "the binary this platform needs is on disk and runnable" -- the release that took the
          # site down proved the two can differ, and the difference only showed up as a 500 on every
          # route after the symlink had already flipped.
          # ASSERTED BY CONNECTING, NOT BY GUESSING A FILENAME. The first version of this check
          # looked for `prisma-query-engine-*` on disk and failed a deploy whose fetch had plainly
          # just succeeded ("Downloaded binaries to .../binaries/5.17.0/393aa..."), because the
          # engine's name and location are prisma's business and not a contract this file gets to
          # assume. Guessing the artefact is how a check ends up testing itself.
          #
          # Opening a connection is the thing that actually has to work, and it is what failed in
          # production: the app started, served, and answered every request with "Not connected to
          # the query engine". `connect()` starts the engine binary and speaks to the database, so
          # it exercises the fetch, the binary's executability and the DSN in one call -- and it
          # runs BEFORE the symlink flips, so a box that cannot reach its database keeps serving the
          # release that can.
          echo "engine cache:"; ls -la "$HOME/.cache/prisma-python/binaries"/*/* 2>/dev/null | head -20 || true
          set -a; . ./.env; set +a
          # NO `disconnect()`, AND ITS ABSENCE IS THE FIX RATHER THAN A SHORTCUT. The first version
          # called `asyncio.run()` twice -- once for connect, once for disconnect -- and the second
          # raised `RuntimeError: Event loop is closed` AFTER printing "the database answered". A
          # prisma connection is bound to the loop that opened it, so the teardown ran against a
          # loop that no longer existed, and a release whose engine and database were both healthy
          # was reported broken. The process exits on the next line and takes the engine subprocess
          # with it; there is nothing for a disconnect to release that the exit does not.
          ka_start "prisma connect(): starting the query engine and reaching the pooler"
          rc=0
          ./.venv/bin/python -c 'import asyncio;from prisma import Prisma;asyncio.run(Prisma().connect());print("query engine started and the database answered")' || rc=$?
          ka_stop
          [ "$rc" -eq 0 ] || { echo "::error::the release cannot connect to its database. Not flipping the symlink."; exit 1; }

          echo "prisma client verified in this release: $client_dir"
          REMOTE

      - name: Migrate, start the new release beside the live one, switch when healthy
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          set -euo pipefail
          [ -n "${SHA:-}" ] || { echo "::error::the release id is empty"; exit 1; }
          ssh ubuntu@${{ secrets.EC2_HOST }} "NODE_PIN='$PRISMA_CLI_NODE_VERSION' bash -s -- release '$SHA'" < backend/deploy/blue_green.sh

      - name: Prune old releases
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/home/ubuntu/app

          # ─── DECIDED FIRST, BECAUSE NOTHING BELOW MAY DELETE IT: WHAT IS BEING SERVED ───────
          # Resolved once, as an absolute path, and compared as one. This step used to compare
          # BASENAMES, which gives the same answer only while `current` points inside releases/ —
          # true today, and exactly the kind of "true today" that a hand rollback or a future layout
          # change turns into a deleted live tree with no warning in between.
          #
          # `[ ! -d ]` AND NOT JUST `[ -z ]`: `readlink -f` on a DANGLING symlink prints the target
          # path and exits 0, so an emptiness test alone sails straight past the one state this
          # guard exists for. Checked on the box's own coreutils, not assumed.
          #
          # IF WE CANNOT TELL WHAT IS LIVE, WE DELETE NOTHING — a warning, not a failure. The
          # release above has already flipped and answered /health, so failing here would report a
          # good release as broken, which is the lie this pipeline keeps being taught not to tell.
          live=""
          [ -e "$APP/current" ] && live="$(readlink -f "$APP/current" 2>/dev/null || true)"
          if [ -z "$live" ] || [ ! -d "$live" ]; then
            echo "::warning::readlink -f $APP/current gave '${live:-<nothing>}', which is not a directory, so this step cannot tell which tree is being served and will delete nothing. The release itself is fine — it flipped and answered /health. Look at 'ls -la $APP/current' by hand."
            exit 0
          fi
          echo "current resolves to: $live"

          cd "$APP/releases"

          # ONE definition of "this is the tree being served", used by BOTH passes, resolved on both
          # sides so a release reached through any symlink still compares equal.
          # 2026-10-19: AND NEVER A RELEASE A PORT'S SLOT POINTS AT. The previous release stays behind
          # the idle port's /home/ubuntu/app/slot-<port> link as the instant rollback target, so it is
          # protected exactly like `current`, whatever its rank.
          slot_8000="$(readlink -f "$APP/slot-8000" 2>/dev/null || true)"
          slot_8001="$(readlink -f "$APP/slot-8001" 2>/dev/null || true)"
          is_live() {
            local r
            r="$(readlink -f "./$1")"
            [ "$r" = "$live" ] || [ "$r" = "$slot_8000" ] || [ "$r" = "$slot_8001" ]
          }

          # A DIRECTORY THIS USER CANNOT DELETE IS A WARNING, NEVER A FAILED DEPLOY. On 2026-10-19 a
          # release folder owned by root (left by a hand recovery run as root) made `rm -rf` fail here,
          # and `set -e` turned a deploy that had already switched and answered /health red. So: as
          # ubuntu, then with sudo (ubuntu has passwordless sudo on these boxes), and if both fail, a
          # warning naming the directory. Only ever a path under releases/, never `current` or a slot.
          prune() {
            if rm -rf -- "$1" 2>/dev/null; then return 0; fi
            if sudo -n rm -rf -- "$1" 2>/dev/null; then echo "pruned $1 with sudo: something in it was not ubuntu's"; return 0; fi
            echo "::warning::could not delete releases/$1 even with sudo; it stays. Look at 'ls -la /home/ubuntu/app/releases/$1' by hand."
            return 0
          }

          # Named once because it is used twice, and a bound written out twice is a bound that will
          # one day disagree with itself.
          keep_released=3

          # ─── PASS 1 · ROLLBACK CANDIDATES, RANKED BY WHEN THEY WENT LIVE ────────────────────
          #
          # "THREE RELEASES", NOT "THREE DIRECTORIES", AND THE DIFFERENCE IS NEW ON 2026-09-17.
          # Release directories used to be named for the commit, so N directories meant N deployed
          # commits — a re-run landed back in the same one. They are named per RUN ATTEMPT now, so
          # the three attempts of run 35145291959 would have left THREE directories, two of which
          # were never flipped onto and have no complete venv. This step does not run on a failed run
          # (no `if:`, so it is `success()`), so the next successful deploy would have found those
          # orphans among the three newest and deleted the last known-good release to make room for
          # them. Pointing `current` at a half-built tree and restarting is the DOCUMENTED rollback,
          # so that would have taken the API down with no way back except another full deploy —
          # precisely what the release layout exists to prevent.
          #
          # SO THE RANKING IS OVER `.released` MARKERS, AND BY THE MARKER'S OWN mtime RATHER THAN THE
          # DIRECTORY'S. The marker is written at the instant of the flip, so its timestamp IS "when
          # this release went live", which is the order this policy wants. A directory's mtime is
          # not: creating a file inside a directory updates it, so the one-time backfill in the
          # layout step re-stamps every directory it visits and reorders the whole set by the order
          # `find` happened to walk it. Measured on a mock tree rather than reasoned about: ranked by
          # directory mtime, the first post-change prune deleted the INCUMBENT release, because two
          # four-day-old ones marked a fraction of a second later outranked it. Ranked by marker
          # mtime, on the identical tree, it deleted the genuinely oldest and kept the incumbent.
          #
          # find/sort rather than `ls -t`: a glob over an empty directory is an error under `set -e`,
          # and this has to be safe on a box where releases/ has just been created.
          #
          # Every branch is an explicit `if`, never `[ … ] && continue`: under `set -e` a false `&&`
          # as the last command of a loop body ends the whole step, and a prune that stops halfway is
          # a prune that silently keeps growing.
          find . -mindepth 2 -maxdepth 2 -type f -name .released -printf '%T@ %h\n' \
            | sort -rn \
            | cut -d' ' -f2- \
            | sed 's#^\./##' \
            | tail -n "+$((keep_released + 1))" \
            | while IFS= read -r d; do
                if [ -z "$d" ]; then continue; fi
                # `current` IS NEVER PRUNED, whatever its age or its rank. Not theoretical: a deploy
                # that failed its migration, or an operator who has rolled back by hand, leaves
                # `current` pointing at a release OLDER than the newest three — so it lands in this
                # list, and without this line the next run deletes the code the box is executing.
                if is_live "$d"; then echo "keeping $d (current, or behind a port's slot)"; continue; fi
                echo "pruning $d (went live, but is older than the $keep_released newest that did)"
                prune "$d"
              done

          # ─── PASS 2 · TREES THAT WERE BUILT AND NEVER SERVED ────────────────────────────────
          # A cancelled run, or an attempt of a run that failed before the flip. They are not
          # rollback targets — no complete venv is guaranteed, and "point `current` at it and
          # restart" is the documented recovery — so leaving them in the ranking is worse than
          # useless. Each also carries the `.env` it was deployed with, in plaintext at mode 600;
          # docs/SECURITY.md's rotation runbook counts these.
          #
          # `| sort` IS A BARRIER AND NOT AN ORDERING. sort must read all of find's output before it
          # emits a byte, so every `rm -rf` below happens after find has exited. Without it the loop
          # unlinks directories find has not stat'd yet — and `! -newermt` forces it to stat every
          # entry — so find exits 1 on an ENOENT it caused, `pipefail` makes that the pipeline's
          # status, and `set -e` turns a green, flipped, health-checked deploy red at random. PASS 1
          # gets this free from its ranking sort; this pass has to ask for it.
          #
          # AN HOUR OF GRACE, AND THE REASON IS NOT A CONCURRENT DEPLOY. `concurrency: deploy-backend`
          # with `cancel-in-progress: false` at the top of this file QUEUES a second run rather than
          # overlapping it, so this step cannot be deleting a directory another run of this workflow
          # is filling. The hour buys the other two things: a window in which a human can still open
          # a failed attempt and read what went wrong, and cover for a `.released` touch that failed.
          # It does NOT bound a directory whose mtime is in the future (clock skew, or a timestamp
          # rsync preserved) — such a directory is never matched here at all. That is disk, not
          # danger, and it is written down rather than discovered.
          #
          # `.keep` IS THE HUMAN SAYING "I AM USING THIS", because an hour is a guess about how long
          # somebody needs and a time window cannot express "in use". backend/DEPLOY_AWS.md's manual
          # recovery procedure builds `releases/manual` by hand with a `cp -a` that can easily outlast
          # the window, and a deploy queued during that incident would otherwise delete the tree being
          # built. That runbook now touches this file as its second step.
          #
          # `bootstrap` is swept by this pass once `current` has moved off it, which is intended:
          # `releases/bootstrap/backend` is either a SYMLINK to the legacy /home/ubuntu/app/backend
          # tree or an empty directory, and `rm -rf` removes the link and never what it points at.
          # This finally automates the cleanup the shim above has been describing as manual since
          # 2026-09-03.
          find . -maxdepth 1 -mindepth 1 -type d ! -newermt '-60 minutes' -printf '%f\n' \
            | sort \
            | while IFS= read -r d; do
                if [ -z "$d" ]; then continue; fi
                if [ -e "$d/.keep" ]; then echo "keeping $d (.keep — somebody is working on this)"; continue; fi
                if [ -e "$d/.released" ]; then continue; fi
                if is_live "$d"; then echo "keeping $d (current — and it carries no .released marker, which should not be possible after a flip; say so rather than delete it)"; continue; fi
                echo "pruning $d (built, never went live)"
                prune "$d"
              done

          total="$(find . -maxdepth 1 -mindepth 1 -type d | wc -l)"
          released="$(find . -mindepth 2 -maxdepth 2 -type f -name .released -printf '.' | wc -c)"
          echo "releases now: $total directories, $released of which have been live (current: $(basename "$live"))"
          REMOTE

      - name: Assert the API is ready AND answers CORS for the production origin
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail

          # The port nginx proxies to since 2026-10-19 (8000 or 8001; backend/deploy/blue_green.sh).
          port="$(sed -nE 's#^[[:space:]]*proxy_pass http://127\.0\.0\.1:([0-9]+);.*#\1#p' /etc/nginx/sites-available/fieldrepo | head -n1)"
          case "$port" in 8000|8001) ;; *) echo "::error::nginx proxies to '${port:-nothing}', not 8000 or 8001"; exit 1 ;; esac
          echo "live port: $port"

          # 1. READY, not merely up. `/health` deliberately avoids the database, so a wrong DSN
          #    produces a green deploy and a dead site; `/health/ready` is the endpoint that connects.
          ready="$(curl -fsS "http://127.0.0.1:${port}/health/ready")"
          echo "readiness: ${ready}"
          case "$ready" in
            *'"database":true'*) ;;
            *) echo "::error::the API is running but reports no database connection: ${ready}"; exit 1 ;;
          esac

          # 2. The production origin is allowed. This is a real preflight, answered by the same
          #    middleware a browser talks to, so it cannot pass on a list that merely looks right.
          origin="https://designer-repository.vercel.app"
          hdr="$(curl -s -D - -o /dev/null --max-time 20 -X OPTIONS "http://127.0.0.1:${port}/api/auth/login" -H "Origin: ${origin}" -H "Access-Control-Request-Method: POST")"
          echo "${hdr}" | head -1
          # No `$` anchor: curl prints headers with CRLF endings, so the line ends in a
          # carriage return and an end-anchored pattern can never match it.
          if ! echo "${hdr}" | grep -qi "^access-control-allow-origin: ${origin}"; then
            echo "::error::the API refuses CORS for ${origin}, so no browser on the live site can call it. Every request fails the preflight with 'Disallowed CORS origin' and the user sees only 'failed to fetch'."
            echo "::error::BACKEND_CORS_ORIGINS on the server is: $(grep -E "^BACKEND_CORS_ORIGINS=" /home/ubuntu/app/current/backend/.env 2>/dev/null || echo "<not found in the current release's .env>")"
            echo "::error::Fix the 'Pin the CORS origins and the link origin' step in this workflow, not the box by hand: the step rewrites .env on every deploy and would overwrite a manual edit."
            exit 1
          fi
          echo "CORS: ${origin} is allowed"
          REMOTE

      - name: Smoke the speech-to-text and Gemini keys from the box
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          ENVFILE_PATH: /home/ubuntu/app/current/backend/.env
        run: |
          set -euo pipefail
          {
            printf 'ENVFILE=%q\n' "$ENVFILE_PATH"
            cat <<'REMOTE'
          set -uo pipefail
          val() { grep -E "^$1=" "$ENVFILE" 2>/dev/null | tail -n1 | cut -d= -f2- | sed -e 's/^["'"'"']//' -e 's/["'"'"']$//'; }
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          fail=0
          el="$(val ELEVENLABS_API_KEY)"
          if [ -z "$el" ]; then
            echo "ElevenLabs: no key in the live .env (skipped)"
          else
            # POST speech-to-text with NO audio: the one scope the pipeline uses, refused by validation
            # (400/422) before anything is transcribed or billed. Each portal's key is restricted to
            # speech-to-text, so a read such as GET /v1/models answers 401 missing_permissions (31 Oct).
            code="$(curl -s -o "$body" -w '%{http_code}' --max-time 30 -H @<(printf 'xi-api-key: %s\n' "$el") -F model_id=scribe_v2 https://api.elevenlabs.io/v1/speech-to-text || true)"
            echo "ElevenLabs POST /v1/speech-to-text (no audio): HTTP ${code:-000}"
            case "$code" in
              401|403) echo "::error::ElevenLabs refused this box's key for speech-to-text (HTTP $code). Check the key, its scope and its IP lock."; fail=1 ;;
              200|400|422) ;;
              *) echo "::warning::ElevenLabs answered HTTP ${code:-000}; not an auth refusal, so the deploy stands." ;;
            esac
          fi
          gm="$(val GEMINI_API_KEY)"
          [ -n "$gm" ] || gm="$(val GEMINI_API_KEYS | tr ',' '\n' | sed -n '1p' | tr -d '[:space:]')"
          if [ -z "$gm" ]; then
            echo "Gemini: no key in the live .env (skipped)"
          else
            code="$(curl -s -o "$body" -w '%{http_code}' --max-time 30 -H @<(printf 'x-goog-api-key: %s\n' "$gm") https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash || true)"
            echo "Gemini models.get gemini-3.8-flash: HTTP ${code:-000}"
            if [ "$code" = "401" ] || [ "$code" = "403" ] || { [ "$code" = "400" ] && grep -q 'API_KEY_INVALID' "$body"; }; then
              echo "::error::Gemini refused this box's key (HTTP $code)."
              fail=1
            elif [ "$code" != "200" ]; then
              echo "::warning::Gemini answered HTTP ${code:-000}; not an auth refusal, so the deploy stands."
            fi
          fi
          unset el gm
          exit "$fail"
          REMOTE
          } | ssh ubuntu@$EC2_HOST 'bash -s'

      - name: What the box saw (only when something above failed)
        if: failure() || cancelled()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=20 \
            "ubuntu@${{ secrets.EC2_HOST }}" 'bash -s' <<'REMOTE'
          set +e
          # THE JOURNALS ARE SCRUBBED, AND THE RULE AT THE .env CHECK ABOVE IS WHY: a deploy log is
          # not the place to leak a secret while diagnosing one. BACKEND_ENV is ONE multi-line
          # secret, so Actions masks the whole blob and NOT the DSN inside it — a prisma or asyncpg
          # connection error that echoes its connection string would otherwise print in clear, on
          # the log of a failed deploy, which is the log everyone opens. Anything that looks like a
          # URL with credentials, a JWT, or a long opaque provider key is replaced here rather than
          # trusted not to appear.
          scrub() { sed -E -e 's#([a-z+]+)://[^:@/[:space:]]+:[^@[:space:]]+@#\1://***:***@#g' \
                           -e 's#eyJ[A-Za-z0-9_-]{10,}#<jwt-redacted>#g' \
                           -e 's#(sk-|AIza|AKIA)[A-Za-z0-9_-]{8,}#<key-redacted>#g'; }
          echo "=== when, and how loaded ==="
          date -u; uptime
          echo "=== steal time: THE t3.micro TELL. A non-zero 'st' column means the hypervisor is"
          echo "=== throttling this box to its 10% baseline because the CPU credits are spent, which"
          echo "=== from the runner looks exactly like a step that has stopped producing output."
          vmstat 1 3
          echo "=== memory and swap (the swap line is the one compared across attempts, and matched) ==="
          free -m; swapon --show
          echo "=== disk, inodes included: a full / fails a deploy in ways that read as anything else ==="
          df -h /; df -i /
          echo "=== the ten biggest processes by RSS ==="
          ps -eo pid,ppid,rss,pcpu,etimes,comm --sort=-rss | head -11
          echo "=== kernel OOM kills, if any ==="
          sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 \
            || echo "(no OOM lines, or dmesg is not readable from here)"
          echo "=== the API: the port nginx proxies to, and each port's unit ==="
          grep -n proxy_pass /etc/nginx/sites-available/fieldrepo 2>&1
          ls -la /home/ubuntu/app/slot-8000 /home/ubuntu/app/slot-8001 2>&1
          for u in fieldrepo-api@8000 fieldrepo-api@8001 fieldrepo; do
            echo "--- $u ---"
            systemctl status "$u" --no-pager -l 2>&1 | head -30 | scrub
            systemctl show "$u" -p NRestarts -p ExecMainStatus -p MemoryCurrent 2>&1
            sudo journalctl -u "$u" --since '-15 min' --no-pager 2>&1 | tail -120 | scrub
          done
          echo "=== fieldrepo-queue ==="
          systemctl status fieldrepo-queue --no-pager -l 2>&1 | head -20 | scrub
          systemctl show fieldrepo-queue -p NRestarts -p ExecMainStatus -p MemoryCurrent 2>&1
          sudo journalctl -u fieldrepo-queue --since '-15 min' --no-pager 2>&1 | tail -60 | scrub
          echo "=== sshd: DID THE BOX DROP US, OR DID THE NETWORK FORGET US? (read this first) ==="
          sudo journalctl -u ssh --since '-15 min' --no-pager 2>&1 | tail -80
          sudo journalctl -u 'ssh@*' --since '-15 min' --no-pager 2>&1 | tail -40
          echo "=== what is live, and what is on disk ==="
          ls -la /home/ubuntu/app/current; readlink -f /home/ubuntu/app/current
          ls -la /home/ubuntu/app/releases
          echo "=== CPU CREDITS ARE NOT READABLE FROM HERE, AND NOT FROM THIS JOB EITHER. They are a"
          echo "=== CloudWatch metric, and the CI IAM user (designrepo-ci-sg) is scoped to"
          echo "=== AuthorizeSecurityGroupIngress and RevokeSecurityGroupIngress on one security group"
          echo "=== ARN and nothing else in the account — a CloudWatch call from this job would be"
          echo "=== AccessDenied, and widening that IAM user to read metrics is not worth it. Read"
          echo "=== them by hand: aws cloudwatch get-metric-statistics --namespace AWS/EC2"
          echo "===   --metric-name CPUCreditBalance --dimensions Name=InstanceId,Value=i-0e091ca8e6b417b52 \\"
          echo "===   --start-time <t-1h> --end-time <now> --period 300 --statistics Minimum"
          echo "=== The 'st' column from vmstat above is the box-readable proxy for the same thing."
          exit 0
          REMOTE
          echo "post-mortem ssh exited $? — recorded here and deliberately not acted on."
          exit 0

      - name: Close the deploy window
        if: always() && steps.sgwindow.outputs.cidr != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          SG_ID: ${{ secrets.AWS_SG_ID }}
          CIDR: ${{ steps.sgwindow.outputs.cidr }}
        run: |
          aws ec2 revoke-security-group-ingress             --group-id "$SG_ID"             --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${CIDR}}]"             2>&1 | tail -5 || echo "revoke returned non-zero — the rule is already absent, which is the intended end state"
          echo "--- port 22 rules remaining on ${SG_ID} ---"
          aws ec2 describe-security-groups --group-ids "$SG_ID"             --query "SecurityGroups[0].IpPermissions[?FromPort==\`22\`].IpRanges[].CidrIp" --output text || true
