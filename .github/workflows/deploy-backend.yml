name: Deploy backend to EC2

# Auto-deploys the FastAPI backend to the EC2 box. Requires these repository secrets
# (Settings → Secrets and variables → Actions):
#   EC2_HOST              Elastic IP of the API box (terraform output api_public_ip)
#   EC2_SSH_KEY           contents of the .pem private key for the EC2 key pair
#   BACKEND_ENV           the full backend/.env file contents (DATABASE_URL, JWT_SECRET,
#                         AWS_* keys, OPENAI_API_KEY, GEMINI_API_KEYS, BACKEND_CORS_ORIGINS …)
#
# Nothing secret is stored in this file — values come from the secrets above.
#
# ─── THIS WORKFLOW IS THE HEAD OF THE RELEASE PIPELINE ────────────────────────────────
#   checks.yml  ⇢  deploy-backend.yml  →  deploy-frontend.yml  →  android-build.yml
#    (push)          (push, gated)           (workflow_run)          (workflow_run)
#
# The `⇢` is a WAIT, not a trigger, and it is new as of 2026-09-03. One workflow cannot `needs:`
# a job in another, so on main these two used to RACE: a push started both, and the deploy could
# reach the box before the suite had said anything about the commit it was shipping. The
# `wait-for-checks` job below closes that by POLLING for the Checks run at this exact SHA and
# refusing to hand over to `deploy` until the three gating jobs are green. checks.yml's own
# header explains why a `needs:` was rejected in the other direction (it never fires on a pull
# request, which is where the drift is introduced) — that reasoning is untouched and still right;
# this is the main-branch half it explicitly did not cover.
#
# THE WAIT DESCRIBED HERE IS BACKEND-ONLY, AND SO IS THE STAGE IT PROTECTS. Later on 2026-09-03
# deploy-frontend.yml grew its own copy for the case this one structurally cannot see: on a
# frontend-only push the `changes` job skips `deploy` and therefore skips the wait too, correctly
# waiting for nothing, and stage 2 would otherwise publish over a red Checks run. See that file's
# header — the two loops are duplicated deliberately and are not allowed to drift.
#
# The order is a real dependency, not a preference:
#   • The web app calls API endpoints that only exist after the backend is deployed and
#     migrated. Ship the frontend first and the live site spends the gap between the two
#     deploys calling routes that answer 404/422 — visible to users as blank lists and
#     failed saves. Backend first, frontend second.
#   • The Android APK is built (not deployed) last: it is a compile/lint gate whose output
#     is an artifact, so it is the cheapest thing to run and the least urgent.
#
# WHY THE `paths:` FILTER IS GONE (this used to be `paths: [backend/**]`):
# `workflow_run` can only fire when the upstream workflow actually RUNS. With a paths
# filter, a frontend-only push never starts this workflow, so the frontend workflow would
# never be triggered either — the pipeline would dead-lock on exactly the change it most
# needs to ship. So this workflow now starts on EVERY push to main and does the path
# filtering itself, in the `changes` job below: when nothing under backend/ changed, the
# `deploy` job is skipped (the run still completes successfully and still triggers the
# frontend workflow), and nothing is touched on EC2.

on:
  push:
    branches: [main]
  workflow_dispatch:

# ─── LEAST PRIVILEGE FOR THE GITHUB_TOKEN, ADDED 2026-09-03 ───────────────────────────────
# This file had no `permissions:` block, which means the token it hands every step was whatever
# the repository default happens to be — historically read/WRITE on contents for repositories
# created before GitHub changed the default, i.e. a token that can push to main sitting in a job
# that also opens a port and holds the production .env. Nothing here writes to the repository.
#
#   contents: read   the checkout, and nothing more.
#   actions: read    `wait-for-checks` reads another workflow's runs and their jobs through the
#                    REST API. That is the only reason this scope is here; without it the poll
#                    below gets a 404 that looks exactly like "Checks has not started yet" and
#                    would wait out its full twenty minutes before failing.
permissions:
  contents: read
  actions: read

# ─── EVERY `uses:` IS A COMMIT SHA, SINCE 2026-09-03 ─────────────────────────────────────
# A version tag is mutable: the owner of an action can repoint `v4`, and the next deploy runs
# different code on the box holding this product's database credentials with no change in this
# file. The SHA is what runs; the human tag rides in a trailing comment so the line stays
# readable. `.github/dependabot.yml` is what keeps them from going stale, which is the failure
# mode pinning introduces.

# cancel-in-progress is deliberately OFF. This workflow now starts on every push to main,
# so overlapping runs are far more likely than they were with the old paths filter — and
# cancelling mid-deploy is destructive here: the remote script stops the fieldrepo service
# before running `prisma migrate deploy`, so a run killed in that window can leave the API
# down with no restart step to come. Queueing is slower and safe; cancelling is not.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # Works out which parts of the monorepo this push touched, so THIS workflow can skip work it
  # does not need. `backend` is read by the two jobs below (`needs.changes.outputs.backend`) and
  # is the only one with a consumer today; `frontend` and `android` are computed and currently
  # read by nothing, which is stated here rather than left for somebody to discover and "tidy up".
  #
  # THEY ARE KEPT DELIBERATELY, AND NOT AS A HOOK FOR A NEW GATE. They are the per-push answer, in
  # the log and the step summary, for a human reading a run and asking what it touched. Anything
  # that wants to decide whether to DEPLOY must ask what is live instead — see the note below.
  #
  # ═══ 2026-09-20: THIS WORKFLOW WAS THE NEXT VICTIM OF ITS OWN NOTE ════════════════════════
  #
  # The paragraph below was written about deploy-frontend.yml, and it ends "that gate now diffs
  # against the commit Vercel is actually serving". The BACKEND gate was not changed at the same
  # time, and on 2026-09-20 it reproduced the identical outage — the same shape, on the same day
  # of the week, for the same reason:
  #
  #     5b2d187  backend changed   deploy FAILED (Checks red on one test)
  #     591a458  backend changed   deploy FAILED
  #     89ce043  docs only         backend=false -> deploy SKIPPED -> run GREEN
  #
  # The box was left three commits behind main with every tick green, and the first thing anybody
  # saw was `GET /api/ministry-dashboard/designers` answering 404 in production while the same
  # route answered 401 from the tree. A per-push diff cannot see that: it measures what ONE PUSH
  # touched, and the question a deploy has to answer is what has changed since the box was last
  # WRITTEN TO. Those are the same number only when every deploy in between succeeded.
  #
  # `detect` now unions the push range with the range from the last commit this workflow actually
  # deployed. The union can only ever make the answer MORE true — a hole can be closed by it and
  # none can be opened — which is why it is a union and not a replacement.
  #
  # 2026-09-17: this used to also upload `changes.env` as the `pipeline-changes` artifact, because
  # downstream `workflow_run` workflows cannot read job outputs across a workflow boundary and an
  # artifact was the only channel. deploy-frontend.yml's gate was the sole consumer, and it no
  # longer wants the answer: a per-push diff says nothing about whether the LIVE SITE is up to
  # date, so once a frontend-carrying push was blocked by an unrelated backend failure, every later
  # backend-only push published `frontend=false` here and the frontend gate skipped on it —
  # forever. That is what kept production on f4f6740 for two days while main ran seven commits
  # ahead, with six "successful" frontend runs that published nothing. That gate now diffs against
  # the commit Vercel is actually serving; the full argument lives on the step that replaced the
  # download.
  #
  # THE UPLOAD IS GONE RATHER THAN LEFT AS A HARMLESS EXTRA, on purpose. An artifact named
  # `pipeline-changes` sitting in every backend run is an invitation to wire a gate back onto it,
  # and the next person to do that re-creates the outage without ever reading this. The
  # per-directory answer still exists where it is legitimate — as job outputs, scoped to the
  # workflow that computed them and to the push they describe.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - name: Checkout (full history, so both the push range and the live range can be diffed)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # ─── WHAT THIS WORKFLOW LAST ACTUALLY PUT ON THE BOX ──────────────────────────────────
      #
      # FAIL OPEN, EXACTLY AS deploy-frontend.yml's GATE DOES, AND FOR THE IDENTICAL REASON. Every
      # path that cannot answer writes an empty string, and an empty answer makes `detect` below
      # fall back to the push range alone — i.e. to the behaviour this step is fixing, which is
      # strictly no worse than what shipped before it. Over-deploying costs a build minute;
      # under-deploying cost two days on f4f6740 and, on 2026-09-20, a 404 in production.
      #
      # ⚠ "SUCCEEDED" IS NOT ENOUGH — THE `deploy` JOB MUST HAVE RUN. That is the whole finding. A
      # run whose `deploy` job was SKIPPED still concludes `success`, and treating it as deployed
      # would put the baseline on a commit the box has never seen and re-open the hole one level
      # deeper. So each candidate run's jobs are read and the one named `deploy` is required to
      # have concluded `success` itself.
      #
      # THE CURRENT RUN IS EXCLUDED BY ID. On a re-run of this very workflow the API can already
      # list it, and a baseline of "this commit" makes every diff empty — the gate would then skip
      # the deploy it exists to perform, and would do it only on re-runs, which is the worst
      # possible place for a bug to hide.
      #
      # `actions: read` is granted at the workflow level and is already what `wait-for-checks`
      # uses; this job declares no permissions of its own and needs no new secret.
      - name: Read the commit this workflow last deployed
        id: live
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions"
          live=""
          reason="no successful deploy of this workflow was found in the last 50 runs"

          # Newest first. `status=success` drops the runs that failed outright; the jobs read below
          # is what separates "deployed" from "skipped the deploy and went green anyway".
          runs="$(gh api "${api}/workflows/deploy-backend.yml/runs?status=success&per_page=50" 2>/dev/null || echo '{"workflow_runs":[]}')"
          candidates="$(printf '%s' "$runs" | jq -r --arg this "$THIS_RUN" '
            [ .workflow_runs[] | select((.id|tostring) != $this) ] | .[] | "\(.id) \(.head_sha)"
          ' 2>/dev/null || true)"

          while read -r run_id sha; do
            [ -n "${run_id:-}" ] || continue
            jobs="$(gh api "${api}/runs/${run_id}/jobs?per_page=100" 2>/dev/null || echo '{"jobs":[]}')"
            ran="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name=="deploy" and .conclusion=="success")] | length' 2>/dev/null || echo 0)"
            if [ "${ran:-0}" -gt 0 ]; then
              live="$sha"
              reason="run ${run_id} deployed ${sha}"
              break
            fi
          done <<< "$candidates"

          echo "$reason"
          echo "sha=${live}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Detect which areas changed
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # Empty whenever the step above could not answer, or died. An unwritten output reads as
          # '' and folds into the push-range-only path below, which is the pre-2026-09-20 behaviour.
          LIVE: ${{ steps.live.outputs.sha }}
          LIVE_REASON: ${{ steps.live.outputs.reason }}
        run: |
          set -euo pipefail
          # Fail SAFE: anything we cannot diff (manual dispatch, first push of a branch,
          # force-push that orphaned the old head) is treated as "everything changed", so
          # the pipeline over-deploys rather than silently skipping a real change.
          if [ "$EVENT" != "push" ] \
            || [ -z "${BEFORE:-}" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable diff range (event=$EVENT before=${BEFORE:-none}); treating all areas as changed."
            files=""
            all=true
          else
            files="$(git diff --name-only "$BEFORE" "$AFTER")"
            all=false
            echo "Changed files in this push:"; printf '%s\n' "$files"
          fi

          # ── AND EVERYTHING THE BOX HAS NOT SEEN YET ───────────────────────────────────────
          #
          # UNIONED, NEVER SUBSTITUTED. The push range answers "what did this push touch" and is
          # what the step summary reports to a human; this answers "what has changed since the box
          # was last written to", which is the only question a DEPLOY decision may be made on.
          # Adding lines to `files` can only turn an area from false to true, so this cannot
          # introduce a skipped deploy — the failure mode it exists to remove.
          #
          # `git cat-file -e` because the baseline may genuinely be absent from this checkout: a
          # force-push can orphan it, and the commit of a deploy older than the repository's
          # history rewrite is not reachable. Absent means UNKNOWN, and unknown means deploy.
          echo "Last deployed: ${LIVE_REASON:-unknown}"
          if [ "$all" != "true" ]; then
            if [ -z "${LIVE:-}" ]; then
              echo "The commit last deployed could not be read, so every area is treated as changed."
              all=true
            elif ! git cat-file -e "${LIVE}^{commit}" 2>/dev/null; then
              echo "The last deployed commit ${LIVE} is not in this checkout's history; treating all areas as changed."
              all=true
            elif [ "$LIVE" = "$AFTER" ]; then
              echo "The box is already on ${AFTER}; the push range alone decides."
            else
              undeployed="$(git diff --name-only "$LIVE" "$AFTER")"
              echo "Changed since the box was last written to (${LIVE}):"; printf '%s\n' "$undeployed"
              # A newline between them, and `printf` rather than an echo of two variables, so an
              # empty half cannot glue two filenames into one line that matches neither pattern.
              files="$(printf '%s\n%s\n' "$files" "$undeployed" | sort -u)"
            fi
          fi

          area() {
            if [ "$all" = "true" ]; then echo true; return; fi
            # A HERESTRING, NOT A PIPE — see the long note on the same construction in
            # deploy-frontend.yml's gate, caught in review on 2026-09-17. `grep -q` exits at its
            # first match; if `printf` still holds bytes the 64 KiB pipe buffer cannot take it
            # dies of SIGPIPE, `pipefail` (set at the top of this step) makes the pipeline
            # non-zero even though grep MATCHED, and this function answers `false` for an area
            # that did change. Here that silently skips an EC2 deploy for a push that touched
            # `backend/`. One push range is rarely 64 KiB of filenames, so this is far less
            # exposed than the gate's live-vs-target diff — but it is the same bug, and it gets
            # the same fix rather than an argument about why it is unlikely.
            if grep -Eq "$1" <<< "$files"; then echo true; else echo false; fi
          }
          backend=$(area '^(backend/|\.github/workflows/deploy-backend\.yml$)')
          frontend=$(area '^(frontend/|\.github/workflows/deploy-frontend\.yml$)')
          android=$(area '^(android/|\.github/workflows/android-build\.yml$)')

          printf 'backend=%s\nfrontend=%s\nandroid=%s\n' "$backend" "$frontend" "$android" \
            | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Changed areas"
            echo ""
            # NAMED IN THE SUMMARY, because the whole 2026-09-20 failure was a green run that never
            # said what it had decided or on what evidence. A reader looking at a skipped deploy
            # has to be able to see the baseline it was skipped against.
            echo "Measured against this push **and** against the commit this workflow last"
            echo "deployed — ${LIVE_REASON:-unknown}."
            echo ""
            echo "| area | changed |"
            echo "|---|---|"
            echo "| backend | $backend |"
            echo "| frontend | $frontend |"
            echo "| android | $android |"
          } >> "$GITHUB_STEP_SUMMARY"


  # ═══════════════════════════════════════════════════════════════════════════════════════
  # THE GATE THAT DID NOT EXIST UNTIL 2026-09-03
  # ═══════════════════════════════════════════════════════════════════════════════════════
  #
  # WHAT WAS WRONG. checks.yml and this workflow both fire on `push: main`, and one workflow
  # cannot `needs:` a job in another, so they raced. In practice the deploy usually WON — its
  # first real work is an rsync, while the suite is minutes of pytest — which means the ordinary
  # case was: a commit that breaks the backend reaches the production box, and the red tick that
  # says so arrives afterwards, on a run nobody is watching because the deploy already went green.
  # Every guard checks.yml exists for was, on main, advisory after the fact.
  #
  # WHAT THIS DOES. It polls the REST API for the Checks run whose head SHA is exactly the commit
  # being deployed, and waits for the three jobs that branch protection names. Success hands over
  # to `deploy`; a failure or a timeout fails the run before anything on the box is touched.
  #
  # WHY THE THREE JOBS AND NOT THE WHOLE RUN, which is the decision most worth reading here.
  # checks.yml gained a `Backend integration tests` job on the same day, which stands up a Postgres
  # service and runs the ~375 database-backed tests that have never run in CI. It is deliberately
  # NOT a required check yet (nobody has measured what it costs), and it can take far longer than
  # the whole budget of this poll. Waiting on the RUN would therefore make an advisory job into the
  # thing that decides whether production can be deployed — by accident, through a timeout, with no
  # decision recorded anywhere. Waiting on the NAMED jobs keeps the gate exactly as wide as branch
  # protection is, so promoting a job to "blocking" stays one deliberate act in one place.
  # IF THE THREE NAMES BELOW ARE RENAMED IN checks.yml, THIS GOES RED WITH A MESSAGE SAYING SO —
  # it does not silently pass, and that is on purpose.
  #
  # WHY workflow_dispatch SKIPS IT ENTIRELY. This is the documented emergency override. When the
  # site is down and the fix is known, waiting twenty minutes for a docs check is not a safety
  # property, it is an outage extended by process — and the person typing `gh workflow run` has
  # already decided. The skip is visible in the run graph, so the override leaves a trace.
  wait-for-checks:
    name: Wait for Checks on this commit
    needs: changes
    # Push only, and only when a deploy would actually follow. A frontend-only push skips this
    # for the same reason it skips `deploy` — there is nothing to gate.
    if: ${{ needs.changes.outputs.backend == 'true' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # A hair over the poll's own 20-minute budget, so the loop's error message (which names what
    # it was still waiting for) is what a reader sees rather than a bare job cancellation.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Poll for the gating jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          # The three checks.yml jobs branch protection names (see that file's header). JSON
          # because jq consumes it as a list; a shell string of names with spaces in them is how
          # this kind of loop quietly starts matching nothing.
          GATING_JOBS: '["Backend tests","Web typecheck, lint and unit specs","Docs check"]'
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions"
          # 60 × 20 s. Twenty minutes is roughly double the measured wall clock of the three
          # gating jobs, which leaves room for a queued runner without letting a stuck run hold
          # the box's deploy open indefinitely.
          for attempt in $(seq 1 60); do
            # `checks.yml` BY FILENAME. Looking the workflow up by its display name would break
            # the day somebody edits `name:` at the top of that file, and would break silently —
            # an empty result is indistinguishable from "not started yet".
            runs="$(gh api "${api}/workflows/checks.yml/runs?head_sha=${SHA}&per_page=30" 2>/dev/null || echo '{"workflow_runs":[]}')"
            # Prefer the `push` run for this SHA; fall back to whatever run exists for it. On main
            # the push run is the one that matters, but a re-run or a dispatch of Checks against
            # the same commit is just as good an answer and there is no reason to ignore it.
            run_id="$(printf '%s' "$runs" | jq -r '([.workflow_runs[] | select(.event=="push")][0] // .workflow_runs[0]) | .id // ""')"
            if [ -z "$run_id" ]; then
              echo "attempt ${attempt}/60: no Checks run for ${SHA} yet"
              sleep 20
              continue
            fi
            jobs="$(gh api "${api}/runs/${run_id}/jobs?per_page=100" 2>/dev/null || echo '{"jobs":[]}')"
            verdict="$(printf '%s' "$jobs" | jq -r --argjson want "$GATING_JOBS" '
              [ .jobs[] | select(.name | IN($want[])) ]                       as $g
              | ($want - [ $g[].name ])                                        as $missing
              | ([ $g[] | select(.status != "completed") | .name ])            as $running
              | ([ $g[] | select(.status == "completed" and .conclusion != "success") | .name ]) as $bad
              | if   ($bad | length) > 0     then "fail " + ($bad | join(", "))
                elif (($missing + $running) | length) > 0 then "wait " + (($missing + $running) | join(", "))
                else "pass" end')"
            state="${verdict%% *}"
            detail="${verdict#* }"
            case "$state" in
              pass)
                echo "Checks passed for ${SHA} — run ${run_id}"
                echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              fail)
                echo "::error::Checks failed for ${SHA} (${detail}). Not deploying. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                exit 1
                ;;
              *)
                echo "attempt ${attempt}/60: still waiting on ${detail}"
                ;;
            esac
            sleep 20
          done
          echo "::error::timed out after 20 minutes waiting for the Checks jobs on ${SHA}. Nothing was deployed. If the suite is genuinely this slow now, raise the loop bound here rather than deleting the gate; to ship past it in an emergency, run this workflow from the Actions tab — workflow_dispatch skips the wait by design."
          exit 1

  deploy:
    needs: [changes, wait-for-checks]
    # ─── THE CONDITION HAS TO NAME THE SKIP CASE EXPLICITLY ──────────────────────────────
    # Skipped (not failed) when the push did not touch backend/. A skipped job still lets
    # the workflow run finish as a success, which is what keeps the frontend stage moving
    # on a frontend-only change. Manual dispatch always deploys.
    #
    # 2026-09-03: `needs:` gained `wait-for-checks`, and that job SKIPS ITSELF on a manual
    # dispatch. GitHub's default is that a job whose dependency was skipped is skipped too —
    # which would have silently turned the emergency override into "dispatch never deploys".
    # Writing an `if` that contains a status function (`!cancelled()`) is what removes the
    # implicit `success()` and lets this job judge the results itself, so:
    #   • wait-for-checks succeeded            → deploy (the normal, gated path)
    #   • wait-for-checks was skipped          → deploy (manual dispatch, or nothing to gate)
    #   • wait-for-checks failed or cancelled  → DO NOT deploy
    if: >-
      ${{ !cancelled()
          && needs.changes.result == 'success'
          && (needs.wait-for-checks.result == 'success' || needs.wait-for-checks.result == 'skipped')
          && (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ─── OPEN A DEPLOY WINDOW ON PORT 22, FOR THIS RUNNER ONLY ───────────────────────────────
      #
      # THE DEFECT THIS EXISTS FOR. `infra/terraform/main.tf` allows SSH from a single
      # `var.ssh_ingress_cidr`, and the box was provisioned with the operator's home address of the
      # day (`49.47.131.192/32`). GitHub's runners come from Azure ranges, so every scheduled deploy
      # died at `ssh-keyscan` with exit 1 — before rsync, before the .env write, before the service
      # stop. That is a fail-SAFE failure and it is why nothing was ever half-deployed, but it also
      # meant this workflow had NEVER successfully run: the box has only ever been updated by hand,
      # from whichever network the operator was on.
      #
      # It is worse than a one-off. A pinned home IP makes deployability a property of where a person
      # is standing — the operator travels, the address changes, and the pipeline silently stops
      # working again with a red mark nobody reads as "you moved".
      #
      # SO THE RUNNER AUTHORISES ITSELF, NARROWLY AND BRIEFLY. `AWS_SG_ID` names one security group;
      # the IAM user behind `AWS_ACCESS_KEY_ID` is `designrepo-ci-sg`, whose inline policy allows
      # exactly `ec2:AuthorizeSecurityGroupIngress` and `ec2:RevokeSecurityGroupIngress` on that one
      # group ARN and nothing else in the account. The rule it adds is a /32 for THIS runner and is
      # revoked in an `if: always()` step below, so the window closes on success, on failure, and on
      # cancellation. Port 22 is never open to the world, and no human IP is ever written into it.
      #
      # WHY NOT THE ALTERNATIVES: GitHub publishes thousands of runner CIDRs and a security group
      # takes 60 rules, so the range cannot simply be allow-listed. `0.0.0.0/0` would trade a travel
      # problem for a permanently exposed port.
      #
      # ─── THE PARAGRAPH THAT USED TO END HERE HAS BEEN OVERTAKEN BY EVENTS ────────────────────
      #
      # It read: "SSM Session Manager removes inbound SSH entirely and is the better end state, but
      # it needs an instance profile and an agent on a box that is currently serving traffic — a
      # migration, not a workflow edit." The first half was right and the second half was wrong, so
      # it is corrected rather than deleted: attaching an instance profile is an IN-PLACE update on
      # a running instance, and the SSM agent ships already running in the Ubuntu 24.04 AMI. It was
      # done on 2026-08-30 with no downtime and no reboot — `designrepo-ssm`, declared in
      # `infra/terraform/main.tf` — and `aws ssm start-session --target i-0e091ca8e6b417b52` now
      # opens a shell on the box from any network.
      #
      # THE STATIC PORT-22 RULE WAS THEN DELETED FROM THE SECURITY GROUP, which is what makes this
      # step load-bearing rather than belt-and-braces. There is no standing SSH access to this box
      # for anybody; this window, opened for one runner and revoked in the `if: always()` step
      # below, is the ONLY time port 22 is open at all. If that step is ever removed or allowed to
      # fail silently, the group keeps a live rule for a machine that no longer exists.
      #
      # THIS JOB WAS NOT MIGRATED TO SSM ALONGSIDE IT, AND THAT IS A DECISION RATHER THAN AN
      # OVERSIGHT. `rsync` and the piped `.env` write both want a real SSH transport; doing them
      # over SSM means either `AWS-StartSSHSession` as a ProxyCommand — which still needs the deploy
      # key, and buys nothing once the window is already narrow and self-revoking — or rewriting the
      # sync as an S3 round trip, which is a larger change to the one workflow that must not break.
      # The window is 60 seconds of a /32 that AWS itself reported; SSM's advantage over it is
      # marginal, whereas SSM's advantage over a pinned HOME address was the whole point.
      - name: Open the deploy window for this runner
        id: sgwindow
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          SG_ID: ${{ secrets.AWS_SG_ID }}
        run: |
          set -euo pipefail
          # checkip is AWS's own and answers the address AWS will see, which is the one that has to
          # match the rule. Reading it from the runner rather than from a range list is what makes
          # this independent of where anybody is.
          ip="$(curl -fsS --max-time 15 https://checkip.amazonaws.com | tr -d '[:space:]')"
          case "$ip" in
            *[!0-9.]*|"") echo "refusing to authorise a malformed address: '$ip'"; exit 1 ;;
          esac
          echo "runner=$ip"
          echo "cidr=${ip}/32" >> "$GITHUB_OUTPUT"
          # Idempotent: a duplicate rule left by a killed run makes this call fail, and that must not
          # fail the deploy — the rule being present is the state we wanted.
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${ip}/32,Description='github-actions deploy window'}]" \
            2>&1 | tail -5 || echo "authorize returned non-zero (likely InvalidPermission.Duplicate) — continuing"

      - name: Start ssh-agent with the deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # ─── KEEPALIVES, AFTER A DEPLOY DIED TWICE ON A CONNECTION NOBODY WAS USING ──────────────
      #
      # 2026-09-17, the incident in which production sat on f4f6740 for two days while main was
      # seven commits ahead. The frontend was stranded because the BACKEND deploy was red, and the
      # backend deploy was red because of this: run 35145291959 ran three times, and ALL THREE
      # attempts ended mid-step with
      #
      #     client_loop: send disconnect: Broken pipe
      #     ##[error]Process completed with exit code 255
      #
      # after long stretches of OUTPUT SILENCE. Exit 255 is ssh's own "the transport died", not the
      # remote command's status — the step that was running had not failed, the pipe under it had.
      #
      # WHERE EACH ONE DIED, read off the jobs API rather than guessed, because the first draft of
      # this comment guessed and got it wrong: attempts 1 and 3 died in step 15 (the Prisma client
      # import and model-accessor check) at 286.8 s and 281.2 s, with step 16 never starting.
      # Attempt 2 got PAST step 15, applied all three migrations, flipped the symlink at 20:32:18Z
      # — and then died in step 16's /health poll after 299.6 s. So all three drops sit at roughly
      # 280-300 s of silence in two DIFFERENT steps, which is the other half of the picture:
      # whatever kills them is timing, not the work. Both of those steps are heartbeated below.
      #
      # THE TWO COMFORTABLE EXPLANATIONS ARE BOTH RULED OUT AND ARE NOT TO BE RE-LITIGATED. It is
      # not a timeout: this job declares no `timeout-minutes` at all, the runner default is six
      # hours, and the run lasted 6m19s. It is not memory: the pre-deploy swap reading on the
      # failing attempt (`/swapfile file 2G 1G -2`) is identical to the reading on the last fully
      # green deploy, and the swap step above is `continue-on-error` precisely because it is tuning.
      #
      # WHAT IS LEFT IS AN IDLE FLOW, AND THIS IS A HYPOTHESIS WRITTEN DOWN AS ONE. Both numbers sit
      # just past four minutes, and four minutes is the default outbound idle timeout of the Azure
      # SNAT that every GitHub-hosted runner leaves through. A middlebox that has forgotten a flow
      # sends no RST anybody sees; the next WRITE after the silence is what discovers it, which is
      # exactly the shape of "broken pipe on send". Nothing in the logs proves where the flow was
      # dropped, because nothing was measuring. The heartbeats added further down this file, and the
      # post-mortem step before the deploy window closes, are what will confirm this or kill it. Do
      # not read this change landing green as the cause being proven.
      #
      # ServerAliveInterval 30 makes the question moot either way: after 30 s with nothing received,
      # ssh sends an encrypted keepalive the peer must answer, so the flow is never idle for longer
      # than 30 s and no NAT entry between here and the box can age out under it. Thirty seconds
      # against a four-minute window is an eightfold margin — chosen for margin, not from
      # measurement, because there may be a shorter timer in the path that nobody has found yet.
      #
      # ServerAliveCountMax 10 is the other half and is deliberately generous: 10 × 30 s is five
      # minutes of unanswered probes before ssh gives up. A t3.micro that has spent its CPU credits
      # runs at 10% of one core and can genuinely stop answering for a long time; tearing the deploy
      # down at the first missed probe would turn a slow box into a failed deploy, which is the
      # exact failure this change exists to stop causing.
      #
      # TCPKeepAlive IS ALREADY THE DEFAULT AND IS NOT THE FIX. It is written here anyway because a
      # reader who sees ServerAlive* will ask, and the answer belongs beside the question: TCP
      # keepalive fires on the kernel's timer, and Linux's tcp_keepalive_time is 7200 seconds — the
      # first probe would arrive two hours after this job has ended. Only the application-level
      # ServerAlive* keepalive runs on a timescale that matters here.
      #
      # ─── WHY A CONFIG FILE AND NOT `-o` ON EACH COMMAND ──────────────────────────────────────
      #
      # This job opens TWELVE ssh sessions and three rsyncs, plus the keyscan below. The line
      # numbers that used to be listed here are gone on purpose: they were stale within a week of
      # being written, and a census that has to be re-derived to be trusted is not a census. The
      # twelfth session is the live-tree check in the sync step, added 2026-09-17 — see it for why it
      # is a separate round trip immediately before the write rather than a flag on an existing one.
      # Putting flags on each one is sixteen places to get right today and a seventeenth that
      # somebody adds next month without them — and the sixteenth is the one that will drop, because
      # a rule that has to be remembered is not a rule. A `Host *` block is read by ssh AND by the
      # ssh that rsync shells out to, so one edit covers every invocation in this file, including
      # the ones not written yet. (If you ever do need it per-call, the rsync form is
      # `-e "ssh -o ServerAliveInterval=30 …"`, not a bare `-o`; rsync has no `-o` of its own and
      # would hand it to the remote shell.)
      #
      # `Host *` RATHER THAN THE HOSTNAME, ON PURPOSE. This runner is destroyed when the job ends
      # and has exactly one SSH destination, so a wildcard cannot leak settings anywhere, and it
      # survives the host being spelled as an IP in one place and a DNS name in another. ssh takes
      # the FIRST value it finds for each keyword, so a more specific block appended after this one
      # would win — if a future step adds one, put these keywords in it too.
      #
      # BatchMode IS NOT COSMETIC. A runner has no terminal, so any prompt ssh decides to show — an
      # unknown host key, a passphrase — is not an error, it is a hang that burns the job until
      # somebody cancels it. BatchMode turns every one of those into an immediate non-zero exit.
      # Host-key policy is deliberately NOT touched: the keyscan below is what makes this host
      # known, and `StrictHostKeyChecking=no` would throw that away to fix a problem this file does
      # not have.
      #
      # `set -euo pipefail` IS LOAD-BEARING AND IS NEW. Without it a step's status is its LAST
      # command's — so the moment anything is written after `ssh-keyscan`, a keyscan failure stops
      # failing the step. That failure is this deploy's oldest fail-safe (see the pinned-home-IP
      # paragraph above: every run died at keyscan, which is why nothing was ever half-deployed).
      - name: Add EC2 host to known_hosts, and set the SSH keepalives every step below inherits
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<'SSHCFG'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
            BatchMode yes
            ConnectTimeout 30
          SSHCFG
          chmod 600 ~/.ssh/config

          # PROVED, NOT TRUSTED. `ssh -G` prints the options ssh would actually use for this
          # destination after every config file has been merged, which is the only way to notice
          # that something else on this runner wrote a `Host *` block first and won the
          # first-value-wins race. It evaluates config without connecting, so it costs nothing.
          echo "--- effective ssh options for the deploy host ---"
          ssh -G "ubuntu@${{ secrets.EC2_HOST }}" > /tmp/sshopts || true
          grep -iE '^(serveraliveinterval|serveralivecountmax|tcpkeepalive|batchmode|connecttimeout) ' /tmp/sshopts || true

          # A WARNING AND NOT A FAILURE, DELIBERATELY. Every other refusal in this job asserts that
          # the RELEASE is fit to serve. This one asserts that a network-hygiene setting applied,
          # and if it did not, the worst case is the behaviour every deploy had before 2026-09-17 —
          # which shipped. Failing here would mean a keepalive that did not take could stop the only
          # publisher this backend has, including the manual dispatch that is the emergency override
          # (see the `if:` on this job). The log line is what a reader needs; the red X is not.
          grep -qix 'serveraliveinterval 30' /tmp/sshopts || \
            echo "::warning::~/.ssh/config did not take effect — ssh takes the FIRST value it finds for a keyword and something on this runner set ServerAliveInterval before this block. Every ssh and rsync below will run without an application-level keepalive, which is what dropped this deploy twice on 2026-09-17. Deploying anyway; fix the config ordering."

      # ─── THIS DEPLOY'S RELEASE DIRECTORY IS NAMED FOR THE RUN, NOT FOR THE COMMIT ────────────
      #
      # 2026-09-17, and this is a production-safety fix rather than tidying. Release directories were
      # `releases/<sha>`, and a RE-RUN is the same commit — so every attempt after the first deployed
      # into the directory the previous attempt had already flipped `current` onto. `rsync -az
      # --delete` then rewrote and removed files for minutes INSIDE the tree uvicorn and
      # fieldrepo-queue were executing out of, live, under traffic. That is what the re-runs of run
      # 35145291959 did while we were chasing the broken pipe: attempt 2 flipped the symlink at
      # 20:32:18Z, and attempt 3 rsynced --delete into that same directory from 20:38:53Z until the
      # pipe broke. Nothing broke on the box, because nothing happened to import a module during the
      # window. That is luck, and luck is not a control.
      #
      # `<sha>-<run_id>.<run_attempt>` MAKES IT IMPOSSIBLE RATHER THAN UNLIKELY. Every attempt of
      # every run gets a directory that has never existed, so `current` cannot already point at it —
      # the sync, the venv build and the client install all happen in a tree nothing is serving, and
      # the release becomes live at the symlink flip and not one second earlier, which is what the
      # release layout was built for. The full SHA stays at the front so `ls releases/` still answers
      # "which commit is this" at a glance.
      #
      # WHAT IT COSTS, NAMED HERE RATHER THAN DISCOVERED LATER:
      #   • A re-run no longer inherits the live release's venv in place; it takes the `cp -a` branch
      #     beside it instead. That branch is gated on `requirements.lock` and `pyproject.toml`
      #     comparing equal against the LIVE release — which for a re-run is the previous attempt of
      #     the same commit, through the same rsync, so they are byte-identical and it always fires.
      #     Nothing moves from copying to `pip install`; the ordinary deploy path is untouched.
      #   • A failed or cancelled attempt leaves a directory behind until a later successful deploy
      #     prunes it, and that directory carries the `.env` it was deployed with. The prune step
      #     below sweeps never-released directories for exactly that reason; docs/SECURITY.md's
      #     credential-rotation runbook is updated to count them.
      #   • Rollback by hand becomes `ln -sfn releases/<sha>-<run_id>.<attempt> current` — a longer
      #     name to type. `ls -lt releases/` is still how anybody finds it.
      #
      # WRITTEN TO $GITHUB_ENV ONCE AND READ EIGHT TIMES. Eight copies of the same expression is
      # eight chances for one to drift, and two steps deploying into two different directories is a
      # failure that would look like almost anything else. The consuming steps keep the variable name
      # `SHA`: there it is ONLY ever used to build a release path — eighteen references on seventeen
      # lines, six inside the six remote blocks and twelve on the runner side of the ssh invocation,
      # every one of them a path component and not one of them a commit — and renaming it means
      # editing all eighteen to correct a word. Rename it in its own commit if it bothers you; do not
      # mix a rename into a safety fix. (The two `${{ github.sha }}` uses that DO name a commit are
      # in `wait-for-checks` and `changes`, in other jobs. They must not move.)
      #
      # `GITHUB_SHA`, `GITHUB_RUN_ID` and `GITHUB_RUN_ATTEMPT` are default runner variables, present
      # in every step without an `env:` block. RUN_ATTEMPT is the one that matters: it increments on
      # both "re-run all jobs" and "re-run failed jobs", which is the case the incident came from,
      # and a fresh `gh workflow run` on an unchanged main gets a new RUN_ID, which is the case a
      # sync guard on its own would have refused.
      - name: Name this deploy's release directory
        run: |
          set -euo pipefail
          rel_id="${GITHUB_SHA}-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          # AN EMPTY RELEASE ID IS THE ONE OUTCOME THAT MUST NOT REACH THE BOX. `releases//backend`
          # is a path `mkdir -p` accepts perfectly happily, and the whole deploy would then build,
          # verify and flip into a directory nobody meant — green the entire way. The pattern list
          # also keeps the id free of anything that would change meaning in the `case` GLOB the
          # client-install step matches it against: `-` and `.` are literal in a pattern, `*`, `?`
          # and `[` are not, and hex-plus-digits cannot produce them.
          case "$rel_id" in
            ""|-*|*"//"*|*" "*|*"*"*|*"?"*|*"["*) echo "::error::refusing to deploy with a malformed release id '$rel_id'"; exit 1 ;;
          esac
          echo "REL_ID=$rel_id" >> "$GITHUB_ENV"
          echo "this deploy builds /home/ubuntu/app/releases/$rel_id"

      # ═══════════════════════════════════════════════════════════════════════════════════
      # THE RELEASE LAYOUT — ADDED 2026-09-03, AND EVERY PATH BELOW MOVED WITH IT
      # ═══════════════════════════════════════════════════════════════════════════════════
      #
      # WHAT THIS DEPLOY USED TO BE. `rsync --delete` straight over /home/ubuntu/app/backend, then
      # `pip install`, then `systemctl stop`, then migrate, then restart. Two properties of that
      # are worth naming because they are what changed:
      #
      #   1. THERE WAS NO PREVIOUS VERSION ON THE BOX. The rsync overwrote it. So "roll back" meant
      #      "find the last good commit, push a revert, and wait for a whole deploy" — minutes of
      #      outage while somebody works out which commit that was, during the incident the bad
      #      deploy just caused. A deployment scheme whose recovery path is another deployment has
      #      no recovery path.
      #   2. EVERY DEPLOY STOPPED THE APP, whether or not it needed to. The stop is there for a real
      #      reason (see the migrate step: the schema engine cannot get a session while uvicorn
      #      holds the pooler's clients), but it is a reason that applies ONLY when a migration is
      #      pending, which most deploys are not. Every no-op code change bought an outage of
      #      however long `pip install` plus `prisma generate` plus a cold start takes on a
      #      CPU-credit-throttled t3.micro — measured in minutes, not seconds.
      #
      # WHAT IT IS NOW.
      #
      #   /home/ubuntu/app/releases/<sha>-<run>.<n>/backend/   one directory per deploy ATTEMPT, venv inside
      #   /home/ubuntu/app/current -> releases/<sha>-<run>.<n>  the symlink both systemd units point through
      #   /home/ubuntu/app/backend                              the LEGACY tree, left alone; see the shim below
      #
      # THE DIRECTORY IS NAMED FOR THE RUN AND NOT FOR THE COMMIT, since 2026-09-17 — see the "Name
      # this deploy's release directory" step above for the live-tree rsync that forced it.
      #
      # Rolling back is now `ln -sfn releases/<older-release> current && systemctl restart fieldrepo
      # fieldrepo-queue`, by hand over SSM, in seconds, with no build and no network. `ls -lt
      # /home/ubuntu/app/releases` names the candidates newest-first. The last three
      # releases are kept, so "the one before this one" is always there. NOTE THE ONE THING A
      # SYMLINK FLIP CANNOT UNDO: a migration that has already been applied. The schema only ever
      # moves forward, so rolling the CODE back is only safe while the older code tolerates the
      # newer schema — which is why the migrate branch below refuses to flip forward on failure
      # rather than trying to be clever about going backwards.
      #
      # ─── FIRST-RUN AND REPEAT-RUN FAILURE MODES, WRITTEN DOWN BECAUSE THEY ARE THE ONES ────
      # ─── A DEPLOY WORKFLOW ONLY EVER HITS ONCE, ON THE DAY IT MATTERS ──────────────────────
      #
      #   • EMPTY releases/ AND NO SYMLINK, WITH A LIVE LEGACY TREE. This is the state of the box
      #     the first time this workflow runs, and it is the dangerous one: the step below installs
      #     systemd drop-ins that point at `current`, so if `current` did not exist the units would
      #     be rewritten to a path that resolves to nothing and the next restart — including an
      #     automatic one, `Restart=always` — would leave the API down. The shim runs FIRST and
      #     makes `current` resolve to the running code before anything else happens.
      #   • NO LEGACY TREE EITHER (a rebuilt box). `current` is pointed at an EMPTY
      #     `releases/bootstrap`, which exists only so the systemd drop-ins below are not written
      #     against a path that resolves to nothing. It is NOT this run's release, and that is the
      #     whole point: since 2026-09-17 the sync step refuses to rsync into whatever `current`
      #     resolves to, so pointing the shim at this run's directory — which is what it used to do —
      #     would make the guard fire on the first deploy to every rebuilt box. Nothing is started
      #     until the restart step at the end, by which time `current` has flipped onto a real
      #     release and the prune has reclaimed the bootstrap.
      #   • THE SAME COMMIT DEPLOYED TWICE (a re-run, or `gh workflow run` on an unchanged main).
      #     THE PARAGRAPH THAT STOOD HERE WAS WRONG IN THE EXPENSIVE DIRECTION, so it is corrected
      #     rather than deleted. It said the release directory "already exists and is the one
      #     `current` already points at", that "rsync into it is idempotent", and that "every step
      #     below is written to survive this". The first clause was true and WAS the defect; the
      #     second is true only of the END state; the third was never tested.
      #
      #     WHAT ACTUALLY HAPPENED, on the re-runs of run 35145291959 on 2026-09-17: attempt 2
      #     flipped `current` onto `releases/<sha>` at 20:32:18Z, and from 20:38:53Z attempt 3 ran
      #     `rsync -az --delete` into that same directory until the pipe broke — deleting and
      #     rewriting source files under a live interpreter that imports modules lazily, the first
      #     time a route asks for one. Idempotent in its end state is not the property that matters
      #     when the intermediate state is being served to users.
      #
      #     SO THE CASE NO LONGER EXISTS. The release directory is named for the RUN ATTEMPT, so a
      #     re-run builds a new directory beside the live one and `current` moves onto it only after
      #     every check has passed. A case that cannot arise needs no step "written to survive it",
      #     which is a much cheaper promise to keep than the one this paragraph used to make.
      #   • A HALF-FINISHED RELEASE from a cancelled run. It is never flipped to, so it is inert. It
      #     is pruned when three newer releases exist. It is not cleaned up eagerly, on purpose: a
      #     directory nobody points at costs disk, and deleting things during a deploy is how a
      #     deploy deletes the wrong thing.
      # ─── SWAP, BECAUSE THE GENERATOR DOES NOT FIT IN THIS BOX ──────────────────────────────
      #
      # `prisma generate` was OOM-KILLED on 2026-09-15 and the deploy log said only:
      #
      #     Error: Generator "prisma-client-py" failed:
      #     Killed
      #
      # "Killed" with no other word is the kernel OOM killer. The API runs on a t3.micro -- 1 GiB
      # of RAM, no swap by default -- and prisma-client-py builds the whole client in memory before
      # writing it: ~100 models at `recursive_type_depth = 5` is a types.py of several megabytes and
      # a peak far above what is free beside uvicorn and the worker.
      #
      # THIS IS WHY THE CLIENT WENT STALE, and the reason it was invisible for a day is worse than
      # the crash. On the deploy that actually shipped the outage the generator did NOT die -- it
      # ran, and wrote into the PREVIOUS release's venv, so the step exited 0 with a tick beside it
      # and the release kept the client that had been copied into it. Between "it silently wrote to
      # the wrong place" and "it is silently killed", every outcome except the correct one was
      # green. The assertion added beside the generate step closes the reporting half; this closes
      # the resource half.
      #
      # 2 GiB, which is the conventional 2x for a 1 GiB instance and nothing to do with the
      # generator's exact peak -- the point is headroom, not a measured figure. The root volume is
      # 30 GiB with three releases kept, so the space is not interesting.
      #
      # IDEMPOTENT AND NEVER FATAL. It does nothing when swap is already on, and a box that refuses
      # it (no sudo, a full disk, a hardened image) still deploys -- the generate assertion is what
      # decides whether the release is fit to serve, and a deploy must not fail because a tuning
      # step could not run. `/etc/fstab` gets the entry so a reboot does not quietly undo it, and
      # the grep guard keeps a second entry from being appended on every deploy.
      - name: Ensure the box has swap, so the client generator is not OOM-killed
        continue-on-error: true
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -uo pipefail
          if [ "$(swapon --show --noheadings | wc -l)" -gt 0 ]; then
            echo "swap already active:"; swapon --show
            exit 0
          fi
          echo "no swap active — creating /swapfile (2 GiB)"
          sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          echo "swap now:"; swapon --show
          free -h
          REMOTE

      - name: Prepare the release layout and the systemd units
        env:
          # The per-run release id, not the bare commit — see "Name this deploy's release directory".
          # The name stays `SHA` because inside the remote block it is only ever a path component.
          SHA: ${{ env.REL_ID }}
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          # `set -u` above catches an UNSET SHA; it does not catch an EMPTY one, and empty is the
          # failure this has. If the "Name this deploy's release directory" step is ever deleted or
          # renamed, `${{ env.REL_ID }}` resolves to the empty string, every path below becomes
          # `/home/ubuntu/app/releases//backend`, `mkdir -p` creates it without a word, and the
          # deploy goes green into a directory nobody meant. One line stops that here, in the first
          # block that touches a release path, rather than at the symlink flip.
          [ -n "${SHA:-}" ] || { echo "::error::the release id is empty — the 'Name this deploy's release directory' step did not run or did not write REL_ID. Refusing to build a release at /home/ubuntu/app/releases//backend."; exit 1; }
          APP=/home/ubuntu/app
          REL="$APP/releases/$SHA"
          mkdir -p "$APP/releases"

          # ── THE ONE-TIME MIGRATION SHIM ──────────────────────────────────────────────────
          # `ln -s` to the legacy tree rather than `cp -a` of it, deliberately. A copy would
          # duplicate a venv whose scripts carry absolute paths to the directory they were built
          # in, and would take minutes of disk I/O on a box that is serving traffic, to produce a
          # bootstrap release nothing will point at again after today. The symlink makes
          # `current/backend` resolve to exactly the tree that is running RIGHT NOW — which is the
          # only property the shim needs — and costs nothing. `rm -rf releases/bootstrap` later
          # removes the link and not the legacy tree; rm does not follow symlinks.
          if [ ! -e "$APP/current" ] && [ -d "$APP/backend" ]; then
            echo "first run on a box with the old layout: seeding releases/bootstrap from $APP/backend"
            mkdir -p "$APP/releases/bootstrap"
            ln -sfn "$APP/backend" "$APP/releases/bootstrap/backend"
            ln -sfn "$APP/releases/bootstrap" "$APP/current.tmp"
            mv -Tf "$APP/current.tmp" "$APP/current"
          fi
          if [ ! -e "$APP/current" ]; then
            # 2026-09-17: this used to point `current` at THIS RUN'S release directory. That was
            # harmless while it was only a dangling placeholder — and it stopped being harmless the
            # moment the sync step started refusing to `rsync --delete` into whatever `current`
            # resolves to. `mkdir -p "$REL/backend"` made the target real, so on a rebuilt box
            # `readlink -f current` canonicalized to exactly the rsync destination, the guard would
            # have fired, and NO DEPLOY TO A FRESHLY REBUILT BOX COULD EVER SUCCEED: a
            # disaster-recovery path broken by a safety check, which is the worst possible place to
            # put one. Per-run naming does not save it — the shim and the rsync are in the same run
            # and share one release id.
            #
            # An EMPTY bootstrap release keeps the only property the shim actually needs — that
            # `current` resolves to something, so the drop-ins below are not written against a path
            # that does not exist — and it can never collide with a release directory, because no
            # deploy is ever named `bootstrap`. It is the same name the legacy branch above uses,
            # deliberately: one bootstrap concept, not two. It carries no interpreter, so the
            # backfill below will not offer it as a rollback target; `current` moves off it at the
            # flip, and the prune's second pass reclaims it.
            echo "no legacy tree either — pointing current at an empty bootstrap release"
            mkdir -p "$APP/releases/bootstrap/backend"
            ln -sfn "$APP/releases/bootstrap" "$APP/current.tmp"
            mv -Tf "$APP/current.tmp" "$APP/current"
          fi
          mkdir -p "$REL/backend"
          echo "current -> $(readlink "$APP/current")"

          # ─── WHO IS A ROLLBACK CANDIDATE, WRITTEN DOWN ONCE A DEPLOY ────────────────────────
          # 2026-09-17: the prune step at the end of this job ranks rollback candidates by a
          # `.released` marker rather than by mtime — see its comment for why per-attempt directories
          # broke the old "keep three" rule. Whatever `current` resolves to right now has by
          # definition been live, so mark it. This also covers the recovery action this file
          # documents but does not perform: a hand rollback over SSM does not go through `flip()`,
          # and this is where the release an operator deliberately moved onto gets its marker back.
          #
          # THE TWO TESTS ARE NOT DECORATION, AND NEITHER IS A NAME TEST. A rollback target is a
          # directory somebody can point `current` at and restart into, so it must have its own
          # interpreter AND its own tree:
          #   • the EMPTY bootstrap on a rebuilt box has no interpreter — marking it would offer a
          #     directory with no code as one of the three candidates `ls -lt releases/` lists, and
          #     picking it takes the API down with the documented recovery command, on a box that was
          #     just rebuilt. That is the exact shape of failure this whole change removes;
          #   • the LEGACY bootstrap passes `-x` THROUGH ITS SYMLINK to /home/ubuntu/app/backend, so
          #     `-x` alone is not enough. It is a pointer at a pre-layout tree whose venv came from
          #     unpinned ranges and whose Prisma client predates the release layout — not a release,
          #     and not something to hand an operator mid-incident. `! -L` is what separates them.
          # A box that has never completed a deploy has no rollback target, and saying so is honest.
          cur="$(readlink -f "$APP/current")"
          if [ -x "$cur/backend/.venv/bin/python" ] && [ ! -L "$cur/backend" ]; then
            touch "$cur/.released" 2>/dev/null || true
          else
            echo "not marking $cur as a rollback candidate: it is a bootstrap pointer, not a release this pipeline built"
          fi

          # ONE TIME ONLY, AND THE SENTINEL IS WHAT MAKES IT ONE TIME. Every directory already on
          # this box predates the marker, so the prune's second pass would read all of them as
          # "built, never went live" and sweep the entire rollback history on the first deploy after
          # this change — leaving one candidate where the policy promises three.
          #
          # WITHOUT THE SENTINEL THIS RULE WOULD BE PERMANENT AND WRONG: an attempt that failed AT
          # the migration has a complete venv too, and marking those every run would put half-built
          # trees straight back into the ranking, which is the defect the marker exists to remove.
          # The sentinel is written even if this run later fails, which is deliberate and harmless:
          # the markers were written in the same block and survive on disk. Do NOT "fix" this by
          # moving the sentinel after the flip — that makes the one-time pass run again on every
          # failed deploy, which is exactly the permanence it exists to prevent.
          #
          # `touch -r "$d"`, NOT A BARE `touch`. The prune ranks releases by their marker's mtime, so
          # stamping every backfilled marker with this instant would tell it that five old releases
          # all went live in the same second, in whatever order `find` happened to walk them.
          # Inheriting the directory's timestamp keeps the real chronology. Measured on a mock tree:
          # with a bare touch the first post-change prune deleted the INCUMBENT release, because two
          # older directories marked a fraction of a second later outranked it.
          if [ ! -e "$APP/.released-backfill-done" ]; then
            find "$APP/releases" -maxdepth 1 -mindepth 1 -type d -print \
              | while IFS= read -r d; do
                  if [ -e "$d/.released" ]; then continue; fi
                  if [ -x "$d/backend/.venv/bin/python" ] && [ ! -L "$d/backend" ]; then
                    echo "backfill: marking $(basename "$d") as released (predates the marker, has an interpreter and a tree of its own)"
                    touch -r "$d" "$d/.released" 2>/dev/null || true
                  else
                    echo "backfill: leaving $(basename "$d") unmarked (nothing a rollback could restart into)"
                  fi
                done
            : > "$APP/.released-backfill-done"
          fi

          # ── SYSTEMD: DROP-INS, NOT REPLACEMENT UNITS ─────────────────────────────────────
          # The base units are written by infra/terraform/user_data.sh at FIRST BOOT ONLY, so the
          # live box's copies are whatever was laid down the day it was created — possibly with a
          # hand edit on top from the months this pipeline could not reach the box at all.
          # Overwriting them wholesale would silently discard that. Drop-ins override exactly the
          # directives that had to move and leave everything else — KillMode=control-group,
          # RestartSec=10, TimeoutStopSec, the Description — exactly as it was. Undoing this is
          # `rm -rf /etc/systemd/system/fieldrepo*.service.d && systemctl daemon-reload`.
          #
          # user_data.sh has been updated to bake the same paths and limits into the base units, so
          # a REBUILT box matches a deployed one without needing this step to have run. The two are
          # deliberately redundant; they are not allowed to disagree.
          #
          # ── THE QUEUE FLAG IS RESTATED HERE, AND IT IS NOT THE GUARANTEE IT LOOKS LIKE ────────
          # THE PRECEDENCE TRUTH FIRST, BECAUSE THIS COMMENT USED TO STATE IT BACKWARDS. It said
          # systemd applies Environment= and EnvironmentFile= "in the order they appear across the
          # merged unit — LATER WINS", and therefore that putting `Environment=…=false` after the
          # EnvironmentFile= line kept `false` on the winning side. systemd does not work that way.
          # systemd.exec(5) is explicit: the files named by EnvironmentFile= are read shortly before
          # the process is executed and "settings from these files override settings made with
          # Environment=" — WHATEVER THE TEXTUAL ORDER. Order decides only which of several
          # EnvironmentFile= lines wins against the others. So a `.env` carrying
          # MEDIA_QUEUE_WORKER_ENABLED=true beats the line below, in this drop-in and in the base
          # unit alike, and always has.
          #
          # WHAT THE LINE IS STILL FOR. It is the DEFAULT for a `.env` that omits the key, and that
          # is worth having: `app/core/config.py` now defaults the flag to false too, so this is
          # documentation and defence-in-depth rather than the only thing standing between uvicorn
          # and a second queue drain. What it is NOT is protection against a `.env` that sets the
          # key. Keep it; do not rely on it; do not delete it because "the .env does not set it".
          #
          # SO THE CONVENTION IS ENFORCED BY THE PIPELINE INSTEAD. The step named "Refuse a .env
          # that would start a second queue drain", immediately after the .env is written, fails the
          # deploy if the secret ever gains a truthy value for this key — which is the only place
          # the guarantee can actually be made, because it is the only place that can see the file.
          # What it prevents is a second drain inside uvicorn beside fieldrepo-queue: two ffmpeg
          # workloads and two paid transcription runs on a 1 GiB box sized for one, a starved
          # health-ping, a SIGKILLed worker, orphaned Prisma query-engines, and a pooler at its
          # client ceiling answering 500 to every login. user_data.sh tells the same story from the
          # base unit's side.
          changed=0
          write_dropin() {
            dir="/etc/systemd/system/$1.d"
            sudo mkdir -p "$dir"
            tmp="$(mktemp)"
            cat > "$tmp"
            # `cmp` rather than an unconditional copy so a redeploy that changes nothing does not
            # daemon-reload for nothing, and so the log says which of these actually moved.
            if sudo cmp -s "$tmp" "$dir/$2"; then
              echo "unchanged $dir/$2"
            else
              sudo cp "$tmp" "$dir/$2"
              sudo chmod 0644 "$dir/$2"
              changed=1
              echo "installed $dir/$2"
            fi
            rm -f "$tmp"
          }

          write_dropin fieldrepo.service 10-release-layout.conf <<'CONF'
          [Service]
          WorkingDirectory=/home/ubuntu/app/current/backend
          EnvironmentFile=
          EnvironmentFile=/home/ubuntu/app/current/backend/.env
          Environment=MEDIA_QUEUE_WORKER_ENABLED=false
          ExecStart=
          ExecStart=/home/ubuntu/app/current/backend/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1
          CONF

          write_dropin fieldrepo-queue.service 10-release-layout.conf <<'CONF'
          [Service]
          WorkingDirectory=/home/ubuntu/app/current/backend
          EnvironmentFile=
          EnvironmentFile=/home/ubuntu/app/current/backend/.env
          ExecStart=
          ExecStart=/home/ubuntu/app/current/backend/.venv/bin/python -m app.worker
          CONF

          # ── THE MEMORY GUARDRAILS ────────────────────────────────────────────────────────
          # This is a t3.micro: 1 GiB of RAM and a 2 GiB swap file. The queue worker runs ffmpeg and
          # AI transcription, and a single large audio job can take it well past what is left after
          # uvicorn, Postgres client buffers and the kernel. Unbounded, the kernel's OOM killer picks
          # the victim — and it does not pick the greedy one, it picks by badness score, which on
          # this box has meant uvicorn dying because the QUEUE was hungry. The API then 502s for a
          # reason that appears nowhere in its own logs.
          #
          # MemoryHigh is a SOFT ceiling: over it the cgroup is throttled and reclaimed aggressively,
          # so a heavy job gets slow instead of getting everything else killed. MemoryMax is the hard
          # stop and only the queue has one — over it the queue's own process is killed, which is
          # recoverable (Restart=always, and the job is retried) in a way that losing uvicorn is not.
          # uvicorn deliberately has NO MemoryMax: killing the API to save memory is the outcome
          # these limits exist to prevent.
          #
          # ─── RESIZED FOR t3.small ON 2026-09-17, AND THE OLD NUMBERS WERE A TOURNIQUET ───────
          #
          # These were 500M (API) and 400M/550M (queue): "chosen so the two soft ceilings plus
          # headroom fit inside 1 GiB", and explicitly "a first setting, not a measurement". The
          # measurement finally arrived, and it says the first setting was too small for the API.
          #
          # WHAT HAPPENED. The backend deploy failed on 2026-09-17 because the API would not answer
          # /health on its own loopback inside five minutes. The box was thrashing — 1 GiB in swap,
          # ~14 MB/s paging both ways, 85% iowait — and `systemctl status fieldrepo` showed why:
          #
          #     Memory: 499.9M (high: 500.0M available: 100.0K peak: 500.4M swap: 483.9M)
          #
          # Pinned to the ceiling, with 484 MB of the cgroup pushed into swap. The instant the
          # ceiling was raised the same process settled at 634 MB and the service came up in under
          # 25 seconds instead of six minutes. THE API WANTS ~634 MB. It was never given it, so it
          # ran every request through swap and called that normal.
          #
          # This is why the box moved to t3.small the same day (infra/terraform/main.tf carries the
          # vmstat figures): 634 MB for uvicorn alone does not fit in 911 MiB beside a 400M queue
          # worker, nginx and the kernel, and no arrangement of soft ceilings makes it fit. Raising
          # these on the 1 GiB box would have swapped a throttled API for an OOM-killed one.
          #
          # THE SIZING, ON 1906 MiB OF USABLE RAM. 1000M soft for the API — ~1.6x its measured
          # 634 MB, so ordinary variation never reaches the ceiling. 800M/1100M for the queue,
          # holding roughly the old 5:4 ratio. The two soft ceilings total 1800M, which is deliberate
          # and is the same bet the old numbers made: MemoryHigh is a ceiling on ONE cgroup, not a
          # reservation, and these two do not peak together. The reasoning below about WHICH unit
          # carries the hard stop is unchanged and still right.
          #
          # STILL NOT A FINAL ANSWER FOR THE QUEUE. 400M was never observed to be hit; it was
          # inherited arithmetic, and 800M is that arithmetic doubled. If real transcription work
          # thrashes, read the memory line in `systemctl status fieldrepo-queue` and raise it from
          # the number there — the way the API's was finally set.
          write_dropin fieldrepo.service memory.conf <<'CONF'
          [Service]
          MemoryAccounting=yes
          MemoryHigh=1000M
          CONF

          write_dropin fieldrepo-queue.service memory.conf <<'CONF'
          [Service]
          MemoryAccounting=yes
          MemoryHigh=800M
          MemoryMax=1100M
          CONF

          if [ "$changed" = "1" ]; then
            sudo systemctl daemon-reload
            echo "systemd reloaded"
          fi
          REMOTE

      - name: Sync code to the release directory
        env:
          # The per-run release id, not the bare commit — see "Name this deploy's release directory".
          # The name stays `SHA` because inside the remote blocks it is only ever a path component;
          # rename it in its own commit if it bothers you, and do not mix a rename into a safety fix.
          SHA: ${{ env.REL_ID }}
        run: |
          # `-u` and `-o pipefail` are NOT on by default — GitHub's default shell is `bash -e {0}`,
          # so a failing command already ends this step, but an unset variable and a broken pipe do
          # not. This step now reads a variable and asks the box a question; it should not be able to
          # lose either answer quietly.
          set -euo pipefail

          # ─── THE TARGET MUST NOT BE THE TREE THAT IS SERVING TRAFFIC ────────────────────────
          #
          # 2026-09-17, the same incident as the SSH keepalives at the top of this job. Run
          # 35145291959 was re-run three times. Release directories were named for the COMMIT, so
          # every attempt after the first found `releases/$SHA` already on disk and already the
          # target of `current`. Attempt 2 migrated and flipped the symlink onto it at 20:32:18Z —
          # the heartbeat comment on the readiness loop below records the same thing from the log,
          # "attempt 2, at 299.6 s, having already migrated and flipped the symlink". Attempt 3 then
          # started THIS rsync into that same directory at 20:38:53Z and ran until the pipe broke.
          # For those minutes `--delete` was removing and rewriting source files inside the tree
          # uvicorn and fieldrepo-queue were executing out of, live, under traffic. Nothing broke,
          # because nothing happened to import a module in the window. That is luck, and luck is not
          # a control.
          #
          # THE REAL FIX IS THAT THE TARGET IS NOW UNIQUE PER RUN ATTEMPT — see "Name this deploy's
          # release directory". `current` cannot already point at a directory that has never existed.
          # THIS CHECK IS THE SECOND STATEMENT OF THE SAME RULE, and the duplication is deliberate:
          # the naming is an arrangement a future edit could quietly undo, and the only thing that
          # turns "we never rsync --delete into the live tree" from a habit into a property is asking
          # the box, every time, immediately before writing. It costs one round trip on a step that
          # is about to spend minutes.
          #
          # IT RESOLVES BOTH SIDES ON THE BOX, WITH THE SAME `readlink -f`, AND THAT IS NOT
          # FUSSINESS. Comparing a resolved path against a path spelled out on the runner compares
          # two different kinds of thing: the day any component of /home/ubuntu/app becomes a symlink
          # — moving the volume is the obvious reason, and the extra directories this scheme keeps
          # are the obvious cause — the two spellings diverge, and the check passes on a real hit,
          # silently. One spelling, produced on one machine, cannot drift.
          #
          # AND IT PRINTS BOTH PATHS ON EVERY RUN, NOT ONLY ON A HIT. A check that says nothing when
          # it passes is a check nobody can tell is still wired up. Those two lines are the standing
          # evidence that the release being built is not the release being served.
          #
          # THIS CHECK IS ONLY CORRECT WHILE RELEASE IDS ARE UNIQUE PER ATTEMPT. On commit-named
          # releases it refuses every re-run whose earlier attempt reached the flip, and EVERY
          # `gh workflow run` on an unchanged main — the documented emergency override this job's
          # `if:` exists to admit, and which the keepalive assertion above deliberately declines to
          # break for a lesser reason. If the naming is ever reverted, revert this with it. If it
          # fires under per-attempt naming, do not weaken it: find out why the release id stopped
          # being unique. It is also why the bootstrap shim points a rebuilt box at
          # `releases/bootstrap` and not at this run's release — those two were the same path, and
          # this check would have made the first deploy to every fresh box impossible.
          ssh "ubuntu@${{ secrets.EC2_HOST }}" "SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          APP=/home/ubuntu/app

          # `set -u` catches an UNSET id and not an EMPTY one, and empty is the failure this has:
          # `releases//backend` is a path rsync and `mkdir -p` both accept without a word, and the
          # whole deploy would then build, verify and flip into a directory nobody meant.
          [ -n "${SHA:-}" ] || { echo "::error::the release id is empty — the 'Name this deploy's release directory' step did not run or did not write REL_ID. Refusing to rsync into /home/ubuntu/app/releases//backend."; exit 1; }

          # `[ -d ]` AND NOT a test on `readlink -f`'s output. `readlink -f` needs only the PARENT to
          # exist, and `releases/` is created unconditionally by infra/terraform/user_data.sh — so it
          # prints a plausible path and exits 0 for a directory that is not there, and a check
          # written that way would be dead code under a comment claiming it fires. rsync is not
          # invoked with `--mkpath`, so this component is made by "Prepare the release layout and the
          # systemd units" several steps earlier; if that ordering ever breaks, this says so in one
          # line instead of a bare "No such file or directory" from the far end of an ssh pipe.
          [ -d "$APP/releases/$SHA" ] || { echo "::error::$APP/releases/$SHA does not exist. It is created by 'Prepare the release layout and the systemd units'; that step did not run, or the release id changed between the two."; exit 1; }

          dest="$(readlink -f "$APP/releases/$SHA")"
          live=""
          [ -e "$APP/current" ] && live="$(readlink -f "$APP/current" 2>/dev/null || true)"
          echo "rsync destination resolves to: $dest"
          echo "current resolves to:           ${live:-<nothing yet>}"

          if [ "$live" = "$dest" ]; then
            echo "::error::refusing to rsync --delete into $dest: that is the directory 'current' resolves to, i.e. the tree uvicorn and fieldrepo-queue are running out of right now. Deleting and rewriting source files under a live interpreter that imports lazily is what the re-runs of run 35145291959 did for minutes at a time on 2026-09-17. Nothing has been written and the box is still serving what it was serving. A re-run gets a new run attempt and therefore a different release directory, so it will proceed — but if this fired at all, the release id has stopped being unique per attempt, and that is the thing to fix rather than the thing to retry past."
            exit 1
          fi
          REMOTE

          # `--delete` STAYS, and it is safe against the venv for a reason worth stating rather
          # than trusting: rsync does not delete files the transfer EXCLUDED unless it is asked to
          # with --delete-excluded. So `.venv`, `__pycache__` and `.env` on the receiver survive a
          # --delete run, and what --delete actually removes is a source file that this commit
          # deleted — which is exactly what it is for.
          #
          # THE CLAUSE THAT USED TO END THAT SENTENCE IS DELETED AS WRONG. It said --delete is "what
          # makes re-rsyncing into an existing release directory (the repeat-SHA case) produce the
          # right tree instead of a union of two commits". The tree it produced was right; the
          # directory it produced it in was the one being served. Idempotent in its END state is not
          # the property that matters when the intermediate state is under traffic. There is no
          # repeat-SHA case any more, and the check above is what keeps it from coming back.
          #
          # `.env` IS EXCLUDED, AND THAT EXCLUSION WAS A PATCH ON ONE SYMPTOM OF THIS SAME DEFECT: on
          # a redeploy of the same SHA the old behaviour deleted the LIVE .env and left the release
          # without one for the length of the rsync. It is kept — the next step writes the file and
          # there is no reason to ship it twice — but it is no longer load-bearing, because the
          # directory this writes into is never one anything is reading from.
          #
          # NOTHING HERE MAKES A FRESH DIRECTORY A FULL REBUILD, and that is the question this scheme
          # has to answer. The venv is not in this transfer at all: the step below copies it from
          # whatever `current` resolves to whenever `requirements.lock` and `pyproject.toml` compare
          # equal — a test on the LIVE release, not on this run's id, so a brand-new directory passes
          # it exactly as often as a re-used one did.
          rsync -az --delete \
            --exclude '.venv' --exclude '__pycache__' --exclude '*.pyc' --exclude '.env' \
            ./backend/ "ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/releases/$SHA/backend/"

      - name: Write .env on the server (piped over the SSH tunnel, never on the command line)
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          SHA: ${{ env.REL_ID }}
        run: |
          # Into the RELEASE directory, not the shared one. Each release carries the .env it was
          # deployed with, so rolling the symlink back rolls the configuration back with it.
          printf '%s' "$BACKEND_ENV" | ssh "ubuntu@${{ secrets.EC2_HOST }}" \
            "cat > /home/ubuntu/app/releases/$SHA/backend/.env && chmod 600 /home/ubuntu/app/releases/$SHA/backend/.env"

      # ─── THE CONVENTION THAT WAS ONLY EVER A CONVENTION, ENFORCED 2026-09-03 ────────────────
      #
      # `Environment=MEDIA_QUEUE_WORKER_ENABLED=false` in fieldrepo.service's drop-in above reads
      # like a guarantee and is not one: systemd.exec(5) says EnvironmentFile= overrides
      # Environment= regardless of the order the two appear in, so THIS FILE — the .env written a
      # step ago — is the winner for every key it sets. The comment on that drop-in claimed the
      # opposite for months. Nothing broke, because BACKEND_ENV has never carried this key; that is
      # luck plus habit, and habit is not a control.
      #
      # So the check is here, where the file actually exists, and it is the cheapest possible one.
      # It runs BEFORE the units are restarted, so a bad secret fails the deploy with the previous
      # release still serving rather than after two drains are already running.
      #
      # WHAT IT PREVENTS, NAMED SO THE FAILURE IS RECOGNISABLE: a second media-queue drain inside
      # uvicorn, beside the fieldrepo-queue unit that is already draining. Two ffmpeg workloads and
      # two paid transcription runs on a 1 GiB box sized for one; uvicorn's health-ping starved by
      # a heavy chunk until the supervisor SIGKILLs it; a Prisma query-engine orphaned per kill
      # cycle until the pooler hits its client ceiling and every login answers 500 while /health
      # stays 200. `media_queue.acquire_queue_worker_lock` refuses a second drain per HOST and is
      # the other half of the fix; this is the half that stops the box being asked in the first
      # place. `false` is allowed and normal — only a TRUE value is refused.
      #
      # NOTHING FROM .env IS EVER PRINTED HERE. `grep -q` is silent by construction and the message
      # names the key, not the line: a deploy log is not the place to leak a secret while asserting
      # about one.
      - name: Refuse a .env that would start a second queue drain
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "/home/ubuntu/app/releases/$SHA/backend"
          if [ ! -s .env ]; then
            echo "::error::the release .env is missing or empty after the write step — the BACKEND_ENV secret is unset or the pipe into it failed. This box would boot with no DATABASE_URL."
            exit 1
          fi
          # `tr -d` strips quotes first so MEDIA_QUEUE_WORKER_ENABLED="true" is caught as well as
          # the bare form; the anchored tail is what keeps `t` from matching a word starting with t.
          # The truthy set is the one pydantic-settings accepts for a bool.
          if tr -d "\"'" < .env \
            | grep -Eiq '^[[:space:]]*(export[[:space:]]+)?MEDIA_QUEUE_WORKER_ENABLED[[:space:]]*=[[:space:]]*(1|t|y|on|yes|true)[[:space:]]*$'; then
            echo "::error::BACKEND_ENV sets MEDIA_QUEUE_WORKER_ENABLED to a true value. On this box the .env WINS over the systemd drop-in (EnvironmentFile overrides Environment, whatever the order), so uvicorn would drain the media queue alongside fieldrepo-queue: two ffmpeg workloads and two billed transcription runs on a 1 GiB box, a SIGKILLed web worker and orphaned query-engines. Remove the key from the secret, or set it to false."
            exit 1
          fi
          echo "queue flag: the release .env does not enable the in-process drain"
          REMOTE

      # Pin CORS to the origins that actually exist, in the workflow rather than in BACKEND_ENV.
      #
      # The deployed API answered `access-control-allow-origin: *`. That is not the hole it looks
      # like — auth is a Bearer token from localStorage, not a cookie, and app/core/config.py forces
      # `allow_credentials=False` whenever a wildcard is present, so a hostile page could reach only
      # unauthenticated endpoints and could never read a signed-in user's data. It is still worth
      # closing, and pinning is what lets credentialed CORS be true rather than silently downgraded.
      #
      # Set HERE and not in the secret because these origins are public knowledge — they are in every
      # browser's address bar — and because BACKEND_ENV cannot be read to edit one line of it. A
      # wholesale rewrite of a secret nobody can print is how a database URL gets lost.
      #
      # Both entries earn their place. The Vercel alias is production. `http://localhost:3000` is the
      # local dev server, which is routinely pointed at THIS deployed API rather than a local backend
      # — omitting it would break every developer's browser while looking like an API fault. The
      # Android client is unaffected either way: a native HTTP client does not do CORS.
      - name: Pin the CORS origins
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          # 2026-09-03: the release layout moved this file. It is edited in the release directory,
          # BEFORE the symlink flip, so the origins land in the .env the new code will read and the
          # currently-serving release's .env is never touched by a deploy that may yet fail.
          cd "/home/ubuntu/app/releases/$SHA/backend"
          # The step above writes this file with `printf '%s'`, which emits NO trailing newline, so a
          # bare `>>` glues the new key onto the end of whatever the last line is and silently
          # corrupts that variable. Guarantee the newline first. (This is not hypothetical: the first
          # version of this step did exactly that, and `grep -c` then found zero matches.)
          [ -s .env ] && [ -n "$(tail -c1 .env)" ] && printf '\n' >> .env
          # Drop any inherited value, so this is authoritative rather than additive.
          sed -i '/^BACKEND_CORS_ORIGINS=/d' .env
          # ── THESE ARE THIS PORTAL'S ORIGINS, AND THE LIST THAT STOOD HERE WAS THE OTHER PRODUCT'S ──
          #
          # This line read `https://field-repository.vercel.app,http://localhost:3000` — the FIELD
          # REPOSITORY's domain, inherited when this repo was derived from that one, like the rest of
          # this workflow. The paragraph that stood here argued at length that the pre-rebrand name
          # was "still the real origin the browser sends" and that correcting it would remove the only
          # allowed origin. Every word of that is true OF THE OTHER REPOSITORY. Here it named a host
          # this portal is never served from.
          #
          # IT WAS INVISIBLE UNTIL THE DEPLOY WORKED. The step had never run: SSH ingress was pinned
          # to an operator's home address, so every CI deploy died before reaching this line and the
          # box kept the origins written by hand at provisioning. The first successful run of this
          # workflow — the same change that fixed the SSH window — is what finally executed it, and
          # because the `sed -i` above deletes any inherited value to make this authoritative, it
          # replaced the correct list with the wrong one and broke login on the live site. A fix and
          # a regression in one push, which is what an untested step does the moment it starts running.
          #
          # ONE VERCEL HOST, and the second one that used to be here was never this application.
          #
          # This list read `designer-repository.vercel.app,design-repository.vercel.app` and the
          # comment above it said "both answer 200 today" — which was measured at the ROOT PATH, and
          # Vercel answers 200 at `/` for a subdomain serving nothing at all. Probed properly on
          # 2026-08-23: `design-repository.vercel.app/login` is a **404**, and `vercel alias ls` does
          # not list that host against any project in this team. It was a plausible misspelling of
          # this portal's own alias that got written down, and then defended by a check too weak to
          # notice — the same misspelling reached docs/CI.md, both deploy workflows, and the Android
          # handset's "open the web portal" button, which had already been repointed once.
          #
          # Dropping a live origin IS how this breaks again, so the rule the old comment stated still
          # stands and is worth keeping: the failure is silent from the server's side, because a
          # rejected preflight is a 400 the API considers correct and the browser reports only
          # "failed to fetch". Add a new domain here in the same change that adds it in Vercel, and
          # keep an old one until its alias is actually retired. What changed is only that this
          # particular host had no alias to retire.
          #
          # NOT LISTED, deliberately: `design-repository-kappa.vercel.app`, Vercel's auto-generated
          # URL for this project, which DOES serve an older deployment of this app. It is not a
          # destination anyone is given, and listing it would put a stale build's origin on the
          # allow-list for as long as the deployment behind it exists.
          printf 'BACKEND_CORS_ORIGINS=%s\n' 'https://designer-repository.vercel.app,http://localhost:3000' >> .env
          # Assert the key landed on a line of its own. `grep -q` rather than `grep -c`: a count of
          # zero exits 1, which under `set -e` fails the step with no explanation of what was wrong.
          grep -q '^BACKEND_CORS_ORIGINS=' .env || { echo "CORS origins did not land on their own line"; exit 1; }
          echo "CORS origins pinned"
          REMOTE

      # ─── THE VENV, AND WHY IT IS COPIED RATHER THAN REBUILT OR HARD-LINKED ──────────────────
      #
      # A venv per release is what makes the symlink flip a real rollback: roll back to a release
      # whose lock pinned a different prisma, and you get that prisma, not whatever the last deploy
      # left in a shared directory. It also means a deploy that fails halfway has not touched the
      # environment the running code is using. The cost is disk, and on a 30 GiB root with three
      # releases kept that cost is not interesting.
      #
      # Building it from scratch every time IS interesting, though: `pip install` of seventy-one
      # wheels on a CPU-credit-throttled t3.micro is minutes, every deploy, for a commit that
      # usually changed a route handler. So the venv is REBUILT only when the dependency set moved
      # — decided by comparing this release's `requirements.lock` and `pyproject.toml` against the
      # previous release's copies — and otherwise COPIED from the previous release.
      #
      # `cp -a` AND NOT `cp -al`, WHICH IS THE ONE DECISION HERE THAT IS NOT OBVIOUS. Hard links
      # would make the copy instant and free, and they would be WRONG: `prisma generate` writes the
      # generated client INTO site-packages, in place, so a hard-linked venv means generating for
      # this release silently rewrites the previous release's client to this release's schema. The
      # rollback target would then be code from one commit running a Prisma client generated for
      # another commit's schema — a corruption that appears only when you roll back, which is the
      # worst possible time to discover it. A real copy is a few seconds of I/O to keep releases
      # genuinely independent.
      #
      # `pip install -e . --no-deps` runs on BOTH paths, copied or fresh. The editable install
      # writes a path file naming the directory it was run from, so a copied venv still points at
      # the PREVIOUS release's source tree until it is re-run here. `--no-deps` is what keeps the
      # lock authoritative — without it pip re-resolves this project's declared ranges and can lift
      # a pin the lock had settled.
      # ─── THE CLIENT IS BUILT HERE, ON THE RUNNER, AND NOT ON THE BOX ───────────────────────
      #
      # WHY IT MOVED, ON 2026-09-15. `prisma generate` ran on the EC2 box for the life of this
      # workflow. It was OOM-killed twice in a row that day -- the log says only
      #
      #     Error: Generator "prisma-client-py" failed:
      #     Killed
      #
      # -- and the retry after 2 GiB of swap was added thrashed the instance hard enough to drop
      # the SSH connection outright (`client_loop: send disconnect: Broken pipe`). The API box is a
      # t3.micro: 1 GiB of RAM, shared with uvicorn and the worker. prisma-client-py builds the
      # whole client in memory before writing it, and this schema is ~100 models at
      # `recursive_type_depth = 5`. Swap does not fix that, it only converts a kill into a stall.
      #
      # AND THE FAILURE BEFORE THAT ONE IS THE REASON TO DISTRUST BOX-SIDE GENERATION ENTIRELY.
      # When the deploy copies the previous release's venv, generate had been writing the client
      # into the PREVIOUS release's directory and exiting 0:
      #
      #     ✔ Generated Prisma Client Python to ./../../b9b35bb…/backend/.venv/…/site-packages/prisma
      #
      # so the release being deployed silently kept the client it was handed. Production served a
      # client generated on 2026-09-03 for a day: every route naming a model added since -- 
      # /api/design-workshops, /api/sanction-orders -- answered `AttributeError`, a 500 reading
      # "Something went wrong on the server", while /api/users was fine because it predates that
      # schema. Nothing went red. Between "written to the wrong release" and "silently killed",
      # every outcome except the correct one was green.
      #
      # The runner has memory, builds from the same `prisma==` pin as the box, and produces PURE
      # PYTHON: the generated modules are platform- and interpreter-independent, and the query
      # engine BINARY is not among them -- prisma downloads that at runtime into
      # ~/.cache/prisma-python, which is why shipping these files to a different machine is sound.
      # Python 3.12 matches the box's interpreter so the bytes are exactly what it would have made.
      # Pinned to 3.12 to match the interpreter on the box. The generated modules are pure Python
      # and would import on another minor, but "the bytes the box would have produced" is a cheaper
      # property to hold than an argument about which syntax the generator emits.
      - name: Python 3.12 for the generator
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Generate the Prisma client on the runner, where there is memory for it
        id: genclient
        run: |
          set -euo pipefail
          # The pin is READ FROM THE LOCK rather than written here. Two copies of a version are one
          # copy too many, and the box installs prisma from this same file -- a generator built by a
          # different version than the runtime is its own class of subtle wrongness.
          pin="$(grep -iE '^prisma==' backend/requirements.lock | head -1)"
          test -n "$pin" || { echo "::error::no prisma== pin in backend/requirements.lock"; exit 1; }
          echo "generating with $pin"
          python3.12 -m venv /tmp/genvenv
          /tmp/genvenv/bin/python -m pip install --quiet --upgrade pip
          /tmp/genvenv/bin/python -m pip install --quiet "$pin"
          ( cd backend && PATH="/tmp/genvenv/bin:$PATH" /tmp/genvenv/bin/python -m prisma generate )

          sp="$(/tmp/genvenv/bin/python -c 'import prisma, os; print(os.path.dirname(prisma.__file__))')"
          echo "generated into $sp"

          # THE EXACT FILE LIST, and it is explicit rather than "copy the package". The base package
          # is installed on the box from the lock and must not be overwritten wholesale by another
          # machine's copy; only the GENERATED artefacts travel. `schema.prisma` is on the list and
          # is the one that is easy to forget -- the query engine loads THAT copy, beside the
          # modules, not backend/prisma/schema.prisma, so a client shipped without it keeps
          # answering about the old schema. That omission is what made this bug survive a
          # regeneration during diagnosis.
          mkdir -p /tmp/genclient/engine
          for f in actions.py bases.py client.py enums.py http.py metadata.py models.py                    partials.py types.py schema.prisma; do
            cp "$sp/$f" "/tmp/genclient/$f"
          done
          for f in abstract.py http.py query.py; do
            cp "$sp/engine/$f" "/tmp/genclient/engine/$f"
          done
          # ─── AND THE ENGINE BINARIES `generate` JUST FETCHED, WHICH TRAVEL WITH THE CLIENT ───
          #
          # `prisma generate` fetches the query engine for the platform it runs on as a side effect,
          # and the generated client HARD-CODES the paths it will look in -- the production error
          # listed `/home/runner/.cache/prisma-python/...` among them, which is this runner's home.
          # That is the tell: the client and the engine are a matched pair produced by one act, and
          # shipping half of it is what took the site down.
          #
          # `prisma py fetch` ON THE BOX WAS TRIED FIRST AND IS NOT ENOUGH. It reported "Downloaded
          # binaries to .../binaries/5.17.0/393aa..." and the very next `connect()` still raised
          # BinaryNotFoundError for `prisma-query-engine-debian-openssl-3.0.x` in that same
          # directory -- it does not place the query engine this client asks for.
          #
          # Copying the binary is sound HERE and would not be in general: both machines are x86-64
          # Ubuntu, the engine is selected by the `debian-openssl-3.0.x` target baked into the
          # client, and the version directory is content-addressed (`5.17.0/<sha>`), so a mismatched
          # pair cannot quietly overwrite a good one -- it lands beside it under a different hash.
          # THE ENGINE BINARY, LIFTED OUT OF THE CLI THE GENERATOR JUST INSTALLED.
          #
          # The generated client hard-codes THREE absolute paths to look in, and the third is
          # `/home/runner/.cache/prisma-python/.../node_modules/prisma/query-engine-...` -- this
          # runner's home, baked in at generation time and meaningless on the box. That is the whole
          # reason a client generated elsewhere cannot find its engine, and why rsyncing the cache
          # tree wholesale did not help: the box would have the bytes at a path its own client never
          # consults.
          #
          # The FIRST path it consults is `<release>/backend/prisma-query-engine-<target>`, which is
          # release-local and therefore the right home for it anyway -- a rolled-back release keeps
          # the engine it was verified with instead of sharing one mutable cache.
          engine_src="$(find "$HOME/.cache/prisma-python/binaries" -type f -name 'query-engine-*' | head -1)"
          test -n "$engine_src" || { echo "::error::generate did not leave a query engine under the prisma-python cache"; exit 1; }
          mkdir -p /tmp/genengine
          cp "$engine_src" "/tmp/genengine/prisma-$(basename "$engine_src")"
          chmod +x /tmp/genengine/*
          ls -la /tmp/genengine

          # Proof the generated client is THIS schema's before a byte of it leaves the runner.
          #
          # NOT `cmp`, AND THE FIRST VERSION OF THIS LINE WAS `cmp`. The generator writes its own
          # copy of the schema beside the modules and does not promise it byte-for-byte: it can
          # normalise line endings and trailing whitespace, and on the first real run that was
          # enough to fail a deploy whose client was perfectly correct. An assertion that cries wolf
          # on a good build is worse than none, because the next person weakens it in a hurry.
          #
          # What actually has to be true is SEMANTIC: the client's schema must declare the same
          # models and enums as this commit's. That is the thing the query engine reads it for, and
          # it is exactly what goes wrong when a stale client ships -- `SanctionOrder` absent, so
          # `db.sanctionorder` is an AttributeError on a live route. Comparing the declared names
          # catches that and stays quiet about whitespace.
          # ANCHORED AT COLUMN 0 AND REQUIRING THE BRACE. `^[[:space:]]*model` also matches a FIELD named
          # `model` -- schema.prisma:2130 is `  model String?` -- which made the import check below
          # demand an accessor called `string`. A declaration in this grammar is never indented and
          # always opens a block, so both halves of that are load-bearing.
          names() { grep -oE '^(model|enum) [A-Za-z0-9_]+ *\{' "$1" | awk '{print $1, $2}' | sort; }
          if ! diff <(names /tmp/genclient/schema.prisma) <(names backend/prisma/schema.prisma) > /tmp/schemadiff; then
            echo "::error::the generated client declares different models/enums than backend/prisma/schema.prisma"
            echo "--- < generated | > this commit ---"
            head -40 /tmp/schemadiff
            exit 1
          fi
          echo "generated client declares the same $(names backend/prisma/schema.prisma | wc -l) models and enums as this commit"
          ls -la /tmp/genclient /tmp/genclient/engine

      - name: Build or reuse the release venv, and generate the Prisma client
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          APP=/home/ubuntu/app
          REL="$APP/releases/$SHA"
          # `readlink -f` resolves through the bootstrap symlink too, so PREV is a real directory
          # or empty. `|| true` because on a brand-new box there is nothing to resolve.
          PREV="$(readlink -f "$APP/current" 2>/dev/null || true)"
          cd "$REL/backend"

          if [ -n "$PREV" ] && [ "$PREV" = "$REL" ] && [ -x .venv/bin/python ]; then
            # THIS IS NOW UNREACHABLE, AND IT IS KEPT AS A GUARD RATHER THAN AS AN OPTIMISATION.
            # Until 2026-09-17 this was the RE-RUN path: release directories were named for the
            # commit, so a re-run found `current` already pointing at this directory, and this branch
            # is what stopped the venv of the RUNNING process being `rm -rf`'d two lines below.
            # Release directories are named for the run attempt now, and the bootstrap shim points a
            # fresh box at `releases/bootstrap` rather than at this run's release, so `PREV = REL`
            # cannot happen at all.
            #
            # WHERE THE COST WENT, since this is the branch that used to make a re-run free. `PREV`
            # is `readlink -f current` — whatever release is LIVE, never anything derived from this
            # run's id — so the `elif` below still fires for a re-run: the live release is the
            # previous ATTEMPT of the same commit, through the same rsync, so its
            # `requirements.lock` and `pyproject.toml` are byte-identical and the `cmp -s` pair
            # passes. A re-run therefore pays one `cp -a` of a venv where it used to pay nothing.
            # That is the branch every ordinary deploy with unchanged dependencies has taken since
            # 2026-09-03. NO CASE MOVES FROM COPYING TO `pip install` under this scheme — the fresh
            # directory name enters the predicate only on the line above.
            #
            # AND THAT COPY IS ONLY CORRECT BECAUSE OF `--force-reinstall` BELOW. Keeping the venv in
            # place left the editable install's path file already naming this release; copying it
            # leaves it naming PREV until pip rewrites it, and without `--force-reinstall` pip
            # answers "already satisfied" and does not. See that line — do not revert it as redundant.
            #
            # It stays because what it prevents — deleting a venv that `current` resolves through —
            # is unrecoverable without a rebuild, and a currently-unreachable guard costs one string
            # comparison. Do not delete it on the grounds that it never fires; that is the argument
            # that would have to be made again the next time somebody changes how releases are named.
            echo "current already points at this release — keeping the venv that is in it"
          elif [ -n "$PREV" ] && [ -x "$PREV/backend/.venv/bin/python" ] \
               && [ -f "$PREV/backend/requirements.lock" ] && [ -f requirements.lock ] \
               && cmp -s "$PREV/backend/requirements.lock" requirements.lock \
               && cmp -s "$PREV/backend/pyproject.toml" pyproject.toml; then
            echo "dependencies unchanged since $PREV — copying its venv"
            rm -rf .venv
            cp -a "$PREV/backend/.venv" .venv
          else
            # Also the path taken on the FIRST run of this workflow, where PREV is the legacy tree
            # and has no requirements.lock to compare against. Building once is the right answer
            # there: the legacy venv was installed from unpinned ranges and is exactly what the lock
            # exists to replace.
            echo "building a fresh venv from requirements.lock"
            rm -rf .venv
            python3.12 -m venv .venv
            ./.venv/bin/python -m pip install --upgrade pip
            ./.venv/bin/python -m pip install -r requirements.lock
          fi

          # `python -m pip` and never `./.venv/bin/pip`: a copied venv's console scripts carry a
          # shebang naming the directory they were BUILT in, which is the previous release and may
          # since have been pruned. The interpreter is a symlink to the system python and does not
          # have that problem. Since 2026-09-17 that shebang is also 14 bytes longer — the release id
          # gained `-<run_id>.<attempt>` — which is a second reason nothing here, and nothing in the
          # systemd units, ever invokes a venv console script by name. (Measured at 107 bytes against
          # a 256-byte kernel limit, so it is headroom and not a hazard; the rule stands on the
          # pruned-directory argument above, which does not depend on a byte count.)
          #
          # `--force-reinstall` ON THE EDITABLE INSTALL, ADDED 2026-09-15. Without it pip sees the
          # copied venv already carrying this project at this version and answers "already
          # satisfied" WITHOUT rewriting the path file -- so the re-run that this step's comment
          # says fixes the copied venv's pointer did not actually fix it, and the venv went on
          # naming the PREVIOUS release's source tree.
          ./.venv/bin/python -m pip install -e . --no-deps --force-reinstall

          # NOTHING GENERATES THE CLIENT HERE ANY MORE. It is built on the runner and rsynced in by
          # the next step -- see that step for why. `prisma generate` ran on this box until
          # 2026-09-15 and was OOM-killed twice in a row even with 2 GiB of swap added, the second
          # attempt thrashing hard enough to drop the SSH connection (`client_loop: send disconnect:
          # Broken pipe`). A 1 GiB t3.micro cannot build a ~100-model client, and giving it swap
          # only converts the kill into a stall.
          echo "venv ready; the Prisma client arrives from the runner in the next step"

          REMOTE

      # ─── AND THE GENERATED CLIENT IS PLACED INTO *THIS* RELEASE'S VENV, THEN PROVED ────────
      #
      # rsync of the thirteen generated artefacts into the venv the previous step just built or
      # copied, followed by the check that the whole outage turned on. `--checksum` because a copied
      # venv carries the previous release's client with plausible timestamps and sizes; content is
      # the only honest comparison here.
      - name: Install the runner-generated Prisma client into the release venv, and prove it
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          set -euo pipefail
          site="$(ssh ubuntu@${{ secrets.EC2_HOST }} "/home/ubuntu/app/releases/$SHA/backend/.venv/bin/python -c 'import prisma, os; print(os.path.dirname(prisma.__file__))'")"
          echo "box resolves prisma to: $site"
          case "$site" in
            /home/ubuntu/app/releases/$SHA/backend/.venv/*) : ;;
            *) echo "::error::the release venv resolves prisma to $site, outside this release. Refusing to write a client into another release."; exit 1 ;;
          esac
          rsync -az --checksum /tmp/genclient/ "ubuntu@${{ secrets.EC2_HOST }}:$site/"

          # THE ENGINE TRAVELS WITH THE CLIENT, into the release directory -- the first path the
          # generated client consults, and the only one of its three that is neither the runner's
          # home nor a shared mutable cache. `--chmod` because rsync does not carry the executable
          # bit reliably across this hop, and a present-but-unexecutable engine produces the exact
          # same BinaryNotFoundError as an absent one ("...or could not be executed").
          rsync -az --chmod=F755 /tmp/genengine/             "ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/releases/$SHA/backend/"

          ssh ubuntu@${{ secrets.EC2_HOST }} "SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          APP=/home/ubuntu/app
          REL="$APP/releases/$SHA"
          cd "$REL/backend"
          # ─── A TICK ON THE WIRE WHILE A QUIET COMMAND RUNS ──────────────────────────────────
          #
          # 2026-09-17. This is the step the audit reached for first, for a reason visible in the
          # log rather than in the code: from this `cd` to the last echo it can go minutes without
          # printing a single character. Importing this client is megabytes of generated Python on a
          # t3.micro, and `connect()` starts the query-engine subprocess and then waits on a pooler
          # that may be in another region. Neither says anything while it works, so the deploy log
          # shows a step start, a long nothing, and — twice on 2026-09-17 — `client_loop: send
          # disconnect: Broken pipe` with exit 255 at 286.8 s and 281.2 s of silence.
          #
          # SILENCE IS BOTH THE SYMPTOM AND (ON THE LEADING HYPOTHESIS) THE CAUSE, which is why one
          # change addresses both. A line every 30 s puts bytes on the SSH channel, so no NAT or
          # SNAT entry in the path can age out under a command that is merely slow — and it leaves a
          # timestamped trail, so the next drop says WHICH command was running and for how long
          # instead of leaving a four-minute hole for somebody to subtract timestamps across. The
          # keepalives written into ~/.ssh/config at the top of this job are the transport half of
          # the same fix; this is the half that is also evidence. Neither alone would have told us
          # anything on 2026-09-17.
          #
          # STDERR, NOT STDOUT, AND THAT IS LOAD-BEARING. One ssh in this file — `site="$(ssh …)"`,
          # a few lines above — captures a remote command's stdout and uses it as a FILESYSTEM PATH.
          # A heartbeat on stdout would one day be appended to a path and produce an error nobody
          # could read. Actions interleaves a step's stdout and stderr in the log, so stderr costs
          # nothing in readability and removes the whole class of accident.
          #
          # IT KILLS ITSELF IF THE SHELL IT IS TICKING FOR GOES AWAY. `kill -0 "$ka_parent"` is
          # re-checked every cycle and a `trap` on EXIT stops it on every ordinary path. Without the
          # parent check, a dropped connection would leave a subshell on the box sleeping and
          # printing into a closed descriptor forever — one per failed deploy, which is exactly the
          # kind of litter a diagnostic must never become.
          #
          # 30 SECONDS. The interval has to be a small fraction of the shortest idle timeout
          # anywhere in the path; the shortest anybody has named is the four-minute Azure SNAT
          # default, so this is an eightfold margin for a handful of lines.
          ka_pid=""
          ka_start() {
            ka_label="$1"
            ka_parent=$$
            ( t=0
              while kill -0 "$ka_parent" 2>/dev/null; do
                sleep 30
                t=$((t + 30))
                printf '  … %s: still running after %ds\n' "$ka_label" "$t" >&2
              done ) &
            ka_pid=$!
          }
          # THE `sleep` IS REAPED BEFORE THE SUBSHELL, AND THAT ORDER IS THE POINT. `kill $ka_pid`
          # ends the subshell but NOT the `sleep 30` it forked and is blocked in; that orphan is
          # reparented with this session's stderr still open, and sshd does not close a channel while
          # anything still holds it. A heartbeat added to stop SSH sessions dying would otherwise
          # hold one open for up to a full interval after the work finished — and leave a stray
          # process on the box on every failure path. `pkill` is in procps and is on this image;
          # both calls are `|| true`-guarded so its absence could never fail a deploy.
          #
          # WRITTEN AS AN `if`, NOT AS `[ -n "$ka_pid" ] && kill …`. This heredoc runs under `set -e`
          # and an `&&` chain whose test is false returns 1 — as the last command of a function that
          # would end the whole step. A deploy failed by its own heartbeat being switched off is a
          # failure nobody would find quickly. The explicit `return 0` states the same rule twice.
          ka_stop() {
            if [ -n "${ka_pid:-}" ]; then
              pkill -TERM -P "$ka_pid" 2>/dev/null || true
              kill "$ka_pid" 2>/dev/null || true
              wait "$ka_pid" 2>/dev/null || true
              ka_pid=""
            fi
            return 0
          }
          trap 'ka_stop' EXIT
          # Stale bytecode would keep the OLD modules importable even though the .py files beside
          # them are new -- a failure that looks exactly like the rsync not having happened.
          find .venv -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          # ─── THE CLIENT MUST BE IN *THIS* RELEASE'S VENV, AND THAT IS ASSERTED ────────────────
          #
          # WHAT HAPPENED ON 2026-09-14, WHICH IS WHY THIS BLOCK EXISTS. The deploy of 1557d93 took
          # the copied-venv path and then reported:
          #
          #   dependencies unchanged since /home/ubuntu/app/releases/b9b35bb… — copying its venv
          #   ✔ Generated Prisma Client Python to ./../../b9b35bb…/backend/.venv/…/site-packages/prisma
          #
          # READ THE SECOND LINE AGAIN: generate wrote the client into the PREVIOUS release. The
          # release being deployed kept the client that was copied into it -- generated on
          # 2026-09-03, before SanctionOrder and AnnualPlanEntry existed. Every route that touches
          # a model added since answered `AttributeError` -> a 500 reading "Something went wrong on
          # the server. The error has been logged." /api/design-workshops and /api/sanction-orders
          # were down for a day; /api/users was fine, because it predates that schema. Nothing in
          # the deploy went red: rsync, generate, migrate, the symlink flip and the readiness probe
          # all passed, because none of them ever asked WHERE the client landed.
          #
          # The check is the one question that matters and it is asked of the interpreter that will
          # actually serve traffic: import prisma, and see where it resolves. A path outside this
          # release means the app is about to run somebody else's client. Comparing the schema the
          # generator embedded beside it against this release's schema then catches the other half
          # -- a client that IS in the right place but was generated from an older tree, which is
          # the same outage with a different cause. (The engine loads THAT copy of schema.prisma,
          # not backend/prisma/schema.prisma, so it is the file that decides what the queries may
          # name.)
          #
          # THERE IS NO SELF-HEAL HERE, AND THAT IS DELIBERATE. An earlier version of this block
          # rebuilt the venv and re-ran `prisma generate` on the box when the check failed. That is
          # now the one thing this box must never be asked to do -- it is what gets OOM-killed. If
          # the client that just arrived from the runner is not the right one, the rsync or the
          # venv is wrong, and both are the runner's to fix: fail, keep the symlink where it is, and
          # let the box go on serving the last release that passed this same check.
          # ─── THE QUERY ENGINE BINARY, WHICH `generate` USED TO FETCH AS A SIDE EFFECT ────────
          #
          # MOVING GENERATION TO THE RUNNER TOOK THIS WITH IT, and the release that shipped without
          # it started, served, and failed every single request:
          #
          #   Background DB reconnect failed: Expected .../prisma-query-engine-debian-openssl-3.0.x
          #   ... to exist but none were found or could not be executed.
          #   Try running prisma py fetch
          #
          # The client is PURE PYTHON and travels; the engine is a PLATFORM BINARY and does not. The
          # paths it searched even included `/home/runner/.cache/...` -- the runner's home, carried
          # in from the machine that generated the client -- which is the clearest possible sign
          # that a binary cannot be shipped this way and has to be fetched where it will run.
          #
          # `py fetch` DOWNLOADS, it does not generate: no schema is parsed and nothing is built in
          # memory, so this is not the step that gets OOM-killed. It is a no-op once the cache holds
          # this version, which is every deploy after the first.
          # `prisma py fetch` WAS HERE AND DID NOT WORK -- see the runner step's note. The engine
          # now arrives by rsync from the runner that generated the matching client.

          client_dir="$(./.venv/bin/python -c 'import prisma, os; print(os.path.dirname(prisma.__file__))')"

          if [ "${client_dir#$REL/}" = "$client_dir" ]; then
            echo "::error::prisma client resolved to $client_dir, which is outside $REL. Refusing to deploy a release that would import another release's client."
            exit 1
          fi
          # SAME SEMANTIC COMPARISON AS ON THE RUNNER, and for the same reason: the file the box now
          # holds is the GENERATOR'S copy of the schema, which is not promised to be byte-identical
          # to `prisma/schema.prisma` in the tree beside it. What must be true is that it declares
          # the same models and enums -- that is what the query engine reads it for, and a
          # disagreement there is the AttributeError that took /api/design-workshops down.
          # ANCHORED AT COLUMN 0 AND REQUIRING THE BRACE. `^[[:space:]]*model` also matches a FIELD named
          # `model` -- schema.prisma:2130 is `  model String?` -- which made the import check below
          # demand an accessor called `string`. A declaration in this grammar is never indented and
          # always opens a block, so both halves of that are load-bearing.
          names() { grep -oE '^(model|enum) [A-Za-z0-9_]+ *\{' "$1" | awk '{print $1, $2}' | sort; }
          if ! diff <(names "$client_dir/schema.prisma") <(names prisma/schema.prisma) > /tmp/schemadiff; then
            echo "::error::$client_dir/schema.prisma declares different models/enums than this release's prisma/schema.prisma. The query engine reads that copy, so anything it does not declare fails at runtime with AttributeError."
            echo "--- < installed | > this release ---"
            head -40 /tmp/schemadiff
            exit 1
          fi
          # AND IT MUST ACTUALLY IMPORT AND CARRY THE MODELS. Comparing schema.prisma proves what the
          # ENGINE will be told; it does not prove the generated MODULES beside it are complete. A
          # half-copied client passes the schema comparison and then fails every route at runtime,
          # which is the same outage wearing a different hat. Instantiating Prisma exercises the
          # generated `client.py`, `models.py`, `actions.py` and `types.py` in one line, and the
          # model accessors are checked by name against the schema so a missing one is named here
          # rather than discovered by a designer.
          # ONE LINE, AND BOTH REASONS ARE THE CONTAINER IT LIVES IN. A nested heredoc cannot close
          # inside this one (an indented terminator does not end an unindented `<<`), and a `-c`
          # program cannot be indented either, because Python would read the leading spaces of each
          # continuation line as an IndentationError -- while YAML's block scalar forbids putting
          # them at column 0. Semicolons are what is left.
          #
          # WHAT IT PROVES, THAT THE SCHEMA COMPARISON ABOVE DOES NOT. That check reads the file the
          # ENGINE will be handed; it says nothing about whether the generated MODULES beside it
          # arrived intact. A half-copied client passes it and then fails every route at runtime --
          # the same outage wearing a different hat. Instantiating Prisma exercises client.py,
          # models.py, actions.py and types.py together, and every model in this release's schema is
          # then checked by name, so a missing accessor is named HERE rather than found by a user.
          # THE EXIT STATUS IS CARRIED BY HAND, because the heartbeat has to be stopped BETWEEN the
          # command and the decision about it. `cmd || rc=$?` is the form that survives `set -e`
          # (the left-hand side of `||` is a tested command, so a non-zero status is not fatal
          # there), and `rc=0` is initialised first because under `set -u` an unset `rc` would abort
          # the step on the SUCCESS path — the failure mode that looks least like its own cause. The
          # one-liner below prints its own `::error::` before exiting 1, so `exit "$rc"` is the
          # whole decision.
          ka_start "prisma client import + model accessor check"
          rc=0
          ./.venv/bin/python -c 'import re,sys,pathlib;from prisma import Prisma;schema=pathlib.Path("prisma/schema.prisma").read_text(encoding="utf-8");models=sorted({m.lower() for m in re.findall(r"^model ([A-Za-z0-9_]+) *\{",schema,re.M)});missing=[m for m in models if not hasattr(Prisma(),m)];print(("::error::the installed client is missing %d model accessor(s): %s"%(len(missing),", ".join(missing[:12]))) if missing else ("client instantiates and carries all %d model accessors"%len(models)));sys.exit(1 if missing else 0)' || rc=$?
          ka_stop
          [ "$rc" -eq 0 ] || exit "$rc"

          # AND THE ENGINE IS ASSERTED, not assumed. `py fetch` exiting 0 is not the same claim as
          # "the binary this platform needs is on disk and runnable" -- the release that took the
          # site down proved the two can differ, and the difference only showed up as a 500 on every
          # route after the symlink had already flipped.
          # ASSERTED BY CONNECTING, NOT BY GUESSING A FILENAME. The first version of this check
          # looked for `prisma-query-engine-*` on disk and failed a deploy whose fetch had plainly
          # just succeeded ("Downloaded binaries to .../binaries/5.17.0/393aa..."), because the
          # engine's name and location are prisma's business and not a contract this file gets to
          # assume. Guessing the artefact is how a check ends up testing itself.
          #
          # Opening a connection is the thing that actually has to work, and it is what failed in
          # production: the app started, served, and answered every request with "Not connected to
          # the query engine". `connect()` starts the engine binary and speaks to the database, so
          # it exercises the fetch, the binary's executability and the DSN in one call -- and it
          # runs BEFORE the symlink flips, so a box that cannot reach its database keeps serving the
          # release that can.
          echo "engine cache:"; ls -la "$HOME/.cache/prisma-python/binaries"/*/* 2>/dev/null | head -20 || true
          set -a; . ./.env; set +a
          # NO `disconnect()`, AND ITS ABSENCE IS THE FIX RATHER THAN A SHORTCUT. The first version
          # called `asyncio.run()` twice -- once for connect, once for disconnect -- and the second
          # raised `RuntimeError: Event loop is closed` AFTER printing "the database answered". A
          # prisma connection is bound to the loop that opened it, so the teardown ran against a
          # loop that no longer existed, and a release whose engine and database were both healthy
          # was reported broken. The process exits on the next line and takes the engine subprocess
          # with it; there is nothing for a disconnect to release that the exit does not.
          ka_start "prisma connect(): starting the query engine and reaching the pooler"
          rc=0
          ./.venv/bin/python -c 'import asyncio;from prisma import Prisma;asyncio.run(Prisma().connect());print("query engine started and the database answered")' || rc=$?
          ka_stop
          [ "$rc" -eq 0 ] || { echo "::error::the release cannot connect to its database. Not flipping the symlink."; exit 1; }

          echo "prisma client verified in this release: $client_dir"
          REMOTE

      # ─── MIGRATE ONLY IF THERE IS SOMETHING TO MIGRATE, THEN FLIP ──────────────────────────
      #
      # THE STOP IS THE OUTAGE, AND IT IS NOT ALWAYS NEEDED. The paragraph inside this step
      # explains why a pending migration requires stopping the app first, and every word of it is
      # still true — it is preserved verbatim below. What was wrong was applying it unconditionally:
      # most deploys carry no migration, and those paid for a full stop/start cycle they had no
      # reason to. `prisma migrate status` answers the question in one round trip, so the common
      # case is now a symlink flip plus a restart — sub-second, and the units come back on the new
      # code without the box ever having no code to serve.
      #
      # WHY A FAILED `migrate status` COUNTS AS "PENDING". It exits non-zero for pending migrations
      # AND for a database it could not reach or read. Treating both as pending sends an
      # unreachable database down the stop-and-retry path, which is the branch that already knows
      # how to fail loudly. The alternative — treating an error as "nothing to do" — would flip to
      # new code against a schema nobody checked.
      #
      # WHAT HAPPENS WHEN THE MIGRATION FAILS ANYWAY: THE SYMLINK IS NOT FLIPPED. The box goes back
      # to serving the PREVIOUS release, which is code that matches the schema that is actually
      # there, and the run goes red. That is the whole point of the layout: before it, a failed
      # migrate left new code on disk with no way back except another deploy.
      - name: Migrate if needed, flip the symlink, restart
        env:
          SHA: ${{ env.REL_ID }}
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "SHA='$SHA' bash -s" <<'REMOTE'
          set -uo pipefail
          APP=/home/ubuntu/app
          REL="$APP/releases/$SHA"
          cd "$REL/backend"
          export PATH="$PWD/.venv/bin:$PATH"

          # ATOMIC BY `mv -T`, not by `ln -sfn` alone. `ln -sfn` unlinks and re-creates, so there is
          # a window — brief, but real — in which `current` does not exist at all, and an automatic
          # `Restart=always` landing in it would fail. Renaming a finished symlink over the old one
          # is a single syscall with no such window.
          flip() {
            ln -sfn "$REL" "$APP/current.tmp"
            mv -Tf "$APP/current.tmp" "$APP/current"
            # 2026-09-17: RELEASE DIRECTORIES ARE NAMED PER RUN ATTEMPT NOW, so `releases/` holds
            # directories that were BUILT and never SERVED — the three attempts of run 35145291959
            # would have left three. The prune step at the end of this job used to rank by mtime and
            # would have counted those among the three it keeps, deleting the last release anybody
            # could actually roll back to and leaving half-built trees as the only candidates. A
            # release is a rollback target only once it has been live; this marker is the record of
            # that, and the prune ranks on nothing else.
            #
            # WRITTEN AFTER THE `mv`, NEVER BEFORE, so a flip that fails marks nothing. The prune
            # ranks by the MARKER'S own mtime rather than the directory's, so this timestamp has to
            # be the instant the symlink actually moved and not a moment earlier.
            #
            # A FAILURE HERE IS A WARNING AND NOT A FAILED DEPLOY — the release is live and about to
            # pass its health check, and failing after the flip would report a good release as
            # broken. It is not silent either: an unmarked live release is a rollback target the NEXT
            # deploy's prune will sweep, which is worth a line in the log rather than a discovery
            # during an incident. (This block runs under `set -uo pipefail` and not `-e`, so the
            # `||` is belt-and-braces; leave it, because the next editor may add the `-e`.)
            touch "$REL/.released" || echo "::warning::could not write $REL/.released. The release is live and fine, but the next deploy's prune will read it as a tree that never went live and will sweep it an hour after it stops being current — so this box may end up with no rollback target. Check the filesystem before the next deploy."
            echo "current -> $(readlink "$APP/current")"
          }
          restart_units() {
            sudo systemctl restart fieldrepo
            # The media queue runs in its OWN service (decoupled from uvicorn so its heavy AI/ffmpeg
            # work can never starve uvicorn's worker health-ping and get the worker SIGKILLed, which
            # used to orphan Prisma query-engines and exhaust the pooler -> HTTP 500). Restart it too
            # so it picks up the new code; '|| true' keeps deploys working on a box provisioned before
            # this service existed.
            sudo systemctl restart fieldrepo-queue 2>/dev/null || true
          }

          deploy_failed=0
          if ./.venv/bin/python -m prisma migrate status; then
            echo "no pending migrations — taking the no-downtime path (flip, then restart)"
            flip
            restart_units
          else
            echo "migrations are pending (or the database could not be read) — taking the stop-first path"
            # Migrations need SESSION mode; on the Supabase deployment this was written against, until
            # 2026-08-22, that meant a pooler with pool_size 15. The running app
            # holds most of those client sessions across its uvicorn workers, so the schema engine had
            # no connection left and failed with "EMAXCONNSESSION max clients reached". Stop the app to
            # free its sessions, then migrate (with a short retry for any sessions the pooler hasn't
            # reclaimed yet). The app is ALWAYS restarted afterwards, so a transient migrate failure
            # never leaves the API down — but a genuine migrate failure still fails the deploy.
            sudo systemctl stop fieldrepo || true
            # 2026-09-03: the QUEUE is stopped too, and it was not before. It holds pooler sessions of
            # its own — that is the whole reason it exists as a separate process — so leaving it up
            # while stopping uvicorn frees only some of the clients the schema engine is waiting for.
            sudo systemctl stop fieldrepo-queue 2>/dev/null || true
            sleep 5
            migrate_ok=0
            for attempt in 1 2 3 4 5; do
              if ./.venv/bin/python -m prisma migrate deploy; then migrate_ok=1; break; fi
              echo "migrate attempt ${attempt} failed; waiting for pooler sessions to drain..."; sleep 10
            done
            if [ "$migrate_ok" = "1" ]; then
              flip
              restart_units
            else
              echo "::error::prisma migrate deploy failed after retries. NOT flipping the symlink — the box stays on $(readlink "$APP/current"), which is code that matches the schema the database actually has. Nothing is half-deployed; fix the migration and push again."
              deploy_failed=1
              restart_units
            fi
          fi

          # App startup connects to a remote database, possibly cross-region, so poll rather than sleep.
          # This runs on the rollback path too: whichever release the units came back on, the deploy
          # does not finish until something is answering.
          # 150 x 2s = FIVE MINUTES, RAISED FROM 40 x 2s ON 2026-09-15, AND THE OLD NUMBER WAS THE
          # BUG RATHER THAN THE BOX BEING SLOW ON ONE BAD DAY. Measured on the deploy that restored
          # service: the unit restarted at 20:58:13 and the probe gave up at 21:00:06 -- about 113
          # seconds, comfortably past the old ceiling of roughly 80. This is a t3.micro that starts
          # uvicorn, imports a client whose models.py is megabytes, and launches the query engine
          # subprocess before /health can answer.
          #
          # WHAT THE OLD CEILING ACTUALLY COST, which is worse than a red tick: the flip happens
          # BEFORE this loop on the no-downtime path, so a deploy that was entirely successful
          # ended red, dumped a journal, and returned a non-zero exit -- while the box went on
          # serving the new release perfectly well. A deploy that lies in the failing direction
          # trains people to ignore it, and it did: three consecutive "failures" this evening were
          # this loop, not the release.
          #
          # `--max-time 5` BOUNDS EACH ATTEMPT. Without it a hung connect makes one iteration take
          # far longer than the 2s the arithmetic above assumes, so the real ceiling was never the
          # number written here.
          # ─── A LINE EVERY TWENTY SECONDS, BECAUSE FIVE MINUTES OF SILENCE KILLS THE SSH ────────
          #
          # 2026-09-17. This loop is the longest silent block in the whole deploy: 150 iterations of
          # `sleep 2` that print NOTHING until /health answers — up to five minutes in which not one
          # byte crosses the SSH connection. Run 35145291959 dropped twice with `client_loop: send
          # disconnect: Broken pipe` and exit 255 after ~280-300 s of output silence. ONE of the
          # three landed inside exactly this window — attempt 2, at 299.6 s, having already
          # migrated and flipped the symlink; the other two died earlier, in the client-import
          # step, which is heartbeated separately above. This loop is still the longest silent
          # block in the deploy and the one most likely to idle a flow out.
          #
          # The keepalives in the runner's ~/.ssh/config are the transport-level guard. THIS is the
          # application-level one, and it is the DIAGNOSTIC that did not exist: with a heartbeat in
          # the log, the next drop says which iteration it died on and what systemd thought the
          # units were doing, instead of leaving a five-minute hole. A step that cannot go silent
          # cannot produce that evidence — and cannot be the thing that idles the flow out either.
          #
          # EVERY TENTH ITERATION, so roughly every 20 s — comfortably inside any NAT or stateful
          # firewall idle window. Fifteen lines in a log nobody reads on a good day, and the only
          # record that exists on a bad one.
          #
          # ON STDERR, so anything that ever pipes this step's stdout keeps reading exactly what it
          # read before. Nothing does today; a heartbeat must not be the reason that changes.
          #
          # AN `if` RATHER THAN `[ … ] && echo`. This heredoc runs `set -uo pipefail` WITHOUT `-e`
          # today, so a false `&&` would be harmless — but the loop's status would then depend on
          # which iteration it left on, and the day somebody adds `-e` above, the heartbeat becomes
          # the thing that fails the deploy. `systemctl is-active` gets `|| true` for the same
          # reason: it exits non-zero for a unit that is merely still starting, which is the state
          # this loop exists to wait out.
          # ─── THE BOUND IS 10 MINUTES, NOT 5, AND IT IS NAMED ONCE ───────────────────────────
          #
          # 2026-09-17, and this is the second half of that day. The bound was 150 tries — five
          # minutes — and the deploy that first carried the heartbeat above FAILED ON IT, with the
          # last line reading:
          #
          #     waiting for /health: 140/150 (~280s elapsed); fieldrepo is active, fieldrepo-queue is active
          #
          # The release was fine. The symlink had flipped, the units were `active`, and the API
          # answered normally a few minutes later — it simply could not serve a request on its own
          # loopback inside five minutes, because the 1 GiB box was thrashing (1 GiB in swap,
          # ~14 MB/s paging both ways, 85% iowait; the numbers are quoted in full on
          # `instance_type` in infra/terraform/main.tf, which moved to t3.small the same day).
          #
          # SO THE REAL FIX IS THE MEMORY, AND THIS IS NOT IT. Doubling the RAM is what makes a
          # restart fast; this bound only decides how patient the pipeline is when it is not.
          # Raising it alone would have turned a red deploy into a slow green one and left the box
          # thrashing under real traffic — which is why both landed together, and why this comment
          # says so rather than letting the next reader conclude the timeout was the bug.
          #
          # Ten minutes is insurance, not an expectation: on t3.small this loop should exit in the
          # first few tries. A genuinely dead service now costs ten minutes instead of five before
          # the journal is dumped, which is the right trade against a deploy that reports failure
          # over a release that is actually live — the failure mode this file has now hit twice.
          #
          # ONE NAME, THREE USES. The count was written out three times — the `seq`, the last-try
          # test and the progress line — and a bound that has to be changed in three places is a
          # bound that will one day disagree with itself, printing `150/150` while looping to 300.
          tries=300
          for i in $(seq 1 "$tries"); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health >/dev/null 2>&1; then echo "healthy after ${i} tries"; break; fi
            if [ "$i" = "$tries" ]; then echo "service did not become healthy after $((tries * 2))s:"; sudo journalctl -u fieldrepo -n 80 --no-pager; exit 1; fi
            if [ "$((i % 10))" -eq 0 ]; then
              echo "waiting for /health: ${i}/${tries} (~$((i * 2))s elapsed); fieldrepo is $(systemctl is-active fieldrepo || true), fieldrepo-queue is $(systemctl is-active fieldrepo-queue || true)" >&2
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          exit "$deploy_failed"
          REMOTE

      # ─── RELEASES ARE PRUNED BY WHAT WENT LIVE, NOT BY WHAT IS NEWEST ────────────────────────
      #
      # Keep three RELEASES — the one that is live, the one to roll back to, and one more for the
      # case where the obvious rollback target is the release that caused the problem. Older ones are
      # disk, not insurance: nobody rolls back four deploys. That policy is unchanged since the
      # release layout was built; WHAT COUNTS AS A RELEASE CHANGED ON 2026-09-17, and everything
      # below exists because of it. The reasoning lives in the script rather than up here, so that it
      # is in front of whoever is reading this step's output on the box during an incident.
      - name: Prune old releases
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/home/ubuntu/app

          # ─── DECIDED FIRST, BECAUSE NOTHING BELOW MAY DELETE IT: WHAT IS BEING SERVED ───────
          # Resolved once, as an absolute path, and compared as one. This step used to compare
          # BASENAMES, which gives the same answer only while `current` points inside releases/ —
          # true today, and exactly the kind of "true today" that a hand rollback or a future layout
          # change turns into a deleted live tree with no warning in between.
          #
          # `[ ! -d ]` AND NOT JUST `[ -z ]`: `readlink -f` on a DANGLING symlink prints the target
          # path and exits 0, so an emptiness test alone sails straight past the one state this
          # guard exists for. Checked on the box's own coreutils, not assumed.
          #
          # IF WE CANNOT TELL WHAT IS LIVE, WE DELETE NOTHING — a warning, not a failure. The
          # release above has already flipped and answered /health, so failing here would report a
          # good release as broken, which is the lie this pipeline keeps being taught not to tell.
          live=""
          [ -e "$APP/current" ] && live="$(readlink -f "$APP/current" 2>/dev/null || true)"
          if [ -z "$live" ] || [ ! -d "$live" ]; then
            echo "::warning::readlink -f $APP/current gave '${live:-<nothing>}', which is not a directory, so this step cannot tell which tree is being served and will delete nothing. The release itself is fine — it flipped and answered /health. Look at 'ls -la $APP/current' by hand."
            exit 0
          fi
          echo "current resolves to: $live"

          cd "$APP/releases"

          # ONE definition of "this is the tree being served", used by BOTH passes, resolved on both
          # sides so a release reached through any symlink still compares equal.
          is_live() { [ "$(readlink -f "./$1")" = "$live" ]; }

          # Named once because it is used twice, and a bound written out twice is a bound that will
          # one day disagree with itself.
          keep_released=3

          # ─── PASS 1 · ROLLBACK CANDIDATES, RANKED BY WHEN THEY WENT LIVE ────────────────────
          #
          # "THREE RELEASES", NOT "THREE DIRECTORIES", AND THE DIFFERENCE IS NEW ON 2026-09-17.
          # Release directories used to be named for the commit, so N directories meant N deployed
          # commits — a re-run landed back in the same one. They are named per RUN ATTEMPT now, so
          # the three attempts of run 35145291959 would have left THREE directories, two of which
          # were never flipped onto and have no complete venv. This step does not run on a failed run
          # (no `if:`, so it is `success()`), so the next successful deploy would have found those
          # orphans among the three newest and deleted the last known-good release to make room for
          # them. Pointing `current` at a half-built tree and restarting is the DOCUMENTED rollback,
          # so that would have taken the API down with no way back except another full deploy —
          # precisely what the release layout exists to prevent.
          #
          # SO THE RANKING IS OVER `.released` MARKERS, AND BY THE MARKER'S OWN mtime RATHER THAN THE
          # DIRECTORY'S. The marker is written at the instant of the flip, so its timestamp IS "when
          # this release went live", which is the order this policy wants. A directory's mtime is
          # not: creating a file inside a directory updates it, so the one-time backfill in the
          # layout step re-stamps every directory it visits and reorders the whole set by the order
          # `find` happened to walk it. Measured on a mock tree rather than reasoned about: ranked by
          # directory mtime, the first post-change prune deleted the INCUMBENT release, because two
          # four-day-old ones marked a fraction of a second later outranked it. Ranked by marker
          # mtime, on the identical tree, it deleted the genuinely oldest and kept the incumbent.
          #
          # find/sort rather than `ls -t`: a glob over an empty directory is an error under `set -e`,
          # and this has to be safe on a box where releases/ has just been created.
          #
          # Every branch is an explicit `if`, never `[ … ] && continue`: under `set -e` a false `&&`
          # as the last command of a loop body ends the whole step, and a prune that stops halfway is
          # a prune that silently keeps growing.
          find . -mindepth 2 -maxdepth 2 -type f -name .released -printf '%T@ %h\n' \
            | sort -rn \
            | cut -d' ' -f2- \
            | sed 's#^\./##' \
            | tail -n "+$((keep_released + 1))" \
            | while IFS= read -r d; do
                if [ -z "$d" ]; then continue; fi
                # `current` IS NEVER PRUNED, whatever its age or its rank. Not theoretical: a deploy
                # that failed its migration, or an operator who has rolled back by hand, leaves
                # `current` pointing at a release OLDER than the newest three — so it lands in this
                # list, and without this line the next run deletes the code the box is executing.
                if is_live "$d"; then echo "keeping $d (current)"; continue; fi
                echo "pruning $d (went live, but is older than the $keep_released newest that did)"
                rm -rf -- "$d"
              done

          # ─── PASS 2 · TREES THAT WERE BUILT AND NEVER SERVED ────────────────────────────────
          # A cancelled run, or an attempt of a run that failed before the flip. They are not
          # rollback targets — no complete venv is guaranteed, and "point `current` at it and
          # restart" is the documented recovery — so leaving them in the ranking is worse than
          # useless. Each also carries the `.env` it was deployed with, in plaintext at mode 600;
          # docs/SECURITY.md's rotation runbook counts these.
          #
          # `| sort` IS A BARRIER AND NOT AN ORDERING. sort must read all of find's output before it
          # emits a byte, so every `rm -rf` below happens after find has exited. Without it the loop
          # unlinks directories find has not stat'd yet — and `! -newermt` forces it to stat every
          # entry — so find exits 1 on an ENOENT it caused, `pipefail` makes that the pipeline's
          # status, and `set -e` turns a green, flipped, health-checked deploy red at random. PASS 1
          # gets this free from its ranking sort; this pass has to ask for it.
          #
          # AN HOUR OF GRACE, AND THE REASON IS NOT A CONCURRENT DEPLOY. `concurrency: deploy-backend`
          # with `cancel-in-progress: false` at the top of this file QUEUES a second run rather than
          # overlapping it, so this step cannot be deleting a directory another run of this workflow
          # is filling. The hour buys the other two things: a window in which a human can still open
          # a failed attempt and read what went wrong, and cover for a `.released` touch that failed.
          # It does NOT bound a directory whose mtime is in the future (clock skew, or a timestamp
          # rsync preserved) — such a directory is never matched here at all. That is disk, not
          # danger, and it is written down rather than discovered.
          #
          # `.keep` IS THE HUMAN SAYING "I AM USING THIS", because an hour is a guess about how long
          # somebody needs and a time window cannot express "in use". backend/DEPLOY_AWS.md's manual
          # recovery procedure builds `releases/manual` by hand with a `cp -a` that can easily outlast
          # the window, and a deploy queued during that incident would otherwise delete the tree being
          # built. That runbook now touches this file as its second step.
          #
          # `bootstrap` is swept by this pass once `current` has moved off it, which is intended:
          # `releases/bootstrap/backend` is either a SYMLINK to the legacy /home/ubuntu/app/backend
          # tree or an empty directory, and `rm -rf` removes the link and never what it points at.
          # This finally automates the cleanup the shim above has been describing as manual since
          # 2026-09-03.
          find . -maxdepth 1 -mindepth 1 -type d ! -newermt '-60 minutes' -printf '%f\n' \
            | sort \
            | while IFS= read -r d; do
                if [ -z "$d" ]; then continue; fi
                if [ -e "$d/.keep" ]; then echo "keeping $d (.keep — somebody is working on this)"; continue; fi
                if [ -e "$d/.released" ]; then continue; fi
                if is_live "$d"; then echo "keeping $d (current — and it carries no .released marker, which should not be possible after a flip; say so rather than delete it)"; continue; fi
                echo "pruning $d (built, never went live)"
                rm -rf -- "$d"
              done

          total="$(find . -maxdepth 1 -mindepth 1 -type d | wc -l)"
          released="$(find . -mindepth 2 -maxdepth 2 -type f -name .released -printf '.' | wc -c)"
          echo "releases now: $total directories, $released of which have been live (current: $(basename "$live"))"
          REMOTE

      # ─── THE CHECK THAT WOULD HAVE CAUGHT A THREE-DAY LOGIN OUTAGE ───────────────────────────
      #
      # On 2026-08-23 the live site could not log anybody in. `BACKEND_CORS_ORIGINS` on the box
      # allowed `http://localhost:3000` and NEITHER Vercel host, so every browser request from
      # designer-repository.vercel.app died on a preflight answering `400 Disallowed CORS origin`.
      # Nothing in this pipeline noticed, and nothing could have:
      #
      #   - the step above polls `/health`, which is FORBIDDEN from touching the database and says
      #     nothing whatsoever about who may call the API;
      #   - the frontend workflow's smoke check fetches the production alias and gets a 200, because
      #     the pages render fine — it is only the API calls inside them that fail;
      #   - and the CORS list was pinned by a step whose own comment asserted the origins were right.
      #
      # A green pipeline over a site nobody can sign in to is the worst failure this repository has,
      # so the two facts a deploy must actually establish are asserted here, on the box, before the
      # window closes.
      #
      # WHY ON THE BOX AND NOT THROUGH CLOUDFRONT. The app's own decision is what went wrong, and
      # testing it at 127.0.0.1:8000 needs no edge hostname — which matters, because the repository
      # currently records two different CloudFront distributions for this API and has not settled
      # which is live (see the infrastructure table). The cost is honest and worth naming: this does
      # NOT prove the edge forwards the `Origin` header, so a CloudFront cache policy that strips it
      # would still break the browser while this step passes. That is a smaller and much rarer
      # failure than the one being closed, and closing it needs the hostname question answered first.
      #
      # 2026-09-03: this now runs AFTER the symlink flip, so what it interrogates is the release that
      # is actually live — which is what it always meant to assert and could not, back when "the code
      # on disk" and "the deployed code" were the same directory either way. Its one path reference
      # moved to `current/` with everything else. It is deliberately still the LAST gate before the
      # SSH window closes: if it fails the run is red, the previous release is still on disk, and the
      # rollback is `ln -sfn releases/<older-release> current && sudo systemctl restart fieldrepo
      # fieldrepo-queue` over SSM — seconds, no build, no network. Since 2026-09-17 release
      # directories are named `<sha>-<run_id>.<attempt>`, so `ls -lt /home/ubuntu/app/releases` is
      # how you read the name off; the one below the current one is the target.
      - name: Assert the API is ready AND answers CORS for the production origin
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail

          # 1. READY, not merely up. `/health` deliberately avoids the database, so a wrong DSN
          #    produces a green deploy and a dead site; `/health/ready` is the endpoint that connects.
          ready="$(curl -fsS http://127.0.0.1:8000/health/ready)"
          echo "readiness: ${ready}"
          case "$ready" in
            *'"database":true'*) ;;
            *) echo "::error::the API is running but reports no database connection: ${ready}"; exit 1 ;;
          esac

          # 2. The production origin is allowed. This is a real preflight, answered by the same
          #    middleware a browser talks to, so it cannot pass on a list that merely looks right.
          origin="https://designer-repository.vercel.app"
          hdr="$(curl -s -D - -o /dev/null --max-time 20 -X OPTIONS http://127.0.0.1:8000/api/auth/login -H "Origin: ${origin}" -H "Access-Control-Request-Method: POST")"
          echo "${hdr}" | head -1
          # No `$` anchor: curl prints headers with CRLF endings, so the line ends in a
          # carriage return and an end-anchored pattern can never match it.
          if ! echo "${hdr}" | grep -qi "^access-control-allow-origin: ${origin}"; then
            echo "::error::the API refuses CORS for ${origin}, so no browser on the live site can call it. Every request fails the preflight with 'Disallowed CORS origin' and the user sees only 'failed to fetch'."
            echo "::error::BACKEND_CORS_ORIGINS on the server is: $(grep -E "^BACKEND_CORS_ORIGINS=" /home/ubuntu/app/current/backend/.env 2>/dev/null || echo "<not found in the current release's .env>")"
            echo "::error::Fix the 'Pin the CORS origins' step in this workflow, not the box by hand: the step rewrites .env on every deploy and would overwrite a manual edit."
            exit 1
          fi
          echo "CORS: ${origin} is allowed"
          REMOTE

      # ─── WHAT THE BOX SAW, CAPTURED WHILE THE DOOR IS STILL OPEN ─────────────────────────────
      #
      # 2026-09-17. When this job died at exit 255 there was nothing to look at. The runner's log
      # ended mid-step with `client_loop: send disconnect: Broken pipe`; the BOX's account of those
      # same seconds — whether sshd logged a disconnect, whether anything was OOM-killed, whether a
      # unit restarted, whether the hypervisor was stealing the CPU because a t3.micro had spent its
      # credits — was never collected, and by the time anybody thought to look, port 22 was shut and
      # the journal had rolled. Three attempts produced three identical, useless logs, and the cause
      # of the failure that stranded two commits of frontend work for two days is STILL not known.
      # This step is the missing half of that investigation.
      #
      # IT MUST RUN BEFORE "Close the deploy window", AND THAT ORDERING IS THE WHOLE TRICK. The
      # revoke below is `if: always()`, and GitHub runs steps in the order they are written — so a
      # diagnostic placed after it would find port 22 shut against a security group with no rule for
      # this runner, and would collect precisely nothing. If either step is ever moved, they move
      # together, and this sentence is why.
      #
      # `continue-on-error: true` AND A TRAILING `exit 0`, WHICH IS BELT AND BRACES ON PURPOSE. A
      # post-mortem that can fail the job turns one incident into two, and the commonest reason this
      # would fail is the box being unreachable — which is precisely the case it exists for.
      # `continue-on-error` keeps its status off the job; the `exit 0` keeps a red X off the step
      # itself, so nobody reads it as a second, separate fault while triaging the first.
      #
      # THE KEEPALIVES HERE ARE SHORTER THAN THE ONES IN ~/.ssh/config, DELIBERATELY. Every other
      # ssh in this file wants to tolerate a slow box; this one wants to find out quickly whether
      # the box answers at all. 15 s × 4 gives up after a minute instead of five, and
      # `timeout-minutes: 3` caps the whole thing — a diagnostic must never become the longest part
      # of a failed run.
      #
      # THE FIRST THING TO READ IN ITS OUTPUT IS THE SSHD JOURNAL. If sshd logged a disconnect for
      # this runner's address at the second the step died, the BOX tore the session down and the
      # cause is on the box. If sshd logged nothing at all and the session simply stopped existing,
      # the flow was dropped somewhere in the middle of the path and the keepalives added at the top
      # of this job are the fix. That is the one question the 2026-09-17 logs could not answer.
      - name: What the box saw (only when something above failed)
        # `|| cancelled()` because a deploy that is CANCELLED — by a human, or by a job timeout —
        # is exactly as interesting as one that failed, and leaves the box in the same half-known
        # state. `failure()` alone skips this, the next step then closes the SG window, and the
        # evidence is gone for good.
        if: failure() || cancelled()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          # NO `set -e` ANYWHERE IN THIS STEP, on either side of the connection. Every command below
          # is allowed to fail — a box where dmesg is restricted, a unit that does not exist on an
          # older provisioning, a journal that has been vacuumed — and none of those is a reason to
          # lose the commands that come after it. A post-mortem that stops at its first missing tool
          # is how you find out three incidents later that the interesting line was two commands
          # down.
          set +e
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=20 \
            "ubuntu@${{ secrets.EC2_HOST }}" 'bash -s' <<'REMOTE'
          set +e
          # THE JOURNALS ARE SCRUBBED, AND THE RULE AT THE .env CHECK ABOVE IS WHY: a deploy log is
          # not the place to leak a secret while diagnosing one. BACKEND_ENV is ONE multi-line
          # secret, so Actions masks the whole blob and NOT the DSN inside it — a prisma or asyncpg
          # connection error that echoes its connection string would otherwise print in clear, on
          # the log of a failed deploy, which is the log everyone opens. Anything that looks like a
          # URL with credentials, a JWT, or a long opaque provider key is replaced here rather than
          # trusted not to appear.
          scrub() { sed -E -e 's#([a-z+]+)://[^:@/[:space:]]+:[^@[:space:]]+@#\1://***:***@#g' \
                           -e 's#eyJ[A-Za-z0-9_-]{10,}#<jwt-redacted>#g' \
                           -e 's#(sk-|AIza|AKIA)[A-Za-z0-9_-]{8,}#<key-redacted>#g'; }
          echo "=== when, and how loaded ==="
          date -u; uptime
          echo "=== steal time: THE t3.micro TELL. A non-zero 'st' column means the hypervisor is"
          echo "=== throttling this box to its 10% baseline because the CPU credits are spent, which"
          echo "=== from the runner looks exactly like a step that has stopped producing output."
          vmstat 1 3
          echo "=== memory and swap (the swap line is the one compared across attempts, and matched) ==="
          free -m; swapon --show
          echo "=== disk, inodes included: a full / fails a deploy in ways that read as anything else ==="
          df -h /; df -i /
          echo "=== the ten biggest processes by RSS ==="
          ps -eo pid,ppid,rss,pcpu,etimes,comm --sort=-rss | head -11
          echo "=== kernel OOM kills, if any ==="
          sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 \
            || echo "(no OOM lines, or dmesg is not readable from here)"
          echo "=== fieldrepo ==="
          systemctl status fieldrepo --no-pager -l 2>&1 | head -30 | scrub
          systemctl show fieldrepo -p NRestarts -p ExecMainStatus -p MemoryCurrent 2>&1
          sudo journalctl -u fieldrepo --since '-15 min' --no-pager 2>&1 | tail -120 | scrub
          echo "=== fieldrepo-queue ==="
          systemctl status fieldrepo-queue --no-pager -l 2>&1 | head -20 | scrub
          systemctl show fieldrepo-queue -p NRestarts -p ExecMainStatus -p MemoryCurrent 2>&1
          sudo journalctl -u fieldrepo-queue --since '-15 min' --no-pager 2>&1 | tail -60 | scrub
          echo "=== sshd: DID THE BOX DROP US, OR DID THE NETWORK FORGET US? (read this first) ==="
          sudo journalctl -u ssh --since '-15 min' --no-pager 2>&1 | tail -80
          sudo journalctl -u 'ssh@*' --since '-15 min' --no-pager 2>&1 | tail -40
          echo "=== what is live, and what is on disk ==="
          ls -la /home/ubuntu/app/current; readlink -f /home/ubuntu/app/current
          ls -la /home/ubuntu/app/releases
          echo "=== CPU CREDITS ARE NOT READABLE FROM HERE, AND NOT FROM THIS JOB EITHER. They are a"
          echo "=== CloudWatch metric, and the CI IAM user (designrepo-ci-sg) is scoped to"
          echo "=== AuthorizeSecurityGroupIngress and RevokeSecurityGroupIngress on one security group"
          echo "=== ARN and nothing else in the account — a CloudWatch call from this job would be"
          echo "=== AccessDenied, and widening that IAM user to read metrics is not worth it. Read"
          echo "=== them by hand: aws cloudwatch get-metric-statistics --namespace AWS/EC2"
          echo "===   --metric-name CPUCreditBalance --dimensions Name=InstanceId,Value=i-0e091ca8e6b417b52 \\"
          echo "===   --start-time <t-1h> --end-time <now> --period 300 --statistics Minimum"
          echo "=== The 'st' column from vmstat above is the box-readable proxy for the same thing."
          exit 0
          REMOTE
          echo "post-mortem ssh exited $? — recorded here and deliberately not acted on."
          exit 0

      # ─── CLOSE IT AGAIN, WHATEVER HAPPENED ───────────────────────────────────────────────────
      #
      # `if: always()` is the whole point: a deploy that fails at migrate, or is cancelled between
      # the stop and the restart, must not leave port 22 standing open to a runner address that will
      # be recycled to somebody else. The revoke is best-effort — if the rule is already gone the
      # call errors and that is the desired state, so it must not turn a green deploy red.
      - name: Close the deploy window
        if: always() && steps.sgwindow.outputs.cidr != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          SG_ID: ${{ secrets.AWS_SG_ID }}
          CIDR: ${{ steps.sgwindow.outputs.cidr }}
        run: |
          aws ec2 revoke-security-group-ingress             --group-id "$SG_ID"             --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${CIDR}}]"             2>&1 | tail -5 || echo "revoke returned non-zero — the rule is already absent, which is the intended end state"
          echo "--- port 22 rules remaining on ${SG_ID} ---"
          aws ec2 describe-security-groups --group-ids "$SG_ID"             --query "SecurityGroups[0].IpPermissions[?FromPort==\`22\`].IpRanges[].CidrIp" --output text || true
