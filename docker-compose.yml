# ---------------------------------------------------------------------------------------------
# Design Prototype Workshop — local development stack.
#
#   docker compose up                  postgres + MinIO only. UNCHANGED from before profiles
#                                      existed: same services, same ports, same volumes, same
#                                      container names. Run the API and the web app from your
#                                      shell against them, exactly as you always have.
#   docker compose --profile api up    ... plus the containerised API on :8000
#   docker compose --profile web up    ... plus the API and the containerised web app on :3000
#   docker compose --profile cache up  ... plus Redis. Nothing uses it until you say so — see below.
#   docker compose --profile full up   everything at once.
#
# THE DEFAULT IS THE CONTRACT. The three services a bare `up` starts are deliberately profile-less,
# because a developer who types the command they have typed for months must not discover that it
# now also builds two images and runs a Redis. Everything added since is behind a profile, and
# `docker compose config --services` with no flags is the test of that promise.
#
# Configuration comes from `${VAR:-default}` interpolation, and every default below is a working
# local one — the stack runs correctly with NO .env file at all. Copy `.env.docker.example` to
# `.env` only when you want to override something (an AI provider key, a port that collides).
#
# NEVER point this stack at backend/.env. That file holds a real DATABASE_URL, the real JWT secret
# and the production AWS keys — whichever provider that DSN currently names. The API container
# refuses to start against ANY remote database, classified by host shape rather than by provider
# name, for exactly this reason (docker/backend/entrypoint.sh); .env.docker.example says the rest.
#
# Full prose: docs/DOCKER.md
# ---------------------------------------------------------------------------------------------

services:
  postgres:
    # 17, PRODUCTION'S MAJOR (the managed production database runs PostgreSQL 17), and the same image
    # major as checks.yml's integration service — so local, CI and production agree. 16 until
    # 2026-10-09. 18 is the newest major and is not used because production cannot follow it yet
    # (its provider, named in docs/ENVIRONMENT.md, offers no 18; prisma-client-py's Prisma 5.17
    # schema engine predates it).
    #
    # ⚠ AN EXISTING `postgres_data` VOLUME WAS INITIALISED BY 16, AND 17 WILL NOT OPEN IT: the
    # container exits with "database files are incompatible with server". Two ways through:
    #   • KEEP THE DATA. Before pulling this change (still on 16):
    #         docker compose exec postgres pg_dumpall -U postgres > local-pg16.sql
    #     then drop the old volume, start 17 on a fresh one, and restore into it:
    #         docker compose rm -sf postgres
    #         docker volume rm <project>_postgres_data     # `docker volume ls` shows the name
    #         docker compose up -d postgres
    #         docker compose exec -T postgres psql -U postgres < local-pg16.sql
    #   • START OVER. The same `rm` and `volume rm`, then `docker compose up -d`, and from backend/
    #     `python -m prisma migrate deploy` and `python -u scripts/seed_test_accounts.py`.
    # Removing only the postgres volume leaves `minio_data` — the local media — where it was.
    # (`docker compose down -v` would delete both.) docs/DOCKER.md carries the same steps.
    image: postgres:17-alpine
    container_name: design-workshop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Renamed with the rebrand, which was safe to do exactly once: the project was starting
      # from an empty `postgres_data` volume, so initdb had not yet created a database under the
      # old name. It is NOT safe to do again. The official postgres image runs initdb only when
      # that volume is empty, so a later rename does not rename anything — it asks an
      # already-initialised cluster for a database that was never created, and every developer
      # with a working local stack gets `FATAL: database "..." does not exist` from the API, the
      # migrate job and the healthcheck at once, with no hint that a cosmetic edit caused it.
      # Changing it after this point means `docker compose down -v` for everyone. It must also
      # stay in step with the DATABASE_URL defaults below and in `.env.example` /
      # `.env.docker.example` / `backend/.env.example`.
      POSTGRES_DB: design_workshop
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d design_workshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # SILO, A MAINTAINED FORK OF MinIO, SINCE 2026-10-09 — AND THE SERVICE KEEPS ITS NAME ON PURPOSE.
    #
    # WHY THE IMAGE CHANGED AGAIN. This read `minio/minio:<tag>` (Docker Hub) until 2026-09-21, when
    # MinIO withdrew that repository, and then `quay.io/minio/minio:<tag>`. quay.io went the same way:
    # measured 2026-10-09, it still issues an anonymous pull token, but the manifest and the tag list
    # of both `minio/minio` and `minio/mc` answer 401 to it and `docker manifest inspect` says "no such
    # manifest", so a bare `docker compose up` — and e2e-live.yml — could not start at all.
    # Upstream is gone for good, not just moved: github.com/minio/minio is ARCHIVED, and its last
    # release (2025-10) shipped as source only.
    #
    # WHY THIS ONE. `docker.io/pgsty/silo` is Pigsty's fork of that same MinIO source
    # (github.com/pgsty/silo, AGPL-3.0 like MinIO, monthly releases, ~1.1 M pulls), and it is the only
    # maintained option that is a TRUE DROP-IN for what this stack and its browser suite rely on:
    #   • the same server lineage and on-disk format, so an existing `minio_data` volume is upgraded
    #     in place the way MinIO's own releases always upgraded each other's (not exercised against a
    #     2024 volume here: that image can no longer be pulled to make one — if yours will not open,
    #     `docker volume rm <project>_minio_data` and re-upload, local media being disposable);
    #   • the same `server /data` command — its entrypoint turns `server …` into `silo server …` —
    #     the same MINIO_ROOT_* variables and the same console on :9001;
    #   • MinIO's own routes, `/minio/health/live` included, which frontend/e2e/support/preflight.ts
    #     asks before a run; and the bundled client, `mcli`, for the healthcheck and the bucket job.
    # Verified on 2026-10-09 against this exact tag, the way the app uses S3: presigned PUT from the
    # web origin (CORS preflight and response), a 70 MiB multipart upload through presigned 16 MiB part
    # URLs whose ETags the browser can read, an anonymous GET under the `download` policy, a ranged
    # presigned GET, and delete. `mcli anonymous set download` writes the same canned read-only policy
    # `mc` always did — GetObject on the objects, GetBucketLocation and ListBucket on the bucket — so
    # anonymous LISTING of the local bucket is allowed, exactly as before. (Production's bucket is
    # not this: infra/terraform/main.tf grants anonymous GetObject on `media/*` and nothing else.)
    #
    # THE ALTERNATIVE, NAMED SO NOBODY RE-SEARCHES IT: rustfs/rustfs (Apache-2.0, a larger team, 1.0 on
    # 2026-09-16). It is a different implementation rather than a fork — its MinIO volume compatibility
    # is still a preview, it has no `mcli`, and nothing guarantees `/minio/health/live` — so moving to it
    # means a fresh volume and a re-test of the e2e suite, not an image swap. If silo stops being
    # maintained, that is the move, and the test above is the checklist for it.
    #
    # The SERVICE is still called `minio`: the API signs uploads for `http://minio:9000`, and the
    # e2e support code maps exactly that host. Renaming it would break the browser suite for a word.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: design-workshop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # `mcli` is the client silo bundles (it also ships `mc` as a symlink to it); `ready local` asks
      # the server's readiness route through the client's built-in `local` alias, as `mc` did.
      test: ["CMD", "mcli", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  create-bucket:
    # THE SAME IMAGE AS `minio`, run for its bundled `mcli`: one image and one release to keep current
    # instead of a separate client image (the old `minio/mc` was withdrawn and archived with the
    # server). `set -e` so a failure in any of the three lines fails the container — the API waits on
    # `service_completed_successfully` and must not start against a bucket that was never made public.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mcli alias set local http://minio:9000 minioadmin minioadmin;
      mcli mb --ignore-existing local/design-workshop;
      mcli anonymous set download local/design-workshop;
      "

  # -------------------------------------------------------------------------------------------
  # Redis — profile `cache` / `full`. INERT UNLESS YOU TURN IT ON.
  #
  # Starting this container changes nothing about how the API behaves. The cache layer under
  # app/scale is off by default and only reaches for Redis when SCALE_CACHE_ENABLED=true AND
  # SCALE_CACHE_BACKEND=redis; with neither set, the API never opens a socket to it and never
  # imports the client library. That is why nothing below declares a dependency on this service:
  # a `depends_on: redis` would make the API's startup contingent on an optional component, which
  # is precisely the coupling the flag design exists to prevent.
  #
  # From another container:  redis://redis:6379/0
  # From your host shell:    redis://localhost:56379/0
  # -------------------------------------------------------------------------------------------
  redis:
    # The 8 line (8.10.2 on 2026-10-09), the newest Redis major. Nothing below changed between 7 and
    # 8: the same `redis-server` flags and the same `redis-cli ping`. Redis 8 is tri-licensed
    # (AGPLv3, RSALv2, SSPLv1), which is fine for a local cache; production runs no Redis at all.
    image: redis:8-alpine
    container_name: design-workshop-redis
    profiles: ["cache", "full"]
    # --save "" disables RDB snapshots. A cache has nothing worth surviving a restart, and the
    # fork-to-snapshot briefly doubles the resident set — the one behaviour a 1 GiB production box
    # cannot absorb, so it is not rehearsed here either. The eviction policy makes the memory
    # ceiling a bound rather than a cliff: at 128 MB Redis discards cold keys instead of returning
    # OOM errors to a caller that is only ever using it as a cache.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # No volume, deliberately. Persisting a cache invites treating it as a store of record.

  # -------------------------------------------------------------------------------------------
  # The API — profile `api`, `web` or `full`.
  #
  # It is a member of `web` as well as its own profile because the web container is useless
  # without it, and Compose treats a `depends_on` on a service no active profile enabled as a hard
  # configuration error rather than an implicit opt-in. Sharing the profile is what makes
  # `--profile web` mean "the web app, and the thing it talks to".
  # -------------------------------------------------------------------------------------------
  api:
    build:
      # The repository root, not backend/ — the image needs docker/backend/entrypoint.sh too, and
      # the single root .dockerignore is what keeps that context small and keeps .env out of it.
      context: .
      dockerfile: backend/Dockerfile
    image: design-workshop-backend:local
    container_name: design-workshop-api
    profiles: ["api", "web", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Not merely "started": the API's first media write would 404 against a bucket that does not
      # exist yet, and MinIO being healthy says nothing about whether the bucket was created.
      create-bucket:
        condition: service_completed_successfully
    environment:
      # `postgres` is the compose service name, and the entrypoint's guard recognises it as local.
      # Port 5432 is the container port; 55432 is only how the host reaches it.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/design_workshop}
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-signing-key-6f2ab41d9c7e5083bd14a27fe6c390b8}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-10080}
      # MinIO speaks the S3 API but not KMS, and it rejects the SSE header outright. Empty is the
      # documented local value (see backend/app/core/config.py).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Also kept at the pre-rebrand name, for the same reason as POSTGRES_DB: this bucket is
      # already created inside the `minio_data` volume, and `create-bucket` only ever adds one
      # (`mc mb --ignore-existing`) — it never renames or moves objects. A rebrand here would point
      # the API at an empty new bucket while every locally uploaded photo stayed addressable only
      # under the old one, so existing media 404s in the browser rather than failing loudly at
      # startup. It must match the `create-bucket` service and AWS_S3_PUBLIC_BASE_URL below.
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-design-workshop}
      AWS_S3_SSE_ALGORITHM: ""
      # The endpoint the API signs and uploads against is inside the network; the public base URL
      # is what a BROWSER later fetches the object from, and a browser cannot resolve `minio`.
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-http://localhost:9000/design-workshop}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:${WEB_HOST_PORT:-3000}}
      NEXT_PUBLIC_APP_URL: http://localhost:${WEB_HOST_PORT:-3000}
      MASTER_ADMIN_EMAIL: ${MASTER_ADMIN_EMAIL:-admin@example.com}
      MASTER_ADMIN_NAME: ${MASTER_ADMIN_NAME:-Local Admin}
      # On over plain http:// so /docs is browsable while you work. HSTS is not: it would teach
      # your browser to refuse http://localhost for two years, across every project on this machine.
      BACKEND_EXPOSE_DOCS: ${BACKEND_EXPOSE_DOCS:-true}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-false}
      # Default OFF. The queue drains real transcription and media jobs, and the failure this
      # guards against is a container left running overnight against a database someone later
      # repointed. Turn it on when you are testing the queue.
      #
      # IT USED TO SAY "unlike the application default", AND THAT CLAUSE STOPPED BEING TRUE ON
      # 2026-09-03: `backend/app/core/config.py` now defaults this to false too, so a box that
      # names nothing no longer drains inside uvicorn by accident (that field's comment carries the
      # argument — the old default was fail-open around a paid provider call). This line is
      # therefore no longer a local OVERRIDE of anything; it is kept, and kept explicit, because it
      # is where a developer looks to turn the queue on, and because a compose file that states the
      # value is one a reader can answer the question from without opening the settings module.
      MEDIA_QUEUE_WORKER_ENABLED: ${MEDIA_QUEUE_WORKER_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    # No healthcheck here on purpose: the image carries one (backend/Dockerfile) and Compose reads
    # the container's health from Docker either way. Restating it would be a second copy to keep in
    # step with the /health-vs-/api/health reasoning the Dockerfile spells out.
    #
    # No restart policy either. The entrypoint's job is to REFUSE to start against a remote
    # database, and a restart loop would scroll that refusal off the screen every few seconds.
    # A container that stays dead is one you read the logs of.

  # -------------------------------------------------------------------------------------------
  # Schema migrations — profile `migrate`, and never started by `up`.
  #
  #     docker compose --profile migrate run --rm migrate
  #
  # Built from the Dockerfile's `prisma` STAGE, not from the finished image, because
  # `prisma migrate` is a Node program and the runtime image has no Node on purpose. That stage
  # has the CLI, the schema and the same entrypoint guard. Compose builds it only when this
  # profile is named, so the fat intermediate image never materialises for anybody else.
  #
  # Deliberately not wired into `api`'s depends_on. A container that migrates on the way up is a
  # container that will one day migrate something you did not mean to migrate.
  # -------------------------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prisma
    image: design-workshop-migrate:local
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Overrides the placeholder baked into the stage for `prisma generate`. The entrypoint checks
      # it before the CLI runs, so pointing this at a deployed database refuses rather than migrates.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/design_workshop}
    command: ["python", "-m", "prisma", "migrate", "deploy", "--schema=./prisma/schema.prisma"]

  # -------------------------------------------------------------------------------------------
  # The web app — profile `web` or `full`.
  # -------------------------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # BUILD args, not environment: Next.js inlines every NEXT_PUBLIC_* into the JavaScript
        # bundle at build time, so changing one of these needs `--build` and not a restart. They
        # are addressed to localhost rather than to a service name because the code that reads
        # them executes in the BROWSER, which is outside this network. Interpolating the same
        # port variables the `ports:` lines use keeps the two from drifting apart.
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8000}
        NEXT_PUBLIC_APP_URL: http://localhost:${WEB_HOST_PORT:-3000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:-}
    image: design-workshop-frontend:local
    container_name: design-workshop-web
    profiles: ["web", "full"]
    depends_on:
      # Healthy rather than started. Server components render on first request, and an API that is
      # still spawning its Prisma engine turns the first page load into an error page the developer
      # then has to reload past.
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"

volumes:
  postgres_data:
  minio_data:
